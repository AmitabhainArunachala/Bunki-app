<title>言葉の鉱脈 Kotoba Mine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- never render-blocking: offline or on a slow line the page paints at once in Hiragino,
     and the web fonts swap in when (if) they arrive -->
<link
  rel="stylesheet"
  data-webfonts
  href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Shippori+Mincho:wght@500;600;700;800&display=swap"
  media="print"
  onload="this.media = 'all'"
/>
<style>
  /* One quiet study tool. Three surfaces: the ground (darkest), the sheet a card is printed on
     (raised, the brightest), and ink. Every screen is a sheet on the ground; review hides the rest. */
  :root {
    --ground: #e6e0d4;
    --ground-2: #dcd5c7;
    --sheet: #fffdf8;
    --sheet-2: #f6f2e9;
    --ink: #17140f;
    --ink-2: #3f3a32;
    --muted: #6f685d;
    --rt: #3f3a32;
    --faint: #9a9284;
    --rule: rgba(23, 20, 15, 0.13);
    --rule-2: rgba(23, 20, 15, 0.07);
    --target: #1f4fd1; /* 藍 — the word being asked */
    --target-bg: rgba(31, 79, 209, 0.1);
    --new: #1f4fd1;
    --learn: #c2361b;
    --review: #17824c;
    --again: #c2361b;
    --hard: #8a6a1f;
    --good: #17824c;
    --easy: #1f4fd1;
    --shadow:
      0 0 0 1px rgba(23, 20, 15, 0.08), 0 1px 2px rgba(23, 20, 15, 0.08),
      0 10px 28px -12px rgba(40, 30, 15, 0.28), 0 30px 60px -30px rgba(40, 30, 15, 0.3);
    --shadow-sm: 0 0 0 1px rgba(23, 20, 15, 0.1), 0 1px 2px rgba(23, 20, 15, 0.1);
    --mincho:
      'Shippori Mincho', 'Hiragino Mincho ProN', 'YuMincho', 'Yu Mincho', 'Noto Serif JP', serif;
    /* Kaku Gothic ProN maps 400→W3 and 700→W6 the same in Chromium and WebKit; Hiragino Sans does not */
    --gothic:
      'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'BIZ UDPGothic', system-ui,
      sans-serif;
    /* the headword in textbook strokes, the way a learner should see its shape */
    --kyokasho: 'Klee One', var(--mincho);
    --scale: 1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #0e0f11;
      --ground-2: #16181b;
      --sheet: #1c1f23;
      --sheet-2: #23272c;
      --ink: #f2eee6;
      --ink-2: #d2ccc1;
      --muted: #9b9488;
      --rt: #c9c2b5;
      --faint: #6f695f;
      --rule: rgba(255, 255, 255, 0.12);
      --rule-2: rgba(255, 255, 255, 0.06);
      --target: #8fb0ff;
      --target-bg: rgba(143, 176, 255, 0.14);
      --new: #8fb0ff;
      --learn: #ff8a70;
      --review: #6fd39a;
      --again: #ff8a70;
      --hard: #e0be6a;
      --good: #6fd39a;
      --easy: #8fb0ff;
      --shadow:
        0 0 0 1px rgba(255, 255, 255, 0.07), 0 1px 2px rgba(0, 0, 0, 0.5),
        0 14px 34px -14px rgba(0, 0, 0, 0.8);
      --shadow-sm: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 1px 2px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --ground: #0e0f11;
    --ground-2: #16181b;
    --sheet: #1c1f23;
    --sheet-2: #23272c;
    --ink: #f2eee6;
    --ink-2: #d2ccc1;
    --muted: #9b9488;
    --rt: #c9c2b5;
    --faint: #6f695f;
    --rule: rgba(255, 255, 255, 0.12);
    --rule-2: rgba(255, 255, 255, 0.06);
    --target: #8fb0ff;
    --target-bg: rgba(143, 176, 255, 0.14);
    --new: #8fb0ff;
    --learn: #ff8a70;
    --review: #6fd39a;
    --again: #ff8a70;
    --hard: #e0be6a;
    --good: #6fd39a;
    --easy: #8fb0ff;
    --shadow:
      0 0 0 1px rgba(255, 255, 255, 0.07), 0 1px 2px rgba(0, 0, 0, 0.5),
      0 14px 34px -14px rgba(0, 0, 0, 0.8);
    --shadow-sm: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 1px 2px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: calc(15px * var(--scale));
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    line-break: strict;
    overflow-wrap: anywhere;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--target);
    outline-offset: 2px;
    border-radius: 4px;
  }
  /* single-column grids never let one long line (a nowrap title) widen the column */
  .wrap,
  .stage,
  .card,
  .answer,
  .today,
  .done,
  .hints,
  .sect,
  .ex,
  .item .open,
  .set .grp {
    grid-template-columns: minmax(0, 1fr);
  }
  .wrap {
    max-width: 46rem;
    margin: 0 auto;
    padding: 20px 16px 64px;
    display: grid;
    gap: 16px;
  }

  /* top bar */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 4px 2px;
  }
  .brand-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .bunki {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-2);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--rule);
    white-space: nowrap;
  }
  .bunki:hover {
    background: var(--sheet-2);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: none;
    border: 0;
    padding: 0;
  }
  .brand b {
    font-family: var(--mincho);
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    font-feature-settings: 'palt';
  }
  .brand span {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }
  nav.seg {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    background: var(--ground-2);
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--rule-2);
  }
  nav.seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  nav.seg button[aria-current='page'] {
    background: var(--sheet);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .sheet {
    background: var(--sheet);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .pad {
    padding: 22px 22px;
  }
  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
  }
  .num {
    font-variant-numeric: tabular-nums;
  }

  /* ---------- home ---------- */
  .today {
    display: grid;
    gap: 20px;
    padding: 26px 24px 24px;
  }
  .today h1 {
    margin: 0;
    font-family: var(--mincho);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
  }
  .tally {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .tally div {
    padding: 14px 0 12px;
    display: grid;
    gap: 2px;
    justify-items: start;
  }
  .tally div + div {
    border-left: 1px solid var(--rule-2);
    padding-left: 18px;
  }
  .tally b {
    font-family: var(--mincho);
    font-size: 2.6rem;
    line-height: 1;
    font-weight: 700;
  }
  .tally span {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .tally .n b {
    color: var(--new);
  }
  .tally .l b {
    color: var(--learn);
  }
  .tally .r b {
    color: var(--review);
  }
  .tally .zero b {
    color: var(--faint);
  }
  .go {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .primary {
    border: 0;
    background: var(--ink);
    color: var(--sheet);
    border-radius: 12px;
    padding: 14px 26px;
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.15) inset,
      0 6px 16px -8px rgba(0, 0, 0, 0.5);
  }
  .primary:disabled {
    opacity: 0.35;
    cursor: default;
  }
  kbd {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 5px;
    border: 1px solid currentColor;
    opacity: 0.6;
    letter-spacing: 0;
  }
  .fine {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0;
  }
  .ghost {
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink-2);
  }
  .ghost:hover {
    background: var(--sheet-2);
  }

  .veins {
    padding: 6px 0;
  }
  .veins-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 22px 8px;
  }
  .vein {
    display: grid;
    grid-template-columns: 2.1rem minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 22px;
    border-top: 1px solid var(--rule-2);
  }
  .vein .no {
    font-family: var(--mincho);
    font-weight: 700;
    color: var(--faint);
    font-size: 0.95rem;
  }
  .vein .what {
    min-width: 0;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    display: grid;
    gap: 3px;
  }
  .vein .what b {
    font-family: var(--mincho);
    font-weight: 700;
    font-size: 1.06rem;
    letter-spacing: 0.02em;
  }
  .vein .what small {
    color: var(--muted);
    font-size: 0.76rem;
  }
  .meter {
    display: flex;
    height: 5px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--rule-2);
    margin-top: 6px;
    max-width: 22rem;
  }
  .meter i {
    display: block;
    height: 100%;
  }
  .meter .m {
    background: var(--review);
  }
  .meter .l {
    background: var(--learn);
    opacity: 0.75;
  }
  .vein .due {
    font-size: 0.76rem;
    font-weight: 700;
    white-space: nowrap;
    text-align: right;
    color: var(--muted);
  }
  .vein .due em {
    font-style: normal;
    color: var(--review);
  }
  .vein.off .what,
  .vein.off .no,
  .vein.off .due {
    opacity: 0.4;
  }
  .switch {
    position: relative;
    width: 38px;
    height: 22px;
    flex: none;
  }
  .switch input {
    appearance: none;
    margin: 0;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    background: var(--rule);
    cursor: pointer;
    transition: background 0.15s;
  }
  .switch input:checked {
    background: var(--review);
  }
  .switch input::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s;
  }
  .switch input:checked::after {
    transform: translateX(16px);
  }
  .vein .play {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    display: grid;
    place-items: center;
    color: var(--ink-2);
  }
  .vein .play:hover {
    background: var(--sheet-2);
  }

  /* ---------- review ---------- */
  .rv {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
  }
  .rv-top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .rv-top .inner {
    max-width: 46rem;
    margin: 0 auto;
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .x {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--sheet);
    display: grid;
    place-items: center;
    color: var(--ink-2);
    flex: none;
  }
  .counts {
    display: flex;
    gap: 14px;
    font-weight: 700;
    font-size: 0.92rem;
  }
  .counts span {
    padding-bottom: 1px;
    border-bottom: 2px solid transparent;
  }
  .counts .n {
    color: var(--new);
  }
  .counts .l {
    color: var(--learn);
  }
  .counts .r {
    color: var(--review);
  }
  .counts .now {
    border-bottom-color: currentColor;
  }
  .counts .z {
    color: var(--faint);
  }
  .rv-top .where {
    margin-left: auto;
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .progress {
    height: 2px;
    background: var(--rule-2);
  }
  .progress i {
    display: block;
    height: 100%;
    background: var(--ink-2);
    transition: width 0.25s ease;
  }
  .stage {
    max-width: 46rem;
    width: 100%;
    margin: 0 auto;
    padding: 18px 16px 24px;
    display: grid;
    gap: 14px;
    align-content: start;
  }
  .card {
    padding: 26px 26px 24px;
    display: grid;
    gap: 16px;
  }
  .card-meta > * {
    min-width: 0;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    align-items: baseline;
  }
  .card-meta .src {
    font-size: 0.76rem;
    color: var(--muted);
    min-width: 0;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .face-tag {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .face-tag i {
    font-style: normal;
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 7px;
    vertical-align: 1px;
  }

  /* Japanese text: ruby rides inside a line-height tall enough that toggling it never moves a line */
  .jp {
    font-family: var(--mincho);
    font-weight: 500;
    line-height: 2;
    letter-spacing: 0;
    text-align: justify;
    text-autospace: normal;
    margin: 0;
  }
  .ctx {
    font-size: calc(1.36rem * var(--scale));
  }
  .ctx p {
    margin: 0;
  }
  .ctx .dim {
    color: color-mix(in srgb, var(--ink) 60%, var(--sheet));
  }
  .ctx.answered .dim {
    color: color-mix(in srgb, var(--ink) 74%, var(--sheet));
  }
  .ctx .dim .tgt,
  .ctx .dim .blank {
    color: var(--target);
  }
  .tail {
    color: var(--ink);
  }
  .ctx p + p {
    margin-top: 0.6em;
  }
  ruby {
    ruby-position: over;
    ruby-align: center;
    ruby-overhang: auto;
  }
  rt {
    font-family: var(--gothic);
    font-size: 0.5em;
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--rt);
    user-select: none;
    -webkit-user-select: none;
  }
  /* hover / off: a reading floats above its kanji and takes no room, so wide readings never
     spread the text and showing one never moves a character */
  .rb {
    position: relative;
  }
  .rb::after {
    content: attr(data-rt);
    position: absolute;
    left: 50%;
    bottom: calc(100% - 0.05em);
    transform: translateX(-50%);
    font-family: var(--gothic);
    font-size: 0.5em;
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0;
    white-space: nowrap;
    color: var(--rt);
    visibility: hidden;
    pointer-events: none;
  }
  .w:hover .rb::after,
  .w.lit .rb::after,
  .show-rt .rb::after {
    visibility: visible;
  }
  .hide-rt .rb::after {
    visibility: hidden !important;
  }
  @media (hover: none) {
    .w:hover .rb::after {
      visibility: hidden;
    }
    .w.lit .rb::after,
    .show-rt .rb::after {
      visibility: visible;
    }
  }
  /* furigana modes: hidden rt keeps its box (visibility), so lines never jump */
  .furi-off .jp rt,
  .furi-hover .jp rt {
    visibility: hidden;
  }
  .furi-hover .jp .w:hover rt,
  .jp .w.lit rt,
  .jp .show-rt rt {
    visibility: visible;
  }
  .jp .hide-rt rt {
    visibility: hidden !important;
  }
  /* the asked word and its blank never split across a line; ordinary text breaks anywhere,
     as Japanese does, so justified lines never stretch into spaced-out glyphs */
  .tgt,
  .clz {
    white-space: nowrap;
  }
  /* no keyboard, no key hints */
  @media (hover: none), (max-width: 600px) {
    kbd,
    .keys {
      display: none;
    }
  }
  .w {
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.12s;
  }
  .w:hover,
  .w.lit {
    background: var(--rule-2);
  }
  .tgt {
    color: var(--target);
    font-weight: 800;
    background: var(--target-bg);
    box-shadow: 0 2px 0 0 var(--target);
    border-radius: 3px 3px 0 0;
    padding: 0 1px;
  }
  .tgt.filled {
    animation: ink 0.35s ease-out;
  }
  @keyframes ink {
    from {
      background: color-mix(in srgb, var(--target) 35%, transparent);
    }
  }
  .blank {
    display: inline-block;
    min-width: 3.2em;
    text-align: center;
    color: var(--target);
    border: 1.5px dashed color-mix(in srgb, var(--target) 70%, transparent);
    background: var(--target-bg);
    border-radius: 6px;
    line-height: 1.25;
    padding: 0.08em 0.3em;
    margin: 0 0.1em;
    font-family: var(--gothic);
    font-weight: 700;
    font-size: 0.72em;
    vertical-align: 0.12em;
    letter-spacing: 0.04em;
  }
  .blank.mute {
    font-size: 0.9em;
    vertical-align: 0.04em;
    font-family: var(--mincho);
    min-width: 3.4em;
  }
  .hintline {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--sheet-2);
    font-size: 1rem;
  }
  .hints {
    display: grid;
    gap: 6px;
    justify-items: start;
  }
  .hints .hintline {
    width: 100%;
  }
  .hd {
    line-height: 1.8;
    font-weight: 600;
  }
  .hk {
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .hintline .k {
    flex: none;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: var(--muted);
  }

  /* answer */
  .answer {
    display: grid;
    gap: 14px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
  }
  .head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .head .term {
    font-family: var(--kyokasho);
    font-weight: 600;
    font-size: calc(2.5rem * var(--scale));
    line-height: 1.15;
    letter-spacing: 0.04em;
    font-feature-settings: 'palt';
  }
  .head .reading {
    font-size: 1.12rem;
    color: var(--ink-2);
    font-weight: 500;
    letter-spacing: 0.06em;
  }
  .speak {
    border: 1px solid var(--rule);
    background: transparent;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    color: var(--ink-2);
    align-self: center;

<script>
  const DECK = /*__DECK__*/ null;
  // FSRS-6 weights — Bunki's pinned set (prototypes/corridor/data/fsrs-pin.json, request retention 0.9)
  const W = [
    0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835,
    0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542,
  ];
  const RETENTION = 0.9;
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const MIN = 60e3,
    DAY = 864e5;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const retr = (t, S) => Math.pow(1 + (FACTOR * t) / S, DECAY);
  const ivlDays = (S) =>
    clamp(Math.round((S / FACTOR) * (Math.pow(RETENTION, 1 / DECAY) - 1)), 1, 36500);
  const D0 = (g) => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
  const S0 = (g) => Math.max(W[g - 1], 0.1);
  const nextD = (D, g) => {
    const dp = D + (-W[6] * (g - 3) * (10 - D)) / 9;
    return clamp(W[7] * D0(4) + (1 - W[7]) * dp, 1, 10);
  };
  const recallS = (D, S, R, g) =>
    S *
    (1 +
      Math.exp(W[8]) *
        (11 - D) *
        Math.pow(S, -W[9]) *
        (Math.exp(W[10] * (1 - R)) - 1) *
        (g === 2 ? W[15] : 1) *
        (g === 4 ? W[16] : 1));
  const forgetS = (D, S, R) =>
    Math.min(
      W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)),
      S / Math.exp(W[17] * W[18]),
    );
  const shortS = (S, g) => {
    let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(S, -W[19]);
    if (g >= 3) inc = Math.max(inc, 1);
    return S * inc;
  };

  /** one grade, pure: returns the next card state */
  function schedule(c, g, now) {
    const n = { ...c, reps: (c.reps || 0) + 1, last: now };
    if (!c.s || c.s === 'new') {
      n.S = S0(g);
      n.D = D0(g);
      if (g === 4) return { ...n, s: 'review', due: now + ivlDays(n.S) * DAY };
      return {
        ...n,
        s: 'learn',
        step: g === 3 ? 1 : 0,
        due: now + (g === 1 ? 1 : g === 2 ? 6 : 10) * MIN,
      };
    }
    if (c.s === 'learn' || c.s === 'relearn') {
      n.S = shortS(c.S, g);
      n.D = nextD(c.D, g);
      if (g === 1) return { ...n, step: 0, due: now + (c.s === 'relearn' ? 10 : 1) * MIN };
      if (g === 2) return { ...n, due: now + (c.s === 'relearn' ? 10 : 6) * MIN };
      if (g === 3 && c.s === 'learn' && (c.step || 0) < 1)
        return { ...n, step: 1, due: now + 10 * MIN };
      return { ...n, s: 'review', due: now + Math.max(ivlDays(n.S), g === 4 ? 2 : 1) * DAY };
    }
    const t = Math.max(0, (now - c.last) / DAY);
    n.D = nextD(c.D, g);
    if (t < 1) {
      n.S = shortS(c.S, g);
    } else {
      const R = retr(t, c.S);
      if (g === 1) {
        n.S = forgetS(c.D, c.S, R);
        n.lapses = (c.lapses || 0) + 1;
        return { ...n, s: 'relearn', step: 0, due: now + 10 * MIN };
      }
      n.S = recallS(c.D, c.S, R, g);
    }
    if (g === 1) {
      n.lapses = (c.lapses || 0) + 1;
      return { ...n, s: 'relearn', step: 0, due: now + 10 * MIN };
    }
    let d = ivlDays(n.S);
    const prev = c.ivl || 0;
    if (g === 3) d = Math.max(d, prev + 1);
    if (g === 4) d = Math.max(d, ivlDays(recallS(c.D, c.S, retr(t, c.S), 3)) + 1, prev + 2);
    if (g === 2) d = Math.max(1, Math.min(d, ivlDays(recallS(c.D, c.S, retr(t, c.S), 3))));
    return { ...n, s: 'review', ivl: d, due: now + d * DAY };
  }
  const fmtIvl = (ms) =>
    ms < 60 * MIN

        : ms < 30 * DAY

          : ms < 365 * DAY

  // ---------- state (same key and shape as before: earlier progress carries over) ----------
  const KEY = 'kotoba-mine.v1';

    on: {},

    } catch (e) {}
  }

  const MODS = DECK ? DECK.modules : [];

      c.mod = m;

    }
  const byKey = new Map(CARDS.map((c) => [c.key, c]));
  const byTerm = new Map(CARDS.map((c) => [c.term, c]));
  // new words come module by module, but spread across each passage's paragraphs,
  // so two fronts in a row rarely show the same paragraph
  const NEW_ORDER = new Map();
  {
    let i = 0;
    for (const m of MODS) {
      const seen = {};
      const ranked = m.cards.map((c) => {
        const p = c.at[0];

        return [seen[p], p, c.key];

    if (st.mode !== 'production') out.push(c.key + ':r');
    if (st.mode !== 'recognition') {
      // the cloze opens once the word can be recognised (comprehension first)
      const r = st.cards[c.key + ':r'];

  // ---------- Japanese text: tokens → ruby ----------
  // token: [surface] punctuation · [surface, ruby, base] word; ruby 0 or [[text, reading], …]
  const readingOf = (tok) => (tok[1] ? tok[1].map(([t, r]) => r || t).join('') : tok[0]);
  function rubyInto(el, tok) {
    if (!tok[1]) {
      el.append(tok[0]);
      return el;
    }
    const native = st.furi === 'on';
    for (const [t, r] of tok[1])
      el.append(
        !r
          ? t

    return rubyInto(el, tok);
  }
  const KANJI = /[\u3400-\u9fff々]/;
  /** the blank never shows the answer's length; a word's trailing kana (its ending) stays visible */
  function stemSplit(tok) {
    if (!tok || !Array.isArray(tok[1])) return { stem: tok ? tok[0] : '', reading: '', tail: '' };
    const pairs = tok[1];
    let last = -1;
    pairs.forEach(([t, r], i) => {
      if (r) last = i;
    });
    const head = pairs.slice(0, last + 1);
    return {
      stem: head.map(([t]) => t).join(''),
      reading: head.map(([t, r]) => r || t).join(''),
      tail: pairs
        .slice(last + 1)
        .map(([t]) => t)
        .join(''),
    };
  }
  /**
   * which characters of paragraph pi a cloze must hide: the asked word's stem wherever the word
   * occurs (any conjugation), and every spelling of it in the running text even when the
   * tokenizer split it (真空 + 管). A kanji card hides only its kanji (【？】古 for 稽古).
   */
  function maskOf(c, pi) {
    const toks = c.mod.paras[pi];
    const text = toks.map((t) => t[0]).join('');
    const mk = new Uint8Array(text.length);
    let off = 0;
    toks.forEach((tok, ti) => {
      const L = tok[0].length;
      const anchor = pi === c.at[0] && ti === c.at[1];
      if (tok.length > 1 && c.pos !== 'kanji' && (anchor || tok[2] === c.term || tok[0] === c.term))
        mk.fill(1, off, off + Math.min(L, stemSplit(tok).stem.length || L));
      off += L;
    });
    const needles = [];
    if (KANJI.test(c.term)) needles.push(c.term);
    if (c.pos !== 'kanji') {
      const st0 = stemSplit(c.mod.paras[c.at[0]][c.at[1]]).stem;
      if (st0.length >= 2 && KANJI.test(st0)) needles.push(st0);
    }
    for (const nd of needles)

  }
  function blankBox(c, hint, isAnchor) {

  function contextEl(c, mode, hint) {
    const box = h('div', { class: 'jp ctx' + (mode === 'fill' ? ' answered' : ''), lang: 'ja' });

    for (let pi = c.ctx[0]; pi <= c.ctx[1]; pi++) {
      const p = h('p');
      let dim = null;
      const dimOn = (yes) => {

  // ---------- speech (the device's own Japanese voice; nothing is downloaded) ----------

      .getVoices()
      .filter(
        (v) =>

          !/^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/.test(v.name),

      (/premium|プレミアム/i.test(v.voiceURI + v.name) ? 4 : 0) +
      (/enhanced|拡張|高品質/i.test(v.voiceURI + v.name) ? 3 : 0) +
      (/o-ren|kyoko|otoya|hattori/i.test(v.name) ? 1 : 0) +

  // ---------- review ----------
  function startReview(mod) {
    focus = mod;
    sess = { start: Date.now(), done: 0, again: 0 };
    undo = null;
    queue = buildQueue();
    cur = null;
    screen = 'review';
    render();
    window.scrollTo(0, 0);
  }
  /** learning faces whose step has come due join the front of the sitting */
  function pullDueLearning(now = Date.now()) {
    const due = [];
    for (const [f, s] of Object.entries(st.cards)) {
      const c = byKey.get(f.split(':')[0]);
      if (
        c &&
        inScope(c) &&
        faces(c).includes(f) &&
        s.s !== 'review' &&
        s.due <= now &&
        !buriedToday(f) &&
        !queue.includes(f)
      )
        due.push(f);
    }
    due.sort((a, b) => st.cards[a].due - st.cards[b].due);
    queue = [...due, ...queue];
  }
  /** what a cloze front starts with: 'def' (Japanese definition below), 'reading' (in the blank), 'none' */
  function hintFor(face) {
    return ['def', 'reading', 'none'].includes(st.hint) ? st.hint : 'def';
  }
  const HINTS = ['def', 'kana', 'gloss'];
  function moreHint() {
    if (!cur || cur.revealed || !cur.face.endsWith(':p')) return;
    cur.step = Math.min(HINTS.length, (cur.step ?? (cur.hint === 'def' ? 1 : 0)) + 1);
    render();
  }
  let lastCtx = null;
  function ctxOf(face) {
    const c = byKey.get(face.split(':')[0]);
    return c ? [c.mod.id, c.ctx[0], c.ctx[1]] : null;
  }
  const overlaps = (x, y) => x && y && x[0] === y[0] && x[1] <= y[2] && y[1] <= x[2];
  function pickNext() {
    if (!queue.length) return null;
    const i = queue.findIndex((f) => !overlaps(ctxOf(f), lastCtx));
    if (i > 0) queue.unshift(queue.splice(i, 1)[0]);
    return { face: queue[0], revealed: false, hint: hintFor(queue[0]) };
  }
  let learnTimer = null;
  function renderReview() {
    pullDueLearning();
    if (!cur || !queue.includes(cur.face)) cur = pickNext();
    const shell = h('div', { class: 'rv' });
    const t = tallyOf(queue);
    const kind = cur
      ? st.cards[cur.face]
        ? st.cards[cur.face].s === 'review'
          ? 'r'
          : 'l'
        : 'n'
      : '';
    const doneN = sess?.done || 0;
    const pct = doneN + queue.length ? (doneN / (doneN + queue.length)) * 100 : 100;
    const c0 = cur ? byKey.get(cur.face.split(':')[0]) : null;
    shell.append(
      h(
        'div',
        { class: 'rv-top' },
        h(
          'div',
          { class: 'inner' },
          h(
            'button',
            {
              class: 'x',
              'aria-label': '終える (Esc)',
              title: '終える (Esc)',
              onclick: () => go('home'),
            },
            svg(I.x),
          ),
          h(
            'div',
            { class: 'counts num', 'aria-label': `新 ${t.n} · 学習中 ${t.l} · 復習 ${t.r}` },
            h('span', { class: 'n' + (t.n ? '' : ' z') + (kind === 'n' ? ' now' : '') }, t.n),
            h('span', { class: 'l' + (t.l ? '' : ' z') + (kind === 'l' ? ' now' : '') }, t.l),
            h('span', { class: 'r' + (t.r ? '' : ' z') + (kind === 'r' ? ' now' : '') }, t.r),
          ),
          h(
            'span',
            { class: 'where', lang: 'ja' },
            c0 ? `${c0.mod.title.ja.split(' — ')[0]}　『${c0.mod.passage.title}』` : '',
          ),
        ),
        h('div', { class: 'progress', 'aria-hidden': 'true' }, h('i', { style: `width:${pct}%` })),
      ),
    );
    const stage = h('main', { class: 'stage' });
    shell.append(stage);
    if (!cur) {
      stage.append(renderDone());
      shell.append(h('div'));
      app.append(shell);
      return;
    }
    clearTimeout(learnTimer);
    const [key, side] = cur.face.split(':');
    const c = byKey.get(key);
    const card = h('section', { class: 'sheet card', 'aria-live': 'polite', id: 'card' });
    const cloze = side === 'p';
    card.append(
      h(
        'div',
        { class: 'card-meta' },
        h(
          'span',
          { class: 'face-tag' },
          h('i', {
            style: `background:var(--${kind === 'n' ? 'new' : kind === 'l' ? 'learn' : 'review'})`,
          }),
          cloze ? '文脈クローズ · 言葉を思い出す' : '文脈で読む · 意味を思い出す',
        ),
        h('span', { class: 'src', lang: 'ja' }, `『${c.mod.passage.title}』より`),
      ),
    );
    card.append(contextEl(c, cur.revealed ? 'fill' : cloze ? 'blank' : 'mark', cur.hint));
    if (cloze && !cur.revealed) {
      const step = cur.step ?? (cur.hint === 'def' ? 1 : 0);
      const shown = HINTS.slice(0, step);
      const hb = h('div', { class: 'hints' });
      if (shown.includes('def'))
        hb.append(
          h(
            'div',
            { class: 'hintline', lang: 'ja' },
            h('span', { class: 'k' }, '定義'),
            h('span', { class: 'jp hd' }, c.def_ja),
          ),
        );
      if (shown.includes('kana'))
        hb.append(
          h(
            'div',
            { class: 'hintline', lang: 'ja' },
            h('span', { class: 'k' }, '読み'),
            h('span', { class: 'hk' }, [...c.reading][0] + '…'),
          ),
        );
      if (shown.includes('gloss'))
        hb.append(
          h(
            'div',
            { class: 'hintline', lang: 'en' },
            h('span', { class: 'k' }, '英語'),
            h('span', {}, c.gloss),
          ),
        );
      if (step < HINTS.length)
        hb.append(
          h(
            'button',
            { class: 'link hint-more', id: 'hint', onclick: moreHint },
            step ? 'もうひとつヒント' : 'ヒント',
            h('kbd', {}, 'H'),
          ),
        );
      card.append(hb);
    }
    if (cur.revealed) card.append(renderAnswer(c));
    stage.append(card);

    const dock = h('div', { class: 'dock' });
    const inner = h('div', { class: 'inner' });
    if (!cur.revealed) {
      inner.append(
        h(
          'button',
          { class: 'reveal', id: 'reveal', onclick: reveal },
          '答えを見る',
          h('kbd', {}, 'Space'),
        ),
      );
    } else {
      const now = Date.now();
      const s = st.cards[cur.face] || {};
      const names = ['もう一度', '難しい', '正解', '簡単'];
      inner.append(
        h(
          'div',
          { class: 'grades', role: 'group', 'aria-label': '評価' },
          [1, 2, 3, 4].map((g) =>
            h(
              'button',
              {
                class: 'g' + g,
                id: 'grade-' + g,
                onclick: () => grade(g),
                title: ['忘れていた', '思い出せたが、苦労した', '思い出せた', 'すぐに分かった'][
                  g - 1
                ],
              },
              h('span', { class: 'lbl' }, names[g - 1]),
              h('span', { class: 'ivl' }, fmtIvl(schedule(s, g, now).due - now)),
              h('kbd', {}, g),
            ),
          ),
        ),
      );
    }
    const minor = h('div', { class: 'minor' });
    if (undo)
      minor.append(h('button', { class: 'link', onclick: doUndo }, '取り消す', h('kbd', {}, 'U')));
    if (canSpeak && voices.length && (cur.revealed || !cloze))
      minor.append(
        h(
          'button',
          { class: 'link', onclick: () => speak(sentenceOf(c)) },
          '読み上げ',
          h('kbd', {}, 'R'),
        ),
      );
    minor.append(
      h(
        'button',
        { class: 'link', onclick: cycleFuri },
        `ふりがな: ${{ off: 'なし', hover: 'ホバー', on: 'あり' }[st.furi]}`,
        h('kbd', {}, 'F'),
      ),
      h('button', { class: 'link', onclick: bury }, '今日は後で', h('kbd', {}, '-')),
      h(
        'button',
        { class: 'link keys', onclick: () => ((showHelp = true), render()) },
        'キー',
        h('kbd', {}, '?'),
      ),
    );
    inner.append(minor);
    dock.append(inner);
    shell.append(dock);
    app.append(shell);
    if (showHelp) app.append(helpEl());
    if (cur.revealed && st.autoplay && !cur.spoke) {
      cur.spoke = true;
      speak(sentenceOf(c));
    }
  }

  function renderAnswer(c) {
    const a = h('div', { class: 'answer', lang: 'ja' });
    a.append(
      h(
        'div',
        { class: 'head' },
        h('span', { class: 'term' }, c.term),
        h('span', { class: 'reading' }, c.reading),
        canSpeak && voices.length
          ? h(
              'button',
              {
                class: 'speak',
                'aria-label': '発音',
                onclick: () => speak(c.pos === 'kanji' ? c.sentences[0].form : c.term),
              },
              svg(I.sound),
            )
          : null,
      ),
      h(
        'div',
        { class: 'tags' },
        h('span', { class: 'tag' }, c.pos),
        ...c.register.split('・').map((r) => h('span', { class: 'tag' }, r)),
      ),
      h('p', { class: 'def' }, c.def_ja),
      h('p', { class: 'gloss', lang: 'en' }, c.gloss),
    );
    const tr = h(
      'p',
      {
        class: 'trans' + (st.showEn || cur?.showEn ? '' : ' veiled'),
        lang: 'en',
        'data-hint': 'タップで英訳  T',

        },

        sect.append(

        );
      deep.append(sect);
    }
    if (c.collocations?.length)
      deep.append(

            'div',

      );
    if (c.confusables?.length)
      deep.append(

              h('li', {}, h('b', {}, x.term), h('span', { lang: 'en' }, x.note)),

    if (c.kanji)
      deep.append(

          ),
          h(

            { class: 'colls' },
            (c.kanji.compounds || []).map((x) => h('span', {}, `${x.w}（${x.r}）`)),
          ),
        ),
      );
    if (c.note)
      deep.append(
        h(
          'div',
          { class: 'sect wide' },
          h('div', { class: 'k' }, 'メモ'),
          h('p', { class: 'note', lang: 'en' }, c.note),
        ),
      );
    if (deep.childNodes.length) a.append(deep);
    return a;
  }

  function tomorrowDue() {
    const end = eod() + DAY;
    let n = 0;
    for (const c of CARDS)
      if (inScope(c))
        for (const f of faces(c)) {
          const s = st.cards[f];
          if (s && s.due <= end) n++;
        }
    return n;
  }
  function renderDone() {
    const nd = nextLearnDue();
    clearTimeout(learnTimer);
    if (nd)
      learnTimer = setTimeout(
        () => {
          if (screen === 'review' && !cur) render();
        },
        Math.max(0, nd - Date.now()) + 500,
      );
    const mins = sess ? Math.max(1, Math.round((Date.now() - sess.start) / 60000)) : 0;
    const right = sess?.done ? Math.round(((sess.done - sess.again) / sess.done) * 100) : null;
    const box = h('section', { class: 'sheet done', id: 'done' });
    box.append(
      h(
        'div',
        { class: 'eyebrow' },
        focus ? MODS.find((m) => m.id === focus)?.title.ja.split(' — ')[0] : '今日',
      ),
      h('h2', { lang: 'ja' }, nd ? 'ひと区切り' : 'おつかれさま'),
      sess?.done
        ? h(
            'div',
            { class: 'stats num' },
            h('div', {}, h('b', {}, sess.done), h('span', {}, '枚')),
            h('div', {}, h('b', {}, right + '%'), h('span', {}, '正答')),
            h('div', {}, h('b', {}, mins), h('span', {}, '分')),
          )
        : null,
      h(
        'p',
        { class: 'fine' },
        nd
          ? `学習中のカードがあと${fmtIvl(Math.max(0, nd - Date.now()))}で戻ってきます。このまま待てば自動で続きます。`
          : `今日のカードはすべて終わりました。明日の復習は${tomorrowDue()}枚。`,
      ),
    );
    const btns = h('div', { class: 'row-btns' });
    if (nd)
      btns.append(
        h(
          'button',
          {
            class: 'ghost',
            onclick: () => {
              for (const [f, s] of Object.entries(st.cards)) {
                const c = byKey.get(f.split(':')[0]);
                if (c && inScope(c) && s.s !== 'review' && s.due > Date.now()) s.due = Date.now();
              }
              save();
              render();
            },
          },
          '学習中を今すぐ',
        ),
      );
    btns.append(
      h(
        'button',
        {
          class: 'ghost',

            newLeft();
            st.newToday.n = Math.max(0, st.newToday.n - 10);

            render();
          },
        },
        '新しい語をあと10',
      ),
      h('button', { class: 'ghost', onclick: () => go('home') }, '戻る'),
    );
    box.append(btns);
    return box;
  }

  function reveal() {
    if (cur && !cur.revealed) {
      closePop();
      cur.revealed = true;
      render();
      document.getElementById('grade-3')?.focus({ preventScroll: true });
    }
  }
  function grade(g) {
    if (!cur?.revealed) return;
    closePop();
    const f = cur.face,
      now = Date.now();
    const before = st.cards[f];
    undo = {
      f,
      before: before ? { ...before } : null,
      nt: { ...st.newToday },
      queue: [...queue],
      sess: { ...sess },
    };
    if (!before) {
      newLeft();
      st.newToday.n++;
    }
    st.cards[f] = schedule(before || {}, g, now);
    toast(
      `${['もう一度', '難しい', '正解', '簡単'][g - 1]} · ${fmtIvl(st.cards[f].due - now)}後 · 取り消す U`,
    );
    lastCtx = ctxOf(f);
    st.log.push([f, g, now]);
    if (st.log.length > 5000) st.log = st.log.slice(-5000);
    save();
    sess.done++;
    if (g === 1) sess.again++;
    // a graded face leaves the sitting; a learning step re-enters only once it is due
    queue = queue.filter((x) => x !== f);
    cur = null;
    render();
    window.scrollTo(0, 0);
  }
  let toastEl = null;
  function toast(text) {
    toastEl?.remove();
    toastEl = h('div', { class: 'toast', role: 'status' }, text);
    document.body.append(toastEl);
  }
  function doUndo() {
    if (!undo) return;
    if (undo.before) st.cards[undo.f] = undo.before;
    else delete st.cards[undo.f];
    st.newToday = undo.nt;
    st.log.pop();
    queue = undo.queue;
    sess = undo.sess;
    cur = { face: undo.f, revealed: true, hint: hintFor(undo.f) };
    undo = null;
    save();
    render();
  }
  function bury() {
    if (!cur) return;
    st.buried[cur.face] = today();
    for (const [f, d] of Object.entries(st.buried)) if (d !== today()) delete st.buried[f];
    save();
    queue = queue.filter((x) => x !== cur.face);
    cur = null;
    render();
  }
  function cycleFuri() {
    st.furi = { hover: 'on', on: 'off', off: 'hover' }[st.furi] || 'hover';
    save();
    render();
  }
  let showHelp = false;
  function helpEl() {
    const keys = [
      ['Space / Enter', '答えを見る · 正解'],

      ['H', 'ヒント（定義 → 最初のかな → 英語）'],
      ['T / C', '英訳を開く'],
      ['F', 'ふりがな なし → ホバー → あり'],
      ['-', '今日は後で'],
      ['Esc', '終える'],
    ];
    return h(
      'div',
      {
        class: 'help',

            render();
          }

      },
      h(
        'div',
        { class: 'sheet' },
        h('div', { class: 'eyebrow' }, 'キーボード'),
        h(

            h('dt', {}, h('kbd', {}, k)),
            h('dd', { style: 'margin:0' }, v),
          ]),

  // ---------- reader ----------
  function renderRead(wrap) {
    const m = MODS.find((x) => x.id === readMod) || MODS[0];
    wrap.append(
      h(
        'div',
        { class: 'chips', role: 'toolbar', 'aria-label': '鉱脈' },

          ),

    art.append(
      h('div', { class: 'eyebrow' }, `${m.passage.level || ''} · ${m.cards.length}語`),

      h('p', { class: 'sub', lang: 'en' }, m.passage.title_en || m.title.en),
      h(

  // ---------- word list ----------
  function renderList(wrap) {
    const inp = h('input', {
      class: 'search',
      id: 'list-search',
      type: 'search',
      placeholder: '検索 — 漢字・かな・English',
      value: q,
      oninput: (e) => {
        q = e.target.value;
        draw();
      },
    });
    const filters = h('div', { class: 'opts filters', role: 'group', 'aria-label': '絞り込み' });
    const F = [
      ['all', 'すべて'],
      ['new', '未学習'],
      ['learn', '学習中'],
      ['review', '復習中'],
    ];
    for (const [id, label] of F)
      filters.append(
        h(
          'button',
          {
            'aria-pressed': String(qFilter === id),
            onclick: () => {
              qFilter = id;
              render();
            },
          },
          label,
        ),
      );
    const list = h('section', { class: 'sheet list' });
    wrap.append(inp, filters, list);
    const draw = () => {
      list.replaceChildren();
      const k = q.trim().toLowerCase();
      let shown = 0;
      for (const c of CARDS) {
        const [cls, lbl] = stateOf(c);
        if (qFilter !== 'all' && cls !== qFilter) continue;
        if (
          k &&
          !(c.term + c.reading + c.gloss + c.def_ja + c.mod.title.ja).toLowerCase().includes(k)
        )
          continue;
        shown++;
        const item = h('div', { class: 'item' });
        item.append(
          h(
            'button',
            {
              'aria-expanded': String(openItem === c.key),
              onclick: () => {
                openItem = openItem === c.key ? null : c.key;
                draw();
              },
            },
            h('span', { class: 't', lang: 'ja' }, c.term, h('small', {}, c.reading)),
            h('span', { class: 'g' }, c.gloss),
            h('span', { class: 'pill ' + cls }, lbl),
          ),
        );
        if (openItem === c.key)
          item.append(
            h(
              'div',
              { class: 'open' },
              h('p', { class: 'def', lang: 'ja' }, c.def_ja),
              contextEl(c, 'fill'),
              h(
                'div',
                { class: 'row-btns' },
                h(
                  'button',
                  {
                    class: 'ghost',
                    onclick: () => {
                      readMod = c.mod.id;
                      go('read');
                    },
                  },
                  '読み物で見る',
                ),
              ),
            ),
          );
        list.append(item);
      }
      if (!shown) list.append(h('p', { class: 'fine pad' }, '該当する語はありません。'));
    };
    draw();
  }

  // ---------- settings ----------
  function opts(label, key, choices, after) {
    return h(
      'div',
      { class: 'grp' },
      h('h3', {}, label),
      h(
        'div',
        { class: 'opts', role: 'group', 'aria-label': label },
        choices.map(([v, t, sub]) =>
          h(
            'button',
            {
              'aria-pressed': String(st[key] === v),
              'data-set': key + ':' + v,
              onclick: () => {
                st[key] = v;
                save();
                after?.();
                render();
              },
            },
            t,
            sub ? h('small', {}, sub) : null,
          ),
        ),
      ),
    );
  }
  function renderSettings(wrap) {
    const box = h('section', { class: 'sheet set' });
    const out = h('output', { class: 'num' }, st.newPerDay);
    const step = (d) => {
      st.newPerDay = clamp(st.newPerDay + d, 0, 200);
      out.textContent = st.newPerDay;
      save();
    };
    box.append(
      h(
        'div',
        { class: 'grp' },
        h('h3', {}, '一日の新しい語'),
        h(
          'div',
          { style: 'display:flex;gap:14px;align-items:center;flex-wrap:wrap' },
          h(
            'span',
            { class: 'stepper' },
            h('button', { 'aria-label': '減らす', onclick: () => step(-5) }, '−'),
            out,
            h('button', { 'aria-label': '増やす', onclick: () => step(5) }, '+'),
          ),
          h('span', { class: 'fine' }, '新しい語ひとつは、のちの復習でおよそ10回分の手間になる。'),
        ),
      ),
      opts('カード', 'mode', [
        ['both', '文脈で読む → クローズ', '意味が分かったら、空欄で言葉を思い出す（おすすめ）'],
        ['recognition', '文脈で読むだけ', '下線の語の意味を思い出す'],
        ['production', 'クローズだけ', '最初から空欄（MCD）'],
      ]),
      opts('クローズの最初のヒント', 'hint', [
        ['def', '日本語の定義', '空欄の下に（おすすめ）'],
        ['none', 'なし', '文脈だけ — 純粋なMCD'],
        ['reading', '読み', '空欄の中に'],
      ]),
      opts('ふりがな', 'furi', [
        ['hover', 'ホバー/タップ', '触れた語だけ'],
        ['on', 'すべて', ''],
        ['off', 'なし', ''],
      ]),
      opts('英訳', 'showEn', [
        [false, '隠す', 'タップで開く'],
        [true, '最初から見せる', ''],
      ]),
      opts('文字の大きさ', 'size', [
        [0.9, '小'],
        [1, '中'],
        [1.15, '大'],
        [1.3, '特大'],
      ]),
      opts('テーマ', 'theme', [
        ['auto', '自動'],
        ['light', '明'],
        ['dark', '暗'],
      ]),
    );
    if (canSpeak) {
      const sel = h(
        'select',
        {
          'aria-label': '声',
          style:
            'padding:8px 10px;border-radius:10px;border:0;background:var(--sheet-2);box-shadow:inset 0 0 0 1px var(--rule)',
          onchange: (e) => {
            st.voice = e.target.value;
            save();
            speak('財政支援を受けて、町に人が戻ってきた。');
          },
        },
        h(
          'option',
          { value: '' },
          voices.length ? `自動（${bestVoice()?.name || ''}）` : 'この端末に日本語の声がありません',
        ),
        voices.map((v) => h('option', { value: v.name, selected: st.voice === v.name }, v.name)),
      );
      box.append(
        h(
          'div',
          { class: 'grp' },
          h('h3', {}, '声'),
          h(
            'div',
            { style: 'display:flex;gap:10px;flex-wrap:wrap;align-items:center' },
            sel,
            h(
              'button',
              { class: 'ghost', onclick: () => speak('財政支援を受けて、町に人が戻ってきた。') },
              '試す',
            ),
          ),
          h(
            'p',
            { class: 'fine' },
            'この端末の読み上げ音声を使います（録音ではありません）。macOS/iOSの設定で「拡張」「プレミアム」の日本語音声を入れると自然になります。',
          ),
        ),
        opts('答えで自動読み上げ', 'autoplay', [
          [false, 'しない'],
          [true, 'する'],
        ]),
      );
    }
    const ta = h('textarea', {
      id: 'progress',
      'aria-label': 'Progress JSON',
      spellcheck: 'false',
    });
    const msg = h('p', { class: 'fine', 'aria-live': 'polite' });
    box.append(
      h(
        'div',
        { class: 'grp' },
        h('h3', {}, '進み具合の保存'),
        h(
          'p',
          { class: 'fine' },
          '進み具合はこのブラウザの中だけにあります。書き出して保存し、別の端末では貼り付けて読み込みます。',
        ),
        ta,
        h(
          'div',
          { class: 'row-btns' },
          h(
            'button',
            {
              class: 'ghost',
              onclick: () => {
                ta.value = JSON.stringify(st);
                ta.select();
                navigator.clipboard?.writeText(ta.value).then(
                  () => (msg.textContent = 'コピーしました。'),
                  () => (msg.textContent = '選択しました。キーボードでコピーしてください。'),
                );
              },
            },
            '書き出す',
          ),
          h(
            'button',
            {
              class: 'ghost',
              onclick: () => {
                const blob = new Blob([JSON.stringify(st)], { type: 'application/json' });
                const a = h('a', {
                  href: URL.createObjectURL(blob),
                  download: `kotoba-mine-progress-${new Date().toISOString().slice(0, 10)}.json`,
                });
                a.click();
                URL.revokeObjectURL(a.href);
              },
            },
            'ファイルに保存',
          ),
          h(
            'button',
            {
              class: 'ghost',
              onclick: () => {
                try {
                  const v = JSON.parse(ta.value);
                  if (!v || typeof v.cards !== 'object') throw 0;
                  st = { ...structuredClone(DEFAULTS), ...v };
                  save();
                  msg.textContent = '読み込みました。';
                } catch (e) {
                  msg.textContent =
                    'Kotoba Mine の書き出しではありません。全体を貼り付けてください。';
                }
              },
            },
            '読み込む',
          ),
          h(
            'button',
            {
              class: 'ghost danger',
              onclick: (e) => {
                if (e.currentTarget.dataset.arm) {
                  st = structuredClone(DEFAULTS);
                  save();
                  render();
                } else {
                  e.currentTarget.dataset.arm = '1';
                  e.currentTarget.textContent = 'もう一度押すと全消去';
                }
              },
            },
            'リセット',
          ),
        ),
        msg,
      ),
      h(
        'div',
        { class: 'grp' },
        h(
          'p',
          { class: 'fine' },
          `スケジューラ: FSRS-6（Bunkiの固定パラメータ、目標保持率90%）。記録 ${st.log.length}回。文・読み物・日本語の定義はBunkiのオリジナル。英語の語釈はJMdict（EDRDG, CC BY-SA 4.0）を編集したもの。`,
        ),
      ),
    );
    wrap.append(box);
  }

  // ---------- keys ----------
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select') || (e.metaKey && e.key !== 'z') || e.altKey)
      return;
    if (e.key === 'Escape') {
      if (popEl) return closePop();
      if (showHelp) return ((showHelp = false), render());
      if (screen === 'review') return go('home');
    }
    if (screen === 'home' && (e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) {
      e.preventDefault();
      if (buildQueue().length) startReview(null);
      return;
    }
    if (screen !== 'review') return;
    if (e.key === '?') return ((showHelp = !showHelp), render());
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (cur && !cur.revealed) reveal();
      else if (cur?.revealed) grade(3);
    } else if (cur?.revealed && ['1', '2', '3', '4'].includes(e.key)) {
      e.preventDefault();
      grade(Number(e.key));
    } else if ((e.key === 'u' || (e.key === 'z' && (e.metaKey || e.ctrlKey))) && undo) {
      e.preventDefault();
      doUndo();
    } else if (e.key === 'r' && cur) {
      const c = byKey.get(cur.face.split(':')[0]);
      if (cur.revealed || cur.face.endsWith(':r')) speak(sentenceOf(c));
    } else if (e.key === 'h') moreHint();
    else if ((e.key === 't' || e.key === 'c') && cur?.revealed) {
      document.getElementById('trans')?.classList.toggle('veiled');
    } else if (e.key === 'f') cycleFuri();
    else if (e.key === '-') bury();
  });
  window.addEventListener('resize', closePop);
  // #m01-money opens that module's passage (Bunki's 単語帳 links here per module)
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (MODS.some((m) => m.id === id)) {
      readMod = id;
      screen = 'read';
    }
  }
  fromHash();
  window.addEventListener('hashchange', () => {
    fromHash();
    render();
    window.scrollTo(0, 0);
  });
  render();
</script>
