<script>
  const DECK = /*__DECK__*/ null;
  // FSRS-6 weights — Bunki's pinned set (prototypes/corridor/data/fsrs-pin.json, request retention 0.9)
  const W = [
    0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835,
    0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542,
  ];
  const RETENTION = 0.9;
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const MIN = 60e3,
    DAY = 864e5;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const retr = (t, S) => Math.pow(1 + (FACTOR * t) / S, DECAY);
  const ivlDays = (S) =>
    clamp(Math.round((S / FACTOR) * (Math.pow(RETENTION, 1 / DECAY) - 1)), 1, 36500);
  const D0 = (g) => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
  const S0 = (g) => Math.max(W[g - 1], 0.1);
  const nextD = (D, g) => {
    const dp = D + (-W[6] * (g - 3) * (10 - D)) / 9;
    return clamp(W[7] * D0(4) + (1 - W[7]) * dp, 1, 10);
  };
  const recallS = (D, S, R, g) =>
    S *
    (1 +
      Math.exp(W[8]) *
        (11 - D) *
        Math.pow(S, -W[9]) *
        (Math.exp(W[10] * (1 - R)) - 1) *
        (g === 2 ? W[15] : 1) *
        (g === 4 ? W[16] : 1));
  const forgetS = (D, S, R) =>
    Math.min(
      W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)),
      S / Math.exp(W[17] * W[18]),
    );
  const shortS = (S, g) => {
    let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(S, -W[19]);
    if (g >= 3) inc = Math.max(inc, 1);
    return S * inc;
  };

  /** one grade, pure: returns the next card state */
  function schedule(c, g, now) {
    const n = { ...c, reps: (c.reps || 0) + 1, last: now };
    if (!c.s || c.s === 'new') {
      n.S = S0(g);
      n.D = D0(g);
      if (g === 4) return { ...n, s: 'review', due: now + ivlDays(n.S) * DAY };
      return {
        ...n,
        s: 'learn',
        step: g === 3 ? 1 : 0,
        due: now + (g === 1 ? 1 : g === 2 ? 6 : 10) * MIN,
      };
    }
    if (c.s === 'learn' || c.s === 'relearn') {
      n.S = shortS(c.S, g);
      n.D = nextD(c.D, g);
      if (g === 1) return { ...n, step: 0, due: now + (c.s === 'relearn' ? 10 : 1) * MIN };
      if (g === 2) return { ...n, due: now + (c.s === 'relearn' ? 10 : 6) * MIN };
      if (g === 3 && c.s === 'learn' && (c.step || 0) < 1)
        return { ...n, step: 1, due: now + 10 * MIN };
      return { ...n, s: 'review', due: now + Math.max(ivlDays(n.S), g === 4 ? 2 : 1) * DAY };
    }
    const t = Math.max(0, (now - c.last) / DAY);
    n.D = nextD(c.D, g);
    if (t < 1) {
      n.S = shortS(c.S, g);
    } else {
      const R = retr(t, c.S);
      if (g === 1) {
        n.S = forgetS(c.D, c.S, R);
        n.lapses = (c.lapses || 0) + 1;
        return { ...n, s: 'relearn', step: 0, due: now + 10 * MIN };
      }
      n.S = recallS(c.D, c.S, R, g);
    }
    if (g === 1) {
      n.lapses = (c.lapses || 0) + 1;
      return { ...n, s: 'relearn', step: 0, due: now + 10 * MIN };
    }
    let d = ivlDays(n.S);
    const prev = c.ivl || 0;
    if (g === 3) d = Math.max(d, prev + 1);
    if (g === 4) d = Math.max(d, ivlDays(recallS(c.D, c.S, retr(t, c.S), 3)) + 1, prev + 2);
    if (g === 2) d = Math.max(1, Math.min(d, ivlDays(recallS(c.D, c.S, retr(t, c.S), 3))));
    return { ...n, s: 'review', ivl: d, due: now + d * DAY };
  }
  const fmtIvl = (ms) =>
    ms < 60 * MIN
      ? `${Math.max(1, Math.round(ms / MIN))}分`
      : ms < DAY
        ? `${Math.round(ms / 36e5)}時間`
        : ms < 30 * DAY
          ? `${Math.round(ms / DAY)}日`
          : ms < 365 * DAY
            ? `${(ms / DAY / 30).toFixed(1)}か月`
            : `${(ms / DAY / 365).toFixed(1)}年`;

  // ---------- state ----------
  const KEY = 'kotoba-mine.v1';
  const today = () => new Date().toDateString();
  const DEFAULTS = {
    cards: {},
    on: {},
    newPerDay: 15,
    mode: 'recognition',
    showEn: false,
    newToday: { d: '', n: 0 },
    log: [],
  };
  let st = load();
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return { ...DEFAULTS, ...JSON.parse(raw) };
    } catch (e) {}
    return structuredClone(DEFAULTS);
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(st));
    } catch (e) {}
  }

  const MODS = DECK ? DECK.modules : [];
  const CARDS = [];
  for (const m of MODS) for (const c of m.cards) CARDS.push({ ...c, mod: m });
  const byKey = new Map(CARDS.map((c) => [c.key, c]));
  const modOn = (m) => st.on[m.id] !== false;
  /** a study item = one card face: `${key}:r` recognition, `${key}:p` production */
  function faces(c) {
    const out = [];
    if (st.mode !== 'production') out.push(c.key + ':r');
    if (st.mode !== 'recognition') {
      // production opens only once the word can be recognised (comprehension first)
      const r = st.cards[c.key + ':r'];
      if (st.mode === 'production' || (r && r.s === 'review')) out.push(c.key + ':p');
    }
    return out;
  }
  function counts(cardsList, now = Date.now()) {
    const eod = new Date();
    eod.setHours(23, 59, 59, 999);
    let fresh = 0,
      due = 0,
      learn = 0,
      mature = 0;
    for (const c of cardsList)
      for (const f of faces(c)) {
        const s = st.cards[f];
        if (!s) fresh++;
        else if (s.s === 'review') {
          if (s.due <= eod.getTime()) due++;
          if ((s.ivl || 0) >= 21) mature++;
        } else {
          learn++;
          if (s.due <= now) due++;
        }
      }
    return { fresh, due, learn, mature };
  }
  function newLeft() {
    if (st.newToday.d !== today()) st.newToday = { d: today(), n: 0 };
    return Math.max(0, st.newPerDay - st.newToday.n);
  }

  function buildQueue(now = Date.now()) {
    const eod = new Date();
    eod.setHours(23, 59, 59, 999);
    const learn = [],
      review = [],
      fresh = [];
    for (const c of CARDS) {
      if (!modOn(c.mod)) continue;
      for (const f of faces(c)) {
        const s = st.cards[f];
        if (!s) fresh.push(f);
        else if (s.s === 'review') {
          if (s.due <= eod.getTime()) review.push(f);
        } else if (s.due <= now) learn.push(f);
      }
    }
    review.sort((a, b) => st.cards[a].due - st.cards[b].due);
    learn.sort((a, b) => st.cards[a].due - st.cards[b].due);
    return [...learn, ...review, ...fresh.slice(0, newLeft())];
  }
  function nextLearnDue() {
    let best = null;
    for (const [f, s] of Object.entries(st.cards)) {
      const c = byKey.get(f.split(':')[0]);
      if (c && modOn(c.mod) && s.s !== 'review' && (best === null || s.due < best)) best = s.due;
    }
    return best;
  }

  // ---------- tiny DOM helper ----------
  function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'html') e.innerHTML = v;
      else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat())
      if (k !== null && k !== undefined && k !== false)
        e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  }
  function marked(ja, form, cls = 't', blank = false, kanjiOf = null) {
    // a production prompt masks every occurrence, or a repeat gives it away;
    // a kanji card also masks its bare character inside other compounds
    if (blank && ja.includes(form))
      return ja.split(form).flatMap((part, i) => {
        const bits =
          kanjiOf && part.includes(kanjiOf)
            ? part
                .split(kanjiOf)
                .flatMap((x, j) => (j ? [h('span', { class: 'blank' }, '［］'), x] : [x]))
            : [part];
        return i ? [h('span', { class: 'blank' }, '［　　］'), ...bits] : bits;
      });
    const i = ja.indexOf(form);
    if (i < 0) return [ja];
    return [
      ja.slice(0, i),
      blank ? h('span', { class: 'blank' }, '［　　］') : h('span', { class: cls }, form),
      ja.slice(i + form.length),
    ];
  }

  // ---------- views ----------
  let tab = 'study';
  let cur = null; // { face, revealed }
  let queue = [];
  let undo = null;
  let readMod = MODS[0]?.id;
  let readPick = null;
  let q = '';
  const view = document.getElementById('view');

  function render() {
    for (const b of document.querySelectorAll('nav.tabs button'))
      b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    view.replaceChildren();
    if (!DECK) {
      view.append(
        h(
          'p',
          { class: 'lead' },
          'Deck data missing — build with decks/kotoba-mine/tools/build_deck.py.',
        ),
      );
      return;
    }
    if (tab === 'study') renderStudy();
    else if (tab === 'read') renderRead();
    else if (tab === 'index') renderIndex();
    else renderSettings();
  }

  /** the face that measures a word's progress: recognition, or production
   * when that is the only face being studied */
  const progressOf = (c) => st.cards[c.key + (st.mode === 'production' ? ':p' : ':r')];
  function stateLabel(c) {
    const s = progressOf(c);
    if (!s) return ['new', '未'];
    if (s.s !== 'review') return ['learn', '学習中'];
    return ['review', fmtIvl(Math.max(0, s.due - Date.now())) + '後'];
  }

  function renderVeins() {
    const box = h('section', { class: 'veins', 'aria-label': 'Modules' });
    for (const m of MODS) {
      const c = counts(m.cards.map((x) => byKey.get(x.key)));
      const total = m.cards.length;
      const known = m.cards.filter((x) => progressOf(x)?.s === 'review').length;
      const learning = m.cards.filter((x) => {
        const s = progressOf(x);
        return s && s.s !== 'review';
      }).length;
      const id = 'vein-' + m.id;
      const row = h(
        'div',
        { class: 'vein' + (modOn(m) ? '' : ' off') },
        h('input', {
          type: 'checkbox',
          id,
          checked: modOn(m),
          'aria-label': `study ${m.title.en}`,
          onchange: (e) => {
            st.on[m.id] = e.target.checked;
            save();
            queue = [];
            cur = null;
            render();
          },
        }),
        h(
          'label',
          { class: 'name', for: id },
          h('b', {}, m.title.ja.split(' — ')[0]),
          h('small', {}, m.title.ja.split(' — ')[1] || m.title.en),
          h(
            'span',
            { class: 'bar', 'aria-hidden': 'true' },
            h('i', { class: 'm', style: `width:${(known / total) * 100}%` }),
            h('i', { class: 'l', style: `width:${(learning / total) * 100}%` }),
          ),
        ),
        h('span', { class: 'count' }, `${known}/${total}`, h('br'), c.due ? `復習 ${c.due}` : ''),
      );
      box.append(row);
    }
    return box;
  }

  function renderStudy() {
    const all = counts(CARDS.filter((c) => modOn(c.mod)));
    const nl = newLeft();
    view.append(
      h(
        'div',
        { class: 'summary' },
        h('span', { class: 'due' }, '復習 ', h('b', {}, all.due)),
        h(
          'span',
          { class: 'new' },
          '新しい語 ',
          h('b', {}, Math.min(nl, all.fresh)),
          ` / ${all.fresh}`,
        ),
        h('span', {}, '定着 ', h('b', {}, all.mature)),
        h('span', {}, `${CARDS.length}語 · ${MODS.length}鉱脈`),
      ),
    );
    if (!queue.length) queue = buildQueue();
    else pullDueLearning();
    if (!cur || !queue.includes(cur.face))
      cur = queue.length ? { face: queue[0], revealed: false } : null;
    view.append(cur ? renderCard() : renderDone());
    view.append(
      h(
        'p',
        { class: 'lead', style: 'margin-top:18px' },
        '鉱脈を選んで掘る — tick the modules to study. Read a module’s passage first (読む), then mine its words here: the sentence asks, the word answers.',
      ),
    );
    view.append(renderVeins());
  }

  /** learning faces whose step has come due join the front of the sitting */
  function pullDueLearning(now = Date.now()) {
    const due = [];
    for (const [f, s] of Object.entries(st.cards)) {
      const c = byKey.get(f.split(':')[0]);
      if (
        c &&
        modOn(c.mod) &&
        faces(c).includes(f) &&
        s.s !== 'review' &&
        s.due <= now &&
        !queue.includes(f)
      )
        due.push(f);
    }
    due.sort((a, b) => st.cards[a].due - st.cards[b].due);
    queue = [...due, ...queue];
  }

  let learnTimer = null;
  function renderDone() {
    const nd = nextLearnDue();
    clearTimeout(learnTimer);
    if (nd) {
      // come back on our own when the next learning step is due
      learnTimer = setTimeout(
        () => {
          if (tab === 'study' && !cur) {
            queue = [];
            render();
          }
        },
        Math.max(0, nd - Date.now()) + 500,
      );
    }
    const box = h('section', { class: 'bench empty' });
    box.append(h('h2', {}, '今日の分は掘り終えた'));
    box.append(
      h(
        'p',
        { class: 'lead' },
        nd
          ? `Next learning step in ${fmtIvl(Math.max(0, nd - Date.now()))}.`
          : 'Nothing due. Read a passage, or raise new words per day in 設定.',
      ),
    );
    const btns = h('div', { class: 'row-btns' });
    if (nd)
      btns.append(
        h(
          'button',
          {
            class: 'btn',
            onclick: () => {
              for (const s of Object.values(st.cards))
                if (s.s !== 'review' && s.due > Date.now()) s.due = Date.now();
              save();
              queue = [];
              render();
            },
          },
          '学習中の語を今やる',
        ),
      );
    btns.append(
      h(
        'button',
        {
          class: 'btn',
          onclick: () => {
            st.newToday.n = Math.max(0, st.newToday.n - 10);
            save();
            queue = [];
            render();
          },
        },
        '新しい語をあと10',
      ),
    );
    box.append(btns);
    return box;
  }

  function preview(face) {
    const s = st.cards[face] || {};
    const now = Date.now();
    return [1, 2, 3, 4].map((g) => fmtIvl(schedule(s, g, now).due - now));
  }

  function renderCard() {
    const [key, side] = cur.face.split(':');
    const c = byKey.get(key);
    const { ja, form, en } = c.sentences[0];
    const box = h('section', { class: 'bench', 'aria-live': 'polite' });
    const s = st.cards[cur.face];
    box.append(
      h(
        'div',
        { class: 'kind' },
        h(
          'span',
          {},
          `${c.mod.title.ja.split(' — ')[0]} · ${side === 'r' ? '認識 recognition' : '産出 production'}`,
        ),
        h(
          'span',
          {},
          s ? (s.s === 'review' ? `間隔 ${s.ivl || 1}日` : '学習中') : '新しい語',
          ` · 残り ${queue.length}`,
        ),
      ),
    );
    box.append(
      h(
        'p',
        { class: 'sentence', lang: 'ja' },
        marked(ja, form, 't', side === 'p' && !cur.revealed, c.kanji ? c.term : null),
      ),
    );
    if (side === 'p' && !cur.revealed)
      box.append(h('p', { class: 'hint', lang: 'ja' }, c.def_ja, h('br'), h('small', {}, c.gloss)));
    if (!cur.revealed) {
      box.append(
        h('button', { class: 'reveal-btn', id: 'reveal', onclick: reveal }, '答えを見る  ␣'),
      );
    } else {
      box.append(renderAnswer(c, en));
      const pv = preview(cur.face);
      const names = ['もう一度', '難しい', '正解', '簡単'];
      box.append(
        h(
          'div',
          { class: 'grades', role: 'group', 'aria-label': 'Grade' },
          [1, 2, 3, 4].map((g) =>
            h(
              'button',
              { class: 'g' + g, id: 'grade-' + g, onclick: () => grade(g) },
              h('span', {}, `${g} ${names[g - 1]}`),
              h('small', {}, pv[g - 1]),
            ),
          ),
        ),
      );
    }
    const tools = h('div', { class: 'tools' });
    if (undo) tools.append(h('button', { class: 'linkish', onclick: doUndo }, '取り消す (u)'));
    tools.append(
      h(
        'button',
        {
          class: 'linkish',
          onclick: () => {
            readMod = c.mod.id;
            readPick = c.key;
            tab = 'read';
            render();
          },
        },
        '読み物で見る',
      ),
    );
    tools.append(
      h(
        'button',
        {
          class: 'linkish',
          onclick: () => {
            queue = queue.filter((f) => f !== cur.face);
            queue.push(cur.face);
            cur = null;
            render();
          },
        },
        '後回し',
      ),
    );
    box.append(tools);
    return box;
  }

  function renderAnswer(c, en) {
    const a = h('div', { class: 'answer', lang: 'ja' });
    a.append(
      h(
        'div',
        { class: 'head' },
        h('span', { class: 'term' }, c.term),
        h('span', { class: 'reading' }, c.reading),
      ),
    );
    a.append(
      h(
        'div',
        { class: 'chips' },
        h('span', { class: 'chip' }, c.pos),
        ...c.register.split('・').map((r) => h('span', { class: 'chip' }, r)),
      ),
    );
    a.append(h('p', { class: 'def' }, c.def_ja));
    a.append(h('p', { class: 'gloss', lang: 'en' }, c.gloss));
    const d = h('details', { class: 'en', lang: 'en' }, h('summary', {}, 'English'), en);
    if (st.showEn) d.open = true;
    a.append(d);
    if (c.sentences.length > 1) {
      const more = h('div', {}, h('div', { class: 'lbl' }, '別の文脈'));
      for (const x of c.sentences.slice(1))
        more.append(
          h(
            'div',
            { class: 'ex' },
            h('span', { class: 'ja' }, marked(x.ja, x.form)),
            h('span', { class: 'en', lang: 'en' }, x.en),
          ),
        );
      a.append(more);
    }
    if (c.collocations?.length)
      a.append(
        h(
          'div',
          {},
          h('div', { class: 'lbl' }, 'よく使う形'),
          h(
            'div',
            { class: 'cols' },
            c.collocations.map((x) => h('span', {}, x)),
          ),
        ),
      );
    if (c.confusables?.length)
      a.append(
        h(
          'div',
          {},
          h('div', { class: 'lbl' }, '紛らわしい語'),
          h(
            'ul',
            { class: 'conf' },
            c.confusables.map((x) =>
              h('li', {}, h('b', {}, x.term), ' — ', h('span', { lang: 'en' }, x.note)),
            ),
          ),
        ),
      );
    if (c.kanji)
      a.append(
        h(
          'div',
          {},
          h('div', { class: 'lbl' }, '字'),
          h(
            'p',
            { class: 'gloss' },
            `音 ${(c.kanji.on || []).join('・')}　訓 ${(c.kanji.kun || []).join('・')} — ${c.kanji.meaning || ''}`,
          ),
          h(
            'div',
            { class: 'cols' },
            (c.kanji.compounds || []).map((x) => h('span', {}, `${x.w}（${x.r}）`)),
          ),
        ),
      );
    if (c.note) a.append(h('p', { class: 'note', lang: 'en' }, c.note));
    return a;
  }

  function reveal() {
    if (cur && !cur.revealed) {
      cur.revealed = true;
      render();
      document.getElementById('grade-3')?.focus({ preventScroll: true });
    }
  }
  function grade(g) {
    if (!cur?.revealed) return;
    const f = cur.face,
      now = Date.now();
    const before = st.cards[f];
    undo = { f, before: before ? { ...before } : null, nt: { ...st.newToday }, queue: [...queue] };
    if (!before) {
      newLeft();
      st.newToday.n++;
    }
    const next = schedule(before || {}, g, now);
    st.cards[f] = next;
    st.log.push([f, g, now]);
    if (st.log.length > 5000) st.log = st.log.slice(-5000);
    save();
    // a graded face leaves the sitting; a learning step re-enters only once
    // it is actually due (pullDueLearning, or the timer renderDone arms)
    queue = queue.filter((x) => x !== f);
    pullDueLearning(now);
    cur = queue.length ? { face: queue[0], revealed: false } : null;
    render();
  }
  function doUndo() {
    if (!undo) return;
    if (undo.before) st.cards[undo.f] = undo.before;
    else delete st.cards[undo.f];
    st.newToday = undo.nt;
    st.log.pop();
    queue = undo.queue;
    cur = { face: undo.f, revealed: true };
    undo = null;
    save();
    render();
  }

  function renderRead() {
    const m = MODS.find((x) => x.id === readMod) || MODS[0];
    const sel = h(
      'select',
      {
        id: 'read-module',
        'aria-label': 'Module',
        onchange: (e) => {
          readMod = e.target.value;
          readPick = null;
          render();
        },
      },
      MODS.map((x) => h('option', { value: x.id, selected: x.id === m.id }, x.title.ja)),
    );
    view.append(sel);
    const art = h('article', { class: 'passage', lang: 'ja' });
    art.append(
      h('h2', {}, m.passage.title),
      h(
        'p',
        { class: 'sub', lang: 'en' },
        (m.passage.title_en || m.title.en) +
          ` · ${m.cards.length} mined words, underlined — tap one`,
      ),
    );
    // place each card on its sentences[0] occurrence; longer forms first so compounds win
    const flat = m.passage.text;
    const marks = [];
    for (const c of [...m.cards].sort(
      (a, b) => b.sentences[0].form.length - a.sentences[0].form.length,
    )) {
      const s0 = c.sentences[0];
      // every occurrence of the form in every copy of the sentence is tried,
      // so a compound that claimed the first 磁気共鳴 leaves the later one free
      let placed = false;
      for (let at = flat.indexOf(s0.ja); at >= 0 && !placed; at = flat.indexOf(s0.ja, at + 1)) {
        for (let f = s0.ja.indexOf(s0.form); f >= 0 && !placed; f = s0.ja.indexOf(s0.form, f + 1)) {
          const a = at + f,
            b = a + s0.form.length;
          if (!marks.some((x) => a < x.b && b > x.a)) {
            marks.push({ a, b, c });
            placed = true;
          }
        }
      }
    }
    marks.sort((x, y) => x.a - y.a);
    let pos = 0,
      para = h('p');
    const flush = (txt) => {
      const parts = txt.split(/\n+/);
      parts.forEach((p, i) => {
        if (i > 0) {
          if (para.childNodes.length) art.append(para);
          para = h('p');
        }
        if (p) para.append(p);
      });
    };
    for (const mk of marks) {
      flush(flat.slice(pos, mk.a));
      const known = progressOf(mk.c)?.s === 'review';
      para.append(
        h(
          'button',
          {
            class: 'w' + (known ? ' known' : ''),
            onclick: () => {
              readPick = mk.c.key;
              render();
            },
          },
          flat.slice(mk.a, mk.b),
        ),
      );
      pos = mk.b;
    }
    flush(flat.slice(pos));
    if (para.childNodes.length) art.append(para);
    view.append(art);
    if (readPick) {
      const c = byKey.get(readPick);
      if (c) {
        const [cls, lbl] = stateLabel(c);
        view.append(
          h(
            'div',
            { class: 'pop', lang: 'ja' },
            h(
              'div',
              { class: 'head' },
              h('span', { class: 'term', style: 'font-size:1.4rem' }, c.term),
              h('span', { class: 'reading' }, c.reading),
              h('span', { class: 'st ' + cls }, lbl),
            ),
            h('p', { class: 'def' }, c.def_ja),
            h('p', { class: 'gloss', lang: 'en' }, c.gloss),
            h(
              'button',
              {
                class: 'linkish',
                onclick: () => {
                  readPick = null;
                  render();
                },
              },
              '閉じる',
            ),
          ),
        );
      }
    }
  }

  function renderIndex() {
    const inp = h('input', {
      class: 'search',
      id: 'index-search',
      type: 'search',
      placeholder: '検索 — kanji, kana or English',
      value: q,
      oninput: (e) => {
        q = e.target.value;
        drawRows();
      },
    });
    view.append(inp);
    const rows = h('div', { class: 'rows' });
    view.append(rows);
    const drawRows = () => {
      rows.replaceChildren();
      const k = q.trim().toLowerCase();
      for (const c of CARDS) {
        if (
          k &&
          !(c.term + c.reading + c.gloss + c.def_ja + c.mod.title.ja).toLowerCase().includes(k)
        )
          continue;
        const [cls, lbl] = stateLabel(c);
        rows.append(
          h(
            'div',
            {
              class: 'row',
              role: 'button',
              tabindex: '0',
              onclick: () => {
                readMod = c.mod.id;
                readPick = c.key;
                tab = 'read';
                render();
              },
            },
            h('span', { class: 'w', lang: 'ja' }, c.term, h('small', {}, c.reading)),
            h('span', { class: 'g' }, c.gloss),
            h('span', { class: 'st ' + cls }, lbl),
          ),
        );
      }
      if (!rows.childNodes.length)
        rows.append(h('p', { class: 'fine' }, 'No word matches that search.'));
    };
    drawRows();
  }

  function renderSettings() {
    const box = h('section', { class: 'settings' });
    box.append(
      h(
        'div',
        { class: 'field' },
        h('label', { for: 'set-new' }, '一日の新しい語 · new words per day'),
        h('input', {
          type: 'number',
          id: 'set-new',
          min: '0',
          max: '200',
          value: st.newPerDay,
          onchange: (e) => {
            st.newPerDay = clamp(parseInt(e.target.value, 10) || 0, 0, 200);
            save();
            queue = [];
          },
        }),
      ),
    );
    box.append(
      h(
        'div',
        { class: 'field' },
        h('label', { for: 'set-mode' }, 'カードの種類 · card faces'),
        h(
          'select',
          {
            id: 'set-mode',
            onchange: (e) => {
              st.mode = e.target.value;
              save();
              queue = [];
              cur = null;
            },
          },
          [
            ['recognition', '認識のみ — sentence → meaning (recommended start)'],
            ['both', '認識＋産出 — production unlocks after a word is recognised'],
            ['production', '産出のみ — cloze + Japanese definition → word'],
          ].map(([v, t]) => h('option', { value: v, selected: st.mode === v }, t)),
        ),
      ),
    );
    box.append(
      h(
        'div',
        { class: 'field' },
        h(
          'label',
          {},
          h('input', {
            type: 'checkbox',
            id: 'set-en',
            checked: st.showEn,
            onchange: (e) => {
              st.showEn = e.target.checked;
              save();
            },
          }),
          ' 英訳を最初から開く · open the English translation by default',
        ),
      ),
    );
    const ta = h('textarea', {
      id: 'progress',
      'aria-label': 'Progress JSON',
      spellcheck: 'false',
    });
    box.append(
      h(
        'div',
        { class: 'field' },
        h('label', { for: 'progress' }, '進み具合の保存 · back up or move your progress'),
        h(
          'p',
          { class: 'fine' },
          'Progress lives in this browser only. Copy it out to keep it; paste a copy back in and press 読み込む to restore it.',
        ),
        ta,
        h(
          'div',
          { class: 'row-btns' },
          h(
            'button',
            {
              class: 'btn',
              onclick: () => {
                ta.value = JSON.stringify(st);
                ta.select();
                navigator.clipboard?.writeText(ta.value).then(
                  () => (msg.textContent = 'Copied.'),
                  () => (msg.textContent = 'Selected — copy it with your keyboard.'),
                );
              },
            },
            '書き出す · copy',
          ),
          h(
            'button',
            {
              class: 'btn',
              onclick: () => {
                try {
                  const v = JSON.parse(ta.value);
                  if (!v || typeof v.cards !== 'object') throw 0;
                  st = { ...DEFAULTS, ...v };
                  save();
                  queue = [];
                  cur = null;
                  msg.textContent = 'Progress restored.';
                } catch (e) {
                  msg.textContent =
                    'That text is not a Kotoba Mine backup. Paste the whole copied block.';
                }
              },
            },
            '読み込む · restore',
          ),
          h(
            'button',
            {
              class: 'btn danger',
              onclick: (e) => {
                if (e.target.dataset.arm) {
                  st = structuredClone(DEFAULTS);
                  save();
                  queue = [];
                  cur = null;
                  render();
                } else {
                  e.target.dataset.arm = '1';
                  e.target.textContent = 'もう一度押すと全消去';
                }
              },
            },
            'リセット · reset',
          ),
        ),
      ),
    );
    const msg = h('p', { class: 'fine', 'aria-live': 'polite' });
    box.append(msg);
    const reviews = st.log.length;
    box.append(
      h(
        'p',
        { class: 'fine' },
        `Scheduler: FSRS-6 with Bunki's pinned weights, 90% target retention. ${reviews} reviews logged. ` +
          `Sentences, passages and Japanese definitions are Bunki originals; English glosses are edited from JMdict (EDRDG, CC BY-SA 4.0).`,
      ),
    );
    view.append(box);
  }

  document.querySelector('nav.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (b) {
      tab = b.dataset.tab;
      render();
      window.scrollTo(0, 0);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (tab !== 'study' || e.target.closest('input, textarea, select')) return;
    if ((e.key === ' ' || e.key === 'Enter') && cur && !cur.revealed) {
      e.preventDefault();
      reveal();
    } else if (cur?.revealed && ['1', '2', '3', '4'].includes(e.key)) {
      e.preventDefault();
      grade(Number(e.key));
    } else if (e.key === 'u' && undo) doUndo();
  });
  render();
</script>
