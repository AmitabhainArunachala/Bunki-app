<div class="km lv{{Level}}">
  <div class="chips">
    <span class="chip lvchip">文 {{Level}}/3</span><span class="chip">{{Topic}}</span>
  </div>
  <div class="sentence">{{furigana:SentenceFurigana}}</div>
  <div class="answer">
    <div class="word">
      <span class="term">{{Word}}</span><span class="reading">{{Reading}}</span>
    </div>
    <div class="def">{{DefJA}}</div>
    <div class="meaning">{{Meaning}}</div>
    <div class="en">{{SentenceEN}}</div>
    {{#Tip}}
    <div class="tip">{{Tip}}</div>
    {{/Tip}}
  </div>
</div>
