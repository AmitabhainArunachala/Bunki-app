<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>言葉の鉱脈</title>
<style data-kp>html,body{margin:0;background:#0a0e13}body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}.kp{margin:0!important}
/* 集中道場 deck player — one column, dark by default, high contrast.
 * One hue axis per surface (docs/srs/brief-2026-10-04/aesthetics.md §3), each hue paired
 * with text or shape:
 *   target / term       part of speech (--kp-noun … --kp-sound), underlined; the blank is the accent
 *   card edge + chip    item kind: 語 --kp-kind-go, 字 --kp-kind-ji, 文法 --kp-kind-bun
 *   grades, state       red again / hard · amber learning / due · green good / known
 *   everything else     ink, ink-2, mute — English and the level chip (N1/N2/N3) are never coloured
 * Textures sit on the page, never on the card under the ruby. Contrast: tools/contrast-kotoba.mjs. */
.kp {
  --kp-bg: #0a0e13;
  --kp-panel: #121922;
  --kp-panel-2: #18212c;
  --kp-ink: #f3f7fb;
  --kp-ink-2: #b7c3cf;
  --kp-mute: #8796a4;
  --kp-line: #263240;
  --kp-cyan: #3fd0ff;
  --kp-cyan-wash: rgba(63, 208, 255, 0.14);
  --kp-red: #ff5d6c;
  --kp-amber: #ffb648;
  --kp-green: #3ee391;
  --kp-violet: #a58bff;
  /* item kind: the card's left edge and its 語・字・文法 chip (aesthetics.md §3) */
  --kp-kind-go: var(--kp-cyan);
  --kp-kind-ji: #ff8fd8;
  --kp-kind-bun: var(--kp-violet);
  --kp-jp: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  --kp-num: ui-monospace, 'SF Mono', 'Menlo', monospace;
  color-scheme: dark;
  background: var(--kp-bg);
  background-image: var(--kp-tex);
  color: var(--kp-ink);
  font-family: var(--kp-jp);
  margin: -8px -16px 0;
  padding: 12px 16px 48px;
  min-height: 100vh;
  box-sizing: border-box;
}
.kp[data-look='light'] {
  --kp-bg: #f5f8fb;
  --kp-panel: #ffffff;
  --kp-panel-2: #eef3f7;
  --kp-ink: #0b1520;
  --kp-ink-2: #27343f;
  --kp-mute: #4f5d6a;
  --kp-line: #d3dde6;
  --kp-cyan: #005f98;
  --kp-cyan-wash: rgba(0, 95, 152, 0.1);
  --kp-red: #c32a3d;
  --kp-amber: #955900;
  --kp-green: #075e36;
  --kp-violet: #5f46c9;
  --kp-kind-ji: #a3237a;
  color-scheme: light;
}
.kp * { box-sizing: border-box; }
.kp section { max-width: 40rem; margin: 0 auto; display: grid; gap: 16px; }
.kp button { font: inherit; color: inherit; cursor: pointer; }
.kp button:focus-visible, .kp input:focus-visible, .kp textarea:focus-visible { outline: 2px solid var(--kp-cyan); outline-offset: 2px; }

.kp-top { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.kp-icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-panel); font-size: 18px; flex: none; }
.kp-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
.kp-sub { margin: 0; color: var(--kp-ink-2); font-size: 14px; line-height: 1.6; }
.kp-h2 { margin: 8px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--kp-mute); }

.kp-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kp-done .kp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kp-tile { background: var(--kp-panel); border: 1px solid var(--kp-line); border-radius: 14px; padding: 12px 10px; display: grid; gap: 2px; }
.kp-tile b { font-family: var(--kp-num); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kp-tile span { font-size: 12px; color: var(--kp-ink-2); }
.kp-c-due b, .kp-c-due { color: var(--kp-amber); }
.kp-c-new b { color: var(--kp-ink); }
.kp-c-known b, .kp-verdict.kp-c-known { color: var(--kp-green); }
.kp-c-hard b, .kp-verdict.kp-c-hard { color: var(--kp-red); }
.kp-tile span { color: var(--kp-ink-2); }

.kp-start { width: 100%; min-height: 56px; border: 0; border-radius: 16px; background: var(--kp-cyan); color: #00131d; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
.kp[data-look='light'] .kp-start { color: #fff; }
.kp-start:disabled { background: var(--kp-panel-2); color: var(--kp-mute); cursor: default; }

.kp-groups { display: grid; gap: 6px; }
.kp-group { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; grid-template-rows: auto 6px; column-gap: 12px; row-gap: 8px; align-items: center; padding: 12px 14px; background: var(--kp-panel); border: 1px solid var(--kp-line); border-radius: 14px; cursor: pointer; }
.kp-group input { width: 20px; height: 20px; accent-color: var(--kp-cyan); margin: 0; }
.kp-group.is-off { opacity: 0.45; }
.kp-gname { min-width: 0; display: grid; }
.kp-gname b { font-size: 16px; }
.kp-gname small { color: var(--kp-mute); font-size: 12px; }
.kp-gcount { font-family: var(--kp-num); font-size: 13px; color: var(--kp-ink-2); }
.kp-bar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--kp-panel-2); }
.kp-bar i { display: block; height: 100%; }
.kp-bar .kp-c-known { background: var(--kp-green); }
.kp-bar .kp-c-grow { background: color-mix(in srgb, var(--kp-green) 55%, var(--kp-panel-2)); }
.kp-bar .kp-c-learn { background: var(--kp-amber); }

.kp-foot { display: flex; gap: 20px; justify-content: center; }
.kp-link { background: none; border: 0; color: var(--kp-ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; padding: 8px; }

/* study */
.kp-top-study { gap: 10px; }
.kp-progress { flex: 1; height: 6px; border-radius: 3px; background: var(--kp-panel-2); overflow: hidden; }
/* the rail ticks per card on the compositor: scaleX, never width */
.kp-progress i { display: block; height: 100%; width: 100%; background: var(--kp-cyan); transform-origin: left center; transform: scaleX(var(--kp-frac, 0)); transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1); }
.kp-count { font-family: var(--kp-num); font-size: 13px; color: var(--kp-ink-2); font-variant-numeric: tabular-nums; }

.kp-card { --kp-kind: var(--kp-kind-go); background: var(--kp-panel); border: 1px solid var(--kp-line); border-left: 4px solid var(--kp-kind); border-radius: 18px; padding: 18px 18px 20px; display: grid; gap: 14px; touch-action: pan-y; user-select: none; transition: transform 0.12s, box-shadow 0.12s; min-height: 220px; }
/* item kind: the left edge and the kind chip, nothing else */
.kp-kind-ji { --kp-kind: var(--kp-kind-ji); }
.kp-kind-bun { --kp-kind: var(--kp-kind-bun); }
.kp-card[data-swipe='good'] { box-shadow: 0 0 0 2px var(--kp-green); }
.kp-card[data-swipe='again'] { box-shadow: 0 0 0 2px var(--kp-red); }
.kp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kp-chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--kp-line); color: var(--kp-ink-2); white-space: nowrap; }
.kp-kindchip { color: var(--kp-kind); border-color: currentColor; font-weight: 700; }
/* level: a monochrome text chip, only when the word has one (aesthetics.md §3) */
.kp-levelchip { color: var(--kp-ink-2); background: var(--kp-panel-2); font-family: var(--kp-num); letter-spacing: 0.04em; }
.kp-st-new { color: var(--kp-ink-2); }
.kp-st-learn { color: var(--kp-amber); border-color: currentColor; }
.kp-st-grow { color: var(--kp-green); border-color: currentColor; border-style: dashed; }
.kp-st-known { color: var(--kp-green); border-color: currentColor; }
.kp-st-hard { color: var(--kp-red); border-color: currentColor; }

.kp-sentence { margin: 0; font-size: clamp(22px, 6.2vw, 30px); line-height: 2.05; font-weight: 500; letter-spacing: 0.02em; color: var(--kp-ink); overflow-wrap: anywhere; }
.kp-sentence rt { font-size: 0.45em; color: var(--kp-ink-2); font-weight: 400; letter-spacing: 0; }
.kp-blank { display: inline-block; min-width: 2.4em; border-bottom: 3px solid var(--kp-cyan); background: var(--kp-cyan-wash); border-radius: 6px 6px 0 0; margin: 0 2px; line-height: 1.3; }
.kp-target { color: var(--kp-cyan); font-weight: 700; text-decoration: underline 2px; text-underline-offset: 0.28em; }
.kp-target rt { color: inherit; }
.kp-hint { margin: 0; font-size: 16px; color: var(--kp-ink-2); }
.kp-taphint { margin: 0; font-size: 12px; color: var(--kp-mute); letter-spacing: 0.08em; }

.kp-answer { display: grid; gap: 6px; border-top: 1px solid var(--kp-line); padding-top: 14px; }
.kp-word { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.kp-term { font-size: 30px; font-weight: 700; color: var(--kp-cyan); line-height: 1.2; }
.kp-reading { font-size: 18px; color: var(--kp-ink-2); }
.kp-def { margin: 0; font-size: 17px; line-height: 1.6; }
.kp-note { margin: 0; font-size: 15px; line-height: 1.6; color: var(--kp-ink-2); }
.kp-pitch { font-family: var(--kp-num); font-size: 13px; color: var(--kp-ink-2); border: 1px solid var(--kp-line); border-radius: 6px; padding: 0 5px; }
.kp-en { margin: 0; font-size: 14px; color: var(--kp-ink-2); line-height: 1.5; }
.kp-tip { margin: 4px 0 0; font-size: 13px; color: var(--kp-ink-2); line-height: 1.5; }
.kp-tip-label { color: var(--kp-mute); }
.kp-en-none { font-size: 13px; color: var(--kp-mute); }
.kp-src { margin: 2px 0 0; font-size: 12px; color: var(--kp-ink-2); letter-spacing: .02em; }

/* the back's second tier: one tap each, the same order on every card */
.kp-folds { display: grid; margin-top: 6px; border-top: 1px solid var(--kp-line); }
.kp-fold { border-bottom: 1px solid var(--kp-line); }
.kp-fold > summary { list-style: none; cursor: pointer; min-height: 40px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--kp-ink-2); letter-spacing: .04em; }
.kp-fold > summary::-webkit-details-marker { display: none; }
.kp-fold > summary::before { content: '▸'; color: var(--kp-mute); font-size: 11px; width: 1em; }
.kp-fold[open] > summary::before { content: '▾'; }
.kp-fold > :not(summary) { margin-bottom: 10px; }
.kp-gloss { margin: 0; font-size: 15px; line-height: 1.5; color: var(--kp-ink-2); font-weight: 400; }
.kp-sem, .kp-others { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; color: var(--kp-ink-2); }
.kp-sem b { color: var(--kp-ink); font-weight: 600; margin-right: 8px; }
.kp-sem-rel { font-size: 12px; color: var(--kp-mute); margin-right: 8px; }
.kp-sem small { display: block; font-size: 12px; color: var(--kp-mute); }

/* the kanji family inside 漢字の形と意味: the learner's own words sharing a kanji (同) or a
 * reading (読), each a link to 語の一覧; text marks, no hue */
/* rows 44px apart, so each link's 44px reach never overlaps the next row's */
.kp-kfam { margin: 6px 0 12px; padding: 0; list-style: none; display: grid; gap: 14px; }
.kp-kfam li { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 6px; }
.kp-kfam-c { font-size: 20px; font-weight: 600; min-width: 3.2em; display: inline-flex; align-items: baseline; gap: 4px; }
.kp-kfam-c small { font-size: 12px; font-weight: 400; color: var(--kp-mute); }
.kp-fam, .kp-see-link { position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--kp-line); background: var(--kp-panel-2); font-size: 15px; color: var(--kp-ink); }
/* 44px reach: from inside the 1px border, 28 + 16 */
.kp-fam::after, .kp-see-link::after, .kp-delete::after { content: ''; position: absolute; inset: -8px 0; }
.kp-fam-mark { font-size: 11px; color: var(--kp-ink-2); border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; line-height: 1.3; }
.kp-fam[data-mark='読'] .kp-fam-mark { border-style: dashed; }
.kp-fam-more { font-size: 12px; color: var(--kp-mute); }
.kp-see { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--kp-line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--kp-ink-2); }
.kp-see-label { color: var(--kp-mute); letter-spacing: .04em; margin-left: 2px; }
.kp-see-label + .kp-see-label, .kp-see-link + .kp-see-label, .kp-see-item + .kp-see-label { margin-left: 10px; }
.kp-see-item { font-size: 15px; color: var(--kp-ink); }

/* a leech (CARD_CONTRACT_V2 §4): the repair ladder between the passage and the answer, in order */
.kp-ladder { border: 1px solid var(--kp-amber); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; }
.kp-ladder-head { margin: 0; font-size: 14px; font-weight: 700; color: var(--kp-amber); }
.kp-ladder-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.kp-ladder-step { width: 100%; min-height: 48px; display: grid; justify-items: start; gap: 1px; padding: 6px 12px; text-align: left; border-radius: 10px; border: 1px solid var(--kp-line); background: var(--kp-panel-2); }
.kp-ladder-step b { font-size: 15px; }
.kp-ladder-step small { font-size: 12px; color: var(--kp-ink-2); }
.kp-ladder-step:disabled { cursor: default; opacity: 0.55; }
.kp-ladder-keep { justify-self: start; padding: 6px 2px; min-height: 36px; }
/* a repaired card's front hint: marked as a repair, this card only */
.kp-rhint { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 16px; color: var(--kp-ink-2); }
.kp-rhint-label { font-size: 11px; color: var(--kp-mute); border: 1px dashed currentColor; border-radius: 4px; padding: 0 4px; }
/* 削除: quiet, one tap, under the answer; undone from the toast */
.kp-tools { display: flex; justify-content: flex-end; }
.kp-delete { position: relative; min-height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--kp-line); background: none; color: var(--kp-ink-2); font-size: 13px; }
.kp-toast.is-info { border-color: var(--kp-line); grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.kp-seg button:disabled { opacity: 0.5; cursor: default; }

/* zoom: 全文 or 焦点 (the sentences around the target dimmed, never removed) */
.kp-zoom { margin-left: auto; display: inline-flex; border: 1px solid var(--kp-line); border-radius: 999px; position: relative; z-index: 1; } /* its hit area stays above the passage, even while the readings fade in */
.kp-zoom-btn { position: relative; border: 0; background: none; border-radius: 999px; font-size: 12px; padding: 2px 10px; min-height: 28px; color: var(--kp-ink-2); }
/* 44px touch targets without a bigger look: the hit area reaches past the drawn button */
.kp-zoom-btn::after, .kp-rule-x::after { content: ''; position: absolute; inset: -8px 0; }
.kp-rule-x::after { inset: -7px; } /* from inside the 1px border: 30 + 14 */
.kp-zoom-btn[aria-pressed='true'] { background: var(--kp-cyan-wash); color: var(--kp-cyan); font-weight: 700; }
.kp-s { transition: opacity 0.16s cubic-bezier(0.2, 0, 0, 1); }
.kp-card[data-zoom='focus'] .kp-s:not([data-focus]) { opacity: 0.38; }
.kp-src a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }

.kp-reveal, .kp-next { width: 100%; min-height: 56px; border-radius: 16px; border: 1px solid var(--kp-cyan); background: var(--kp-cyan-wash); color: var(--kp-cyan); font-size: 17px; font-weight: 700; }
.kp-grades { display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px; position: sticky; bottom: 0; z-index: 2; padding-top: 8px; padding-bottom: env(safe-area-inset-bottom); background: var(--kp-bg); }
.kp-grade { min-height: 64px; border-radius: 14px; border: 1px solid var(--kp-line); background: var(--kp-panel); display: grid; place-content: center; gap: 2px; }
.kp-grade b { font-size: 15px; }
.kp-grade small { font-family: var(--kp-num); font-size: 12px; color: var(--kp-ink-2); }
.kp-again { border-color: var(--kp-red); } .kp-again b { color: var(--kp-red); }
.kp-good { border-color: var(--kp-green); background: color-mix(in srgb, var(--kp-green) 12%, var(--kp-panel)); } .kp-good b { color: var(--kp-green); }
.kp-swipehint { grid-column: 1 / -1; margin: 2px 0 0; text-align: center; font-size: 11px; color: var(--kp-mute); letter-spacing: 0.1em; }
.kp-rule { grid-column: 1 / -1; margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--kp-ink-2); }
.kp-rule-x { position: relative; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--kp-line); background: none; color: var(--kp-mute); font-size: 14px; flex: none; }
/* phones: the grade bar is pinned to the bottom of the screen, so a long passage never hides it */
@media (max-width: 640px) {
  .kp-grades { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 40rem; margin: 0 auto; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--kp-line); }
  .kp-study.has-bar { padding-bottom: var(--kp-bar-h, 140px); }
}
.kp-undo { justify-self: center; background: none; border: 0; color: var(--kp-mute); font-size: 13px; padding: 8px; }
.kp-verdict { margin: 0; text-align: center; font-size: 18px; font-weight: 700; }

.kp-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kp-choice { min-height: 56px; border-radius: 14px; border: 1px solid var(--kp-line); background: var(--kp-panel-2); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; padding: 6px; }
.kp-choice:active { border-color: var(--kp-cyan); }

/* word list */
.kp-search { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-panel); color: var(--kp-ink); font: inherit; font-size: 16px; }
.kp-rows { display: grid; gap: 4px; }
.kp-row { display: grid; grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) auto auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-panel); }
.kp-rw { display: grid; min-width: 0; }
.kp-rw b { font-size: 17px; overflow-wrap: anywhere; }
.kp-rw small { font-size: 12px; color: var(--kp-mute); }
.kp-rm { font-size: 13px; color: var(--kp-ink-2); min-width: 0; }
.kp-dots { display: flex; gap: 3px; }
.kp-dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--kp-mute); }
.kp-dots i.half { background: var(--kp-amber); border-color: var(--kp-amber); }
.kp-dots i.on { background: var(--kp-green); border-color: var(--kp-green); }
.kp-detail { padding: 6px 12px 14px; display: grid; gap: 10px; }
.kp-detail .kp-sentence { font-size: 20px; line-height: 1.9; }
.kp-ex { display: grid; gap: 2px; border-left: 2px solid var(--kp-line); padding-left: 10px; }

/* settings */
.kp-field { display: grid; gap: 8px; }
.kp-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.kp-seg button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--kp-line); background: var(--kp-panel); font-size: 14px; }
.kp-seg button.is-on { border-color: var(--kp-cyan); color: var(--kp-cyan); background: var(--kp-cyan-wash); font-weight: 700; }
.kp-backup { width: 100%; min-height: 5rem; font-family: var(--kp-num); font-size: 11px; background: var(--kp-panel); color: var(--kp-ink); border: 1px solid var(--kp-line); border-radius: 10px; padding: 8px; }
.kp-danger { color: var(--kp-red) !important; border-color: var(--kp-red) !important; }
.kp-toast { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 5; display: grid; gap: 8px; margin-bottom: 12px; background: var(--kp-panel-2); border: 1px solid var(--kp-red); border-radius: 12px; padding: 10px 16px; font-size: 14px; line-height: 1.5; }
.kp-toast-btn { justify-self: start; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--kp-cyan); background: var(--kp-cyan-wash); color: var(--kp-cyan); font-size: 14px; font-weight: 700; }

@media (max-width: 420px) {
  .kp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kp-row { grid-template-columns: minmax(0, 6rem) minmax(0, 1fr) auto; }
  .kp-row .kp-dots { display: none; }
}
/* motion (aesthetics.md §5): the reveal keeps the card and fades the answer in; a grade
 * slides the old card out in its direction while the next one settles. Opacity and
 * transform only, 120–180 ms. */
.kp-sentence.kp-enter .kp-target { animation: kp-fade 0.16s cubic-bezier(0.2, 0, 0, 1) both; }
.kp-sentence.kp-enter rt { animation: kp-fade 0.14s cubic-bezier(0.2, 0, 0, 1) 0.04s both; }
.kp-answer.kp-enter { animation: kp-rise 0.18s cubic-bezier(0.2, 0, 0, 1) both; }

.kp-ghost { position: absolute; margin: 0; pointer-events: none; z-index: 1; }
.kp-ghost.kp-out-good { animation: kp-out-good 0.14s cubic-bezier(0.4, 0, 1, 1) both; }

@keyframes kp-arrive { from { opacity: 0.4; transform: scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes kp-out-good { to { opacity: 0; transform: translateX(24px); } }
@keyframes kp-out-again { to { opacity: 0; transform: translateX(-24px); } }
/* reduced motion: nothing moves, nothing fades — every change is instant */
@media (prefers-reduced-motion: reduce) {
  .kp *, .kp *::before, .kp *::after { animation: none !important; transition: none !important; }
  .kp-progress i { transform: none; width: calc(var(--kp-frac, 0) * 100%); }
  .kp-ghost { display: none; }
}
.kp-method { margin: 4px 0; border: 1px solid var(--kp-line, #26303b); border-radius: 14px; padding: 10px 14px; }
.kp-method summary { cursor: pointer; font-weight: 700; color: var(--kp-ink); }
.kp-method p { margin: 8px 0 0; font-size: 14px; line-height: 1.65; color: var(--kp-ink-2); }
.kp-blank { color: var(--kp-cyan); }

/* ---------------------------------------------------------------- themes
 * Each deck picks its own default; 設定 › 色 switches. Every theme keeps the
 * same meaning per colour (accent = the asked word, red/green = again/good). */
.kp { --kp-on-accent: #00131d; --kp-tex: none; --kp-depth: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 10px 30px rgba(0, 0, 0, 0.35);
  --kp-noun: var(--kp-cyan); --kp-verb: #ff8a5c; --kp-adj: #ffd24a; --kp-adv: #c59bff; --kp-expr: #5ee6b0; --kp-sound: #ff7ac8; }

.kp .kp-card { background-color: var(--kp-panel); background-image: none; box-shadow: var(--kp-depth); }

/* part of speech colours the asked word: nouns, verbs, adjectives… each their own hue */
.kp-pos-noun .kp-target, .kp-pos-noun .kp-term { color: var(--kp-noun); }
.kp-pos-verb .kp-target, .kp-pos-verb .kp-term { color: var(--kp-verb); }
.kp-pos-adj .kp-target, .kp-pos-adj .kp-term { color: var(--kp-adj); }
.kp-pos-adv .kp-target, .kp-pos-adv .kp-term { color: var(--kp-adv); }

.kp-pos-sound .kp-target, .kp-pos-sound .kp-term { color: var(--kp-sound); }

.kp-kanji { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 2px; }
.kp-kj { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--kp-panel-2); border: 1px solid var(--kp-line); min-width: 9.5rem; }

.kp-kj span { font-size: 13px; color: var(--kp-ink-2); }
.kp-kj small { font-size: 12px; color: var(--kp-mute); }

/* theme swatches in 設定 */
.kp-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.kp-swatch { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--kp-line); display: grid; place-items: center; font-size: 13px; }
.kp-swatch.is-on { border-color: var(--kp-cyan); box-shadow: 0 0 0 2px var(--kp-cyan-wash); }
.kp-pos-noun .kp-posbadge { color: var(--kp-noun); }
.kp-pos-verb .kp-posbadge { color: var(--kp-verb); }
.kp-pos-adj .kp-posbadge { color: var(--kp-adj); }
.kp-pos-adv .kp-posbadge { color: var(--kp-adv); }
.kp-pos-expr .kp-posbadge { color: var(--kp-expr); }
.kp-pos-sound .kp-posbadge { color: var(--kp-sound); }

    if (mode === 'choice') {
      const opts = el('div', 'kp-choices');
      for (const w of choicesFor(word)) {
        opts.append(
          btn('kp-choice', w.term, () => {
            ui.picked = w.id;
            ui.seen = !!ctx.state.cards[id];
            ui.revealed = true;
            commit(w.id === word.id ? RATINGS.good : RATINGS.again, { stay: true });
          }, { 'data-choice': w.id }),
        );
      }
      face.append(opts);
    } else {
      face.append(el('p', 'kp-taphint', mode === 'read' ? '意味を思い出してからタップ' : 'タップして答えを見る'));
      face.addEventListener('click', reveal);
    }
  } else {
    face.append(...backParts(card, word).nodes);
  }
  box.append(face);

  if (ui.revealed) {
    if (mode === 'choice') {
      const ok = ui.picked === word.id;
      box.append(el('p', `kp-verdict ${ok ? 'kp-c-known' : 'kp-c-hard'}`, ok ? '正解' : `不正解 — 正しくは ${word.term}`));
      box.append(btn('kp-next', '次へ →', () => next(), { id: 'kp-next' }));
    } else {
      box.append(gradeBar(id));
      box.classList.add('has-bar');
    }
    attachSwipe(face);
  } else if (mode === 'choice') {
    box.append(
      btn('kp-reveal', 'わからない', () => {
        ui.picked = null;
        ui.seen = !!ctx.state.cards[id];
        ui.revealed = true;
        commit(RATINGS.again, { stay: true });
      }, { id: 'kp-dunno' }),
    );
  } else {
    box.append(btn('kp-reveal', '答えを見る', reveal, { id: 'kp-reveal' }));
  }
  if (ui.undo) box.append(btn('kp-undo', '↶ ひとつ戻す', undo, { id: 'kp-undo' }));
  return box;
}

const THEMES = [
  ['dark', '墨', '#0a0e13', '#3fd0ff'],
  ['ai', '藍', '#121a46', '#f2c14e'],
  ['matcha', '抹茶', '#13261a', '#a6e06a'],
  ['kokuban', '黒板', '#1f2f28', '#ffe066'],
  ['washi', '和紙', '#fbf6ea', '#93301a'],
  ['sakura', '桜', '#fde7ec', '#a1264a'],
  ['light', '白', '#ffffff', '#005f98'],
  ['contrast', '高', '#000000', '#ffff00'],
];
const POS = { noun: ['noun', '名詞'], verb: ['verb', '動詞'], 'い-adjective': ['adj', '形容詞'], 'な-adjective': ['adj', '形容動詞'], adverb: ['adv', '副詞'], expression: ['expr', '表現'], 'sound word': ['sound', '擬音語'], kanji: ['noun', '漢字'] };
const posKey = (pos) => (POS[pos] || ['noun'])[0];
/** item kind → [css key, chip label]: 語 a whole word, 字 one kanji of it, 文法 a grammar point */
function itemKind(card) {
  if (card.type === 'kanji') return ['ji', '字'];
  if (card.type === 'grammar') return ['bun', '文法'];
  return ['go', '語'];
}
/** the word's level from a public JLPT-style list (build.py, wbig.json): text only, never a hue */
function levelChip(level) {
  const chip = el('span', 'kp-chip kp-levelchip', level);
  const note = `${level}相当（公開リストによる目安）`;
  chip.title = note;
  chip.setAttribute('aria-label', note);
  return chip;
}
/** the progress rail: drawn at where it stood, then ticked to frac on the compositor */
function rail(frac) {
  const bar = el('i');
  const from = motionOk() ? ui.rail : frac;
  bar.style.setProperty('--kp-frac', String(from));
  ui.rail = frac;
  if (from !== frac) {
    queueMicrotask(() => {
      if (!bar.isConnected) return;
      bar.getBoundingClientRect(); // the old width is drawn first, so the change transitions
      bar.style.setProperty('--kp-frac', String(frac));
    });
  }
  return bar;
}
/** prefers-reduced-motion: nothing moves (aesthetics.md §5, S37) */
function motionOk() {
  return !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
}

/** 全文 (every sentence bright) or 焦点 (the sentences around the target dimmed). Unless the
 * learner chose one for this deck, a card seen before opens in 焦点 and a new card in 全文 */
function zoomFor() {
  if (ctx.prefs.zoom === 'full' || ctx.prefs.zoom === 'focus') return ctx.prefs.zoom;
  return ui.seen ? 'focus' : 'full';
}
function zoomToggle(zoom) {
  const wrap = el('span', 'kp-zoom');
  wrap.setAttribute('role', 'group');
  wrap.setAttribute('aria-label', '文章の表示');
  for (const [value, label] of [['full', '全文'], ['focus', '焦点']]) {
    const b = btn('kp-zoom-btn', label, (e) => {
      e.stopPropagation();
      if (zoomFor() === value || !savePrefQuiet({ zoom: value })) return;
      // in place: a repaint would close the folds the learner opened
      const face = wrap.closest('.kp-card');
      if (face) face.dataset.zoom = value;
      for (const x of wrap.querySelectorAll('.kp-zoom-btn')) x.setAttribute('aria-pressed', String(x === b));
    }, { id: `kp-zoom-${value}`, 'aria-pressed': String(zoom === value) });
    wrap.append(b);
  }
  return wrap;
}

function kanjiAnatomy(word) {
  if (!word.kanji?.length) return null;
  const box = el('div', 'kp-kanji');
  for (const k of word.kanji) {
    box.append(el('div', 'kp-kj', el('b', null, k.c), el('span', null, k.m || ''), el('small', null, [k.parts?.length ? k.parts.join(' ') : '', k.st ? `${k.st}画` : ''].filter(Boolean).join(' · '))));
  }
  return box;
}

/** one tier-two fold: a native disclosure, closed unless open is set */
function fold(cls, title, open, ...kids) {
  const d = el('details', `kp-fold ${cls}`, el('summary', null, title), ...kids);
  d.open = !!open;
  d.addEventListener('click', (e) => e.stopPropagation());
  return d;
}

const EN_NONE = 'この文だけの英訳は未対応です（全文の英訳と文の区切りが合いません）';
const SEM_REL = { syn: '類語', ant: '対義語', fam: '同じ字', reg: '言い換え', col: 'よく一緒に', thm: '関連' };

/**
 * The back (CARD_CONTRACT_V2 §3). Tier one, read on every pass, no English: the word with
 * its reading and part of speech (pitch only when the deck has it), the passage above with
 * a reading over every kanji, the Japanese definition, a Japanese usage note when there is
 * one. Tier two, one tap each, in this order: 英語 (the gloss; open when 設定 says always),
 * 英訳 of the target sentence only, 漢字の形と意味 (open on a 字 card), 類語 (only with
 * entries, and only once the card is in review), the word's other passages (titles only),
 * then the source line.
 */
function answerBlock(card, word) {
  const a = el('div', 'kp-answer');
  a.lang = 'ja';
  const pos = (POS[word.pos] || ['', ''])[1] || word.pos;
  a.append(el('div', 'kp-word', el('span', 'kp-term', word.term), el('span', 'kp-reading', word.reading), word.pitch != null ? el('span', 'kp-pitch', String(word.pitch)) : null, el('span', 'kp-posbadge', pos)));
  a.append(el('p', 'kp-def', word.defJa));
  // a usage note in Japanese stays in tier one; the deck's English notes go behind 英語
  const jaNote = word.tip && !/[A-Za-z]/.test(word.tip);
  if (jaNote) a.append(el('p', 'kp-note', word.tip));

  const folds = el('div', 'kp-folds');
  // English text carries lang='en'; the summaries and labels stay Japanese for screen readers
  const english = (tag, cls, text) => {
    const n = el(tag, cls, text);
    n.lang = 'en';
    return n;
  };
  const gloss = fold('kp-f-gloss', '英語', ctx.prefs.gloss === 'show', english('p', 'kp-gloss', word.meaning));
  if (word.tip && !jaNote) gloss.append(el('p', 'kp-tip', el('span', 'kp-tip-label', '注 '), english('span', null, word.tip)));
  folds.append(gloss);
  // a passage translates only the sentence holding the target (enTarget, from build.py), never
  // the whole passage; when its sentences could not be matched the fold says so, so the slot
  // stays in the same place on every card
  const en = card.type ? card.enTarget : card.en;
  if (en || card.type) folds.append(fold('kp-f-en', '英訳', false, en ? english('p', 'kp-en', en) : el('p', 'kp-en kp-en-none', EN_NONE)));
  const anatomy = kanjiAnatomy(word);
  if (anatomy) folds.append(fold('kp-f-kanji', '漢字の形と意味', card.type === 'kanji', anatomy, kanjiFamily(word)));
  // see-also and grammar from the deck, as one link line after the kanji fold; no data, no line
  const see = seeAlsoLine(card, word);
  if (see) folds.append(see);
  // synonyms interfere with a word still being learned (R13): only on a card in review state
  if (word.sem?.length && ctx.state.cards[card.id]?.state === 2) {
    const list = el('ul', 'kp-sem');
    for (const e of word.sem) list.append(el('li', null, el('b', null, e.w), el('span', 'kp-sem-rel', SEM_REL[e.rel] || e.rel), e.note ? el('small', null, e.note) : null));
    folds.append(fold('kp-f-sem', '類語', false, list));
  }
  const others = otherPassages(card, word);
  if (others.length) {
    const list = el('ul', 'kp-others');
    for (const c of others) list.append(el('li', null, c.type ? `文章${c.passage}` : `例文${c.lv}`, el('span', null, ` · ${KIND_NAME[c.kind] || '例文'}${c.src?.site ? ` · ${c.src.site}` : ''}`)));
    folds.append(fold('kp-f-others', `この語の他の文章（${others.length}）`, false, list));
  }
  a.append(folds);
  if (card.src) a.append(sourceLine(card));
  return a;
}

/* ------------------------------------------------ kanji family, see-also (CARD_CONTRACT_V2 §3.7) */
/** per deck: glyph → words that contain it; reading of one kanji → [{ word, c }] (deck.json
 * kanji[].r is the kanji's reading inside that word, from build.py's alignment) */
const families = new WeakMap();
function familyIndex(deck) {
  if (families.has(deck)) return families.get(deck);
  const byGlyph = new Map();
  const byReading = new Map();
  for (const w of deck.words) {
    for (const k of w.kanji || []) {
      if (!byGlyph.has(k.c)) byGlyph.set(k.c, []);
      byGlyph.get(k.c).push(w);
      if (!k.r) continue;
      if (!byReading.has(k.r)) byReading.set(k.r, []);
      byReading.get(k.r).push({ word: w, c: k.c });
    }
  }
  const out = { byGlyph, byReading };
  families.set(deck, out);
  return out;
}
const FAMILY_READ_MAX = 8;
/**
 * The learner's own words in this deck (a card of the word is in the ledger) that share a kanji
 * of the target (同) or a reading of one of its kanji written with another kanji (読): the
 * JPMN/Kiku model, deck-relative. No etymology, no mnemonics. Words not yet met are left out,
 * so the fold never shows a word before its own card does.
 */
function familyOf(word) {
  const { byGlyph, byReading } = familyIndex(ctx.deck);
  const learned = (w) => w.id !== word.id && w.cards.some((c) => ctx.state.cards[c.id]);
  const rows = [];
  for (const k of word.kanji || []) {
    const same = [...new Set((byGlyph.get(k.c) || []).filter(learned))];
    const read = [...new Set((k.r ? byReading.get(k.r) || [] : []).filter((x) => x.c !== k.c && learned(x.word) && !same.includes(x.word)).map((x) => x.word))];
    if (same.length || read.length) rows.push({ k, same, read });
  }
  return rows;
}
function kanjiFamily(word) {
  const rows = familyOf(word);
  if (!rows.length) return null;
  const list = el('ul', 'kp-kfam');
  list.setAttribute('aria-label', '同じ字・同じ読みの、学習中の語');
  for (const { k, same, read } of rows) {
    const li = el('li', null, el('b', 'kp-kfam-c', k.c, k.r ? el('small', null, k.r) : null));
    for (const w of same) li.append(familyLink(w, '同', `${k.c}を含む`));
    for (const w of read.slice(0, FAMILY_READ_MAX)) li.append(familyLink(w, '読', `${k.r}と読む字を含む`));
    if (read.length > FAMILY_READ_MAX) li.append(el('span', 'kp-fam-more', `ほか${read.length - FAMILY_READ_MAX}語`));
    list.append(li);
  }
  return list;
}
function familyLink(w, mark, why) {
  return btn('kp-fam', [el('span', 'kp-fam-mark', mark), w.term], (e) => {
    e.stopPropagation();
    openWord(w.id);
  }, { 'data-word': w.id, 'data-mark': mark, 'aria-label': `${mark} ${w.term}（${why}）・語の一覧で開く` });
}
/** open a word in 語の一覧; its ← comes back to the card on screen */
function openWord(wid) {
  ui.from = ui.screen === 'study' ? 'study' : null;
  ui.q = '';
  ui.open = wid;
  go('list');
  ctx.root.querySelector(`.kp-row[data-word="${wid}"]`)?.scrollIntoView({ block: 'center' });
}

/** 参照 (deck words named by word.seeAlso) and 文法 (grammar ids on the card or the word, as
 * { id, p } or a bare id), one line; null when the deck gives neither */
function seeAlsoLine(card, word) {
  const see = (Array.isArray(word.seeAlso) ? word.seeAlso : []).filter((t) => typeof t === 'string' && t && t !== word.term);
  const grammar = [...(Array.isArray(card.grammar) ? card.grammar : []), ...(Array.isArray(word.grammar) ? word.grammar : [])]
    .map((g) => (typeof g === 'string' ? { id: g } : g))
    .filter((g, i, all) => g?.id && all.findIndex((x) => x.id === g.id) === i);
  if (!see.length && !grammar.length) return null;
  const line = el('p', 'kp-see');
  line.id = 'kp-see';
  if (see.length) {
    line.append(el('span', 'kp-see-label', '参照'));
    for (const t of see) {
      const w = ctx.deck.words.find((x) => x.term === t);
      line.append(
        w
          ? btn('kp-see-link', t, (e) => {
              e.stopPropagation();
              openWord(w.id);
            }, { 'data-word': w.id })
          : el('span', 'kp-see-item', t),
      );
    }
  }
  if (grammar.length) {
    line.append(el('span', 'kp-see-label', '文法'));
    for (const g of grammar) {
      line.append(
        ctx.openEntry
          ? btn('kp-see-link', g.p || g.id, (e) => {
              e.stopPropagation();
              ctx.openEntry({ t: 'grammar', id: g.id });
            }, { 'data-grammar': g.id })
          : Object.assign(el('span', 'kp-see-item', g.p || g.id), { title: g.id }),
      );
    }
  }
  return line;
}

/* ------------------------------------------------ delete and the leech ladder (CARD_CONTRACT_V2 §4) */
const DELETED = 'このカードを削除しました（設定 › 保留中のカード から戻せます）。';
const SWAPPED = '別の文に替えました。前の文は保留にしました。';
const SUSPENDED = '保留にしました（設定 › 保留中のカード から戻せます）。';
const UNDOABLE = [DELETED, SWAPPED, SUSPENDED];

/** the back's nodes in order: the ladder (a leech only), the answer, the card's tools */
function backParts(card, word) {
  const answer = answerBlock(card, word);
  return { answer, nodes: [isLeech(ctx.state, card.id) ? leechLadder(card, word) : null, answer, cardTools()].filter(Boolean) };
}

/** under the answer: 削除, one tap, undone from the toast or ↶ for the rest of the sitting */
function cardTools() {
  const row = el('div', 'kp-tools');
  row.append(btn('kp-delete', '削除', (e) => {
    e.stopPropagation();
    deleteCard();
  }, { id: 'kp-delete', 'aria-label': 'このカードを削除（保留にする・あとで戻せる）' }));
  return row;
}

/** a ladder hint: the first kana of the reading and one ○ per kana left; on a 字 card, the
 * blanked kanji's parts (its reading is already the card's hint) */
function repairHint(card, word) {
  if (card.type === 'kanji') {
    const glyph = card.ruby.find((seg) => seg[2] === 1)?.[0];
    const k = word.kanji?.find((x) => x.c === glyph);
    if (k?.parts?.length) return k.parts.join('＋');
    return k?.st ? `${k.st}画` : '';
  }
  const kana = [...(word.reading || '')];
  return kana.length ? kana[0] + '○'.repeat(kana.length - 1) : '';
}

function leechLadder(card, word) {
  const box = el('div', 'kp-ladder');
  box.id = 'kp-ladder';
  box.setAttribute('role', 'group');
  const lapses = ctx.state.cards[card.id]?.lapses ?? 0;
  const head = `この文で${lapses}回つまずいています`;
  box.setAttribute('aria-label', head);
  box.append(el('p', 'kp-ladder-head', head));
  const target = swapTarget(word, card, ctx.state);
  const hint = ctx.state.repairs?.[card.id]?.hint ? '' : repairHint(card, word);
  const steps = el('ol', 'kp-ladder-steps');
  const step = (name, label, sub, onClick) => {
    const b = btn(`kp-ladder-step`, [el('b', null, label), el('small', null, sub)], (e) => {
      e.stopPropagation();
      onClick();
    }, { id: `kp-ladder-${name}`, 'data-step': name });
    if (!onClick) b.disabled = true;
    steps.append(el('li', null, b));
  };
  step('swap', '別の文に替える', target ? `${target.type ? `文章${target.passage}` : `例文${target.lv}`}へ（進み具合はそのまま）` : '替えられる文がありません', target && (() => ladderSwap(card, word)));
  step('hint', 'ヒントを付ける', hint ? `表に「${hint}」` : 'ヒントはもう付いています', hint && (() => ladderHint(card, hint)));
  step('suspend', '保留', 'このカードを休ませる', () => ladderSuspend(card));
  box.append(steps, btn('kp-link kp-ladder-keep', 'このまま続ける', (e) => {
    e.stopPropagation();
    ladderKeep(card);
  }, { id: 'kp-ladder-keep' }));
  return box;
}

/** adopt a ledger change made on the card on screen: stored first, then one undo step */
function adoptRepair(nextState) {
  if (!save(nextState)) return saveFailed();
  ui.undo = { state: ctx.state, queue: [...ui.queue], pos: ui.pos, done: ui.done, right: ui.right };
  ctx.state = nextState;
  return true;
}
/** the card leaves the sitting: this and every later place it held in the queue */
function dropFromQueue(id) {
  ui.queue = [...ui.queue.slice(0, ui.pos), ...ui.queue.slice(ui.pos).filter((x) => x !== id)];
}
function deleteCard() {
  const id = ui.queue[ui.pos];
  if (!id || !adoptRepair(suspendCard(ctx.state, id, 'delete', new Date()))) return;
  dropFromQueue(id);
  ui.toast = DELETED;
  resetCard();
  paint();
}
function ladderSwap(card, word) {
  const done = swapCard(word, card, ctx.state, new Date());
  if (!done || !adoptRepair(done.state)) return;
  dropFromQueue(card.id);
  ui.queue.splice(ui.pos, 0, done.to); // the new passage takes the card's place, front first
  ui.toast = SWAPPED;
  resetCard();
  paint();
}
function ladderHint(card, hint) {
  if (!adoptRepair(repairCard(ctx.state, card.id, 'hint', new Date(), hint))) return;
  ui.toast = '';
  paint();
}
function ladderSuspend(card) {
  if (!adoptRepair(suspendCard(ctx.state, card.id, 'leech', new Date()))) return;
  dropFromQueue(card.id);
  ui.toast = SUSPENDED;
  resetCard();
  paint();
}
function ladderKeep(card) {
  if (!adoptRepair(repairCard(ctx.state, card.id, 'keep', new Date()))) return;
  ui.toast = '';
  paint();
}

/** the word's other passages, one per passage (a passage's 字 cards share it): titles only,
 * never their text, so a sibling card is not answered here */
function otherPassages(card, word) {
  if (!card.type) return word.cards.filter((c) => c.id !== card.id);
  return word.cards.filter((c) => c.type === 'word' && c.passage !== card.passage);
}

function sourceLine(card) {
  const p = el('p', 'kp-src');
  const label = card.src.site || card.src.label || '';
  if (card.src.url) {
    const a = el('a', null, label);
    a.href = card.src.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.addEventListener('click', (e) => e.stopPropagation());
    p.append('出典 ', a);
  } else p.append(`出典 ${label}`);
  // which passage of the word this is lives here, not in the chip row (one 23px row, aesthetics.md §4)
  if (card.type) p.append(` · 文章${card.passage}`);
  return p;
}

/** もう一度／思い出せた, nothing else (CARD_CONTRACT_V2 §4: Hard and Easy are not shown).
 * Under the bar, once per deck until dismissed or answered, the rule for choosing. */
const RULE = '答えを見て理解が深まったなら もう一度';
function gradeBar(id) {
  const pv = preview(fsrsApi, scheduler, ctx.state, id, new Date());
  const bar = el('div', 'kp-grades');
  const g = (name, label, cls, key) =>
    btn(`kp-grade ${cls}`, [el('b', null, label), el('small', null, fmtWait(pv[name]))], () => commit(RATINGS[name]), {
      id: `kp-grade-${name}`,
      'aria-keyshortcuts': key,
    });
  bar.append(g('again', 'もう一度', 'kp-again', '1'), g('good', '思い出せた', 'kp-good', '3'));
  bar.append(el('p', 'kp-swipehint', '← もう一度　　スワイプ　　思い出せた →'));
  if (!ctx.prefs.ruleSeen) {
    const rule = el('p', 'kp-rule', el('span', null, RULE));
    rule.id = 'kp-rule';
    const dismiss = () => {
      if (!savePrefQuiet({ ruleSeen: true })) return;
      rule.remove();
      fitBar();
    };
    rule.append(btn('kp-rule-x', '×', dismiss, { id: 'kp-rule-dismiss', 'aria-label': 'このヒントを閉じる' }));
    bar.append(rule);
  }
  return bar;
}

function reveal() {
  if (ui.revealed) return;
  ui.revealed = true;
  // read before any grade of this sitting: was this card answered on an earlier pass?
  ui.seen = !!ctx.state.cards[ui.queue[ui.pos]];
  if (!revealInPlace()) paint();
}

/**
 * The reveal keeps the card node (no rebuild of the screen): the passage gains its readings,
 * the answer comes in under it, and 答えを見る becomes the grade bar. Only opacity and
 * transform animate (aesthetics.md §5); with reduced motion nothing does. False when the
 * card on screen is not the one to reveal (the caller repaints).
 */
function revealInPlace() {
  const id = ui.queue[ui.pos];
  const face = ctx.root.querySelector('#kp-card');
  if (!id || !face || face.dataset.card !== id || cardMode() === 'choice') return false;
  const { card, word } = ctx.index.cards.get(id);
  const box = face.closest('.kp-study');
  const passage = !!card.type;
  if (passage) {
    const zoom = zoomFor();
    face.dataset.zoom = zoom;
    face.querySelector('.kp-chips').append(zoomToggle(zoom));
  }
  const sentence = sentenceNodes(card, { blank: false, ruby: 'all', split: passage });
  face.querySelector('.kp-sentence').replaceWith(sentence);
  for (const n of face.querySelectorAll('.kp-hint, .kp-taphint, .kp-rhint')) n.remove();
  face.removeEventListener('click', reveal);
  const { nodes, answer } = backParts(card, word);
  face.append(...nodes);
  if (motionOk()) {
    sentence.classList.add('kp-enter');
    answer.classList.add('kp-enter');
  }
  box.querySelector('#kp-reveal')?.replaceWith(gradeBar(id));
  box.classList.add('has-bar');
  attachSwipe(face);
  fitBar();
  return true;
}

/** the rule under the grade bar is shown once: answering the card it sat under retires it.
 * Not stored (storage full) only means it shows again. */
function retireRule() {
  if (ctx.prefs.ruleSeen) return;
  const prefs = { ...ctx.prefs, ruleSeen: true };
  if (writeJson(ctx.storage, prefsKey(ctx.deck.id), prefs)) ctx.prefs = prefs;
}

function commit(rating, { stay = false } = {}) {
  const id = ui.queue[ui.pos];
  if (!id) return;
  const nextState = grade(fsrsApi, scheduler, ctx.state, id, rating, new Date());
  if (!save(nextState)) {
    // not stored: the same card stays, ready to answer again
    if (cardMode() === 'choice') {
      ui.revealed = false;
      ui.picked = null;
    }
    saveFailed();
    return;
  }
  askToKeepStorage();
  if (cardMode() !== 'choice') retireRule();
  ui.toast = '';
  ui.undo = { state: ctx.state, queue: [...ui.queue], pos: ui.pos, done: ui.done, right: ui.right };
  ctx.state = nextState;
  ui.done++;
  if (rating >= RATINGS.good) ui.right++;
  if (stay) {
    paint();
    return;
  }
  next(rating >= RATINGS.good ? 'good' : 'again');
}

/**
 * Ask the browser once, after the first saved grade, to keep this site's
 * storage (Safari may otherwise clear it after days without a visit). A refusal
 * changes nothing; 設定 › バックアップ shows the answer.
 */
let storageAsked = false;
function askToKeepStorage() {
  if (storageAsked) return;
  storageAsked = true;
  try {
    navigator.storage?.persist?.()?.catch?.(() => {});
  } catch {
    /* not offered here */
  }
}

/** the next card. dir ('good' | 'again'): the answered card slides out that way while the
 * next one settles in (none with reduced motion) */
function next(dir) {
  const id = ui.queue[ui.pos];
  refill();
  ui.pos++;
  // a learning step due within the sitting comes back after a few cards
  const s = ctx.state.cards[id];
  if (s && s.state !== 2 && new Date(s.due).getTime() - Date.now() < 15 * MIN) {
    ui.queue.splice(Math.min(ui.queue.length, ui.pos + 4), 0, id);
  }
  resetCard();
  const ghost = dir && motionOk() ? ghostOf(ctx.root.querySelector('#kp-card'), dir) : null;
  paint();
  arrive(ghost, dir);
}

/** a copy of the answered card, inert and without ids, to slide out over the next one */
function ghostOf(face, dir) {
  if (!face) return null;
  const rect = face.getBoundingClientRect();
  const node = face.cloneNode(true);
  node.removeAttribute('id');
  for (const n of node.querySelectorAll('[id]')) n.removeAttribute('id');
  delete node.dataset.card;
  node.classList.remove('kp-arrive');
  node.classList.add('kp-ghost', `kp-out-${dir}`);
  node.style.transform = '';
  node.setAttribute('aria-hidden', 'true');
  node.inert = true;
  return { node, rect };
}
function arrive(ghost, dir) {
  const box = ctx.root.querySelector('.kp-study');
  if (!box) return; // the done screen
  if (dir) box.dataset.advance = dir;
  if (!motionOk()) return;
  box.querySelector('#kp-card')?.classList.add('kp-arrive');
  if (!ghost) return;
  const at = box.getBoundingClientRect();
  Object.assign(ghost.node.style, { top: `${ghost.rect.top - at.top}px`, left: `${ghost.rect.left - at.left}px`, width: `${ghost.rect.width}px`, height: `${ghost.rect.height}px` });
  box.append(ghost.node);
  const drop = () => ghost.node.remove();
  ghost.node.addEventListener('animationend', drop, { once: true });
  setTimeout(drop, 400);
}

function undo() {
  if (!ui.undo) return;
  if (!save(ui.undo.state)) return saveFailed();
  ui.toast = '';
  ctx.state = ui.undo.state;
  ui.queue = ui.undo.queue;
  ui.pos = ui.undo.pos;
  ui.done = ui.undo.done;
  ui.right = ui.undo.right;
  ui.undo = null;
  resetCard();
  ui.revealed = cardMode() !== 'choice';
  ui.seen = !!ctx.state.cards[ui.queue[ui.pos]];
  paint();
}

/**
 * Swipe right = 思い出せた, left = もう一度. Only the finger that started the
 * swipe counts; it must travel more than 90px and at least twice as far
 * sideways as up or down, and be lifted (pointerup). A cancelled gesture (the
 * page scrolled, the system took the touch) only puts the card back.
 */
function attachSwipe(face) {
  let x0 = null;
  let y0 = 0;
  let pid = null;
  let dx = 0;
  let dy = 0;
  const reset = () => {
    x0 = null;
    pid = null;
    face.style.transform = '';
    face.dataset.swipe = '';
  };
  face.addEventListener('pointerdown', (e) => {
    if ((x0 !== null && e.pointerId !== pid) || e.target.closest?.('button, a, summary, input, textarea')) return;
    pid = e.pointerId;
    try {
      face.setPointerCapture(pid); // a release outside the card still ends the swipe here
    } catch {
      /* a pointer the browser no longer tracks */
    }
    x0 = e.clientX;
    y0 = e.clientY;
    dx = 0;
    dy = 0;
  });
  face.addEventListener('pointermove', (e) => {
    if (x0 === null || e.pointerId !== pid) return;
    dx = e.clientX - x0;
    dy = e.clientY - y0;
    const sideways = Math.abs(dx) > 2 * Math.abs(dy);
    // reduced motion: the card stays put, only its edge says which way (the buttons do the work)
    face.style.transform = sideways && motionOk() ? `translateX(${dx}px) rotate(${dx / 40}deg)` : '';
    face.dataset.swipe = !sideways ? '' : dx > 40 ? 'good' : dx < -40 ? 'again' : '';
  });
  face.addEventListener('pointerup', (e) => {
    if (x0 === null || e.pointerId !== pid) return;
    const swiped = Math.abs(dx) > 90 && Math.abs(dx) > 2 * Math.abs(dy);
    const right = dx > 0;
    reset();
    if (!swiped) return;
    if (cardMode() === 'choice') next(right ? 'good' : 'again');
    else commit(right ? RATINGS.good : RATINGS.again);
  });
  face.addEventListener('pointercancel', (e) => {
    if (x0 === null || e.pointerId !== pid) return;
    reset();
  });
}

function doneScreen() {
  const box = el('section', 'kp-done');
  box.append(topBar('おつかれさま', () => go('home')));
  const pct = ui.done ? Math.round((ui.right / ui.done) * 100) : 0;
  box.append(el('div', 'kp-tiles', el('div', 'kp-tile kp-c-new', el('b', null, String(ui.done)), el('span', null, '回答')), el('div', 'kp-tile kp-c-known', el('b', null, `${pct}%`), el('span', null, '思い出せた割合'))));
  const soon = learningSoon(ctx.deck, ctx.state, new Date(), DAY)[0];
  box.append(el('p', 'kp-sub', soon ? `次の復習は ${fmtWait(Math.max(0, soon.t - Date.now()))}後。` : '今日の分は終わり。また明日。'));
  box.append(btn('kp-start', 'デッキに戻る', () => go('home'), { id: 'kp-home' }));
  if (ui.undo) box.append(btn('kp-undo', '↶ ひとつ戻す', undo, { id: 'kp-undo' }));
  return box;
}

function listScreen() {
  const box = el('section', 'kp-list');
  // opened from a card (the kanji family, 参照): ← goes back to that card, as it was
  box.append(
    topBar('語の一覧', () => {
      const back = ui.from === 'study' && ui.queue[ui.pos] ? 'study' : 'home';
      ui.from = null;
      go(back);
    }),
  );
  const input = el('input', 'kp-search');
  input.type = 'search';
  input.id = 'kp-search';
  input.placeholder = '検索 — 漢字・かな・英語';
  input.value = ui.q;
  box.append(input);
  const rows = el('div', 'kp-rows');
  box.append(rows);
  const draw = () => {
    rows.replaceChildren();
    const k = ui.q.trim().toLowerCase();
    for (const w of ctx.deck.words) {
      if (k && !`${w.term}${w.reading}${w.meaning}${w.defJa}`.toLowerCase().includes(k)) continue;
      const st = wordStatus(w, ctx.state);
      const [label, cls] = STATUS[st.key];
      const row = btn('kp-row', [
        el('span', 'kp-rw', el('b', null, w.term), el('small', null, w.reading)),
        el('span', 'kp-rm', w.meaning),
        el('span', 'kp-dots', w.cards.map((c) => el('i', ctx.state.cards[c.id]?.state === 2 ? 'on' : ctx.state.cards[c.id] ? 'half' : ''))),
        el('span', `kp-chip ${cls}`, label),
      ], () => {
        ui.open = ui.open === w.id ? null : w.id;
        draw();
      }, { 'data-word': w.id, 'aria-expanded': String(ui.open === w.id) });
      if (ui.open === w.id) row.classList.add('is-open');
      rows.append(row);
      if (ui.open === w.id) {
        const det = el('div', 'kp-detail');
        det.append(el('p', 'kp-def', w.defJa));
        for (const c of w.cards) det.append(el('div', 'kp-ex', sentenceNodes(c, { blank: false, ruby: 'all' }), ...(c.en ? [el('p', 'kp-en', c.en)] : [])));
        if (w.tip) det.append(el('p', 'kp-tip', w.tip));
        rows.append(det);
      }
    }
    if (!rows.childNodes.length) rows.append(el('p', 'kp-sub', '該当する語はありません。'));
  };
  input.addEventListener('input', () => {
    ui.q = input.value;
    draw();
  });
  draw();
  return box;
}

function settingsScreen() {
  const box = el('section', 'kp-settings');
  box.append(topBar('設定', () => go('home')));
  if (ctx.deck.method?.length) {
    const how = el('details', 'kp-method');
    how.id = 'kp-method';
    how.append(el('summary', null, 'このデッキのしくみ'));
    for (const line of ctx.deck.method) how.append(el('p', null, line));
    box.append(how);
  }
  const seg = (title, key, options) => {
    const wrap = el('div', 'kp-field', el('h2', 'kp-h2', title));
    const row = el('div', 'kp-seg');
    row.setAttribute('role', 'radiogroup');
    row.setAttribute('aria-label', title);
    for (const [value, label] of options) {
      const on = ctx.prefs[key] === value;
      const b = btn(on ? 'is-on' : '', label, () => {
        savePrefs({ ...ctx.prefs, [key]: value });
      }, { 'data-pref': `${key}:${value}`, role: 'radio', 'aria-checked': String(on) });
      row.append(b);
    }
    wrap.append(row);
    return wrap;
  };
  box.append(seg('一日の新しいカード', 'newPerDay', [[5, '5'], [10, '10'], [15, '15'], [20, '20'], [30, '30']]));
  box.append(seg('答え方', 'mode', [['read', '読んで思い出す'], ['self', '穴埋め'], ['choice', '4択']]));
  box.append(seg('ヒント（穴埋め・4択）', 'hint', [['ja', '日本語の説明'], ['none', 'なし']]));
  box.append(seg('英語の意味（答えの「英語」）', 'gloss', [['tap', 'タップで開く'], ['show', 'いつも開いておく']]));
  const themes = el('div', 'kp-field', el('h2', 'kp-h2', '色（テーマ）'));
  const sw = el('div', 'kp-swatches');
  sw.setAttribute('role', 'radiogroup');
  sw.setAttribute('aria-label', '色（テーマ）');
  for (const [value, label, bg, ink] of THEMES) {
    const on = ctx.prefs.look === value;
    const b = btn(`kp-swatch${on ? ' is-on' : ''}`, label, () => {
      savePrefs({ ...ctx.prefs, look: value });
    }, { 'data-pref': `look:${value}`, 'aria-label': label, role: 'radio', 'aria-checked': String(on), style: `background:${bg};color:${ink}` });
    sw.append(b);
  }
  themes.append(sw);
  box.append(themes);
  box.append(suspendedField());

  const ta = el('textarea', 'kp-backup');
  ta.id = 'kp-backup';
  ta.spellcheck = false;
  const msg = el('p', 'kp-sub');
  msg.id = 'kp-backup-msg';
  const taLabel = el('label', 'kp-sub', 'バックアップの文字列');
  taLabel.htmlFor = 'kp-backup';
  const kept = el('p', 'kp-sub', '端末の保存領域：不明');
  kept.id = 'kp-persist';
  navigator.storage?.persisted?.().then(
    (yes) => (kept.textContent = `端末の保存領域：${yes ? '確保済み' : '未確保'}`),
    () => {},
  );
  box.append(
    el('div', 'kp-field', el('h2', 'kp-h2', 'バックアップ'), el('p', 'kp-sub', '記録はこの端末だけに保存されます。コピーして保管し、別の端末で貼り付けて復元できます。'), kept, taLabel, ta,
      el('div', 'kp-seg',
        btn('', 'コピー', () => {
          ta.value = JSON.stringify(ctx.state);
          ta.select();
          navigator.clipboard?.writeText(ta.value).then(() => (msg.textContent = 'コピーしました。'), () => (msg.textContent = '選択しました。手動でコピーしてください。'));
        }),
        restoreButton(ta, msg),
        btn('kp-danger', '記録を消す', (e) => {
          if (e.currentTarget.dataset.arm) {
            const empty = emptyState(ctx.deck.id);
            if (!save(empty)) return saveFailed();
            ctx.state = empty;
            go('home');
          } else {
            e.currentTarget.dataset.arm = '1';
            e.currentTarget.textContent = 'もう一度押すと消えます';
          }
        }),
      ), msg),
  );
  return box;
}

/** 保留中のカード: how many cards a delete or the leech ladder took out, and 復元 for all of them */
const SUSPEND_WHY = { delete: '削除', swap: '別の文に替えた', leech: '保留' };
function suspendedField() {
  const ids = Object.keys(ctx.state.suspended || {}).filter((id) => ctx.index.cards.has(id));
  const why = {};
  for (const id of ids) why[ctx.state.suspended[id].by] = (why[ctx.state.suspended[id].by] || 0) + 1;
  const count = el('p', 'kp-sub', ids.length ? `${ids.length}枚（${Object.entries(why).map(([k, n]) => `${SUSPEND_WHY[k] || k} ${n}`).join('・')}）` : 'ありません');
  count.id = 'kp-suspended';
  const back = btn('', '復元', () => {
    const nextState = restoreSuspended(ctx.state, new Date(), ids);
    if (!save(nextState)) return saveFailed();
    ctx.state = nextState;
    ui.undo = null;
    ui.toast = '';
    paint();
  }, { id: 'kp-unsuspend', 'aria-label': `保留中の${ids.length}枚をすべて戻す` });
  back.disabled = !ids.length;
  return el('div', 'kp-field', el('h2', 'kp-h2', '保留中のカード'), el('p', 'kp-sub', '削除したカードと、つまずきが続いて休ませたカード。記録は消えていません。'), count, el('div', 'kp-seg', back));
}

const RESTORE_REFUSED = {
  json: '読み取れません。バックアップの文字列をそのまま貼り付けてください。',
  'not-an-object': 'このデッキのバックアップではありません。',
  'wrong-format': 'このデッキのバックアップではありません。',
  'wrong-version': 'このデッキのバックアップではありません。',
  'wrong-deck': 'このデッキのバックアップではありません。',
  empty: 'カードの記録が入っていません。',
  'bad-card': '壊れた記録が含まれています。',
};
const RESTORE_NO_ROOM = '保存領域がいっぱいで、置き換えられませんでした。';

/**
 * 復元: the first tap only checks the pasted backup and shows both counts; a
 * second tap on 置き換える keeps a copy of the current ledger under
 * bunki-cloze:<deck>:before-restore and only then writes the backup. Anything
 * that fails leaves the stored ledger and ctx.state as they were.
 */
function restoreButton(ta, msg) {
  let staged = null;
  const b = btn('', '復元', () => {
    if (staged && staged.text === ta.value) return replace();
    disarm();
    let raw;
    try {
      raw = JSON.parse(ta.value);
    } catch {
      msg.textContent = RESTORE_REFUSED.json;
      return;
    }
    const seen = inspectState(raw, ctx.deck);
    if (!seen.ok) {
      msg.textContent = RESTORE_REFUSED[seen.reason] || RESTORE_REFUSED['wrong-format'];
      return;
    }
    const nowCards = Object.keys(ctx.state.cards).length;
    const nowLog = ctx.state.log.length;
    msg.textContent = `このバックアップ：${seen.cards}枚・${seen.log}回答／いまの記録：${nowCards}枚・${nowLog}回答` + (seen.cards < nowCards ? '　いまより少ない記録です。' : '');
    staged = { text: ta.value, raw };
    b.dataset.arm = '1';
    b.textContent = '置き換える';
  }, { id: 'kp-restore' });
  function disarm() {
    staged = null;
    delete b.dataset.arm;
    b.textContent = '復元';
  }
  function replace() {
    const { raw } = staged;
    disarm();
    const key = stateKey(ctx.deck.id);
    let current = null;
    try {
      current = ctx.storage.getItem(key);
    } catch {
      current = null;
    }
    if (!writeRaw(ctx.storage, beforeRestoreKey(ctx.deck.id), current ?? JSON.stringify(ctx.state))) {
      msg.textContent = RESTORE_NO_ROOM;
      return;
    }
    const next = normalizeState(raw, ctx.deck);
    if (!save(next)) {
      msg.textContent = RESTORE_NO_ROOM;
      return;
    }
    ctx.state = next;
    ctx.notice = '';
    ui.undo = null;
    msg.textContent = `復元しました（${Object.keys(next.cards).length}枚・${next.log.length}回答）。`;
  }
  ta.addEventListener('input', () => staged && disarm());
  return b;
}

function onKey(e) {
  if (!ctx?.root?.isConnected || ui.screen !== 'study' || e.target.closest?.('input, textarea')) return;
  const mode = cardMode();
  if (!ui.revealed && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    if (mode !== 'choice') reveal();
  } else if (ui.revealed && mode !== 'choice' && (e.key === '1' || e.key === '3')) {
    e.preventDefault();
    commit(Number(e.key));
  } else if (ui.revealed && mode === 'choice' && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    next();
  } else if (e.key === 'u' && ui.undo) undo();
}
let keyBound = false;

/** the host's entry point */
function ensureCss() {
  if (document.querySelector('style[data-kp], link[data-kp]')) return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = new URL('./player.css', location.href).href;
  link.dataset.kp = '1';
  document.head.append(link);
}

async function render(main, { deckId, storage = window.localStorage, onLeave, openEntry } = {}) {
  ensureCss();
  const root = el('div', 'kp');
  root.append(el('p', 'kp-sub', '読み込み中…'));
  main.append(root);
  const { deck, index } = await loadDeck(deckId);
  const sameDeck = ctx?.deck?.id === deck.id;
  ctx = {
    root,
    deck,
    index,
    storage,
    onLeave,
    openEntry: typeof openEntry === 'function' ? openEntry : null,
    prefs: prefsFor(storage, deck),
  };
  ({ state: ctx.state, notice: ctx.notice } = loadState(storage, deck));
  if (!sameDeck) {
    ui.screen = 'home';
    ui.queue = [];
  }
  if (!keyBound) {
    document.addEventListener('keydown', onKey);
    keyBound = true;
  }
  paint();
}

/** due count for a deck chooser, without rendering anything */
async function summary(deckId, storage = window.localStorage) {
  const { deck } = await loadDeck(deckId);
  const { state } = loadState(storage, deck);
  const prefs = prefsFor(storage, deck);
  const q = buildQueue(deck, state, new Date(), prefs.newPerDay);
  return { due: q.due.length, fresh: q.fresh.length, words: deck.words.length, titleJa: deck.titleJa, titleEn: deck.titleEn };
}

render(document.getElementById('app'), { deckId: 'kotoba-mine' });
