/* 集中道場 deck player — one column, dark by default, high contrast.
 * Colour carries meaning and nothing else:
 *   cyan   the word being asked (blank, answer, target)
 *   red    again / hard words      amber  learning / due today
 *   green  good / known words      violet easy

.kp {
  --kp-bg: #0a0e13;
  --kp-panel: #121922;
  --kp-panel-2: #18212c;
  --kp-ink: #f3f7fb;
  --kp-ink-2: #b7c3cf;
  --kp-mute: #7f8d9b;
  --kp-line: #263240;
  --kp-cyan: #3fd0ff;
  --kp-cyan-wash: rgba(63, 208, 255, 0.14);
  --kp-red: #ff5d6c;
  --kp-amber: #ffb648;
  --kp-green: #3ee391;
  --kp-violet: #a58bff;
  --kp-jp: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  --kp-num: ui-monospace, 'SF Mono', 'Menlo', monospace;
  color-scheme: dark;
  background: var(--kp-bg);
  color: var(--kp-ink);
  font-family: var(--kp-jp);
  margin: -8px -16px 0;
  padding: 12px 16px 48px;
  min-height: 100vh;
  box-sizing: border-box;
}
.kp[data-look='light'] {
  --kp-bg: #f5f8fb;
  --kp-panel: #ffffff;
  --kp-panel-2: #eef3f7;
  --kp-ink: #0b1520;
  --kp-ink-2: #32424f;
  --kp-mute: #5d6c79;
  --kp-line: #d3dde6;
  --kp-cyan: #0074b8;
  --kp-cyan-wash: rgba(0, 116, 184, 0.1);
  --kp-red: #d22f43;
  --kp-amber: #b86e00;
  --kp-green: #0e8f53;
  --kp-violet: #6a4fd8;
  color-scheme: light;
}
.kp * { box-sizing: border-box; }
.kp section { max-width: 40rem; margin: 0 auto; display: grid; gap: 16px; }
.kp button { font: inherit; color: inherit; cursor: pointer; }
.kp button:focus-visible, .kp input:focus-visible, .kp textarea:focus-visible { outline: 2px solid var(--kp-cyan); outline-offset: 2px; }

.kp-top { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.kp-icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-panel); font-size: 18px; flex: none; }
.kp-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
.kp-sub { margin: 0; color: var(--kp-ink-2); font-size: 14px; line-height: 1.6; }
.kp-h2 { margin: 8px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--kp-mute); }

.kp-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kp-done .kp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kp-tile { background: var(--kp-panel); border: 1px solid var(--kp-line); border-radius: 14px; padding: 12px 10px; display: grid; gap: 2px; }
.kp-tile b { font-family: var(--kp-num); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kp-tile span { font-size: 12px; color: var(--kp-ink-2); }
.kp-c-due b, .kp-c-due { color: var(--kp-amber); }
.kp-c-new b { color: var(--kp-cyan); }
.kp-c-known b, .kp-verdict.kp-c-known { color: var(--kp-green); }
.kp-c-hard b, .kp-verdict.kp-c-hard { color: var(--kp-red); }
.kp-tile span { color: var(--kp-ink-2); }

.kp-start { width: 100%; min-height: 56px; border: 0; border-radius: 16px; background: var(--kp-cyan); color: #00131d; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
.kp[data-look='light'] .kp-start { color: #fff; }
.kp-start:disabled { background: var(--kp-panel-2); color: var(--kp-mute); cursor: default; }

.kp-groups { display: grid; gap: 6px; }
.kp-group { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; grid-template-rows: auto 6px; column-gap: 12px; row-gap: 8px; align-items: center; padding: 12px 14px; background: var(--kp-panel); border: 1px solid var(--kp-line); border-radius: 14px; cursor: pointer; }
.kp-group input { width: 20px; height: 20px; accent-color: var(--kp-cyan); margin: 0; }
.kp-group.is-off { opacity: 0.45; }
.kp-gname { min-width: 0; display: grid; }
.kp-gname b { font-size: 16px; }
.kp-gname small { color: var(--kp-mute); font-size: 12px; }
.kp-gcount { font-family: var(--kp-num); font-size: 13px; color: var(--kp-ink-2); }
.kp-bar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--kp-panel-2); }
.kp-bar i { display: block; height: 100%; }
.kp-bar .kp-c-known { background: var(--kp-green); }
.kp-bar .kp-c-grow { background: var(--kp-cyan); }
.kp-bar .kp-c-learn { background: var(--kp-amber); }

.kp-foot { display: flex; gap: 20px; justify-content: center; }
.kp-link { background: none; border: 0; color: var(--kp-ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; padding: 8px; }

/* study */
.kp-top-study { gap: 10px; }
.kp-progress { flex: 1; height: 6px; border-radius: 3px; background: var(--kp-panel-2); overflow: hidden; }
.kp-progress i { display: block; height: 100%; background: var(--kp-cyan); transition: width 0.2s; }
.kp-count { font-family: var(--kp-num); font-size: 13px; color: var(--kp-ink-2); font-variant-numeric: tabular-nums; }

.kp-card { background: var(--kp-panel); border: 1px solid var(--kp-line); border-left: 4px solid var(--kp-green); border-radius: 18px; padding: 18px 18px 20px; display: grid; gap: 14px; touch-action: pan-y; user-select: none; transition: transform 0.12s, box-shadow 0.12s; min-height: 220px; }
.kp-lv2 { border-left-color: var(--kp-cyan); }
.kp-lv3 { border-left-color: var(--kp-violet); }
.kp-card[data-swipe='good'] { box-shadow: 0 0 0 2px var(--kp-green); }
.kp-card[data-swipe='again'] { box-shadow: 0 0 0 2px var(--kp-red); }
.kp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kp-chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--kp-line); color: var(--kp-ink-2); white-space: nowrap; }
.kp-lv1 .kp-lvchip { color: var(--kp-green); border-color: currentColor; }
.kp-lv2 .kp-lvchip { color: var(--kp-cyan); border-color: currentColor; }
.kp-lv3 .kp-lvchip { color: var(--kp-violet); border-color: currentColor; }
.kp-st-new { color: var(--kp-cyan); border-color: currentColor; }
.kp-st-learn { color: var(--kp-amber); border-color: currentColor; }
.kp-st-grow { color: var(--kp-cyan); border-color: currentColor; }
.kp-st-known { color: var(--kp-green); border-color: currentColor; }
.kp-st-hard { color: var(--kp-red); border-color: currentColor; }

.kp-sentence { margin: 0; font-size: clamp(22px, 6.2vw, 30px); line-height: 2.05; font-weight: 500; letter-spacing: 0.02em; color: var(--kp-ink); overflow-wrap: anywhere; }
.kp-sentence rt { font-size: 0.45em; color: var(--kp-ink-2); font-weight: 400; letter-spacing: 0; }
.kp-blank { display: inline-block; min-width: 2.4em; border-bottom: 3px solid var(--kp-cyan); background: var(--kp-cyan-wash); border-radius: 6px 6px 0 0; margin: 0 2px; line-height: 1.3; }
.kp-target { color: var(--kp-cyan); font-weight: 700; }
.kp-target rt { color: var(--kp-cyan); }
.kp-tapword { border-bottom: 1px dotted var(--kp-mute); cursor: pointer; }
.kp-hint { margin: 0; font-size: 16px; color: var(--kp-ink-2); }
.kp-taphint { margin: 0; font-size: 12px; color: var(--kp-mute); letter-spacing: 0.08em; }

.kp-answer { display: grid; gap: 6px; border-top: 1px solid var(--kp-line); padding-top: 14px; }
.kp-word { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.kp-term { font-size: 34px; font-weight: 700; color: var(--kp-cyan); line-height: 1.2; }
.kp-reading { font-size: 18px; color: var(--kp-ink-2); }
.kp-def { margin: 0; font-size: 17px; line-height: 1.6; }
.kp-meaning { margin: 0; font-size: 15px; color: var(--kp-green); font-weight: 600; }
.kp-en { margin: 0; font-size: 14px; color: var(--kp-ink-2); line-height: 1.5; }

.kp-grades { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr 0.8fr; gap: 8px; }

.kp-grade small { font-family: var(--kp-num); font-size: 12px; color: var(--kp-ink-2); }
.kp-again { border-color: var(--kp-red); } .kp-again b { color: var(--kp-red); }
.kp-hard b { color: var(--kp-amber); }
.kp-good { border-color: var(--kp-green); background: color-mix(in srgb, var(--kp-green) 12%, var(--kp-panel)); } .kp-good b { color: var(--kp-green); }
.kp-easy b { color: var(--kp-violet); }
.kp-swipehint { grid-column: 1 / -1; margin: 2px 0 0; text-align: center; font-size: 11px; color: var(--kp-mute); letter-spacing: 0.1em; }
.kp-undo { justify-self: center; background: none; border: 0; color: var(--kp-mute); font-size: 13px; padding: 8px; }
.kp-verdict { margin: 0; text-align: center; font-size: 18px; font-weight: 700; }

.kp-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kp-choice { min-height: 56px; border-radius: 14px; border: 1px solid var(--kp-line); background: var(--kp-panel-2); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; padding: 6px; }
.kp-choice:active { border-color: var(--kp-cyan); }

.kp-search { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-panel); color: var(--kp-ink); font: inherit; font-size: 16px; }

.kp-row { display: grid; grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) auto auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-panel); }
.kp-rw { display: grid; min-width: 0; }
.kp-rw b { font-size: 17px; overflow-wrap: anywhere; }
.kp-rw small { font-size: 12px; color: var(--kp-mute); }
.kp-rm { font-size: 13px; color: var(--kp-ink-2); min-width: 0; }
.kp-dots { display: flex; gap: 3px; }
.kp-dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--kp-mute); }
.kp-dots i.half { background: var(--kp-amber); border-color: var(--kp-amber); }
.kp-dots i.on { background: var(--kp-green); border-color: var(--kp-green); }

.kp-ex { display: grid; gap: 2px; border-left: 2px solid var(--kp-line); padding-left: 10px; }

.kp-field { display: grid; gap: 8px; }
.kp-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.kp-seg button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--kp-line); background: var(--kp-panel); font-size: 14px; }
.kp-seg button.is-on { border-color: var(--kp-cyan); color: var(--kp-cyan); background: var(--kp-cyan-wash); font-weight: 700; }
.kp-backup { width: 100%; min-height: 5rem; font-family: var(--kp-num); font-size: 11px; background: var(--kp-panel); color: var(--kp-ink); border: 1px solid var(--kp-line); border-radius: 10px; padding: 8px; }
.kp-danger { color: var(--kp-red) !important; border-color: var(--kp-red) !important; }
.kp-toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--kp-panel-2); border: 1px solid var(--kp-line); border-radius: 12px; padding: 10px 16px; font-size: 14px; }

@media (max-width: 420px) {

}

"く"],["りが",""],["悪化","あっか"],["した。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"When bond prices fall, their 利回り goes up."},{"id":"km-105","group":"m01-money","term":"等比","reading":"とうひ","meaning":"geometric (equal ratio)","defJa":"となり合う数の比がいつも同じこと。","pos":"noun","cards":[{"id":"km-105-1","lv":1,"ja":"2、4、8、16は等比数列だ。","form":"等比","en":"2, 4, 8, 16 is a geometric sequence.","ruby":[["2、4、8、16は",""],["等比","とうひ",1],["数列","すうれつ"],["だ。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Almost always met in 等比数列; the arithmetic version is 等差数列."},{"id":"km-106","group":"m01-money","term":"数列","reading":"すうれつ","meaning":"sequence of numbers","defJa":"決まった順に数を並べたもの。","pos":"noun","cards":[{"id":"km-106-1","lv":1,"ja":"収束する数列は有界である。","form":"数列","en":"A convergent sequence is bounded.","ruby":[["収束","しゅうそく"],["する",""],["数列","すうれつ",1],["は",""],["有界","ゆうかい"],["である。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/5186043","licence":"CC BY 2.0 FR (Tatoeba)"}}]},{"id":"km-107","group":"m01-money","term":"返済","reading":"へんさい","meaning":"repayment","defJa":"借りたお金を返すこと。","pos":"noun","cards":[{"id":"km-107-1","lv":1,"ja":"出来るだけ早く借金は返済します。","form":"返済","en":"I will pay my debt as soon as possible.","ruby":[["出来","でき"],["るだけ",""],["早","はや"],["く",""],["借金","しゃっきん"],["は",""],["返済","へんさい",1],["します。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-107-2","lv":2,"ja":"父は高額な家のローンを返済している。","form":"返済","en":"My father is paying back a huge loan on our home.","ruby":[["父","ちち"],["は",""],["高額","こうがく"],["な",""],["家","いえ"],["のローンを",""],["返済","へんさい",1],["している。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/1147515","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"A refund in a shop is 返金, not 返済."},{"id":"km-108","group":"m01-money","term":"預金","reading":"よきん","meaning":"bank deposit","defJa":"銀行などに預けたお金。","pos":"noun","cards":[{"id":"km-108-1","lv":1,"ja":"預金口座を開設したいのですが。","form":"預金","en":"I'd like to open a savings account.","ruby":[["預金","よきん",1],["口座","こうざ"],["を",""],["開設","かいせつ"],["したいのですが。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 4.0"}},{"id":"km-108-2","lv":2,"ja":"もっとも低い100万円未満の預金残高の場合は0.01%である。","form":"預金","en":"","ruby":[["もっとも",""],["低","ひく"],["い100",""],["万","まん"],["円","えん"],["未満","みまん"],["の",""],["預金","よきん",1],["残高","ざんだか"],["の",""],["場合","ばあい"],["は0.01%である。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"預金を下ろす means to withdraw money from your account."},{"id":"km-109","group":"m01-money","term":"金利","reading":"きんり","meaning":"interest rate","defJa":"お金を貸し借りするときの利息の割合。","pos":"noun","cards":[{"id":"km-109-1","lv":1,"ja":"金利が低下したので銀行貸し出しが増加している。","form":"金利","en":"Bank lending is rising because of lower interest rates.","ruby":[["金利","きんり",1],["が",""],["低下","ていか"],["したので",""],["銀行","ぎんこう"],["貸","か"],["し",""],["出","だ"],["しが",""],["増加","ぞうか"],["している。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 4.0"}},{"id":"km-109-2","lv":2,"ja":"金利の下限である短期金融市場金利（無担保コールレート）の目標値は0.25%となった。","form":"金利","en":"","ruby":[["金利","きんり",1],["の",""],["下限","かげん"],["である",""],["短期","たんき"],["金融","きんゆう"],["市場","しじょう"],["金利","きんり"],["（",""],["無","む"],["担保","たんぽ"],["コールレート）の",""],["目標","もくひょう"],["値","ち"],["は0.25%となった。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"金利 is the rate; the money you actually pay or receive is 利息."},{"id":"km-110","group":"m01-money","term":"利率","reading":"りりつ","meaning":"interest rate (formal)","defJa":"元金に対する利息の割合。","pos":"noun","cards":[{"id":"km-110-1","lv":1,"ja":"利率は少しずつ上昇するだろう。","form":"利率","en":"Gradually the interest rate will increase.","ruby":[["利率","りりつ",1],["は",""],["少","すこ"],["しずつ",""],["上昇","じょうしょう"],["するだろう。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}],"tip":"Common in ""],["指数関数","しすうかんすう",1],["じゃなくて",""],["三角","さんかく"],["関数","かんすう"],["ですけど・・・。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}],"tip":"In news, 指数関数的に simply means growing very fast."},{"id":"km-120","group":"m01-money","term":"足し算","reading":"たしざん","meaning":"addition","defJa":"数を合わせて合計を出す計算。","pos":"noun","cards":[{"id":"km-120-1","lv":1,"ja":"５＋１０の足し算はやさしい。","form":"足し算","en":"It is easy to add 5 to 10.","ruby":[["５＋１０の",""],["足し算","たしざん",1],["はやさしい。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}],"tip":"Subtraction is 引き算, multiplication 掛け算 and division 割り算."},{"id":"km-131","group":"m01-money","term":"電卓","reading":"でんたく","meaning":"pocket calculator","defJa":"数字を打ちこんで計算する小さな機械。","pos":"noun","cards":[{"id":"km-131-1","lv":1,"ja":"テーブルの上の電卓は私のです。","form":"電卓","en":"the calculator on the table is mine .","ruby":[["テーブルの",""],["上","うえ"],["の",""],["電卓","でんたく",1],["は",""],["私","わたくし"],["のです。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 4.0"}}]},{"id":"km-132","group":"m01-money","term":"電卓を叩く","reading":"でんたくをたたく","meaning":"to crunch the numbers","defJa":"損か得かを細かく計算してみる。","pos":"expression","cards":[{"id":"km-132-1","lv":1,"ja":"店の主人が電卓を叩いて値段を出した。","form":"電卓を叩い","en":"The shop owner tapped away on a calculator and came up with a price.","ruby":[["店","みせ"],["の",""],["主人","しゅじん"],["が",""],["電卓を叩い","でんたくをたたい",1],["て",""],["値段","ねだん"],["を",""],["出","だ"],["した。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Can be literal, or mean working out whether something pays off; the second use is common in business news."},{"id":"km-134","group":"m01-money","term":"計算機","reading":"けいさんき","meaning":"calculating machine","defJa":"計算をするための機械。","pos":"noun","cards":[{"id":"km-134-1","lv":1,"ja":"ビジネスマンが計算機を使って計算している。","form":"計算機","en":"A businessman is working out some figures with a calculator.","ruby":[["ビジネスマンが",""],["計算機","けいさんき",1],["を",""],["使","つ "は",""],["写真","しゃしん"],["の",""],["消去","しょうきょ"],["に",""],["同意","どうい"],["した。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"Sounds formal; common in contracts, law and debates about fair pay."},{"id":"km-258","group":"m01-money","term":"費え","reading":"ついえ","meaning":"wasteful expense","defJa":"むだに出ていくお金や手間。","pos":"noun","cards":[{"id":"km-258-1","lv":1,"ja":"無駄な費えはできるだけ省きたい。","form":"費え","en":"I want to cut wasteful expenses as much as possible.","ruby":[["無駄","むだ"],["な",""],["費え","ついえ",1],["はできるだけ",""],["省","はぶ"],["きたい。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Rare and old-fashioned, mostly met in historical novels; in normal speech say 出費 or 無駄遣い."},{"id":"km-262","group":"m01-money","term":"逸失利益","reading":"いっしつりえき","meaning":"lost earnings","defJa":"事故などがなければ得られたはずの収入。","pos":"noun","cards":[{"id":"km-262-1","lv":1,"ja":"裁判で逸失利益が認められた。","form":"逸失利益","en":"The court recognized the claim for lost earnings.","ruby":[["裁判","さいばん"],["で",""],["逸失利益","いっしつりえき",1],["が",""],["認","みと"],["められた。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"A legal and insurance term, mostly seen in court and accident news."},{"id":"km-295","group":"m01-money","term":"折半","reading":"せっぱん","meaning":"splitting fifty-fifty","defJa":"お金などを二人で半分ずつ分けること。","pos":"noun","cards":[{"id":"km-295-1","lv":1,"ja":"賞金1千万クローナは、IAEAとエルバラダイ事務局長が折半する。","form":"折半","en":"","ruby":[["賞金","しょうきん"],["1",""],["千","せん"],["万","まん"],["クローナは、IAEAとエルバラダイ",""],["事務","じむ"],["局","きょく"],["長","ちょう"],["が",""],["折半","せっぱん",1],["する。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}]},{"id":"km-316","group":"m01-money","term":"経費","reading":"けいひ","meaning":"business expenses","defJa":"仕事や活動を続けるのにかかるお金。","pos":"noun","cards":[{"id":"km-316-1","lv":1,"ja":"車を維持するのはとても経費がかかる。","form":"経費","en":"Running a car is a great expense.","ruby":[["車","くるま"],["を",""],["維持","いじ"],["するのはとても",""],["経費","けいひ",1],["がかかる。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-316-2","lv":2,"ja":"読売新聞によれば、経費の計上方法を巡る税務処理のミスとされる。","form":"経費","en":"","ruby":[["読売","よみうり"],["新聞","しんぶん"],["によれば、",""],["経費","けいひ",1],["の",""],["計上","けいじょう"],["方法","ほうほう"],["を",""],["巡","めぐ"],["る",""],["税務","ぜいむ"],["処理","しょり"],["のミスとされる。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"経費で落とす means having the company pay for something as a business expense."},{"id":"km-125","group":"m01-money","term":"棚卸","reading":"たなおろし","meaning":"stocktaking","defJa":"店の商品の数をすべて数えて調べること。","pos":"noun","cards":[{"id":"km-125-1","lv":1,"ja":"今日は店の棚卸の日だ。","form":"棚卸","en":"Today is stocktaking day at the store.","ruby":[["今日","きょう"],["は",""],["店","みせ"],["の",""],["棚卸","たなおろし",1],["の",""],["日","ひ"],["だ。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Also written 棚卸し; job hunters use it for taking stock of their own skills."},{"id":"km-126","group":"m01-money","term":"棚卸資産","reading":"たなおろししさん","meaning":"inventory (in accounts)","defJa":"売るために持っている商品や材料。","pos":"noun","cards":[{"id":"km-126-1","lv":1,"ja":"売れ残りで棚卸資産が増えた。","form":"棚卸資産","en":"Inventory went up because of unsold goods.","ruby":[["売","う"],["れ",""],["残","のこ"],["りで",""],["棚卸資産","たなおろししさん",1],["が",""],["増","ふ"],["えた。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"An accounting word from financial statements; in a shop people just say 在庫."},{"id":"km-219","group":"m01-money","term":"景気","reading":"けいき","meaning":"the economy, business conditions","defJa":"物の売り買いなど、経済全体の調子。","pos":"noun","cards":[{"id":"km-219-1","lv":1,"ja":"不景気なのに依然物価は高い。","form":"景気","en":"In spite of the depression, the prices of commodities are still high.","ruby":[["不","ふ"],["景気","けいき",1],["なのに",""],["依然","いぜん"],["物価","ぶっか"],["は",""],["高","たか"],["い。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 4.0"}},{"id":"km-219-2","lv":2,"ja":"景気がよくなってきています。","form":"景気","en":"Business is improving.","ruby":[["景気","けいき",1],["がよくなってきています。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/176526","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"景気のいい can also just mean lively or upbeat, as in 景気のいい話."},{"id":"km-297","group":"m01-money","term":"不況","reading":"ふきょう","meaning":"recession","defJa":"物が売れず、経済が落ちこんでいる状態。","pos":"noun","cards":[{"id":"km-297-1","lv":1,"ja":"経済は厳しい不況で縮小した。","form":"不況","en":"The economy recorded a negative growth.","ruby":[["経済","けいざい"],["は",""],["厳","きび"],["しい",""],["不況","ふきょう",1],["で",""],["縮小","しゅくしょう"],["した。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-297-2","lv":2,"ja":"商売している人は不況だとこぼしている。","form":"不況","en":"Merchants complain about the depression.","ruby":[["商売","しょうばい"],["している",""],["人","ひと"],["は",""],["不況","ふきょう",1],["だとこぼしている。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/147135","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"Often joined to an industry name, as in 出版不況 (the publishing slump)."},{"id":"km-218","group":"m01-money","term":"回復","reading":"かいふく","meaning":"recovery","defJa":"悪くなったものが、もとの状態にもどること。","pos":"noun","cards":[{"id":"km-218-1","lv":1,"ja":"私がほっとしたことに、彼は病気から回復した。","form":"回復","en":"To my relief, he recovered from his illness.","ruby":[["私","わたくし"],["がほっとしたことに、",""],["彼","かれ"],["は",""],["病気","びょうき"],["から",""],["回復","かいふく",1],["した。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/167923","licence":"CC BY 2.0 FR (Tatoeba)"}},{"id":"km-218-2","lv":2,"ja":"君主は病気から完全に回復した。","form":"回復","en":"The sovereign completely recovered from his illness.","ruby":[["君主","くんしゅ"],["は",""],["病気","びょうき"],["から",""],["完全","かんぜん"],["に",""],["回復","かいふく",1],["した。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-218-3","lv":3,"ja":"ひんやりした空気のせいで、トムは意識を回復した。","form":"回復","en":"The cold air revived Tom. ":"Also used casually for a frosty standoff, such as a couple who aren't speaking."},{"id":"km-071","group":"m02-hegemony","term":"覇権","reading":"はけん","meaning":"dominance, hegemony","defJa":"圧倒的な力で地域や分野を支配すること。","pos":"noun","cards":[{"id":"km-071-1","lv":1,"ja":"セ・リーグも2005年度に続いて交流試合込みの146試合でリーグ戦の覇権を争う。","form":"覇権","en":"","ruby":[["セ・リーグも2005",""],["年度","ねんど"],["に",""],["続","つづ"],["いて",""],["交流","こうりゅう"],["試合","しあい"],["込","こ"],["みの146",""],["試合","しあい"],["でリーグ",""],["戦","せん"],["の",""],["覇権","はけん",1],["を",""],["争","あらそ"],["う。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"覇権を握る (to seize dominance) is the usual verb; it is also used for business and sport."},{"id":"km-072","group":"m02-hegemony","term":"覇権安定論","reading":"はけんあんていろん","meaning":"hegemonic stability theory","defJa":"強い一国が秩序を支えると世界経済が安定するという説。","pos":"noun","cards":[{"id":"km-072-1","lv":1,"ja":"国際政治の授業で覇権安定論を学んだ。","form":"覇権安定論","en":"I studied hegemonic stability theory in an international politics class.","ruby":[["国際","こくさい"],["政治","せいじ"],["の",""],["授業","じゅぎょう"],["で",""],["覇権安定論","はけんあんていろん",1],["を",""],["学","まな"],["んだ。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"An academic term from international relations; you meet it in textbooks and essays, not conversation."},{"id":"km-182","group":"m02-hegemony","term":"貿易摩擦","reading":"ぼうえきまさつ","meaning":"trade friction","defJa":"輸出入をめぐって国の間に起きる対立。","pos":"noun","cards":[{"id":"km-182-1","lv":1,"ja":"今にも両国間に貿易摩擦が生じそうだ。","form":"貿易摩擦","en":"Trade friction might arise between the two nations at any moment.","ruby":[["今","いま"],["にも",""],["両国","りょうこく"],["間","かん"],["に",""],["貿易摩擦","ぼうえきまさつ",1],["が",""],["生","しょう"],["じそうだ。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}]},{"id":"km-183","group":"m02-hegemony","term":"由々しき","reading":"ゆゆしき","meaning":"grave, serious","defJa":"放っておけないほど重大な。","pos":"expression","cards":[{"id":"km-183-1","lv":1,"ja":"食品の偽装は由々しき問題だ。","form":"由々しき","en":"Food mislabeling is a grave problem.","ruby":[["食品","しょくひん"],["の",""],["偽装","ぎそう"],["は",""],["由々しき","ゆゆしき",1],["問題","もんだい"],["だ。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Stiff and formal; it is only used before a noun, as in 由々しき事態."},{"id":"km-186","group":"m02-hegemony","term":"協定","reading":"きょうてい","meaning":"agreement, pact","defJa":"国や団体が話し合って決めた約束。","pos":"noun","cards":[{"id":"km-186-1","lv":1,"ja":"協定が結ばれる可能性は極めて少ない。","form":"協定","en":"There is very little probability of an agreement being reached.","ruby":[["協定","きょうてい",1],["が",""],["結","むす"],["ばれる",""],["可能","かのう"],["性","せい"],["は",""],["極","きわ"],["めて",""],["少","すく"],["ない。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 4.0"}},{"id":"km-186-2","lv":2,"ja":"農業産品にもこの協定は適応される。","form":"協定","en":"","ruby":[["農業","のうぎょう"],["産品","さんひん"],["にもこの",""],["協定","きょうてい",1],["は",""],["適応","てきおう"],["される。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"Used between countries or organizations; a private deal between people is 約束 or 契約."},{"id":"km-188","group":"m02-hegemony","term":"財閥","reading":"ざいばつ","meaning":"family-run conglomerate","defJa":"一族が多くの会社を支配する企業グループ。","pos":"noun","cards":[{"id":"km-188-1","lv":1,"ja":"戦後、日本の財閥は解体された。","form":"財閥","en":"After the war, Japan's zaibatsu were broken up.","ruby":[["戦後","せんご"],["、",""],["日本","にっぽん"],["の",""],["財閥","ざいばつ",1],["は",""],["解体","かいたい"],["された。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Korean chaebol is the same word, so 韓国の財閥 is how you say it in Japanese."},{"id":"km-189","group":"m02-hegemony","term":"制圧","reading":"せいあつ","meaning":"bringing under control","defJa":"力で相手をおさえて支配すること。","pos":"noun","cards":[{"id":"km-189-1","lv":1,"ja":"私達は残っていたわずかな抵抗組織を全て制圧した。","form":"制圧","en":"We broke down what little resistance remained.","ruby":[["私","わたくし"],["達","たち"],["は",""],["残","のこ"],["っていたわずかな",""],["抵抗","ていこう"],["組織","そしき"],["を",""],["全","すべ"],["て",""],["制圧","せいあつ",1],["した。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-189-2","lv":2,"ja":"共同通信によれば、クーデター派が首都バンコクを制圧した。","form":"制圧","en":"","ruby":[["共同","きょうどう"],["通信","つうしん"],["によれば、クーデター",""],["派","は"],["が",""],["首都","しゅと"],["バンコクを",""],["制圧","せいあつ",1],["した。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"A military and police word, also used in sports for dominating the game."},{"id":"km-190","group":"m02-hegemony","term":"決裂","reading":"けつれつ","meaning":"breakdown of talks","defJa":"話し合いがまとまらずに終わること。","pos":"noun","cards":[{"id":"km-190-1","lv":1,"ja":"交渉の決裂は戦争を引き起こすことになるだろう。","form":"決裂","en":"A breakdown in the negotiations will mean war.","ruby":[["交渉","こうしょう"],["の",""],["決裂","けつれつ",1],["は",""],["戦争","せんそう"],["を",""],["引","ひ"],["き",""],["起","お"],["こすことになるだろう。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}],"tip":"Almost always with 交渉, 会談 or 協議 as the subject."},{"id":"km-191","group":"m02-hegemony","term":"中枢","reading":"ちゅうすう","meaning":"center, core","defJa":"全体を動かす、いちばん大事な中心部分。","pos":"noun","cards":[{"id":"km-191-1","lv":1,"ja":"東京は今や世界経済の中枢だ。","form":"中枢","en":"Tokyo is now a center of the world economy.","ruby":[["東京","とうきょう"],["は",""],["今","いま"],["や",""],["世界","せかい"],["経済","けいざい"],["の",""],["中枢","ちゅうすう",1],["だ。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-191-2","lv":2,"ja":"首都の中枢機能が麻痺すると懸念。","form":"中枢","en":"","ruby":[["首都","しゅと"],["の",""],["中枢","ちゅうすう",1],["機能","きのう"],["が",""],["麻痺","まひ"],["すると",""],["懸念","けねん"],["。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"Also a medical word: 中枢神経 is the central nervous system."},{"id":"km-195","group":"m02-hegemony","term":"国策","reading":"こくさく","meaning":"national policy","defJa":"国が方針として進める政策。","pos":"noun","cards":[{"id":"km-195-1","lv":1,"ja":"原発は長く国策とされてきた。","form":"国策","en":"Nuclear power has long been treated as national policy.","ruby":[["原発","げんぱつ"],["は",""],["長","なが"],["く",""],["国策","こくさく",1],["とされてきた。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Can sound critical, as in 国策捜査 (a politically motivated investigation)."},{"id":"km-200","group":"m02-hegemony","term":"追い上げる","reading":"おいあげる","meaning":"to close in on","defJa":"前を行く相手との差を縮めて迫る。","pos":"verb","cards":[{"id":"km-200-1","lv":1,"ja":"終盤ガンバに1点差に追い上げられるもそのまま逃げ切って勝利した。","form":"追い上げ","en":"","ruby":[["終盤","しゅうばん"],["ガンバに1",""],["点","てん"],["差","さ"],["に",""],["追い上げ","おいあげ",1],["られるもそのまま",""],["逃","に"],["げ",""],["切","き"],["って",""],["勝利","しょうり"],["した。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}}],"tip":"The noun 追い上げ is very common in sports commentary."},{"id":"km-201","group":"m02-hegemony","term":"劣勢","reading":"れっせい","meaning":"losing position","defJa":"相手より力が弱く、不利な立場。","pos":"noun","cards":[{"id":"km-201-1","lv":1,"ja":"あのダークホースは予備選挙の前は、劣勢でした。","form":"劣勢","en":"The dark horse candidate was losing in the polls before the primary.","ruby":[["あのダークホースは",""],["予備","よび"],["選挙","せんきょ"],["の",""],["前","まえ"],["は、",""],["劣勢","れっせい",1],["でした。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}],"tip":"The opposite is 優勢."},{"id":"km-204","group":"m02-hegemony","term":"牛耳る","reading":"ぎゅうじる","meaning":"to control, to dominate","defJa":"組織の中心に立ち、思いどおりに動かす。","pos":"verb","cards":[{"id":"km-204-1","lv":1,"ja":"彼女は彼を牛耳っている。","form":"牛耳って","en":"She has him under her thumb.","ruby":[["彼女","かのじょ"],["は",""],["彼","かれ"],["を",""],["牛耳って","ぎゅうじって",1],["いる。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/1492215","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"Usually negative; it comes from an old Chinese phrase about holding an ox's ear."},{"id":"km-294","group":"m02-hegemony","term":"凋落","reading":"ちょうらく","meaning":"decline, fall","defJa":"勢いのあったものが、おとろえること。","pos":"noun","cards":[{"id":"km-294-1","lv":1,"ja":"彼の傲慢が凋落に繋がった。","form":"凋落","en":"His arrogance led to his downfall.","ruby":[["彼","かれ"],["の",""],["傲慢","ごうまん"],["が",""],["凋落","ちょうらく",1],["に",""],["繋","つな"],["がった。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/873967","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"Formal and common in headlines; 凋落の一途をたどる means to keep on declining."},{"id":"km-061","group":"m02-hegemony","term":"命運","reading":"めいうん","meaning":"fate, make-or-break fortune","defJa":"生き残るか滅びるかを決めるめぐり合わせ。","pos":"noun","cards":[{"id":"km-061-1","lv":1,"ja":"次の試合にチームの命運がかかっている。","form":"命運","en":"The team's fate depends on the next game.","ruby":[["次","つぎ"],["の",""],["試合","しあい"],["にチームの",""],["命運","めいうん",1],["がかかっている。",""]],"kind":"original","src":{"site":"書き下ろし（このデッキ用）"}}],"tip":"Used in make-or-break situations, as in 命運を賭ける or 命運がかかる."},{"id":"km-167","group":"m02-hegemony","term":"切り札","reading":"きりふだ","meaning":"trump card","defJa":"いざという時に使う、いちばん効く手段。","pos":"noun","cards":[{"id":"km-167-1","lv":1,"ja":"切り札は最後まで見せるな。見せるなら、さらに奥の手を持て。","form":"切り札","en":"Keep that ace up your sleeve. If you're going to show it, have another even further up.","ruby":[["切り札","きりふだ",1],["は",""],["最後","さいご"],["まで",""],["見","み"],["せるな。",""],["見","み"],["せるなら、さらに",""],["奥","おく"],["の",""],["手","て"],["を",""],["持","も"],["て。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-167-2","lv":2,"ja":"きっと無罪になるだけの決定的切り札を隠し持っているに違いない。","form":"切り札","en":"I'm sure he has something up his sleeve.","ruby":[["きっと",""],["無罪","むざい"],["になるだけの",""],["決定","けってい"],["的","てき"],["切り札","きりふだ",1],["を",""],["隠","かく"],["し",""],["持","も"],["っているに",""],["違","ちが"],["いない。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 4.0"}}],"tip":"From card games; used for policies, players and products."},{"id":"km-161","group":"m02-hegemony","term":"起爆剤","reading":"きばくざい","meaning":"catalyst, spark","defJa":"物事が大きく動き出すきっかけになるもの。","pos":"noun","cards":[{"id":"km-161-1","lv":1,"ja":"変革をもたらす「起爆剤」を手中に。","form":"起爆剤","en":"","ruby":[["変革","へんかく"],["をもたらす「",""],["起爆剤","きばくざい",1],["」を",""],["手中","しゅちゅう"],["に。",""]],"kind":"company","src":{"site":"special.nikkeibp.co.jp","url":"https://special.nikkeibp.co.jp/atclh/NXT/24/delltechnologies0308/","licence":"web quotation (personal study)"}}],"tip":"Literally a detonator charge, but in news it almost always means a catalyst for growth."},{"id":"km-069","group":"m02-hegemony","term":"悲観","reading":"ひかん","meaning":"pessimism, despair","defJa":"うまくいかないと考えて望みを失うこと。","pos":"noun","cards":[{"id":"km-069-1","lv":1,"ja":"記事の論調は一種の悲観論だった。","form":"悲観","en":"The article's tone was one of pessimism.","ruby":[["記事","きじ"],["の",""],["論調","ろんちょう"],["は",""],["一種","いっしゅ"],["の",""],["悲観","ひかん",1],["論","ろん"],["だった。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-069-2","lv":2,"ja":"人生をそう悲観してはいけない。","form":"悲観","en":"You had better not take such a hopeless view of life.","ruby":[["人生","じんせい"],["をそう",""],["悲観","ひかん",1],["してはいけない。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/143968","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"The opposite is 楽観; 悲観的 means pessimistic."},{"id":"km-185","group":"m02-hegemony","term":"凄まじい","reading":"すさまじい","meaning":"tremendous, fierce","defJa":"驚くほど勢いや程度が激しい。","pos":"い-adjective","cards":[{"id":"km-185-1","lv":1,"ja":"国内市場の競争はすさまじいものです。","form":"すさまじい","en":"Competition in the domestic market is cutthroat.","ruby":[["国内","こくない"],["市場","しじょう"],["の",""],["競争","きょうそう"],["は",""],["すさまじい","すさまじい",1],["ものです。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/173036","licence":"CC BY 2.0 FR (Tatoeba)"}},{"id":"km-185-2","lv":2,"ja":"木がすさまじい音を立てて倒れるのが聞こえた。","form":"すさまじい","en":"We heard the tree fall with a crash.","ruby":[["木","き"],["が",""],["すさまじい","すさまじい",1],["音","おと"],["を",""],["立","た"],["てて",""],["倒 inews.org","licence":"CC BY 2.5"}}],"tip":"In political news, 遠心力 means a group is starting to break apart."},{"id":"km-127","group":"m09-math","term":"自由自在","reading":"じゆうじざい","meaning":"freely, at will","defJa":"思いどおりに、どのようにでもできるようす。","pos":"な-adjective","cards":[{"id":"km-127-1","lv":1,"ja":"私の秘書は英語が自由自在だ。","form":"自由自在","en":"My secretary has a good command of the English language.","ruby":[["私","わたくし"],["の",""],["秘書","ひしょ"],["は",""],["英語","えいご"],["が",""],["自由自在","じゆうじざい",1],["だ。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}}],"tip":"Most often used as 自由自在に before verbs like 操る or 使いこなす."},{"id":"km-032","group":"m09-math","term":"帰納的関数","reading":"きのうてきかんすう","meaning":"recursive function (logic)","defJa":"決まった操作のくり返しで作られる、計算できる関数。","pos":"noun","cards":[{"id":"km-032-1","lv":1,"ja":"定理：帰納的関数は計算可能である．。","form":"帰納的関数","en":"","ruby":[["定理","ていり"],["：",""],["帰納的関数","きのうてきかんすう",1],["は",""],["計算","けいさん"],["可能","かのう"],["である．。",""]],"kind":"other","src":{"site":"web.sfc.keio.ac.jp","url":"https://web.sfc.keio.ac.jp/~hagino/mi17/03.pdf","licence":"web quotation (personal study)"}}],"tip":"A term from mathematical logic; programmers call a function that calls itself 再帰関数."},{"id":"km-033","group":"m09-math","term":"帰納的","reading":"きのうてき","meaning":"inductive","defJa":"いくつもの例から、一般的な結論を出すようす。","pos":"な-adjective","cards":[{"id":"km-033-1","lv":1,"ja":"ちきりんはモノを考える時、圧倒的に帰納的に考えることが多いです。","form":"帰納的","en":"","ruby":[["ちきりんはモノを",""],["考","かんが"],["える",""],["時","とき"],["、",""],["圧倒","あっとう"],["的","てき"],["に",""],["帰納的","きのうてき",1],["に",""],["考","かんが"],["えることが",""],["多","おお"],["いです。",""]],"kind":"blog","src":{"site":"chikirin.hatenablog.com","url":"https://chikirin.hatenablog.com/entry/20070806","licence":"web quotation (personal study)"}}],"tip":"The opposite is 演繹的, deductive; in logic, 帰納的 can also translate recursive."},{"id":"km-034","group":"m09-math","term":"機能的","reading":"きのうてき","meaning":"functional, practical","defJa":"むだがなく、使う目的 .com","url":"https://note.com/virgin_flight/n/ne345214d37d5","licence":"web quotation (personal study)"}},{"id":"km-004-2","lv":2,"ja":"「なんくるないさ」という言葉には重要な前置きがある。","form":"なんくるないさ","en":"","ruby":[["「",""],["なんくるないさ","なんくるないさ",1],["」という",""],["言葉","ことば"],["には",""],["重要","じゅうよう"],["な",""],["前置","まえお"],["きがある。",""]],"kind":"blog","src":{"site":"note.com","url":"https://note.com/nus_t/n/neb637d71ac08","licence":"web quotation (personal study)"}},{"id":"km-004-3","lv":3,"ja":"実は「なんくるないさー」は本来、その前句として「まくとぅそーけー」がつくのだという。","form":"なんくるないさー","en":"","ruby":[["実","じつ"],["は「",""],["なんくるないさー","なんくるないさあ",1],["」は",""],["本来","ほんらい"],["、その",""],["前句","まえく"],["として「まくとぅそーけー」がつくのだという。",""]],"kind":"blog","src":{"site":"note.com","url":"https://note.com/virgin_flight/n/ne345214d37d5","licence":"web quotation (personal study)"}}],"tip":"Okinawan dialect, almost always said as なんくるないさ."},{"id":"km-024","group":"m11-people","term":"正直","reading":"しょうじき","meaning":"honest; honestly","defJa":"うそやごまかしがないこと。","pos":"な-adjective","cards":[{"id":"km-024-1","lv":1,"ja":"正直なところ、それはいちかばちかだ。","form":"正直","en":"Honestly, it's all or nothing.","ruby":[["正直","しょうじき",1],["なところ、それはいちかばちかだ。",""]],"kind":"example-bank","src":{"site":"例文集（Tanaka/SNOW）","licence":"CC BY 2.0 FR"}},{"id":"km-024-2","lv":2,"ja":"正直に言って、それは法律と法律の実務の問題です。","form":"正直","en":"","ruby":[["正直","しょうじき",1],["に",""],["言","い"],["って、それは",""],["法律","ほうりつ"],["と",""],["法律","ほうりつ"],["の",""],["実務","じつむ"],["の",""],["問題","もんだい"],["です。",""]],"kind":"news","src":{"site":"ja.wikinews.org","licence":"CC BY 2.5"}},{"id":"km-024-3","lv":3,"ja":"正直な人なら、そんなことはしないだろう。","form":"正直","en":"An honest man would not do such a thing.","ruby":[["正直","しょうじき",1],["な",""],["人","ひと"],["なら、そんなことはしないだろう。",""]],"kind":"tatoeba","src":{"site":"Tatoeba","url":"https://tatoeba.org/ja/sentences/show/142905","licence":"CC BY 2.0 FR (Tatoeba)"}}],"tip":"In speech a bare 正直、 at the start of a sentence means honestly."},{"id":"km-025","group":"m11-people","term":"率直に言って","rea      * $$ S_0(G) = w_{G-1}$$
     * $$S_0 = \max \lbrace S_0,0.1\rbrace $$
  
     * @param g Grade (rating at Anki) [1.again,2.hard,3.good,4.easy]
     * @return Stability (interval when R=90%)
     */
  init_stability(g) {
    return Math.max(this.param.w[g - 1], 0.1);
  }
  /**
   * The formula used is :
   * $$D_0(G) = w_4 - e^{(G-1) \cdot w_5} + 1 $$
   * $$D_0 = \min \lbrace \max \lbrace D_0(G),1 \rbrace,10 \rbrace$$
   * where the $$D_0(1)=w_4$$ when the first rating is good.
   *
   * @param {Grade} g Grade (rating at Anki) [1.again,2.hard,3.good,4.easy]
   * @return {number} Difficulty $$D \in [1,10]$$
   */
  init_difficulty(g) {
    const w = this.param.w;
    const d = w[4] - Math.exp((g - 1) * w[5]) + 1;
    return roundTo(d, 8);
  }
  /**
   * If fuzzing is disabled or ivl is less than 2.5, it returns the original interval.
   * @param {number} ivl - The interval to be fuzzed.
   * @param {number} elapsed_days t days since the last review
   * @return {number} - The fuzzed interval.
   **/
  apply_fuzz(ivl, elapsed_days) {
    if (!this.param.enable_fuzz || ivl < 2.5) return Math.round(ivl);
    const generator = alea(this._seed);
    const fuzz_factor = generator();
    const { min_ivl, max_ivl } = get_fuzz_range(
      ivl,
      elapsed_days,
      this.param.maximum_interval
    );
    return Math.floor(fuzz_factor * (max_ivl - min_ivl + 1) + min_ivl);
  }
  /**
   *   @see The formula used is : {@link FSRSAlgorithm.calculate_interval_modifier}
   *   @param {number} s - Stability (interval when R=90%)
   *   @param {number} elapsed_days t days since the last review
   */
  next_interval(s, elapsed_days) {
    const newInterval = Math.min(
      Math.max(1, Math.round(s * this.intervalModifier)),
      this.param.maximum_interval
    );
    return this.apply_fuzz(newInterval, elapsed_days);
  }
  /**
   * @see https://github.com/open-spaced-repetition/fsrs4anki/issues/697
   */
  linear_damping(delta_d, old_d) {
    return roundTo(delta_d * (10 - old_d) / 9, 8);
  }
  /**
   * The formula used is :
   * $$\text{delta}_d = -w_6 \cdot (g - 3)$$
   * $$\text{next}_d = D + \text{linear damping}(\text{delta}_d , D)$$
   * $$D^\prime(D,R) = w_7 \cdot D_0(4) +(1 - w_7) \cdot \text{next}_d$$
   * @param {number} d Difficulty $$D \in [1,10]$$
   * @param {Grade} g Grade (rating at Anki) [1.again,2.hard,3.good,4.easy]
   * @return {number} $$\text{next}_D$$
   */
  next_difficulty(d, g) {
    const delta_d = -this.param.w[6] * (g - 3);
    const next_d = d + this.linear_damping(delta_d, d);
    return clamp(
      this.mean_reversion(this.init_difficulty(Rating.Easy), next_d),
      1,
      10
    );
  }
  /**
   * The formula used is :
   * $$w_7 \cdot \text{init} +(1 - w_7) \cdot \text{current}$$
   * @param {number} init $$w_2 : D_0(3) = w_2 + (R-2) \cdot w_3= w_2$$
   * @param {number} current $$D - w_6 \cdot (R - 2)$$
   * @return {number} difficulty
   */
  mean_reversion(init, current) {
    const w = this.param.w;
    return roundTo(w[7] * init + (1 - w[7]) * current, 8);
  }
  /**
   * The formula used is :
   * $$S^\prime_r(D,S,R,G) = S\cdot(e^{w_8}\cdot (11-D)\cdot S^{-w_9}\cdot(e^{w_{10}\cdot(1-R)}-1)\cdot w_{15}(\text{if} G=2) \cdot w_{16}(\text{if} G=4)+1)$$
   * @param {number} d Difficulty D \in [1,10]
   * @param {number} s Stability (interval when R=90%)
   * @param {number} r Retrievability (probability of recall)
   * @param {Grade} g Grade (Rating[0.again,1.hard,2.good,3.easy])
   * @return {number} S^\prime_r new stability after recall
   */
  next_recall_stability(d, s, r, g) {
    const w = this.param.w;
    const hard_penalty = Rating.Hard === g ? w[15] : 1;
    const easy_bound = Rating.Easy === g ? w[16] : 1;
    return roundTo(
      clamp(
        s * (1 + Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp((1 - r) * w[10]) - 1) * hard_penalty * easy_bound),
        S_MIN,
        36500
      ),
      8
    );
  }
  /**
   * The formula used is :
   * $$S^\prime_f(D,S,R) = w_{11}\cdot D^{-w_{12}}\cdot ((S+1)^{w_{13}}-1) \cdot e^{w_{14}\cdot(1-R)}$$
   * enable_short_term = true : $$S^\prime_f \in \min \lbrace \max \lbrace S^\prime_f,0.01\rbrace, \frac{S}{e^{w_{17} \cdot w_{18}}} \rbrace$$
   * enable_short_term = false : $$S^\prime_f \in \min \lbrace \max \lbrace S^\prime_f,0.01\rbrace, S \rbrace$$
   * @param {number} d Difficulty D \in [1,10]
   * @param {number} s Stability (interval when R=90%)
   * @param {number} r Retrievability (probability of recall)
   * @return {number} S^\prime_f new stability after forgetting
   */
  next_forget_stability(d, s, r) {
    const w = this.param.w;
    return roundTo(
      clamp(
        w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp((1 - r) * w[14]),
        S_MIN,
        36500
      ),
      8
    );
  }
  /**
   * The formula used is :
   * $$S^\prime_s(S,G) = S \cdot e^{w_{17} \cdot (G-3+w_{18})}$$
   * @param {number} s Stability (interval when R=90%)
   * @param {Grade} g Grade (Rating[0.again,1.hard,2.good,3.easy])
   */
  next_short_term_stability(s, g) {
    const w = this.param.w;
    const sinc = Math.pow(s, -w[19]) * Math.exp(w[17] * (g - 3 + w[18]));
    const maskedSinc = g >= Rating.Hard ? Math.max(sinc, 1) : sinc;
    return roundTo(clamp(s * maskedSinc, S_MIN, 36500), 8);
  }
  /**
   * The formula used is :
   * $$R(t,S) = (1 + \text{FACTOR} \times \frac{t}{9 \cdot S})^{\text{DECAY}}$$
   * @param {number} elapsed_days t days since the last review
   * @param {number} stability Stability (interval when R=90%)
   * @return {number} r Retrievability (probability of recall)
   */
  forgetting_curve;
  /**
   * Calculates the next state of memory based on the current state, time elapsed, and grade.
   *
   * @param memory_state - The current state of memory, which can be null.
   * @param t - The time elapsed since the last review.
   * @param {Rating} g Grade (Rating[0.Manual,1.Again,2.Hard,3.Good,4.Easy])
   * @param r - Optional retrievability value. If not provided, it will be calculated.
   * @returns The next state of memory with updated difficulty and stability.
   */
  next_state(memory_state, t, g, r) {
    const { difficulty: d, stability: s } = memory_state ?? {
      difficulty: 0,
      stability: 0
    };
    if (t < 0) {
      throw new FSRSValidationError(`Invalid delta_t "${t}"`);
    }
    if (g < 0 || g > 4) {
      throw new FSRSValidationError(`Invalid grade "${g}"`);
    }
    if (d === 0 && s === 0) {
      return {
        difficulty: clamp(this.init_difficulty(g), 1, 10),
        stability: this.init_stability(g)
      };
    }
    if (g === 0) {
      return {
        difficulty: d,
        stability: s
      };
    }
    if (d < 1 || s < S_MIN) {
      throw new FSRSValidationError(
        `Invalid memory state { difficulty: ${d}, stability: ${s} }`
      );
    }
    const w = this.param.w;
    r = typeof r === "number" ? r : this.forgetting_curve(t, s);
    let new_s;
    if (t === 0 && this.param.enable_short_term) {
      new_s = this.next_short_term_stability(s, g);
    } else if (g === 1) {
      const s_after_fail = this.next_forget_stability(d, s, r);
      let [w_17, w_18] = [0, 0];
      if (this.param.enable_short_term) {
        w_17 = w[17];
        w_18 = w[18];
      }
      const next_s_min = s / Math.exp(w_17 * w_18);
      new_s = clamp(roundTo(next_s_min, 8), S_MIN, s_after_fail);
    } else {
      new_s = this.next_recall_stability(d, s, r, g);
    }
    const new_d = this.next_difficulty(d, g);
    return { difficulty: new_d, stability: new_s };
  }
}

class BasicScheduler extends AbstractScheduler {
  learningStepsStrategy;
  constructor(card, now, algorithm, strategies) {
    super(card, now, algorithm, strategies);
    let learningStepStrategy = BasicLearningStepsStrategy;
    if (this.strategies) {
      const custom_strategy = this.strategies.get(StrategyMode.LEARNING_STEPS);
      if (custom_strategy) {
        learningStepStrategy = custom_strategy;
      }
    }
    this.learningStepsStrategy = learningStepStrategy;
  }
  getLearningInfo(card, grade) {
    const parameters = this.algorithm.parameters;
    card.learning_steps = card.learning_steps || 0;
    const steps_strategy = this.learningStepsStrategy(
      parameters,
      card.state,
      card.learning_steps
    );
    const scheduled_minutes = Math.max(
      0,
      steps_strategy[grade]?.scheduled_minutes ?? 0
    );
    const next_steps = Math.max(0, steps_strategy[grade]?.next_step ?? 0);
    return {
      scheduled_minutes,
      next_steps
    };
  }
  /**
   * @description This function applies the learning steps based on the current card's state and grade.
   */
  applyLearningSteps(nextCard, grade, to_state) {
    const { scheduled_minutes, next_steps } = this.getLearningInfo(
      this.current,
      grade
    );
    if (scheduled_minutes > 0 && scheduled_minutes < 1440) {
      nextCard.learning_steps = next_steps;
      nextCard.scheduled_days = 0;
      nextCard.state = to_state;
      nextCard.due = date_scheduler(
        this.review_time,
        Math.round(scheduled_minutes),
        false
        /** true:days false: minute */
      );
    } else {
      nextCard.state = State.Review;
      if (scheduled_minutes >= 1440) {
        nextCard.learning_steps = next_steps;
        nextCard.due = date_scheduler(
          this.review_time,
          Math.round(scheduled_minutes),
          false
          /** true:days false: minute */
        );
        nextCard.scheduled_days = Math.floor(scheduled_minutes / 1440);
      } else {
        nextCard.learning_steps = 0;
        const interval = this.algorithm.next_interval(
          nextCard.stability,
          this.elapsed_days
        );
        nextCard.scheduled_days = interval;
        nextCard.due = date_scheduler(this.review_time, interval, true);
      }
    }
  }
  newState(grade) {
    const exist = this.next.get(grade);
    if (exist) {
      return exist;
    }
    const next = this.next_ds(this.elapsed_days, grade);
    this.applyLearningSteps(next, grade, State.Learning);
    const item = {
      card: next,
      log: this.buildLog(grade)
    };
    this.next.set(grade, item);
    return item;
  }
  learningState(grade) {
    const exist = this.next.get(grade);
    if (exist) {
      return exist;
    }
    const next = this.next_ds(this.elapsed_days, grade);
    this.applyLearningSteps(
      next,
      grade,
      this.last.state
      /** Learning or Relearning */
    );
    const item = {
      card: next,
      log: this.buildLog(grade)
    };
    this.next.set(grade, item);
    return item;
  }
  reviewState(grade) {
    const exist = this.next.get(grade);
    if (exist) {
      return exist;
    }
    const interval = this.elapsed_days;
    const retrievability = this.algorithm.forgetting_curve(
      interval,
      this.current.stability
    );
    const next_again = this.next_ds(interval, Rating.Again, retrievability);
    const next_hard = this.next_ds(interval, Rating.Hard, retrievability);
    const next_good = this.next_ds(interval, Rating.Good, retrievability);
    const next_easy = this.next_ds(interval, Rating.Easy, retrievability);
    this.next_interval(next_hard, next_good, next_easy, interval);
    this.next_state(next_hard, next_good, next_easy);
    this.applyLearningSteps(next_again, Rating.Again, State.Relearning);
    next_again.lapses += 1;
    const item_again = {
      card: next_again,
      log: this.buildLog(Rating.Again)
    };
    const item_hard = {
      card: next_hard,
      log: super.buildLog(Rating.Hard)
    };
    const item_good = {
      card: next_good,
      log: super.buildLog(Rating.Good)
    };
    const item_easy = {
      card: next_easy,
      log: super.buildLog(Rating.Easy)
    };
    this.next.set(Rating.Again, item_again);
    this.next.set(Rating.Hard, item_hard);
    this.next.set(Rating.Good, item_good);
    this.next.set(Rating.Easy, item_easy);
    return this.next.get(grade);
  }
  /**
   * Review next_ds
   */
  next_ds(t, g, r) {
    const next_state = this.algorithm.next_state(
      {
        difficulty: this.current.difficulty,
        stability: this.current.stability
      },
      t,
      g,
      r
    );
    const card = TypeConvert.card(this.current);
    card.difficulty = next_state.difficulty;
    card.stability = next_state.stability;
    return card;
  }
  /**
   * Review next_interval
   */
  next_interval(next_hard, next_good, next_easy, interval) {
    let hard_interval, good_interval;
    hard_interval = this.algorithm.next_interval(next_hard.stability, interval);
    good_interval = this.algorithm.next_interval(next_good.stability, interval);
    hard_interval = Math.min(hard_interval, good_interval);
    good_interval = Math.max(good_interval, hard_interval + 1);
    const easy_interval = Math.max(
      this.algorithm.next_interval(next_easy.stability, interval),
      good_interval + 1
    );
    next_hard.scheduled_days = hard_interval;
    next_hard.due = date_scheduler(this.review_time, hard_interval, true);
    next_good.scheduled_days = good_interval;
    next_good.due = date_scheduler(this.review_time, good_interval, true);
    next_easy.scheduled_days = easy_interval;
    next_easy.due = date_scheduler(this.review_time, easy_interval, true);
  }
  /**
   * Review next_state
   */
  next_state(next_hard, next_good, next_easy) {
    next_hard.state = State.Review;
    next_hard.learning_steps = 0;
    next_good.state = State.Review;
    next_good.learning_steps = 0;
    next_easy.state = State.Review;
    next_easy.learning_steps = 0;
  }
}

class LongTermScheduler extends AbstractScheduler {
  newState(grade) {
    const exist = this.next.get(grade);
    if (exist) {
      return exist;
    }
    this.current.scheduled_days = 0;
    this.current.elapsed_days = 0;
    const first_interval = 0;
    const next_again = this.next_ds(first_interval, Rating.Again);
    const next_hard = this.next_ds(first_interval, Rating.Hard);
    const next_good = this.next_ds(first_interval, Rating.Good);
    const next_easy = this.next_ds(first_interval, Rating.Easy);
    this.next_interval(
      next_again,
      next_hard,
      next_good,
      next_easy,
      first_interval
    );
    this.next_state(next_again, next_hard, next_good, next_easy);
    this.update_next(next_again, next_hard, next_good, next_easy);
    return this.next.get(grade);
  }
  next_ds(t, g, r) {
    const next_state = this.algorithm.next_state(
      {
        difficulty: this.current.difficulty,
        stability: this.current.stability
      },
      t,
      g,
      r
    );
    const card = TypeConvert.card(this.current);
    card.difficulty = next_state.difficulty;
    card.stability = next_state.stability;
    return card;
  }
  /**
   * @see https://github.com/open-spaced-repetition/ts-fsrs/issues/98#issuecomment-2241923194
   */
  learningState(grade) {
    return this.reviewState(grade);
  }
  reviewState(grade) {
    const exist = this.next.get(grade);
    if (exist) {
      return exist;
    }
    const interval = this.elapsed_days;
    const retrievability = this.algorithm.forgetting_curve(
      interval,
      this.current.stability
    );
    const next_again = this.next_ds(interval, Rating.Again, retrievability);
    const next_hard = this.next_ds(interval, Rating.Hard, retrievability);
    const next_good = this.next_ds(interval, Rating.Good, retrievability);
    const next_easy = this.next_ds(interval, Rating.Easy, retrievability);
    this.next_interval(next_again, next_hard, next_good, next_easy, interval);
    this.next_state(next_again, next_hard, next_good, next_easy);
    next_again.lapses += 1;
    this.update_next(next_again, next_hard, next_good, next_easy);
    return this.next.get(grade);
  }
  /**
   * Review/New next_interval
   */
  next_interval(next_again, next_hard, next_good, next_easy, interval) {
    let again_interval, hard_interval, good_interval, easy_interval;
    again_interval = this.algorithm.next_interval(
      next_again.stability,
      interval
    );
    hard_interval = this.algorithm.next_interval(next_hard.stability, interval);
    good_interval = this.algorithm.next_interval(next_good.stability, interval);
    easy_interval = this.algorithm.next_interval(next_easy.stability, interval);
    again_interval = Math.min(again_interval, hard_interval);
    hard_interval = Math.max(hard_interval, again_interval + 1);
    good_interval = Math.max(good_interval, hard_interval + 1);
    easy_interval = Math.max(easy_interval, good_interval + 1);
    next_again.scheduled_days = again_interval;
    next_again.due = date_scheduler(this.review_time, again_interval, true);
    next_hard.scheduled_days = hard_interval;
    next_hard.due = date_scheduler(this.review_time, hard_interval, true);
    next_good.scheduled_days = good_interval;
    next_good.due = date_scheduler(this.review_time, good_interval, true);
    next_easy.scheduled_days = easy_interval;
    next_easy.due = date_scheduler(this.review_time, easy_interval, true);
  }
  /**
   * Review/New next_state
   */
  next_state(next_again, next_hard, next_good, next_easy) {
    next_again.state = State.Review;
    next_again.learning_steps = 0;
    next_hard.state = State.Review;
    next_hard.learning_steps = 0;
    next_good.state = State.Review;
    next_good.learning_steps = 0;
    next_easy.state = State.Review;
    next_easy.learning_steps = 0;
  }
  update_next(next_again, next_hard, next_good, next_easy) {
    const item_again = {
      card: next_again,
      log: this.buildLog(Rating.Again)
    };
    const item_hard = {
      card: next_hard,
      log: super.buildLog(Rating.Hard)
    };
    const item_good = {
      card: next_good,
      log: super.buildLog(Rating.Good)
    };
    const item_easy = {
      card: next_easy,
      log: super.buildLog(Rating.Easy)
    };
    this.next.set(Rating.Again, item_again);
    this.next.set(Rating.Hard, item_hard);
    this.next.set(Rating.Good, item_good);
    this.next.set(Rating.Easy, item_easy);
  }
}

class Reschedule {
  fsrs;
  /**
   * Creates an instance of the `Reschedule` class.
   * @param fsrs - An instance of the FSRS class used for scheduling.
   */
  constructor(fsrs) {
    this.fsrs = fsrs;
  }
  /**
   * Replays a review for a card and determines the next review date based on the given rating.
   * @param card - The card being reviewed.
   * @param reviewed - The date the card was reviewed.
   * @param rating - The grade given to the card during the review.
   * @returns A `RecordLogItem` containing the updated card and review log.
   */
  replay(card, reviewed, rating) {
    return this.fsrs.next(card, reviewed, rating);
  }
  /**
   * Processes a manual review for a card, allowing for custom state, stability, difficulty, and due date.
   * @param card - The card being reviewed.
   * @param state - The state of the card after the review.
   * @param reviewed - The date the card was reviewed.
   * @param elapsed_days - The number of days since the last review.
   * @param stability - (Optional) The stability of the card.
   * @param difficulty - (Optional) The difficulty of the card.
   * @param due - (Optional) The due date for the next review.
   * @returns A `RecordLogItem` containing the updated card and review log.
   * @throws Will throw an error if the state or due date is not provided when required.
   */
  handleManualRating(card, state, reviewed, elapsed_days, stability, difficulty, due) {
    if (typeof state === "undefined") {
      throw new FSRSValidationError(
        "reschedule: state is required for manual rating"
      );
    }
    let log;
    let next_card;
    if (state === State.New) {
      log = {
        rating: Rating.Manual,
        state,
        due: due ?? reviewed,
        stability: card.stability,
        difficulty: card.difficulty,
        elapsed_days,
        last_elapsed_days: card.elapsed_days,
        scheduled_days: card.scheduled_days,
        learning_steps: card.learning_steps,
        review: reviewed
      };
      next_card = createEmptyCard(reviewed);
      next_card.last_review = reviewed;
    } else {
      if (typeof due === "undefined") {
        throw new FSRSValidationError(
          "reschedule: due is required for manual rating"
        );
      }
      const scheduled_days = date_diff(due, reviewed, "days");
      log = {
        rating: Rating.Manual,
        state: card.state,
        due: card.last_review || card.due,
        stability: card.stability,
        difficulty: card.difficulty,
        elapsed_days,
        last_elapsed_days: card.elapsed_days,
        scheduled_days: card.scheduled_days,
        learning_steps: card.learning_steps,
        review: reviewed
      };
      next_card = {
        ...card,
        state,
        due,
        last_review: reviewed,
        stability: stability || card.stability,
        difficulty: difficulty || card.difficulty,
        elapsed_days,
        scheduled_days,
        reps: card.reps + 1
      };
    }
    return { card: next_card, log };
  }
  /**
   * Reschedules a card based on its review history.
   *
   * @param current_card - The card to be rescheduled.
   * @param reviews - An array of review history objects.
   * @returns An array of record log items representing the rescheduling process.
   */
  reschedule(current_card, reviews) {
    const collections = [];
    let cur_card = createEmptyCard(current_card.due);
    for (const review of reviews) {
      let item;
      review.review = TypeConvert.time(review.review);
      if (review.rating === Rating.Manual) {
        let interval = 0;
        if (cur_card.state !== State.New && cur_card.last_review) {
          interval = date_diff(review.review, cur_card.last_review, "days");
        }
        item = this.handleManualRating(
          cur_card,
          review.state,
          review.review,
          interval,
          review.stability,
          review.difficulty,
          review.due ? TypeConvert.time(review.due) : void 0
        );
      } else {
        item = this.replay(cur_card, review.review, review.rating);
      }
      collections.push(item);
      cur_card = item.card;
    }

/** learning steps due inside the sitting (minutes away), soonest first */

function choicesFor(word) {

  const seed = [...word.id].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const picks = [];
  for (let i = 0; picks.length < 3 && i < alt.length * 2; i++) {
    const w = alt[(seed + i * 7919) % alt.length];
    if (!picks.includes(w)) picks.push(w);
  }
  const all = [word, ...picks];
  return all.sort((a, b) => ((seed ^ a.id.length * 97) % 7) - ((seed ^ b.id.length * 97) % 7) || a.id.localeCompare(b.id));
}

function attachSwipe(face) {
  let x0 = null;
  let dx = 0;
  face.addEventListener('pointerdown', (e) => {
    x0 = e.clientX;
    dx = 0;
  });
  face.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    face.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
    face.dataset.swipe = dx > 40 ? 'good' : dx < -40 ? 'again' : '';
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    face.style.transform = '';
    if (Math.abs(dx) > 90) {
      if (ctx.prefs.mode === 'choice') next();
      else commit(dx > 0 ? RATINGS.good : RATINGS.again);
    } else face.dataset.swipe = '';
  };
  face.addEventListener('pointerup', end);
  face.addEventListener('pointercancel', end);
}

        const det = el('div', 'kp-detail');
        det.append(el('p', 'kp-def', w.defJa));
        for (const c of w.cards) det.append(el('div', 'kp-ex', sentenceNodes(c, { blank: false, ruby: 'all' }), ...(c.en ? [el('p', 'kp-en', c.en)] : [])));
        if (w.tip) det.append(el('p', 'kp-tip', w.tip));
        rows.append(det);
      }
    }
    if (!rows.childNodes.length) rows.append(el('p', 'kp-sub', '該当する語はありません。'));
  };
  input.addEventListener('input', () => {
    ui.q = input.value;
    draw();
  });
  draw();
  return box;
}

function settingsScreen() {
  const box = el('section', 'kp-settings');
  box.append(topBar('設定', () => go('home')));
  const seg = (title, key, options) => {
    const wrap = el('div', 'kp-field', el('h2', 'kp-h2', title));
    const row = el('div', 'kp-seg');
    for (const [value, label] of options) {
      const b = btn(ctx.prefs[key] === value ? 'is-on' : '', label, () => {
        ctx.prefs = { ...ctx.prefs, [key]: value };
        savePrefs();
        paint();
      }, { 'data-pref': `${key}:${value}` });
      row.append(b);
    }
    wrap.append(row);
    return wrap;
  };
  box.append(seg('一日の新しい文', 'newPerDay', [[5, '5'], [10, '10'], [15, '15'], [20, '20'], [30, '30']]));
  box.append(seg('答え方', 'mode', [['read', '読んで思い出す'], ['self', '穴埋め'], ['choice', '4択']]));
  box.append(seg('ヒント（穴埋め・4択）', 'hint', [['en', '英語'], ['ja', '日本語'], ['none', 'なし']]));
  box.append(seg('ふりがな（問題）', 'furigana', [['tap', 'タップで表示'], ['none', 'なし']]));
  box.append(seg('画面', 'look', [['dark', 'ダーク'], ['light', 'ライト']]));

  const ta = el('textarea', 'kp-backup');
  ta.id = 'kp-backup';
  ta.spellcheck = false;
  const msg = el('p', 'kp-sub');
  box.append(
    el('div', 'kp-field', el('h2', 'kp-h2', 'バックアップ'), el('p', 'kp-sub', '記録はこの端末だけに保存されます。コピーして保管し、別の端末で貼り付けて復元できます。'), ta,
      el('div', 'kp-seg',
        btn('', 'コピー', () => {
          ta.value = JSON.stringify(ctx.state);
          ta.select();
          navigator.clipboard?.writeText(ta.value).then(() => (msg.textContent = 'コピーしました。'), () => (msg.textContent = '選択しました。手動でコピーしてください。'));
        }),
        btn('', '復元', () => {
          try {
            const raw = JSON.parse(ta.value);
            const next = normalizeState(raw, ctx.deck);
            if (!Object.keys(next.cards).length && Object.keys(raw?.cards || {}).length) throw new Error('mismatch');
            ctx.state = next;
            save();
            msg.textContent = '復元しました。';
          } catch {
            msg.textContent = 'このデッキのバックアップではありません。';
          }
        }),
        btn('kp-danger', '記録を消す', (e) => {
          if (e.currentTarget.dataset.arm) {
            ctx.state = emptyState(ctx.deck.id);
            save();
            go('home');
          } else {
            e.currentTarget.dataset.arm = '1';
            e.currentTarget.textContent = 'もう一度押すと消えます';
          }
        }),
      ), msg),
  );
  return box;
}

function onKey(e) {
  if (!ctx?.root?.isConnected || ui.screen !== 'study' || e.target.closest?.('input, textarea')) return;
  if (!ui.revealed && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    if (ctx.prefs.mode !== 'choice') reveal();
  } else if (ui.revealed && ctx.prefs.mode !== 'choice' && ['1', '2', '3', '4'].includes(e.key)) {
    e.preventDefault();
    commit(Number(e.key));
  } else if (ui.revealed && ctx.prefs.mode === 'choice' && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    next();
  } else if (e.key === 'u' && ui.undo) undo();
}
let keyBound = false;

/** the host's entry point */
function ensureCss() {
  if (document.querySelector('style[data-kp], link[data-kp]')) return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = new URL('./player.css', location.href).href;
  link.dataset.kp = '1';
  document.head.append(link);
}

async function render(main, { deckId, storage = window.localStorage, onLeave } = {}) {
  ensureCss();
  const root = el('div', 'kp');
  root.append(el('p', 'kp-sub', '読み込み中…'));
  main.append(root);
  const { deck, index } = await loadDeck(deckId);
  const sameDeck = ctx?.deck?.id === deck.id;
  ctx = {
    root,
    deck,
    index,
    storage,
    onLeave,
    state: normalizeState(readJson(storage, stateKey(deck.id)), deck),
    prefs: { ...PREFS_DEFAULT, ...(readJson(storage, prefsKey) || {}) },
  };
  if (!sameDeck) {
    ui.screen = 'home';
    ui.queue = [];
  }
  if (!keyBound) {
    document.addEventListener('keydown', onKey);
    keyBound = true;
  }
  paint();
}

/** due count for a deck chooser, without rendering anything */
async function summary(deckId, storage = window.localStorage) {
  const { deck } = await loadDeck(deckId);
  const state = normalizeState(readJson(storage, stateKey(deck.id)), deck);
  const prefs = { ...PREFS_DEFAULT, ...(readJson(storage, prefsKey) || {}) };
  const q = buildQueue(deck, state, new Date(), prefs.newPerDay);
  return { due: q.due.length, fresh: q.fresh.length, words: deck.words.length, titleJa: deck.titleJa, titleEn: deck.titleEn };
}

render(document.getElementById('app'), { deckId: 'kotoba-mine' });
</script>
