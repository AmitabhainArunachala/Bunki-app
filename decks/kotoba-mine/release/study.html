/* 集中道場 deck player — one column, dark by default, high contrast.
 * Colour carries meaning and nothing else:

  --kp-panel: #121922;
  --kp-panel-2: #18212c;
  --kp-ink: #f3f7fb;
  --kp-ink-2: #b7c3cf;
  --kp-mute: #7f8d9b;
  --kp-line: #263240;
  --kp-cyan: #3fd0ff;
  --kp-cyan-wash: rgba(63, 208, 255, 0.14);
  --kp-red: #ff5d6c;
  --kp-amber: #ffb648;
  --kp-green: #3ee391;
  --kp-violet: #a58bff;
  --kp-jp: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  --kp-num: ui-monospace, 'SF Mono', 'Menlo', monospace;
  color-scheme: dark;
  background: var(--kp-bg);

  min-height: 100vh;
  box-sizing: border-box;
}
.kp[data-look='light'] {
  --kp-bg: #f5f8fb;
  --kp-panel: #ffffff;
  --kp-panel-2: #eef3f7;
  --kp-ink: #0b1520;
  --kp-ink-2: #32424f;
  --kp-mute: #5d6c79;
  --kp-line: #d3dde6;
  --kp-cyan: #0074b8;
  --kp-cyan-wash: rgba(0, 116, 184, 0.1);
  --kp-red: #d22f43;
  --kp-amber: #b86e00;
  --kp-green: #0e8f53;
  --kp-violet: #6a4fd8;
  color-scheme: light;
}
.kp * { box-sizing: border-box; }
.kp section { max-width: 40rem; margin: 0 auto; display: grid; gap: 16px; }
.kp button { font: inherit; color: inherit; cursor: pointer; }
.kp button:focus-visible, .kp input:focus-visible, .kp textarea:focus-visible { outline: 2px solid var(--kp-cyan); outline-offset: 2px; }

.kp-top { display: flex; align-items: center; gap: 12px; min-height: 44px; }

.kp-tile span { color: var(--kp-ink-2); }

.kp-groups { display: grid; gap: 6px; }

.kp-bar .kp-c-learn { background: var(--kp-amber); }

.kp-foot { display: flex; gap: 20px; justify-content: center; }
.kp-link { background: none; border: 0; color: var(--kp-ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; padding: 8px; }

.kp-card[data-swipe='good'] { box-shadow: 0 0 0 2px var(--kp-green); }

.kp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kp-chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--kp-line); color: var(--kp-ink-2); white-space: nowrap; }

.kp-lv3 .kp-lvchip { color: var(--kp-violet); border-color: currentColor; }
.kp-st-new { color: var(--kp-cyan); border-color: currentColor; }
.kp-st-learn { color: var(--kp-amber); border-color: currentColor; }
.kp-st-grow { color: var(--kp-cyan); border-color: currentColor; }
.kp-st-known { color: var(--kp-green); border-color: currentColor; }
.kp-st-hard { color: var(--kp-red); border-color: currentColor; }

.kp-sentence { margin: 0; font-size: clamp(22px, 6.2vw, 30px); line-height: 2.05; font-weight: 500; letter-spacing: 0.02em; color: var(--kp-ink); overflow-wrap: anywhere; }

.kp-reading { font-size: 18px; color: var(--kp-ink-2); }

.kp-verdict { margin: 0; text-align: center; font-size: 18px; font-weight: 700; }

たほうがいい。","form":"利回り","en":"Rental yields on central Tokyo condos are low, so if you invest, you should also compare properties outside the big cities.","ruby":[["都心","としん"],["のマンションは",""],["家賃","やちん"],["収入","しゅうにゅう"],["の",""],["利回り","りまわり",1],["が",""],["低","ひく"],["いため、",""],["投資","とうし"],["するなら",""],["地方","ちほう"],["の",""],["物件","ぶっけん"],["も",""],["比","くら"],["べたほうがいい。",""]]}],"tip":"When bond prices fall, their 利回り goes up."},{"id":"km-105","group":"m01-money","term":"等比","reading":"とうひ","meaning":"geometric (equal ratio)","defJa":"となり合う数の比がいつも同じこと。","pos":"noun","cards":[{"id":"km-105-1","lv":1,"ja":"2、4、8、16は等比数列だ。","form":"等比","en":"2, 4, 8, 16 is a geometric sequence.","ruby":[["2、4、8、16は",""],["等比","とうひ",1],["数列","すうれつ"],["だ。",""]]},{"id":"km-105-2","lv":2,"ja":"毎回同じ数を掛けていく数列を等比数列という。","form":"等比","en":"A sequence where you keep multiplying by the same number is called a geometric sequence.","ruby":[["毎回","まいかい"],["同","おな"],["じ",""],["数","かず"],["を",""],["掛","か"],["けていく",""],["数列","すうれつ"],["を",""],["等比","とうひ",1],["数列","すうれつ"],["という。",""]]},{"id":"km-105-3","lv":3,"ja":"複利でお金が増えていく様子は、高校数学で習う等比数列の考え方で説明できる。","form":"等比","en":"How money grows with compound interest can be explained with the geometric sequences you learn in high school math.","ruby":[["複利","ふくり"],["でお",""],["金","かね"],["が",""],["増","ふ"],["えていく",""],["様子","ようす"],["は、",""],["高校","こうこう"],["数学","すうがく"],["で",""],["習","なら"],["う",""],["等比","とうひ",1],["数列","すうれつ"],["の",""],["考","かんが"],["え",""],["方","かた"],["で",""],["説明","せつめい"],["できる。",""]]}],"tip":"Almost always met in 等比数列; the arithmetic version is 等差数列."},{"id":"km-106","group":"m01-money","term":"数列","reading":"すうれつ","meaning":"sequence of numbers","defJa":"決まった順に数を並べたもの。","pos":"noun","cards":[{"id":"km-106-1","lv":1,"ja":"数学の授業で数列を習った。","form":"数列","en":"We learned about sequences in math class.","ruby":[["数学","すうがく"],["の",""],["授業","じゅぎょう"],["で",""],["数列","すうれつ",1],["を",""],["習","なら"],["った。",""]]},{"id":"km-106-2","lv":2,"ja":"1、3、5、7と続く数列の次の数は9だ。","form":"数列","en":"The next number in the sequence 1, 3, 5, 7 is 9.","ruby":[["1、3、5、7と",""],["続","つづ"],["く",""],["数列","すうれつ",1],["の",""],["次","つぎ"],["の",""],["数","かず"],["は9だ。",""]]},{"id":"km-106-3","lv":3,"ja":"入社試験に数列の規則を見つける問題が出たので、高校の数学を思い出しながら解いた。","form":"数列","en":"The company's entrance test had a question on finding the rule in a number sequence, so I solved it by recalling high school math.","ruby":[["入社","にゅうしゃ"],["試験","しけん"],["に",""],["数列","すうれつ",1],["の",""],["規則","きそく"],["を",""],["見","み"],["つける",""],["問題","もんだい"],["が",""],["出","で"],["たので、",""],["高校","こうこう"],["の",""],["数学","すうがく"],["を",""],["思","おも"],["い",""],["出","だ"],["しながら",""],["解","と"],["いた。",""]]}]},{"id":"km-107","group":"m01-money","term":"返済","reading":"へんさい","meaning":"repayment","defJa":"借りたお金を返すこと。","pos":"noun","cards":[{"id":"km-107-1","lv":1,"ja":"毎月ローンを返済している。","form":"返済","en":"I pay back my loan every month.","ruby":[["毎月","まいつき"],["ローンを",""],["返済","へんさい",1],["している。",""]]},{"id":"km-107-2","lv":2,"ja":"奨学金の返済があと五年残っている。","form":"返済","en":"I still have five more years of student loan repayments.","ruby":[["奨学","しょうがく"],["金","きん"],["の",""],["返済","へんさい",1],["があと",""],["五","ご"],["年","ねん"],["残","のこ"],["っている。",""]]},{"id":"km-107-3","lv":3,"ja":"住宅ローンの返済が苦しくなったので、銀行に相談して月々の支払いを減らしてもらった。","form":"返済","en":"Paying off my mortgage got hard, so I talked to the bank and had my monthly payments lowered.","ruby":[["住宅","じゅうたく"],["ローンの",""],["返済","へんさい",1],["が",""],["苦","くる"],["しくなったので、",""],["銀行","ぎんこう"],["に",""],["相談","そうだん"],["して",""],["月々","つきづき"],["の",""],["支払","しはら"],["いを",""],["減","へ"],["らしてもらった。",""]]}],"tip":"A refund in a shop is 返金, not 返済."},{"id":"km-108","group":"m01-money","term":"預金","reading":"よきん","meaning":"bank deposit","defJa":"銀行などに預けたお金。","pos":"noun","cards":[{"id":"km-108-1","lv":1,"ja":"ATMで預金を下ろした。","form":"預金","en":"I withdrew some money from my account at an ATM.","ruby":[["ATMで",""],["預金","よきん",1],["を",""],["下","お"],["ろした。",""]]},{"id":"km-108-2","lv":2,"ja":"毎月の給料の一部を定期預金にしている。","form":"預金","en":"Every month I put part of my salary into a fixed-term deposit.","ruby":[["毎月","まいつき"],["の",""],["給料","きゅうりょう"],["の",""],["一部","いちぶ"],["を",""],["定期","ていき"],["預金","よきん",1],["にしている。",""]]},{"id":"km-108-3","lv":3,"ja":"金利がとても低いので、預金をしておくだけではお金はなかなか増えない。","form":"預金","en":"Interest rates are very low, so money hardly grows if you just keep it in a bank account.","ruby":[["金利","きんり"],["がとても",""],["低","ひく"],["いので、",""],["預金","よきん",1],["をしておくだけではお",""],["金","かね"],["はなかなか",""],["増","ふ"],["えない。",""]]}],"tip":"預金を下ろす means to withdraw money from your account."},{"id":"km-109","group":"m01-money","term":"金利","reading":"きんり","meaning":"interest rate","defJa":"お金を貸し借りするときの利息の割合。","pos":"noun","cards":[{"id":"km-109-1","lv":1,"ja":"住宅ローンの金利が上がった。","form":"金利","en":"Interest rates on home loans have gone up.","ruby":[["住宅","じゅうたく"],["ローンの",""],["金利","きんり",1],["が",""],["上","あ"],["がった。",""]]},{"id":"km-109-2","lv":2,"ja":"金利が低いうちに家を買おうと考えている。","form":"金利","en":"We're thinking of buying a house while interest rates are low.","ruby":[["金利","きんり",1],["が",""],["低","ひく"],["いうちに",""],["家","いえ"],["を",""],["買","か"],["おうと",""],["考","かんが"],["えている。",""]]},{"id":"km-109-3","lv":3,"ja":"中央銀行が金利を引き上げると、お金を借りる人が減って景気が冷えやすい。","form":"金利","en":"When the central bank raises interest rates, fewer people borrow and the economy tends to cool down.","ruby":[["中央","ちゅうおう"],["銀行","ぎんこう"],["が",""],["金利","きんり",1],["を",""],["引","ひ"],["き",""],["上","あ"],["げると、お",""],["金","かね"],["を",""],["借","か"],["りる",""],["人","ひと"],["が",""],["減","へ"],["って",""],["景気","けいき"],["が",""],["冷","ひ"],["えやすい。",""]]}],"tip":"金利 is the rate; the money you actually pay or receive is 利息."},{"id":"km-110","group":"m01-money","term":"利率","reading":"りりつ","meaning":"interest rate (formal)","defJa":"元金に対する利息の割合。","pos":"noun","cards":[{"id":"km-110-1","lv":1,"ja":"この預金の利率は年1％です。","form":"利率","en":"The interest rate on this deposit is 1% a year.","ruby":[["この",""],["預金","よきん"],["の",""],["利率","りりつ",1],["は",""],["年","ねん"],["1％です。",""]]},{"id":"km-110-2","lv":2,"ja":"契約書には、借りたお金の利率がはっきり書いてある。","form":"利率","en":"The contract clearly states the interest rate on the money borrowed.","ruby":[["契約","けいやく"],["書","しょ"],["には、",""],["借","か"],["りたお",""],["金","かね"],["の",""],["利率","りりつ",1],["がはっきり",""],["書","か"],["いてある。",""]]},{"id":"km-110-3","lv":3,"ja":"年5％の利率で10万円を1年間預けると、利息は5000円になる。","form":"利率","en":"If you deposit 100,000 yen for one year at an interest rate of 5%, you get 5,000 yen in interest.","ruby":[["年","ねん"],["5％の",""],["利率","りりつ",1],["で10",""],["万","まん"],["円","えん"],["を1",""],["年間","ねんかん"],["預","あず"],["けると、",""],["利息","りそく"],["は5000",""],["円","えん"],["になる。",""]]}],"tip":"Common in contracts and math problems; in conversation people usually say 金利."},{"id":"km-111","group":"m01-money","term":"初項","reading":"しょこう","meaning":"first term of a sequence","defJa":"数列のいちばん最初の数。","pos":"noun","cards":[{"id":"km-111-1","lv":1,"ja":"この数列の初項は3だ。","form":"初項","en":"The first term of this sequence is 3.","ruby":[["この",""],["数列","すうれつ"],["の",""],["初項","しょこう",1],["は3だ。",""]]},{"id":"km-111-2","lv":2,"ja":"初項が2、公比が3の等比数列を書き出してみよう。","form":"初項","en":"Let's write out the geometric sequence with first term 2 and common ratio 3.","ruby":[["初項","しょこう",1],["が2、",""],["公比","こうひ"],["が3の",""],["等比","とうひ"],["数列","すうれつ"],["を",""],["書","か"],["き",""],["出","だ"],["してみよう。",""]]},{"id":"km-111-3","lv":3,"ja":"等差数列の問題では、まず初項と公差を求めれば、何番目の項でもすぐに計算できる。","form":"初項","en":"In arithmetic sequence problems, once you find the first term and the common difference, you can quickly work out any term.","ruby":[["等差","とうさ"],["数列","すうれつ"],["の",""],["問題","もんだい"],["では、まず",""],["初項","しょこう",1],["と",""],["公差","こうさ"],["を",""],["求","もと"],["めれば、",""],["何","なん"],["番","ばん"],["目","め"],["の",""],["項","こう"],["でもすぐに",""],["計算","けいさん"],["できる。",""]]}],"tip":"A math-class word; it usually comes with 公比 (common ratio) or 公差 (common difference)."},{"id":"km-112","group":"m01-money","term":"運用","reading":"うんよう","meaning":"managing, putting to use","defJa":"お金や制度をうまく使って動かすこと。","pos":"noun","cards":[{"id":"km-112-1","lv":1,"ja":"退職金を運用して増やしたい。","form":"運用","en":"I want to invest my retirement money and make it grow.","ruby":[["退職","たいしょく"],["金","きん"],["を",""],["運用","うんよう",1],["して",""],["増","ふ"],["やしたい。",""]]},{"id":"km-112-2","lv":2,"ja":"新しいルールは来月から運用が始まる予定だ。","form":"運用","en":"The new rules are due to be put into practice from next month.","ruby":[["新","あたら"],["しいルールは",""],["来月","らいげつ"],["から",""],["運用","うんよう",1],["が",""],["始","はじ"],["まる",""],["予定","よてい"],["だ。",""]]},{"id":"km-112-3","lv":3,"ja":"年金の積立金を株式で運用しているため、株価が大きく下がると評価額も減ってしまう。","form":"運用","en":"Because pension reserves are invested in stocks, their value drops when share prices fall sharply.","ruby":[["年金","ねんきん"],["の",""],["積立","つみたて"],["金","きん"],["を",""],["株式","かぶしき"],["で",""],["運用","うんよう",1],["しているため、",""],["株価","かぶか"],["が",""],["大","おお"],["きく",""],["下","さ"],["がると",""],["評価","ひょうか"],["額","がく"],["も",""],["減","へ"],["ってしまう。",""]]}],"tip":"Two common uses: 資産運用 (investing money) and 制度の運用 (running a system)."},{"id":"km-113","group":"m01-money","term":"利息","reading":"りそく","meaning":"interest (money)","defJa":"貸し借りしたお金に上乗せされるお金。","pos":"noun","cards":[{"id":"km-113-1","lv":1,"ja":"友だちから利息なしでお金を借りた。","form":"利息","en":"I borrowed money from a friend with no interest.","ruby":[["友","とも"],["だちから",""],["利息","りそく",1],["なしでお",""],["金","かね"],["を",""],["借","か"],["りた。",""]]},{"id":"km-113-2","lv":2,"ja":"一年間預けても、利息は数十円しかつかなかった。","form":"利息","en":"Even after a year in the bank, I only earned a few dozen yen in interest.","ruby":[["一","いち"],["年間","ねんかん"],["預","あず"],["けても、",""],["利息","りそく",1],["は",""],["数十","すうじゅう"],["円","えん"],["しかつかなかった。",""]]},{"id":"km-113-3","lv":3,"ja":"カードの支払いを分割にすると利息がかかるので、できるだけ一回払いにしている。","form":"利息","en":"Paying by card in installments adds interest, so I try to pay in a single payment.","ruby":[["カードの",""],["支払","しはら"],["いを",""],["分割","ぶんかつ"],["にすると",""],["利息","りそく",1],["がかかるので、できるだけ",""],["一","いち"],["回","かい"],["払","はら"],["いにしている。",""]]}]},{"id":"km-114","group":"m01-money","term":"元金","reading":"がんきん","meaning":"principal","defJa":"利息がつく前の、もとのお金。","pos":"noun","cards":[{"id":"km-114-1","lv":1,"ja":"毎月、利息と元金を少しずつ返している。","form":"元金","en":"Every month I pay back a little interest and principal.","ruby":[["毎月","まいつき"],["、",""],["利息","りそく"],["と",""],["元金","がんきん",1],["を",""],["少","すこ"],["しずつ",""],["返","かえ"],["している。",""]]},{"id":"km-114-2","lv":2,"ja":"元金が大きいほど、つく利息も多くなる。","form":"元金","en":"The bigger the principal, the more interest it earns.","ruby":[["元金","がんきん",1],["が",""],["大","おお"],["きいほど、つく",""],["利息","りそく"],["も",""],["多","おお"],["くなる。",""]]},{"id":"km-114-3","lv":3,"ja":"最初の数年は返済の多くが利息に回るため、借りた元金はなかなか減らない。","form":"元金","en":"In the first few years most of each payment goes to interest, so the principal you borrowed barely goes down.","ruby":[["最初","さいしょ"],["の",""],["数","すう"],["年","ねん"],["は",""],["返済","へんさい"],["の",""],["多","おお"],["くが",""],["利息","りそく"],["に",""],["回","まわ"],["るため、",""],["借","か"],["りた",""],["元金","がんきん",1],["はなかなか",""],["減","へ"],["らない。",""]]}],"tip":"Also read もときん, but がんきん is the standard reading in banking."},{"id":"km-115","group":"m01-money","term":"単利","reading":"たんり","meaning":"simple interest","defJa":"最初のお金だけに利息をつける計算。","pos":"noun","cards":[{"id":"km-115-1","lv":1,"ja":"この預金は単利で計算される。","form":"単利","en":"Interest on this deposit is calculated as simple interest.","ruby":[["この",""],["預金","よきん"],["は",""],["単利","たんり",1],["で",""],["計算","けいさん"],["される。",""]]},{"id":"km-115-2","lv":2,"ja":"単利だと、毎年もらえる利息の額は変わらない。","form":"単利","en":"With simple interest, the amount you receive each year stays the same.","ruby":[["単利","たんり",1],["だと、",""],["毎年","まいとし"],["もらえる",""],["利息","りそく"],["の",""],["額","がく"],["は",""],["変","か"],["わらない。",""]]},{"id":"km-115-3","lv":3,"ja":"単利と複利の違いは最初の数年では小さいが、三十年たつと大きな差になる。","form":"単利","en":"The difference between simple and compound interest is small in the first few years, but after thirty years it becomes large.","ruby":[["単利","たんり",1],["と",""],["複利","ふくり"],["の",""],["違 。","form":"貿易摩擦","en":"Trade friction between Japan and the US grew intense.","ruby":[["日米","にちべい"],["の",""],["貿易摩擦","ぼうえきまさつ",1],["が",""],["激","はげ"],["しくなった。",""]]},{"id":"km-182-2","lv":2,"ja":"1980年代、日本車の輸出が増えてアメリカとの貿易摩擦が起きた。","form":"貿易摩擦","en":"In the 1980s, rising exports of Japanese cars caused trade friction with America.","ruby":[["1980",""],["年","ねん"],["代","だい"],["、",""],["日本","にっぽん"],["車","しゃ"],["の",""],["輸出","ゆしゅつ"],["が",""],["増","ふ"],["えてアメリカとの",""],["貿易摩擦","ぼうえきまさつ",1],["が",""],["起","お"],["きた。",""]]},{"id":"km-182-3","lv":3,"ja":"関税の引き上げが続けば貿易摩擦がさらに深まり、両国の企業が損をすることになる。","form":"貿易摩擦","en":"If tariffs keep going up, trade friction will deepen and companies in both countries will lose out.","ruby":[["関税","かんぜい"],["の",""],["引","ひ"],["き",""],["上","あ"],["げが",""],["続","つづ"],["けば",""],["貿易摩擦","ぼうえきまさつ",1],["がさらに",""],["深","ふか"],["まり、",""],["両国","りょうこく"],["の",""],["企業","きぎょう"],["が",""],["損","そん"],["をすることになる。",""]]}]},{"id":"km-183","group":"m02-hegemony","term":"由々しき","reading":"ゆゆしき","meaning":"grave, serious","defJa":"放っておけないほど重大な。","pos":"expression","cards":[{"id":"km-183-1","lv":1,"ja":"食品の偽装は由々しき問題だ。","form":"由々しき","en":"Food mislabeling is a grave problem.","ruby":[["食品","しょくひん"],["の",""],["偽装","ぎそう"],["は",""],["由々しき","ゆゆしき",1],["問題","もんだい"],["だ。",""]]},{"id":"km-183-2","lv":2,"ja":"若者の投票率が下がり続けているのは、由々しき事態だ。","form":"由々しき","en":"The steady fall in young people's voter turnout is a serious situation.","ruby":[["若者","わかもの"],["の",""],["投票","とうひょう"],["率","りつ"],["が",""],["下","さ"],["がり",""],["続","つづ"],["けているのは、",""],["由々しき","ゆゆしき",1],["事態","じたい"],["だ。",""]]},{"id":"km-183-3","lv":3,"ja":"機密情報が外部に漏れていたことを受け、大臣は国の安全を揺るがす由々しき事態だと述べた。","form":"由々しき","en":"After classified information was found to have leaked, the minister called it a grave situation that threatens national security.","ruby":[["機密","きみつ"],["情報","じょうほう"],["が",""],["外部","がいぶ"],["に",""],["漏","も"],["れていたことを",""],["受","う"],["け、",""],["大臣","だいじん"],["は",""],["国","くに"],["の",""],["安全","あんぜん"],["を",""],["揺","ゆ"],["るがす",""],["由々しき","ゆゆしき",1],["事態","じたい"],["だと",""],["述","の"],["べた。",""]]}],"tip":"Stiff and formal; it is only used before a noun, as in 由々しき事態."},{"id":"km-186","group":"m02-hegemony","term":"協定","reading":"きょうてい","meaning":"agreement, pact","defJa":"国や団体が話し合って決めた約束。","pos":"noun","cards":[{"id":"km-186-1","lv":1,"ja":"両国は自由貿易協定を結んだ。","form":"協定","en":"The two countries signed a free trade agreement.","ruby":[["両国","りょうこく"],["は",""],["自由","じゆう"],["貿易","ぼうえき"],["協定","きょうてい",1],["を",""],["結","むす"],["んだ。",""]]},{"id":"km-186-2","lv":2,"ja":"漁業協定によって、この海で取れる魚の量が決められている。","form":"協定","en":"A fisheries agreement sets how many fish can be caught in this sea.","ruby":[["漁業","ぎょぎょう"],["協定","きょうてい",1],["によって、この",""],["海","うみ"],["で",""],["取","と"],["れる",""],["魚","さかな"],["の",""],["量","りょう"],["が",""],["決","き"],["められている。",""]]},{"id":"km-186-3","lv":3,"ja":"1986年の日米半導体協定で、日本は外国製の半導体をもっと買うよう求められた。","form":"協定","en":"Under the 1986 US-Japan Semiconductor Agreement, Japan was asked to buy more foreign-made chips.","ruby":[["1986",""],["年","ねん"],["の",""],["日米","にちべい"],["半","はん"],["導体","どうたい"],["協定","きょうてい",1],["で、",""],["日本","にっぽん"],["は",""],["外国","がいこく"],["製","せい"],["の",""],["半","はん"],["導体","どうたい"],["をもっと",""],["買","か"],["うよう",""],["求","もと"],["められた。",""]]}],"tip":"Used between countries or organizations; a private deal between people is 約束 or 契約."},{"id":"km-188","group":"m02-hegemony","term":"財閥","reading":"ざいばつ","meaning":"family-run conglomerate","defJa":"一族が多くの会社を支配する企業グループ。","pos":"noun","cards":[{"id":"km-188-1","lv":1,"ja":"戦後、日本の財閥は解体された。","form":"財閥","en":"After the war, Japan's zaibatsu were broken up.","ruby":[["戦後","せんご"],["、",""],["日本","にっぽん"],["の",""],["財閥","ざいばつ",1],["は",""],["解体","かいたい"],["された。",""]]},{"id":"km-188-2","lv":2,"ja":"三井や三菱は、もともと財閥として大きくなった企業だ。","form":"財閥","en":"Mitsui and Mitsubishi are companies that first grew big as zaibatsu.","ruby":[["三井","みつい"],["や",""],["三菱","みつびし"],["は、もともと",""],["財閥","ざいばつ",1],["として",""],["大","おお"],["きくなった",""],["企業","きぎょう"],["だ。",""]]},{"id":"km-188-3","lv":3,"ja":"韓国では財閥が経済の大部分を握っているため、大企業と中小企業の格差がよく問題になる。","form":"財閥","en":"In South Korea the chaebol control much of the economy, so the gap between big and small companies is often an issue.","ruby":[["韓国","かんこく"],["では",""],["財閥","ざいばつ",1],["が",""],["経済","けいざい"],["の",""],["大","だい"],["部分","ぶぶん"],["を",""],["握","にぎ"],["っているため、",""],["大","だい"],["企業","きぎょう"],["と",""],["中","ちゅう"],["小","しょう"],["企業","きぎょう"],["の",""],["格差","かくさ"],["がよく",""],["問題","もんだい"],["になる。",""]]}],"tip":"Korean chaebol is the same word, so 韓国の財閥 is how you say it in Japanese."},{"id":"km-189","group":"m02-hegemony","term":"制圧","reading":"せいあつ","meaning":"bringing under control","defJa":"力で相手をおさえて支配すること。","pos":"noun","cards":[{"id":"km-189-1","lv":1,"ja":"警察が犯人を制圧した。","form":"制圧","en":"The police subdued the suspect.","ruby":[["警察","けいさつ"],["が",""],["犯人","はんにん"],["を",""],["制圧","せいあつ",1],["した。",""]]},{"id":"km-189-2","lv":2,"ja":"軍は三日間の戦闘で首都を制圧した。","form":"制圧","en":"The army took control of the capital after three days of fighting.","ruby":[["軍","ぐん"],["は",""],["三","みっ"],["日間","かかん"],["の",""],["戦闘","せんとう"],["で",""],["首都","しゅと"],["を",""],["制圧","せいあつ",1],["した。",""]]},{"id":"km-189-3","lv":3,"ja":"前半から相手の中盤を制圧したことで、チームは何度もゴールのチャンスを作れた。","form":"制圧","en":"By controlling the other side's midfield from the first half, the team created many scoring chances.","ruby":[["前半","ぜんはん"],["から",""],["相手","あいて"],["の",""],["中盤","ちゅうばん"],["を",""],["制圧","せいあつ",1],["したことで、チームは",""],["何","なん"],["度","ど"],["もゴールのチャンスを",""],["作","つく"],["れた。",""]]}],"tip":"A military and police word, also used in sports for dominating the game."},{"id":"km-190","group":"m02-hegemony","term":"決裂","reading":"けつれつ","meaning":"breakdown of talks","defJa":"話し合いがまとまらずに終わること。","pos":"noun","cards":[{"id":"km-190-1","lv":1,"ja":"給料をめぐる交渉が決裂した。","form":"決裂","en":"Wage negotiations broke down.","ruby":[["給料","きゅうりょう"],["をめぐる",""],["交渉","こうしょう"],["が",""],["決裂","けつれつ",1],["した。",""]]},{"id":"km-190-2","lv":2,"ja":"両国の首脳会談 nics makers pulled out of the TV business one after another.","ruby":[["中国","ちゅうごく"],["や",""],["韓国","かんこく"],["のメーカーに",""],["追い上げられ","おいあげられ",1],["、",""],["日本","にっぽん"],["の",""],["家電","かでん"],["メーカーは",""],["次々","つぎつぎ"],["とテレビ",""],["事業","じぎょう"],["から",""],["撤退","てったい"],["した。",""]]}],"tip":"The noun 追い上げ is very common in sports commentary."},{"id":"km-201","group":"m02-hegemony","term":"劣勢","reading":"れっせい","meaning":"losing position","defJa":"相手より力が弱く、不利な立場。","pos":"noun","cards":[{"id":"km-201-1","lv":1,"ja":"試合は前半から劣勢だった。","form":"劣勢","en":"We were on the back foot from the first half.","ruby":[["試合","しあい"],["は",""],["前半","ぜんはん"],["から",""],["劣勢","れっせい",1],["だった。",""]]},{"id":"km-201-2","lv":2,"ja":"選挙戦で劣勢が伝えられる候補が、最後の演説に力を入れている。","form":"劣勢","en":"A candidate reported to be trailing is putting everything into the final campaign speeches.","ruby":[["選挙","せんきょ"],["戦","せん"],["で",""],["劣勢","れっせい",1],["が",""],["伝","つた"],["えられる",""],["候補","こうほ"],["が、",""],["最後","さいご"],["の",""],["演説","えんぜつ"],["に",""],["力","ちから"],["を",""],["入","い"],["れている。",""]]},{"id":"km-201-3","lv":3,"ja":"序盤で劣勢に立たされた棋士は、長考の末に思い切った一手を指して形勢を逆転させた。","form":"劣勢","en":"Put at a disadvantage early on, the shogi player made a bold move after long thought and turned the game around.","ruby":[["序盤","じょばん"],["で",""],["劣勢","れっせい",1],["に",""],["立","た"],["たされた",""],["棋士","きし"],["は、",""],["長考","ちょうこう"],["の",""],["末","すえ"],["に",""],["思","おも"],["い",""],["切","き"],["った",""],["一手","いって"],["を",""],["指","さ"],["して",""],["形勢","けいせい"],["を",""],["逆転","ぎゃくてん"],["させた。",""]]}],"tip":"The opposite is 優勢."},{"id":"km-204","group":"m02-hegemony","term":"牛耳る","reading":"ぎゅうじる","meaning":"to control, to dominate","defJa":"組織の中心に立ち、思いどおりに動かす。","pos":"verb","cards":[{"id":"km-204-1","lv":1,"ja":"一部の幹部が会社を牛耳っている。","form":"牛耳っ","en":"A handful of executives run the company as they please.","ruby":[["一部","いちぶ"],["の",""],["幹部","かんぶ"],["が",""],["会社","かいしゃ"],["を",""],["牛耳っ","ぎゅうじっ",1],["ている。",""]]},{"id":"km-204-2","lv":2,"ja":"この町の議会は、長年一つの一族に をたどった。",""]]}],"tip":"Formal and common in headlines; 凋落の一途をたどる means to keep on declining."},{"id":"km-061","group":"m02-hegemony","term":"命運","reading":"めいうん","meaning":"fate, make-or-break fortune","defJa":"生き残るか滅びるかを決めるめぐり合わせ。","pos":"noun","cards":[{"id":"km-061-1","lv":1,"ja":"次の試合にチームの命運がかかっている。","form":"命運","en":"The team's fate depends on the next game.","ruby":[["次","つぎ"],["の",""],["試合","しあい"],["にチームの",""],["命運","めいうん",1],["がかかっている。",""]]},{"id":"km-061-2","lv":2,"ja":"経営難の会社は、新工場の建設に命運を賭けた。","form":"命運","en":"The struggling company bet its future on building a new factory.","ruby":[["経営","けいえい"],["難","なん"],["の",""],["会社","かいしゃ"],["は、",""],["新","しん"],["工場","こうじょう"],["の",""],["建設","けんせつ"],["に",""],["命運","めいうん",1],["を",""],["賭","か"],["けた。",""]]},{"id":"km-061-3","lv":3,"ja":"交渉が決裂すれば国内工場が閉鎖されるため、従業員の命運は交渉の行方にかかっていた。","form":"命運","en":"If the talks failed, the domestic plant would close, so the workers' future depended on how the negotiations went.","ruby":[["交渉","こうしょう"],["が",""],["決裂","けつれつ"],["すれば",""],["国内","こくない"],["工場","こうじょう"],["が",""],["閉鎖","へいさ"],["されるため、",""],["従業","じゅうぎょう"],["員","いん"],["の",""],["命運","めいうん",1],["は",""],["交渉","こうしょう"],["の",""],["行方","ゆくえ"],["にかかっていた。",""]]}],"tip":"Used in make-or-break situations, as in 命運を賭ける or 命運がかかる."},{"id":"km-167","group":"m02-hegemony","term":"切り札","reading":"きりふだ","meaning":"trump card","defJa":"いざという時に使う、いちばん効く手段。","pos":"noun","cards":[{"id":"km-167-1","lv":1,"ja":"監督は切り札の選手を後半に出した。","form":"切り札","en":"The coach sent on his ace player in the second half.","ruby":[["監督","かんとく"],["は",""],["切り札","きりふだ",1],["の",""],["選手","せんしゅ"],["を",""],["後半","こうはん"],["に",""],["出","だ"],["した。",""]]},{"id":"km-167-2","lv":2,"ja":"政府は景気対策の切り札として、大型の減税を打ち出した。","form":"切り札","en":"The government announced a big tax cut as its trump card for boosting the economy.","ruby":[["政府","せいふ"],["は",""],["景気","けいき"],["対策","たいさく"],["の",""],["切り札","きりふだ",1],["として、",""],["大型","おおがた"],["の",""],["減税","げんぜい"],["を",""],["打","う"],["ち",""],["出","だ"], ],["したものだ。",""]]},{"id":"km-032-3","lv":3,"ja":"チューリング機械で計算できる関数と帰納的関数が一致することは、計算理論の重要な結果の一つだ。","form":"帰納的関数","en":"That the functions computable by a Turing machine are exactly the recursive functions is one of the key results of computability theory.","ruby":[["チューリング",""],["機械","きかい"],["で",""],["計算","けいさん"],["できる",""],["関数","かんすう"],["と",""],["帰納的関数","きのうてきかんすう",1],["が",""],["一致","いっち"],["することは、",""],["計算","けいさん"],["理論","りろん"],["の",""],["重要","じゅうよう"],["な",""],["結果","けっか"],["の",""],["一","ひと"],["つだ。",""]]}],"tip":"A term from mathematical logic; programmers call a function that calls itself 再帰関数."},{"id":"km-033","group":"m09-math","term":"帰納的","reading":"きのうてき","meaning":"inductive","defJa":"いくつもの例から、一般的な結論を出すようす。","pos":"な-adjective","cards":[{"id":"km-033-1","lv":1,"ja":"多くの例から帰納的に結論を出す。","form":"帰納的","en":"We draw a conclusion inductively from many examples.","ruby":[["多","おお"],["くの",""],["例","れい"],["から",""],["帰納的","きのうてき",1],["に",""],["結論","けつろん"],["を",""],["出","だ"],["す。",""]]},{"id":"km-033-2","lv":2,"ja":"帰納的な推論では、たくさんの観察から一般的な法則を導く。","form":"帰納的","en":"In inductive reasoning, you derive a general rule from many observations.","ruby":[["帰納的","きのうてき",1],["な",""],["推論","すいろん"],["では、たくさんの",""],["観察","かんさつ"],["から",""],["一般","いっぱん"],["的","てき"],["な",""],["法則","ほうそく"],["を",""],["導","みちび"],["く。",""]]},{"id":"km-033-3","lv":3,"ja":"帰納的な考え方は便利だが、例外が一つ見つかるだけで結論がくずれることもある。","form":"帰納的","en":"Inductive thinking is useful, but a single exception can be enough to overturn the conclusion.","ruby":[["帰納的","きのうてき",1],["な",""],["考","かんが"],["え",""],["方","かた"],["は",""],["便利","べんり"],["だが、",""],["例外","れいがい"],["が",""],["一","ひと"],["つ",""],["見","み"],["つかるだけで",""],["結論","けつろん"],["がくずれることもある。",""]]}],"tip":"The opposite is 演繹的, deductive; in logic, 帰納的 can also translate recursive."},{"id":"km-034","group":"m09-math","term":"機能的","reading":"きのうてき","meaning":"functional, practical","defJa":"むだがなく、使う目的によく合っているようす。","pos":"な-adjective","cards":[{"id":"km-034-1","lv":1,"ja":"新しい台所はとても機能的だ       el('span', `kp-chip ${stored ? 'kp-st-learn' : 'kp-st-new'}`, stored ? '復習' : '初めて'),
    ),
  );
  face.append(sentenceNodes(card, { blank: !ui.revealed, ruby: ui.revealed ? 'all' : ctx.prefs.furigana === 'tap' ? 'tap' : 'none' }));

  if (!ui.revealed) {
    if (ctx.prefs.hint !== 'none') face.append(el('p', 'kp-hint', ctx.prefs.hint === 'ja' ? word.defJa : word.meaning));
    if (ctx.prefs.mode === 'choice') {
      const opts = el('div', 'kp-choices');
      for (const w of choicesFor(word)) {
        opts.append(
          btn('kp-choice', w.term, () => {
            ui.picked = w.id;
            ui.revealed = true;
            commit(w.id === word.id ? RATINGS.good : RATINGS.again, { stay: true });
          }, { 'data-choice': w.id }),
        );
      }
      face.append(opts);
    } else {
      face.append(el('p', 'kp-taphint', 'タップして答えを見る'));
      face.addEventListener('click', reveal);
    }
  } else {
    face.append(answerBlock(card, word));
  }
  box.append(face);

  if (ui.revealed) {
    if (ctx.prefs.mode === 'choice') {
      const ok = ui.picked === word.id;
      box.append(el('p', `kp-verdict ${ok ? 'kp-c-known' : 'kp-c-hard'}`, ok ? '正解' : `不正解 — 正しくは ${word.term}`));
      box.append(btn('kp-next', '次へ →', next, { id: 'kp-next' }));
    } else {
      box.append(gradeBar(id));
    }
    attachSwipe(face);
  } else if (ctx.prefs.mode === 'choice') {
    box.append(
      btn('kp-reveal', 'わからない', () => {
        ui.picked = null;
        ui.revealed = true;
        commit(RATINGS.again, { stay: true });
      }, { id: 'kp-dunno' }),
    );
  } else {
    box.append(btn('kp-reveal', '答えを見る', reveal, { id: 'kp-reveal' }));
  }
  if (ui.undo) box.append(btn('kp-undo', '↶ ひとつ戻す', undo, { id: 'kp-undo' }));
  return box;
}

function answerBlock(card, word) {
  const a = el('div', 'kp-answer');
  a.lang = 'ja';
  a.append(el('div', 'kp-word', el('span', 'kp-term', word.term), el('span', 'kp-reading', word.reading)));
  a.append(el('p', 'kp-def', word.defJa));
  a.append(el('p', 'kp-meaning', word.meaning));
  a.append(el('p', 'kp-en', card.en));
  if (word.tip) a.append(el('p', 'kp-tip', word.tip));
  return a;
}

function gradeBar(id) {
  const pv = preview(fsrsApi, scheduler, ctx.state, id, new Date());
  const bar = el('div', 'kp-grades');
  const g = (name, label, cls, key) =>
    btn(`kp-grade ${cls}`, [el('b', null, label), el('small', null, fmtWait(pv[name]))], () => commit(RATINGS[name]), {
      id: `kp-grade-${name}`,
      'aria-keyshortcuts': key,
    });
  bar.append(g('again', 'もう一度', 'kp-again', '1'), g('hard', '難しい', 'kp-hard', '2'), g('good', '覚えた', 'kp-good', '3'), g('easy', '簡単', 'kp-easy', '4'));
  bar.append(el('p', 'kp-swipehint', '← もう一度　　スワイプ　　覚えた →'));
  return bar;
}

function reveal() {
  if (ui.revealed) return;
  ui.revealed = true;
  paint();
}

function commit(rating, { stay = false } = {}) {
  const id = ui.queue[ui.pos];
  if (!id) return;
  ui.undo = { state: ctx.state, queue: [...ui.queue], pos: ui.pos, done: ui.done, right: ui.right };
  ctx.state = grade(fsrsApi, scheduler, ctx.state, id, rating, new Date());
  save();
  ui.done++;
  if (rating >= RATINGS.good) ui.right++;
  if (stay) {
    paint();
    return;
  }
  next();
}

function next() {
  const id = ui.queue[ui.pos];
  ui.pos++;
  // a learning step due within the sitting comes back after a few cards
  const s = ctx.state.cards[id];
  if (s && s.state !== 2 && new Date(s.due).getTime() - Date.now() < 15 * MIN) {
    ui.queue.splice(Math.min(ui.queue.length, ui.pos + 4), 0, id);
  }
  resetCard();
  paint();
}

function undo() {
  if (!ui.undo) return;
  ctx.state = ui.undo.state;
  ui.queue = ui.undo.queue;
  ui.pos = ui.undo.pos;
  ui.done = ui.undo.done;
  ui.right = ui.undo.right;
  ui.undo = null;
  resetCard();
  ui.revealed = ctx.prefs.mode !== 'choice';
  save();
  paint();
}

function attachSwipe(face) {
  let x0 = null;
  let dx = 0;
  face.addEventListener('pointerdown', (e) => {
    x0 = e.clientX;
    dx = 0;
  });
  face.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    face.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
    face.dataset.swipe = dx > 40 ? 'good' : dx < -40 ? 'again' : '';
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    face.style.transform = '';
    if (Math.abs(dx) > 90) {
      if (ctx.prefs.mode === 'choice') next();
      else commit(dx > 0 ? RATINGS.good : RATINGS.again);
    } else face.dataset.swipe = '';
  };
  face.addEventListener('pointerup', end);
  face.addEventListener('pointercancel', end);
}

function doneScreen() {
  const box = el('section', 'kp-done');
  box.append(topBar('おつかれさま', () => go('home')));
  const pct = ui.done ? Math.round((ui.right / ui.done) * 100) : 0;
  box.append(el('div', 'kp-tiles', el('div', 'kp-tile kp-c-new', el('b', null, String(ui.done)), el('span', null, '回答')), el('div', 'kp-tile kp-c-known', el('b', null, `${pct}%`), el('span', null, '正解率'))));
  const soon = learningSoon(ctx.deck, ctx.state, new Date(), DAY)[0];
  box.append(el('p', 'kp-sub', soon ? `次の復習は ${fmtWait(Math.max(0, soon.t - Date.now()))}後。` : '今日の分は終わり。また明日。'));
  box.append(btn('kp-start', 'デッキに戻る', () => go('home'), { id: 'kp-home' }));
  return box;
}

function listScreen() {
  const box = el('section', 'kp-list');
  box.append(topBar('語の一覧', () => go('home')));
  const input = el('input', 'kp-search');
  input.type = 'search';
  input.id = 'kp-search';
  input.placeholder = '検索 — 漢字・かな・英語';
  input.value = ui.q;
  box.append(input);
  const rows = el('div', 'kp-rows');
  box.append(rows);
  const draw = () => {
    rows.replaceChildren();
    const k = ui.q.trim().toLowerCase();
    for (const w of ctx.deck.words) {
      if (k && !`${w.term}${w.reading}${w.meaning}${w.defJa}`.toLowerCase().includes(k)) continue;
      const st = wordStatus(w, ctx.state);
      const [label, cls] = STATUS[st.key];
      const row = btn('kp-row', [
        el('span', 'kp-rw', el('b', null, w.term), el('small', null, w.reading)),
        el('span', 'kp-rm', w.meaning),
        el('span', 'kp-dots', w.cards.map((c) => el('i', ctx.state.cards[c.id]?.state === 2 ? 'on' : ctx.state.cards[c.id] ? 'half' : ''))),
        el('span', `kp-chip ${cls}`, label),
      ], () => {
        ui.open = ui.open === w.id ? null : w.id;
        draw();
      });
      rows.append(row);
      if (ui.open === w.id) {
        const det = el('div', 'kp-detail');
        det.append(el('p', 'kp-def', w.defJa));
        for (const c of w.cards) det.append(el('div', 'kp-ex', sentenceNodes(c, { blank: false, ruby: 'all' }), el('p', 'kp-en', c.en)));
        if (w.tip) det.append(el('p', 'kp-tip', w.tip));
        rows.append(det);
      }
    }
    if (!rows.childNodes.length) rows.append(el('p', 'kp-sub', '該当する語はありません。'));
  };
  input.addEventListener('input', () => {
    ui.q = input.value;
    draw();
  });
  draw();
  return box;
}

function settingsScreen() {
  const box = el('section', 'kp-settings');
  box.append(topBar('設定', () => go('home')));
  const seg = (title, key, options) => {
    const wrap = el('div', 'kp-field', el('h2', 'kp-h2', title));
    const row = el('div', 'kp-seg');
    for (const [value, label] of options) {
      const b = btn(ctx.prefs[key] === value ? 'is-on' : '', label, () => {
        ctx.prefs = { ...ctx.prefs, [key]: value };
        savePrefs();
        paint();
      }, { 'data-pref': `${key}:${value}` });
      row.append(b);
    }
    wrap.append(row);
    return wrap;
  };
  box.append(seg('一日の新しい文', 'newPerDay', [[5, '5'], [10, '10'], [15, '15'], [20, '20'], [30, '30']]));
  box.append(seg('答え方', 'mode', [['self', '自分で判定'], ['choice', '4択']]));
  box.append(seg('ヒント', 'hint', [['en', '英語'], ['ja', '日本語'], ['none', 'なし']]));
  box.append(seg('ふりがな（問題）', 'furigana', [['tap', 'タップで表示'], ['none', 'なし']]));
  box.append(seg('画面', 'look', [['dark', 'ダーク'], ['light', 'ライト']]));

  const ta = el('textarea', 'kp-backup');
  ta.id = 'kp-backup';
  ta.spellcheck = false;
  const msg = el('p', 'kp-sub');
  box.append(
    el('div', 'kp-field', el('h2', 'kp-h2', 'バックアップ'), el('p', 'kp-sub', '記録はこの端末だけに保存されます。コピーして保管し、別の端末で貼り付けて復元できます。'), ta,
      el('div', 'kp-seg',
        btn('', 'コピー', () => {
          ta.value = JSON.stringify(ctx.state);
          ta.select();
          navigator.clipboard?.writeText(ta.value).then(() => (msg.textContent = 'コピーしました。'), () => (msg.textContent = '選択しました。手動でコピーしてください。'));
        }),
        btn('', '復元', () => {
          try {
            const raw = JSON.parse(ta.value);
            const next = normalizeState(raw, ctx.deck);
            if (!Object.keys(next.cards).length && Object.keys(raw?.cards || {}).length) throw new Error('mismatch');
            ctx.state = next;
            save();
            msg.textContent = '復元しました。';
          } catch {
            msg.textContent = 'このデッキのバックアップではありません。';
          }
        }),
        btn('kp-danger', '記録を消す', (e) => {
          if (e.currentTarget.dataset.arm) {
            ctx.state = emptyState(ctx.deck.id);
            save();
            go('home');
          } else {
            e.currentTarget.dataset.arm = '1';
            e.currentTarget.textContent = 'もう一度押すと消えます';
          }
        }),
      ), msg),
  );
  return box;
}

function onKey(e) {
  if (!ctx?.root?.isConnected || ui.screen !== 'study' || e.target.closest?.('input, textarea')) return;
  if (!ui.revealed && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    if (ctx.prefs.mode !== 'choice') reveal();
  } else if (ui.revealed && ctx.prefs.mode !== 'choice' && ['1', '2', '3', '4'].includes(e.key)) {
    e.preventDefault();
    commit(Number(e.key));
  } else if (ui.revealed && ctx.prefs.mode === 'choice' && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    next();
  } else if (e.key === 'u' && ui.undo) undo();
}
let keyBound = false;

/** the host's entry point */
function ensureCss() {
  if (document.querySelector('style[data-kp], link[data-kp]')) return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = new URL('./player.css', location.href).href;
  link.dataset.kp = '1';
  document.head.append(link);
}

async function render(main, { deckId, storage = window.localStorage, onLeave } = {}) {
  ensureCss();
  const root = el('div', 'kp');
  root.append(el('p', 'kp-sub', '読み込み中…'));
  main.append(root);
  const { deck, index } = await loadDeck(deckId);
  const sameDeck = ctx?.deck?.id === deck.id;
  ctx = {
    root,
    deck,
    index,
    storage,
    onLeave,
    state: normalizeState(readJson(storage, stateKey(deck.id)), deck),
    prefs: { ...PREFS_DEFAULT, ...(readJson(storage, prefsKey) || {}) },
  };
  if (!sameDeck) {
    ui.screen = 'home';
    ui.queue = [];
  }
  if (!keyBound) {
    document.addEventListener('keydown', onKey);
    keyBound = true;
  }
  paint();
}

/** due count for a deck chooser, without rendering anything */
async function summary(deckId, storage = window.localStorage) {
  const { deck } = await loadDeck(deckId);
  const state = normalizeState(readJson(storage, stateKey(deck.id)), deck);
  const prefs = { ...PREFS_DEFAULT, ...(readJson(storage, prefsKey) || {}) };
  const q = buildQueue(deck, state, new Date(), prefs.newPerDay);
  return { due: q.due.length, fresh: q.fresh.length, words: deck.words.length, titleJa: deck.titleJa, titleEn: deck.titleEn };
}

render(document.getElementById('app'), { deckId: 'kotoba-mine' });
</script>
