name: Nightly full verification
on:
  workflow_dispatch:
  schedule:
    # 02:30 JST; retain the schedule pending the operator's decision.
    - cron: '30 17 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: bunki-nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-battery:
    uses: ./.github/workflows/ci.yml
