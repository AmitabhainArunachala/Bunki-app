# 回廊 corridor gate — the whole-corridor verifier (verify-corridor.mjs) as a
# workflow of its own.
#
# Until 2026-09-21 this suite ran only inside docs/build-evidence/renkan/battery.sh,
# never on a pull request, and two of its breadcrumb assertions had gone stale
# on main after the 2026-09-14 header repair without anyone seeing red. It gets
# its own job rather than a step in reference-libraries.yml because it walks the
# entire corridor in a real browser with screenshots and would not
# fit that workflow's fifteen-minute budget beside the suites already there.
#
# The verifier writes runtime evidence outside the checkout. The walk binds its
# evidence directory explicitly so the current report is retained with screenshots
# (verification-report.json lands there; --report FILE overrides it).
#
# The kotoba-decks job (added 2026-10-04, REFINEMENT.md section 6) holds the
# 言葉の鉱脈 deck repairs in place: it rebuilds both decks from source with the
# committed id manifest frozen, private and public profiles, and fails if any
# tracked output differs (the .apkg files are left out of that diff because
# genanki stamps them with build times); it then runs verify-kotoba-mine.mjs
# and the deck/player unit tests with fugashi installed, so the build checks in
# kotoba-deck-ids.test.mjs run here instead of being skipped as they are in ci.yml.
name: Corridor gate

on:
  pull_request:
    paths:
      - 'prototypes/corridor/**'
      - 'prototypes/corridor/decks/**'
      - 'decks/**'
      - 'tools/kotoba-*'
      - 'tools/sw-shell.test.mjs'
      - 'tools/lint-ui-language.mjs'
      - 'tools/verify-redesign-foundation.mjs'
      - 'tools/verify-redesign-docks.mjs'
      - '.github/workflows/corridor-gate.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/corridor/**'
      - 'prototypes/corridor/decks/**'
      - 'decks/**'
      - 'tools/kotoba-*'
      - 'tools/sw-shell.test.mjs'
      - 'tools/lint-ui-language.mjs'
      - 'tools/verify-redesign-foundation.mjs'
      - 'tools/verify-redesign-docks.mjs'
      - '.github/workflows/corridor-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corridor-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-corridor:
    name: whole-corridor walk (verify-corridor.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Walk the corridor
        env:
          KAIRO_EVIDENCE_DIR: ${{ runner.temp }}/corridor-evidence
        run: node prototypes/corridor/tools/verify-corridor.mjs --shots "$RUNNER_TEMP/corridor-shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corridor-gate-evidence
          path: |
            ${{ runner.temp }}/corridor-shots
            ${{ runner.temp }}/corridor-evidence
          if-no-files-found: ignore

  kotoba-decks:
    name: 言葉の鉱脈 decks (build.py --frozen, verify-kotoba-mine.mjs, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # build.py's own header names these; versions are the ones the committed
      # decks were built with.
      - run: pip install fugashi==1.5.2 unidic-lite==1.0.8 genanki==0.13.1
      - name: Rebuild the decks (private profile, ids frozen)
        run: python3 decks/kotoba-mine/tools/build.py --frozen
      - name: Rebuild the decks (public profile)
        run: python3 decks/kotoba-mine/tools/build.py --frozen --profile public
      - name: Committed deck outputs match the rebuild
        run: |
          git status --short -- prototypes/corridor/decks decks/kotoba-mine
          git diff --stat --exit-code -- prototypes/corridor/decks decks/kotoba-mine ':(exclude)*.apkg'
          untracked=$(git ls-files --others --exclude-standard -- prototypes/corridor/decks decks/kotoba-mine)
          if [ -n "$untracked" ]; then
            echo "build.py wrote files that are not committed:"; echo "$untracked"; exit 1
          fi
      - name: Japanese sense table (test_gloss_ja.py)
        run: python3 decks/kotoba-mine/tools/test_gloss_ja.py
      - name: Passage rules and fields (test_export_mcd.py)
        run: python3 decks/kotoba-mine/tools/test_export_mcd.py
      - name: Segment lexicon (test_segment_overrides.py)
        run: python3 prototypes/corridor/tools/test_segment_overrides.py
      - name: Verify the deck and player (verify-kotoba-mine.mjs)
        run: node prototypes/corridor/tools/verify-kotoba-mine.mjs
      - name: Deck and player unit tests
        run: >-
          npx vitest run
          tools/kotoba-deck-ids.test.mjs
          tools/kotoba-deck-leaks.test.mjs
          tools/kotoba-deck-rights.test.mjs
          tools/kotoba-deck-ruby.test.mjs
          tools/kotoba-player-engine.test.mjs
          tools/sw-shell.test.mjs

  redesign-foundation:
    name: language law and navigation / EN + Japanese room screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build the clean foundation candidate
        run: |
          echo "KAIRO_SITE_DIR=$RUNNER_TEMP/foundation-site" >> "$GITHUB_ENV"
          echo "KAIRO_EVIDENCE_DIR=$RUNNER_TEMP/foundation-evidence" >> "$GITHUB_ENV"
          node scripts/build-corridor-site.mjs --out "$RUNNER_TEMP/foundation-site"
      - name: Inspect every room and retain both language tours at 390 by 844
        run: node tools/lint-ui-language.mjs --screenshots --both-languages
      - name: Exercise navigation, room stamps and docking in both browsers
        run: node tools/verify-redesign-foundation.mjs
      - name: Verify report clearance, live imports and palette targets in both browsers
        run: node tools/verify-redesign-docks.mjs
      - name: Retain the room gallery and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunki-redesign-foundation-EN-JA-390x844
          path: ${{ runner.temp }}/foundation-evidence
          retention-days: 14
          if-no-files-found: error
