# Historical Sites v11 remains downloadable for review. It has no Pages
# permissions, environment or publisher and cannot replace live Corridor.
name: legacy Sites v11 artifact preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-sites-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: historical prototype artifact (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install prototype dependencies
        working-directory: prototypes/bunki-sites-v11
        run: npm ci
      - name: Repair binary public assets from npm sources
        working-directory: prototypes/bunki-sites-v11
        run: node scripts/repair-binary-assets.mjs
      - name: Build static client bundle
        working-directory: prototypes/bunki-sites-v11
        run: ./node_modules/.bin/vite build --config vite.config.harness.mts
      - name: Upload historical preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bunki-sites-v11-static
          path: prototypes/bunki-sites-v11/dist
          retention-days: 7
          if-no-files-found: error
      - name: Report artifact-only result
        run: echo 'Historical Sites v11 artifact attached. This workflow does not deploy; live KAIRO is owned by pages-app.' >> "$GITHUB_STEP_SUMMARY"
