name: pages-preview

# Publishes the client-only static build of the Sites v11 prototype (local
# harness entry) to GitHub Pages so the operator can interact with the
# repaired app on a real phone. Server-backed flows (live feeds, teacher,
# cloud sync) stay stubbed; the app runs in its designed local/offline mode.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/sites-v11-interaction-recovery

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install prototype dependencies
        working-directory: prototypes/bunki-sites-v11
        run: npm ci
      - name: Repair binary public assets from npm sources
        working-directory: prototypes/bunki-sites-v11
        run: node scripts/repair-binary-assets.mjs
      - name: Build static client bundle
        working-directory: prototypes/bunki-sites-v11
        run: ./node_modules/.bin/vite build --config vite.config.harness.mts
      - name: Upload build as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunki-sites-v11-static
          path: prototypes/bunki-sites-v11/dist
      # Pages cannot be enabled by the workflow token on this private repo
      # (configure-pages: "Resource not accessible by integration"). Attempt
      # it, but treat unavailability as a skip, not a failure — the build
      # above is the verified deliverable either way. Once Pages is enabled
      # in Settings → Pages (source: GitHub Actions), this deploys for real.
      - id: cfg
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/bunki-sites-v11/dist
      - id: deployment
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Report Pages availability
        run: |
          if [ "${{ steps.cfg.outcome }}" = "success" ]; then
            echo "### Pages deployed: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Pages unavailable on this repository" >> "$GITHUB_STEP_SUMMARY"
            echo "Build succeeded and is attached as the *bunki-sites-v11-static* artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "To get a live URL: Settings → Pages → Source: GitHub Actions (requires a public repo or a plan with private Pages), then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
