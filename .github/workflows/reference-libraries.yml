name: Reference libraries

on:
  pull_request:
    paths:
      - 'prototypes/corridor/**'
      - 'tools/*reference*.mjs'
      - 'corpus/datasets/kanji/kanken.jsonl'
      - 'prototypes/bunki-sites-v11/public/kotobako-static.json'
      - 'prototypes/drift/data/wbig.json'
      - 'apps/app/src/data/generated/drift-words.json'
      - 'apps/app/src/data/generated/drift-kanji.json'
      - 'corpus/samples/jmdict/kanjidic_sample.jsonl'
      - 'tools/fixtures/reference/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages-app.yml'
      - '.github/workflows/reference-libraries.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/corridor/**'
      - 'tools/*reference*.mjs'
      - 'corpus/datasets/kanji/kanken.jsonl'
      - 'prototypes/bunki-sites-v11/public/kotobako-static.json'
      - 'prototypes/drift/data/wbig.json'
      - 'apps/app/src/data/generated/drift-words.json'
      - 'apps/app/src/data/generated/drift-kanji.json'
      - 'corpus/samples/jmdict/kanjidic_sample.jsonl'
      - 'tools/fixtures/reference/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages-app.yml'
      - '.github/workflows/reference-libraries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare one canonical artifact for every check
        run: |
          echo "KAIRO_SITE_DIR=$RUNNER_TEMP/reference-site" >> "$GITHUB_ENV"
          echo "KAIRO_EVIDENCE_DIR=$RUNNER_TEMP/reference-evidence" >> "$GITHUB_ENV"
          node scripts/build-corridor-site.mjs --out "$RUNNER_TEMP/reference-site"
      - name: Verify complete source coverage and packaging
        run: |
          node --check prototypes/corridor/reference-core.js
          node --check prototypes/corridor/reference-ui.js
          node --check prototypes/corridor/corridor.js
          node tools/test-reference-core.mjs --evidence-out "$RUNNER_TEMP/reference-evidence/core"
          node --test prototypes/corridor/tools/test-reference-ui.mjs prototypes/corridor/tools/test-skip-ui.mjs prototypes/corridor/tools/test-kanji-capture.mjs prototypes/corridor/tools/test-navigation-returns.mjs
          node tools/build-reference-data.mjs --check
          node prototypes/corridor/tools/test-reference-packaging.mjs
      - name: Verify reference browsing and personal-study isolation
        run: node prototypes/corridor/tools/verify-reference.mjs --shots "$RUNNER_TEMP/reference-shots"
      - name: Verify existing mock-paper boundary
        run: node prototypes/corridor/tools/verify-mock.mjs
      - name: Verify recursive connections and return context
        run: node prototypes/corridor/tools/verify-reference-connections.mjs --shots "$RUNNER_TEMP/connection-shots"
      - name: Walk the complete learner experience with screenshots
        env:
          KAIRO_EVIDENCE_DIR: ${{ runner.temp }}/experience-shots
        run: |
          if test -f prototypes/corridor/skip-core.js; then
            node prototypes/corridor/tools/verify-experience.mjs --require-skip
          else
            node prototypes/corridor/tools/verify-experience.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-library-browser-evidence
          path: |
            ${{ runner.temp }}/reference-evidence
            ${{ runner.temp }}/reference-shots
            ${{ runner.temp }}/connection-shots
            ${{ runner.temp }}/experience-shots
          if-no-files-found: ignore
