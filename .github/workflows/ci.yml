# One immutable build; canonical gates partitioned by measured duration.
name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      site-id:
        value: ${{ jobs.build.outputs.site-id }}
      site-digest:
        value: ${{ jobs.build.outputs.site-digest }}
permissions:
  contents: read
  actions: read
concurrency:
  group: bunki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fast-matrix: ${{ steps.plan.outputs.fast-matrix }}
      has-battery: ${{ steps.plan.outputs.has-battery }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print and compare original and candidate required gates
        run: |
          base=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('scripts/ci/gate-baseline.json')).baseSha)")
          node scripts/ci/parity.mjs --base "$base" --out "$RUNNER_TEMP/parity.json"
      - name: Classify the complete candidate diff conservatively
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          let paths = [];
          if (process.env.GITHUB_EVENT_NAME === 'pull_request' && /^[a-f0-9]{40}$/.test(process.env.BASE_SHA || '')) {
            try { paths = execFileSync('git', ['diff', '--name-only', '-z', '--no-renames', `${process.env.BASE_SHA}...HEAD`], { encoding: 'utf8' }).split('\0').filter(Boolean); }
            catch { paths = []; }
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/paths.json`, JSON.stringify(paths));
          NODE
      - id: plan
        run: node scripts/ci/battery.mjs plan --paths "$RUNNER_TEMP/paths.json" --out "$RUNNER_TEMP/plan.json"
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/parity.json
          if-no-files-found: error
          retention-days: 14
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      site-id: ${{ steps.site.outputs.artifact-id }}
      site-digest: ${{ steps.site.outputs.artifact-digest }}
    steps:
      - name: Set canonical artifact path outside checkout
        run: echo "KAIRO_SITE_DIR=$RUNNER_TEMP/kairo-site" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build once and verify source identity
        run: |
          mkdir -p "$RUNNER_TEMP/build-evidence" "$RUNNER_TEMP/site-package"
          node scripts/build-corridor-site.mjs --out "$KAIRO_SITE_DIR" > "$RUNNER_TEMP/build-evidence/build.json"
          node scripts/verify-release-gates.mjs --verify-artifact "$KAIRO_SITE_DIR" --require-clean > "$RUNNER_TEMP/build-evidence/artifact-before.json"
      - name: Smoke-test every packaged path, dictionary, licence and archive obligation
        run: bash scripts/ci/smoke.sh
      - name: Seal the exact packaged bytes
        run: |
          node scripts/verify-release-gates.mjs --verify-artifact "$KAIRO_SITE_DIR" --require-clean > "$RUNNER_TEMP/build-evidence/artifact-after.json"
          tar -cf "$RUNNER_TEMP/site-package/site.tar" -C "$KAIRO_SITE_DIR" .
      - id: site
        uses: actions/upload-artifact@v4
        with:
          name: bunki-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-package/site.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Bind immutable artifact metadata
        env:
          SITE_ID: ${{ steps.site.outputs.artifact-id }}
          SITE_DIGEST: ${{ steps.site.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const manifest = readFileSync(`${process.env.KAIRO_SITE_DIR}/build-identity.json`);
          const json = JSON.parse(manifest);
          writeFileSync(`${process.env.RUNNER_TEMP}/artifact.json`, JSON.stringify({id:process.env.SITE_ID,name:`bunki-site-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,digest:process.env.SITE_DIGEST.startsWith('sha256:')?process.env.SITE_DIGEST:`sha256:${process.env.SITE_DIGEST}`,artifactSha256:json.artifactSha256,manifestSha256:createHash('sha256').update(manifest).digest('hex'),producerSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.json
          retention-days: 14
          if-no-files-found: error
      - name: Compress build evidence
        if: always()
        run: tar -czf "$RUNNER_TEMP/build-evidence.tar.gz" -C "$RUNNER_TEMP" build-evidence corridor-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-evidence.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
  native:
    name: native
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4

      - name: Set up Node 22 for cross-language fixture checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned JavaScript contracts without native app setup
        run: npm ci --ignore-scripts

      - name: Compile the CloudKit backend and run network-free fixtures
        id: apple-sync
        run: KAIRO_EVIDENCE_DIR="$RUNNER_TEMP/kairo-apple-sync" node packages/apple-sync/tools/verify.mjs

      - name: Compile and exercise the TypeScript client over real Swift OS pipes
        id: native-rpc
        run: KAIRO_RPC_EVIDENCE_DIR="$RUNNER_TEMP/kairo-native-rpc" node packages/persistence/tools/native-rpc/verify.mjs

      - name: Retain native compiler and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairo-apple-sync-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kairo-apple-sync/
          retention-days: 14
          if-no-files-found: warn

      - name: Retain native RPC compiler, pipe and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairo-native-rpc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kairo-native-rpc/
          retention-days: 14
          if-no-files-found: warn
  fast:
    name: battery / ${{ matrix.shard }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.fast-matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      KAIRO_CORPUS_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        with:
          python: ${{ matrix.python }}
          corpus: ${{ matrix.corpus }}
          browsers: ${{ matrix.browsers }}
      - uses: actions/download-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - name: Verify immutable archive digest before extraction
        env:
          SITE_ID: ${{ needs.build.outputs.site-id }}
          SITE_DIGEST: ${{ needs.build.outputs.site-digest }}
        run: node scripts/ci/receipts.mjs download-site --id "$SITE_ID" --run-id "$GITHUB_RUN_ID" --digest "$SITE_DIGEST" --temp "$RUNNER_TEMP/site-download" --out "$RUNNER_TEMP/site"
      - name: Bind this actual GitHub job identity
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const suffix=`battery / ${process.env.SHARD}`;
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs.json`)).flatMap(x=>x.jobs).filter(x=>x.name===suffix||x.name.endsWith(` / ${suffix}`));
          assert.equal(jobs.length,1); appendFileSync(process.env.GITHUB_ENV,`CI_JOB_ID=${jobs[0].id}\n`);
          NODE
      - name: Run the exact planned gates and retain first failures
        id: gates
        continue-on-error: true
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
        run: exec node scripts/ci/battery.mjs run --plan "$RUNNER_TEMP/inputs/plan.json" --shard "$SHARD" --artifact "$RUNNER_TEMP/inputs/artifact.json" --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/evidence"
      - name: Compress evidence before upload
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/evidence" ]; then tar -czf "$RUNNER_TEMP/evidence.tar.gz" -C "$RUNNER_TEMP" evidence; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-shard-${{ matrix.shard }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/shard.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-evidence-${{ matrix.shard }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
  fast-retry-plan:
    name: fast-retry-plan
    if: always() && needs.plan.result == 'success' && needs.build.result == 'success'
    needs: [plan, build, fast]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.retry.outputs.matrix }}
      has-retries: ${{ steps.retry.outputs.has-retries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: bunki-shard-fast-*-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Independently admit completed first-attempt jobs before retry planning
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs-pages.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs-pages.json`)).flatMap(page=>page.jobs);
          writeFileSync(`${process.env.RUNNER_TEMP}/jobs.json`,JSON.stringify(jobs));
          NODE
      - id: retry
        run: node scripts/ci/battery.mjs retry-plan --phase fast --plan "$RUNNER_TEMP/inputs/plan.json" --artifact "$RUNNER_TEMP/inputs/artifact.json" --receipts "$RUNNER_TEMP/receipts" --jobs "$RUNNER_TEMP/jobs.json" --out "$RUNNER_TEMP/fast-retry-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bunki-fast-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fast-retry-plan.json
          retention-days: 14
          if-no-files-found: error
  fast-retry:
    name: retry / ${{ matrix.shard }}
    if: always() && needs.fast-retry-plan.result == 'success' && needs.fast-retry-plan.outputs.has-retries == 'true'
    needs: [plan, build, fast-retry-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fast-retry-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      KAIRO_CORPUS_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        with:
          python: ${{ matrix.python }}
          corpus: ${{ matrix.corpus }}
          browsers: ${{ matrix.browsers }}
      - uses: actions/download-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-fast-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - name: Verify immutable archive digest before extraction
        env:
          SITE_ID: ${{ needs.build.outputs.site-id }}
          SITE_DIGEST: ${{ needs.build.outputs.site-digest }}
        run: node scripts/ci/receipts.mjs download-site --id "$SITE_ID" --run-id "$GITHUB_RUN_ID" --digest "$SITE_DIGEST" --temp "$RUNNER_TEMP/site-download" --out "$RUNNER_TEMP/site"
      - name: Bind this actual GitHub job identity
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const suffix=`retry / ${process.env.SHARD}`;
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs.json`)).flatMap(x=>x.jobs).filter(x=>x.name===suffix||x.name.endsWith(` / ${suffix}`));
          assert.equal(jobs.length,1); appendFileSync(process.env.GITHUB_ENV,`CI_JOB_ID=${jobs[0].id}\n`);
          NODE
      - name: Run the exact planned gates and record the second and final attempt
        id: gates
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
        run: exec node scripts/ci/battery.mjs run --plan "$RUNNER_TEMP/inputs/plan.json" --shard "$SHARD" --artifact "$RUNNER_TEMP/inputs/artifact.json" --site "$RUNNER_TEMP/site" --retry-plan "$RUNNER_TEMP/inputs/fast-retry-plan.json" --out "$RUNNER_TEMP/evidence"
      - name: Compress evidence before upload
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/evidence" ]; then tar -czf "$RUNNER_TEMP/evidence.tar.gz" -C "$RUNNER_TEMP" evidence; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-shard-${{ matrix.shard }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/shard.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-evidence-${{ matrix.shard }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
  fast-signal:
    name: bunki / fast
    if: always()
    needs: [plan, build, fast, fast-retry-plan, fast-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require complete planning and independently successful build
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RETRY_PLAN_RESULT: ${{ needs.fast-retry-plan.result }}
        run: test "$PLAN_RESULT" = success && test "$BUILD_RESULT" = success && test "$RETRY_PLAN_RESULT" = success
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: bunki-fast-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: bunki-shard-fast-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Read actual jobs from this exact run attempt
        if: always()
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs-pages.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs-pages.json`)).flatMap(page=>page.jobs);
          writeFileSync(`${process.env.RUNNER_TEMP}/jobs.json`,JSON.stringify(jobs));
          NODE
      - name: Fail closed on incomplete evidence, cancellation or repeated failures
        id: aggregate
        if: always()
        run: node scripts/ci/battery.mjs aggregate --phase fast --plan "$RUNNER_TEMP/inputs/plan.json" --artifact "$RUNNER_TEMP/inputs/artifact.json" --retry-plan "$RUNNER_TEMP/inputs/fast-retry-plan.json" --receipts "$RUNNER_TEMP/receipts" --jobs "$RUNNER_TEMP/jobs.json" --out "$RUNNER_TEMP/proof"
      - name: Retain infrastructure summary even when setup or evidence was unavailable
        if: always() && steps.aggregate.outcome != 'success'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof'
          evidence.mkdir(exist_ok=True)
          text = '\n## Required workflow admission failed\n\n'
          text += 'Setup, evidence collection or aggregate admission failed. No promotable full receipt was issued.\n\n'
          if int(os.environ['GITHUB_RUN_ATTEMPT']) > 1:
              rerun = ('Every job admits only this attempt\'s own plan, build and shard artifacts, so a '
                       '"Re-run failed jobs" attempt always fails closed with missing artifacts. Failed gates '
                       'already received one automatic fresh-runner retry; to rerun, use "Re-run all jobs".')
              print('::warning title=Re-run all jobs required::' + rerun)
              text += '**Attempt ' + os.environ['GITHUB_RUN_ATTEMPT'] + ':** ' + rerun + '\n\n'
          text += 'Required dependency results:\n\n```json\n' + json.dumps(json.loads(os.environ['NEEDS_JSON']), indent=2) + '\n```\n'
          (evidence / 'WORKFLOW_FAILURE.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PYEOF
      - name: Retain summary and appendable flake ledger entries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunki-fast-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof/
          retention-days: 14
          if-no-files-found: warn
  battery:
    name: battery / ${{ matrix.shard }}
    if: needs.plan.outputs.has-battery == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      KAIRO_CORPUS_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Temporary hosted cancellation control; remove after the experiment.
      # A failing setup must cancel actual sibling jobs before they emit receipts.
      - name: Cancel slow siblings through a deliberate setup failure
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = practice-history ]; then
            sleep 90
            exit 23
          fi
          sleep 180
      - uses: ./.github/actions/ci-setup
        with:
          python: ${{ matrix.python }}
          corpus: ${{ matrix.corpus }}
          browsers: ${{ matrix.browsers }}
      - uses: actions/download-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - name: Verify immutable archive digest before extraction
        env:
          SITE_ID: ${{ needs.build.outputs.site-id }}
          SITE_DIGEST: ${{ needs.build.outputs.site-digest }}
        run: node scripts/ci/receipts.mjs download-site --id "$SITE_ID" --run-id "$GITHUB_RUN_ID" --digest "$SITE_DIGEST" --temp "$RUNNER_TEMP/site-download" --out "$RUNNER_TEMP/site"
      - name: Bind this actual GitHub job identity
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const suffix=`battery / ${process.env.SHARD}`;
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs.json`)).flatMap(x=>x.jobs).filter(x=>x.name===suffix||x.name.endsWith(` / ${suffix}`));
          assert.equal(jobs.length,1); appendFileSync(process.env.GITHUB_ENV,`CI_JOB_ID=${jobs[0].id}\n`);
          NODE
      - name: Run the exact planned gates and retain first failures
        id: gates
        continue-on-error: true
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
        run: exec node scripts/ci/battery.mjs run --plan "$RUNNER_TEMP/inputs/plan.json" --shard "$SHARD" --artifact "$RUNNER_TEMP/inputs/artifact.json" --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/evidence"
      - name: Retain the built app for an exact failed-e2e retry
        if: always() && matrix.e2e
        uses: actions/upload-artifact@v4
        with:
          name: bunki-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/app/dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Compress evidence before upload
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/evidence" ]; then tar -czf "$RUNNER_TEMP/evidence.tar.gz" -C "$RUNNER_TEMP" evidence; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-shard-${{ matrix.shard }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/shard.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-evidence-${{ matrix.shard }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
  retry-plan:
    name: retry-plan
    if: always() && needs.plan.result == 'success' && needs.build.result == 'success' && needs.plan.outputs.has-battery == 'true'
    needs: [plan, build, battery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.retry.outputs.matrix }}
      has-retries: ${{ steps.retry.outputs.has-retries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: bunki-shard-*-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Independently admit completed first-attempt jobs before retry planning
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs-pages.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs-pages.json`)).flatMap(page=>page.jobs);
          writeFileSync(`${process.env.RUNNER_TEMP}/jobs.json`,JSON.stringify(jobs));
          NODE
      - id: retry
        run: node scripts/ci/battery.mjs retry-plan --phase battery --plan "$RUNNER_TEMP/inputs/plan.json" --artifact "$RUNNER_TEMP/inputs/artifact.json" --receipts "$RUNNER_TEMP/receipts" --jobs "$RUNNER_TEMP/jobs.json" --out "$RUNNER_TEMP/retry-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bunki-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retry-plan.json
          retention-days: 14
          if-no-files-found: error
  retry:
    name: retry / ${{ matrix.shard }}
    if: always() && needs.retry-plan.result == 'success' && needs.retry-plan.outputs.has-retries == 'true'
    needs: [plan, build, retry-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      KAIRO_CORPUS_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        with:
          python: ${{ matrix.python }}
          corpus: ${{ matrix.corpus }}
          browsers: ${{ matrix.browsers }}
      - uses: actions/download-artifact@v4
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bunki-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - name: Determine whether the failed e2e needs its original build
        id: e2e
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const plan=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/inputs/retry-plan.json`));
          const shard=plan.shards.find(row=>row.id===process.env.SHARD);
          appendFileSync(process.env.GITHUB_OUTPUT,`restore=${Boolean(shard.dependencies?.e2eBuild)}\n`);
          NODE
      - uses: actions/download-artifact@v4
        if: steps.e2e.outputs.restore == 'true'
        with:
          name: bunki-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/app/dist/
      - name: Verify immutable archive digest before extraction
        env:
          SITE_ID: ${{ needs.build.outputs.site-id }}
          SITE_DIGEST: ${{ needs.build.outputs.site-digest }}
        run: node scripts/ci/receipts.mjs download-site --id "$SITE_ID" --run-id "$GITHUB_RUN_ID" --digest "$SITE_DIGEST" --temp "$RUNNER_TEMP/site-download" --out "$RUNNER_TEMP/site"
      - name: Bind this actual GitHub job identity
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const suffix=`retry / ${process.env.SHARD}`;
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs.json`)).flatMap(x=>x.jobs).filter(x=>x.name===suffix||x.name.endsWith(` / ${suffix}`));
          assert.equal(jobs.length,1); appendFileSync(process.env.GITHUB_ENV,`CI_JOB_ID=${jobs[0].id}\n`);
          NODE
      - name: Run the exact planned gates and record the second and final attempt
        id: gates
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
        run: exec node scripts/ci/battery.mjs run --plan "$RUNNER_TEMP/inputs/plan.json" --shard "$SHARD" --artifact "$RUNNER_TEMP/inputs/artifact.json" --site "$RUNNER_TEMP/site" --retry-plan "$RUNNER_TEMP/inputs/retry-plan.json" --out "$RUNNER_TEMP/evidence"
      - name: Compress evidence before upload
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/evidence" ]; then tar -czf "$RUNNER_TEMP/evidence.tar.gz" -C "$RUNNER_TEMP" evidence; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-shard-${{ matrix.shard }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/shard.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunki-evidence-${{ matrix.shard }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
  required:
    name: bunki / required
    if: always()
    needs:
      [
        plan,
        build,
        native,
        fast,
        fast-retry-plan,
        fast-retry,
        fast-signal,
        battery,
        retry-plan,
        retry,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require complete planning and independently successful build
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FAST_RESULT: ${{ needs.fast-signal.result }}
          FAST_RETRY_PLAN_RESULT: ${{ needs.fast-retry-plan.result }}
          RETRY_PLAN_RESULT: ${{ needs.retry-plan.result }}
          CI_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          test "$PLAN_RESULT" = success && test "$BUILD_RESULT" = success && test "$FAST_RESULT" = success && test "$FAST_RETRY_PLAN_RESULT" = success
          if [ "$CI_SCOPE" = full ]; then test "$RETRY_PLAN_RESULT" = success; else test "$RETRY_PLAN_RESULT" = skipped; fi
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: bunki-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: bunki-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: bunki-fast-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always() && needs.plan.outputs.scope == 'full'
        with:
          name: bunki-retry-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: bunki-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Read actual jobs from this exact run attempt
        if: always()
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs-pages.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const jobs=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jobs-pages.json`)).flatMap(page=>page.jobs);
          writeFileSync(`${process.env.RUNNER_TEMP}/jobs.json`,JSON.stringify(jobs));
          NODE
      - name: Fail closed on incomplete evidence, cancellation or repeated failures
        id: aggregate
        if: always()
        env:
          CI_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          if [ "$CI_SCOPE" = full ]; then
            node scripts/ci/battery.mjs aggregate --phase all --plan "$RUNNER_TEMP/inputs/plan.json" --artifact "$RUNNER_TEMP/inputs/artifact.json" --fast-retry-plan "$RUNNER_TEMP/inputs/fast-retry-plan.json" --retry-plan "$RUNNER_TEMP/inputs/retry-plan.json" --receipts "$RUNNER_TEMP/receipts" --jobs "$RUNNER_TEMP/jobs.json" --out "$RUNNER_TEMP/proof"
          else
            node scripts/ci/battery.mjs aggregate --phase all --plan "$RUNNER_TEMP/inputs/plan.json" --artifact "$RUNNER_TEMP/inputs/artifact.json" --fast-retry-plan "$RUNNER_TEMP/inputs/fast-retry-plan.json" --receipts "$RUNNER_TEMP/receipts" --jobs "$RUNNER_TEMP/jobs.json" --out "$RUNNER_TEMP/proof"
          fi
      - name: Retain infrastructure summary even when setup or evidence was unavailable
        if: always() && steps.aggregate.outcome != 'success'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof'
          evidence.mkdir(exist_ok=True)
          text = '\n## Required workflow admission failed\n\n'
          text += 'Setup, evidence collection or aggregate admission failed. No promotable full receipt was issued.\n\n'
          if int(os.environ['GITHUB_RUN_ATTEMPT']) > 1:
              rerun = ('Every job admits only this attempt\'s own plan, build and shard artifacts, so a '
                       '"Re-run failed jobs" attempt always fails closed with missing artifacts. Failed gates '
                       'already received one automatic fresh-runner retry; to rerun, use "Re-run all jobs".')
              print('::warning title=Re-run all jobs required::' + rerun)
              text += '**Attempt ' + os.environ['GITHUB_RUN_ATTEMPT'] + ':** ' + rerun + '\n\n'
          text += 'Required dependency results:\n\n```json\n' + json.dumps(json.loads(os.environ['NEEDS_JSON']), indent=2) + '\n```\n'
          (evidence / 'WORKFLOW_FAILURE.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PYEOF
      - name: Publish a full proof only after aggregate admission
        if: success() && needs.plan.outputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: bunki-proof-${{ needs.plan.outputs.tree }}
          overwrite: true
          path: ${{ runner.temp }}/proof/receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain summary and appendable flake ledger entries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunki-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof/
          retention-days: 14
          if-no-files-found: warn
