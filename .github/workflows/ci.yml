# Bunki CI (WP-01, extended by WP-10; controller §17.5).
#
# Two jobs, because they fail for different reasons and a reader should be able
# to tell which happened without opening a log:
#
#   checks — lint, format, typecheck, and the whole Vitest suite, plus the two
#            §17.5 lines the controller reports separately (`test:replay`,
#            `verify:export`). Those two are subsets of `npm run test`; they are
#            named here anyway because the controller names them, and a check
#            that only exists inside another check cannot be cited on its own.
#
#   e2e    — the controller's build proof (`expo export --platform web`) and the
#            Playwright loop that drives its output: T-17, plus the E2E halves of
#            T-12 and T-13. This job is the one that can fail while every unit
#            test passes, which is precisely the definition-of-done failure
#            "tests pass but the app doesn't" (§2 item 1).
#
# Not here yet, and deliberately not implied: the axe accessibility scan named in
# §17.5, and the §17.2 adversarial matrix. Those belong to WP-10's T-lanes, which
# add their own specs under apps/app/e2e/ and pick up this job for free — the
# runner already discovers `**/*.spec.ts`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint / format / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` (not `npm install`) so the exact pinned versions from
      # package-lock.json are what CI verifies. Controller §14 pins every
      # dependency exactly; a CI run that silently resolved a different
      # version would be checking a different project.
      - name: Install dependencies
        run: npm ci

      - name: Lint (includes controller §5 boundary rules)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Replay (T-03)
        run: npm run test:replay

      - name: Export round trip (T-14)
        run: npm run verify:export

  e2e:
    name: web build proof / e2e closed loop (T-17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser build is pinned by `@playwright/test`'s exact version in
      # package-lock.json, so the engine under test is as pinned as every other
      # dependency (controller §14). `--with-deps` installs the system libraries
      # Chromium needs on a bare runner.
      - name: Install the pinned browser
        run: npx playwright install --with-deps chromium

      # Controller §17.5's build proof, and the artifact the E2E then drives.
      # It runs here rather than in `checks` because a bundle that fails to
      # export and a lint rule that fails are not the same news.
      - name: Build the web export
        run: npm run test:e2e:build

      - name: E2E — closed loop (T-17), candidate labelling (T-12), finite session (T-13)
        run: npm run test:e2e

      # Traces and screenshots for a red run. `retention-days` is short because
      # these are debugging aids, not evidence: the evidence capsule holds the
      # recorded results.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artefacts
          path: apps/app/test-results/
          retention-days: 7
          if-no-files-found: ignore
