# The only live publisher. Its reusable verification job builds and tests the
# artifact; deployment consumes that same run's immutable Pages artifact.
name: pages-app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kairo-pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages is configured
        uses: actions/configure-pages@v5
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: kairo-pages
