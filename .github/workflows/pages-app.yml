# Sole Pages publisher. Tree proof is admitted independently before byte reuse.
name: pages-app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'kairo-pages' || format('kairo-pages-test-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  lookup:
    name: admit existing full-tree proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matched: ${{ steps.lookup.outputs.matched }}
      # named once, by the attempt that admitted it, so a re-run of only the release job reads it back
      transfer_artifact: ${{ steps.transfer_name.outputs.name }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Admit only a synchronized stable product release
        run: node scripts/release/version.mjs verify
      - name: Plan the current full policy
        run: node scripts/ci/battery.mjs plan --scope full --out "$RUNNER_TEMP/plan.json"
      - name: Independently admit exact-tree proof or require fresh CI
        id: lookup
        run: node scripts/ci/receipts.mjs lookup --plan "$RUNNER_TEMP/plan.json" --out "$RUNNER_TEMP/reuse"
      - name: Check out the independently admitted original producer
        if: steps.lookup.outputs.matched == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.lookup.outputs.producer_sha }}
          fetch-depth: 0
      - name: Install the admitted producer's pinned verification dependencies
        if: steps.lookup.outputs.matched == 'true'
        run: npm ci --ignore-scripts
      - name: Verify unchanged tested bytes against the original producer
        id: transfer
        if: steps.lookup.outputs.matched == 'true'
        run: node scripts/ci/receipts.mjs verify-transfer --transfer "$RUNNER_TEMP/reuse/transfer.json"
      - name: Refuse replacement of an already numbered release
        if: success() && steps.transfer.outputs.verified == 'true' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SITE: ${{ steps.transfer.outputs.site_dir }}
        run: node scripts/release/publish.mjs guard --site "$RELEASE_SITE"
      # the same name the upload below gives it, kept as this job's output for the release job
      - name: Name the transfer evidence
        id: transfer_name
        if: success() && steps.transfer.outputs.verified == 'true'
        run: echo "name=bunki-transfer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain the transfer evidence
        if: success() && steps.transfer.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bunki-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reuse/receipt.json
            ${{ runner.temp }}/reuse/transfer.json
          retention-days: 14
          if-no-files-found: error
      - name: Package admitted bytes without rebuilding
        if: success() && steps.transfer.outputs.verified == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          name: kairo-pages
          path: ${{ steps.transfer.outputs.site_dir }}
  verify:
    if: always() && (needs.lookup.result != 'success' || needs.lookup.outputs.matched != 'true')
    needs: lookup
    uses: ./.github/workflows/ci.yml
  package:
    name: package freshly tested artifact
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    needs: [lookup, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the exact immutable artifact admitted by full CI
        env:
          SITE_ID: ${{ needs.verify.outputs.site-id }}
          SITE_DIGEST: ${{ needs.verify.outputs.site-digest }}
        run: node scripts/ci/receipts.mjs download-site --id "$SITE_ID" --run-id "$GITHUB_RUN_ID" --digest "$SITE_DIGEST" --temp "$RUNNER_TEMP/download" --out "$RUNNER_TEMP/site"
      - name: Recheck complete source and byte identity before Pages packaging
        run: node scripts/verify-release-gates.mjs --verify-artifact "$RUNNER_TEMP/site" --require-clean
      - name: Refuse replacement of an already numbered release
        run: node scripts/release/publish.mjs guard --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: kairo-pages
          path: ${{ runner.temp }}/site
  deploy:
    if: always() && github.ref == 'refs/heads/main' && ((needs.lookup.result == 'success' && needs.lookup.outputs.matched == 'true') || (needs.verify.result == 'success' && needs.package.result == 'success'))
    needs: [lookup, verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages is configured
        uses: actions/configure-pages@v5
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: kairo-pages
  release:
    name: retain and publish numbered release
    if: always() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    needs: [lookup, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUNKI_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the proof admitted by this deployment
        id: producer
        env:
          REUSED: ${{ needs.lookup.outputs.matched }}
          TRANSFER_ARTIFACT: ${{ needs.lookup.outputs.transfer_artifact }}
        run: |
          if [ "$REUSED" = true ]; then
            # the attempt that admitted the proof named it; a re-run of only this job is a later attempt
            release_proof_name="$TRANSFER_ARTIFACT"
            test -n "$release_proof_name"
          else
            release_proof_name="bunki-proof-$(git rev-parse 'HEAD^{tree}')"
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$release_proof_name" --dir "$RUNNER_TEMP/release-proof"
          node scripts/release/publish.mjs resolve --proof "$RUNNER_TEMP/release-proof/receipt.json"
      - name: Check out the original tested producer
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.producer.outputs.producer }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the live app and retain its exact release package
        run: node scripts/release/publish.mjs publish --proof "$RUNNER_TEMP/release-proof/receipt.json" --out "$RUNNER_TEMP/release-publish"
