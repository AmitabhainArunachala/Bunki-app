name: Bunki verified build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: prototypes/bunki-sites-v11

concurrency:
  group: bunki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: prototypes/bunki-sites-v11/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            prototypes/bunki-sites-v11/playwright-report/
            prototypes/bunki-sites-v11/test-results/
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: prototypes/bunki-sites-v11/package-lock.json
      - run: npm ci
      - name: Check deployment connection
        id: connection
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID}" && -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Verified build completed. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to enable the public Worker deployment."
          fi
      - run: npm run build
        if: steps.connection.outputs.ready == 'true'
      - name: Deploy verified main
        id: deploy
        if: steps.connection.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run deploy:worker:built 2>&1 | tee deploy.log
          deployment_url="$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | tail -1 || true)"
          echo "deployment-url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Bunki production"
            echo
            echo "Deployed from commit \`${GITHUB_SHA}\`."
            echo
            echo "${deployment_url}"
          } >> "${GITHUB_STEP_SUMMARY}"
