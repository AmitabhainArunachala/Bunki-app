# Historical verification only. Cloudflare publishing is retired; a green job
# proves these checks, never a skipped production deployment.
name: legacy Sites v11 verification

on:
  pull_request:
    paths:
      - 'prototypes/bunki-sites-v11/**'
      - '.github/workflows/bunki-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: prototypes/bunki-sites-v11

concurrency:
  group: bunki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: prototypes/bunki-sites-v11/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            prototypes/bunki-sites-v11/playwright-report/
            prototypes/bunki-sites-v11/test-results/
          retention-days: 14

      - name: Report historical verification scope
        run: echo 'Sites v11 historical checks passed. Cloudflare deployment is retired; this workflow creates no production deployment.' >> "$GITHUB_STEP_SUMMARY"
