name: Personal collections

on:
  pull_request:
    paths:
      - 'prototypes/corridor/decks/personal/**'
      - 'prototypes/corridor/tools/*personal*'
      - 'prototypes/corridor/corridor.js'
      - 'prototypes/corridor/sw.js'
      - 'scripts/corridor-assets.mjs'
      - 'scripts/build-corridor-site.mjs'
      - 'scripts/resolve-corridor-site.mjs'
      - '.github/workflows/personal-collections.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/corridor/decks/personal/**'
      - 'prototypes/corridor/tools/*personal*'
      - 'prototypes/corridor/corridor.js'
      - 'prototypes/corridor/sw.js'
      - 'scripts/corridor-assets.mjs'
      - 'scripts/build-corridor-site.mjs'
      - 'scripts/resolve-corridor-site.mjs'
      - '.github/workflows/personal-collections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-deck:
    name: Private deck / Chromium + WebKit / offline + storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare the canonical runtime
        run: |
          echo "KAIRO_SITE_DIR=$RUNNER_TEMP/personal-site" >> "$GITHUB_ENV"
          echo "KAIRO_EVIDENCE_DIR=$RUNNER_TEMP/personal-evidence" >> "$GITHUB_ENV"
          node scripts/build-corridor-site.mjs --out "$RUNNER_TEMP/personal-site"
      - run: node prototypes/corridor/tools/test-personal-collections.mjs
      - run: node --test prototypes/corridor/decks/personal/tests/host-bridge.test.mjs
      - run: node prototypes/corridor/tools/verify-personal-collections.mjs
        env:
          PERSONAL_QA_OUT: ${{ runner.temp }}/personal-collections
      - run: node prototypes/corridor/tools/verify-personal-host.mjs
      - run: node prototypes/corridor/tools/verify-personal-host.mjs
        env:
          PERSONAL_HOST_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-collections-browser-evidence
          path: |
            ${{ runner.temp }}/personal-collections
            ${{ runner.temp }}/personal-evidence
          if-no-files-found: ignore
