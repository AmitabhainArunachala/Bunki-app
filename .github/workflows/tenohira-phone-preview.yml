name: TENOHIRA phone preview

on:
  push:
    branches:
      - claude/bunki-kairo-pr76-review-qa1qnh
    paths:
      - 'prototypes/corridor/**'
      - '.github/workflows/tenohira-phone-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax guard
        run: |
          set -euo pipefail
          node --check prototypes/corridor/corridor.js
          node --check prototypes/corridor/corridor-ink.js
          node --check prototypes/corridor/dictionary-worker.js
          node --check prototypes/corridor/sw.js
      - name: Assemble phone build
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -R prototypes/corridor/. "$SITE/"
          cp prototypes/corridor/index.html "$SITE/404.html"
          echo "SITE_DIR=$SITE" >> "$GITHUB_ENV"
      - name: Smoke test entrypoint
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$SITE_DIR" >/tmp/bunki-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && break
            sleep .2
          done
          grep -q 'stroke-room-operator-fix-79' "$SITE_DIR/index.html"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
