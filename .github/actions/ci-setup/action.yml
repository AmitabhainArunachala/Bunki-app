name: Bunki CI dependencies
description: Lockfile caches accelerate setup; successful test evidence is never cached.
inputs:
  python:
    default: 'false'
    description: Install corpus and pinned deck dependencies
  corpus:
    default: 'false'
    description: Install the corpus optional test dependencies
  browsers:
    default: 'chromium webkit'
    description: Playwright engines required by the plan
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
      shell: bash
    - uses: actions/setup-python@v5
      if: inputs.python == 'true'
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          corpus/pyproject.toml
          scripts/ci/deck-requirements.txt
    - run: python3 -m pip install -r scripts/ci/deck-requirements.txt
      if: inputs.python == 'true'
      shell: bash
    - run: python3 -m pip install './corpus[dev,wikinews,aozora,snow,grading]'
      if: inputs.corpus == 'true'
      shell: bash
    - uses: actions/cache@v4
      if: inputs.browsers != ''
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - run: npx playwright install --with-deps ${{ inputs.browsers }}
      if: inputs.browsers != ''
      shell: bash
    - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      if: inputs.browsers != ''
      shell: bash
