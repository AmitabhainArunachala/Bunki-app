<title>墨流し — Bunki Drift</title>
<style>
  :root{
    --ground:#FBFAF5; --ink:#1B2A3A; --faint:rgba(27,42,58,.42); --line:rgba(27,42,58,.2);
    --pig1:#1E50A2; --pig2:#165E83; --accent:#EB6101;
    --plaque:rgba(251,250,245,.92); --halo:rgba(30,80,162,.5); --grainOp:.55;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    touch-action:none; transition:background-color 1.2s;
  }
  canvas{display:block}
  #ink{position:fixed;inset:0;z-index:0;width:100%;height:100%}
  #grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--grainOp);
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.55 0 0 0 0 0.52 0 0 0 0 0.46 0 0 0 0.05 0"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>')}
  #veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:var(--ground);
    opacity:0;transition:opacity .9s}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;width:100%;height:100%}
  #sky{position:fixed;inset:0;z-index:4}
  .word,.glyph,.part{position:absolute;left:0;top:0;white-space:nowrap;cursor:pointer;
    will-change:transform,opacity;user-select:none;-webkit-user-select:none;
    text-align:center;transition:filter .9s}
  .word .base{display:block;line-height:1.15;text-shadow:0 0 1px currentColor}
  .word .yomi{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    font-size:.44em;letter-spacing:.16em;color:var(--pig2);opacity:0;
    transition:opacity .5s;padding-bottom:.12em;pointer-events:none}
  .word .gloss{position:absolute;top:100%;left:50%;transform:translateX(-50%);
    font-size:.4em;font-style:italic;font-family:Georgia,serif;color:var(--faint);
    opacity:0;transition:opacity .5s;padding-top:.16em;pointer-events:none}
  .word.unfolded .yomi,.word.unfolded .gloss{opacity:1}
  .word.fragile .base{text-shadow:0 0 1px currentColor,0 0 24px var(--halo)}
  .word.lod .yomi,.word.lod .gloss{opacity:0!important}
  .glyph.comp{z-index:7}
  .word.center,.glyph.center,.part.center{z-index:6}
  .glyph .g{display:block;font-size:36px;line-height:1.1;text-shadow:0 0 1px currentColor}
  .glyph.center small{font-size:8px}
  .glyph.comp .g{font-size:24px;color:var(--pig2);border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;background:var(--plaque)}
  .glyph small,.part small{display:block;font-size:11px;font-family:Georgia,serif;font-style:italic;
    color:var(--faint);letter-spacing:.03em}
  .part .pch{display:flex;align-items:center;justify-content:center;margin:0 auto;
    width:38px;height:38px;border:1.5px solid var(--pig2);border-radius:50%;
    font-size:19px;color:var(--pig2);background:var(--plaque)}
  #brand{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;z-index:8;
    font-size:13px;letter-spacing:.3em;color:var(--faint)}
  #seal{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;
    background:#B13A2F;color:#FFF8EE;border-radius:3px;font-size:11px;margin-right:8px;
    vertical-align:-3px;letter-spacing:0}
  #depth{position:fixed;top:calc(13px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);z-index:8;font-size:12px;letter-spacing:.14em;
    color:var(--faint);max-width:46vw;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;pointer-events:none}
  #theme{position:fixed;top:calc(8px + env(safe-area-inset-top));right:14px;z-index:8;
    font-size:12px;letter-spacing:.12em;color:var(--ink);background:var(--plaque);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:inherit;cursor:pointer}
  #theme:focus-visible{outline:2px solid var(--pig1);outline-offset:2px}
  #tray{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:16px;z-index:8;
    font-size:12px;color:var(--faint);letter-spacing:.1em}
  #tray b{color:var(--accent);font-weight:500}
  #hint{position:fixed;bottom:calc(42px + env(safe-area-inset-bottom));left:0;right:0;z-index:8;
    text-align:center;font-size:12px;letter-spacing:.3em;color:var(--faint);
    opacity:1;transition:opacity 1.4s;pointer-events:none}
  #card{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;background:var(--plaque);
    border:1px solid var(--line);border-radius:14px;
    padding:20px 20px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(115%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:inset 0 0 0 1px var(--line),0 -10px 44px rgba(0,0,0,.14)}
  #card.open{transform:translateY(0)}
  #card .yomi{font-size:13px;letter-spacing:.2em;color:var(--pig2)}
  #card h1{font-size:42px;font-weight:500;margin:2px 0 4px}
  #card .gloss{font-family:Georgia,serif;font-style:italic;color:var(--faint);font-size:15px}
  #card .row{display:flex;gap:10px;margin-top:14px}
  #card .row div{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  #card .row .k{font-size:24px}
  #card .row .kg{font-size:11px;color:var(--faint);font-family:Georgia,serif;font-style:italic}
  #card .note{margin-top:13px;font-size:11px;color:var(--faint);text-align:center;
    font-family:Georgia,serif;font-style:italic}
  #card .kx{display:flex;align-items:center;gap:14px}
  #card .kx h1{margin:0}
  #card .bt{margin-left:auto;font-size:12px;letter-spacing:.1em;color:var(--pig2);
    background:none;border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-family:inherit;cursor:pointer}
  .scell{margin:12px auto 0;width:150px;height:150px;background:var(--plaque);
    border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  .scell svg{display:block;width:100%;height:100%}
  #card .rhead{margin-top:12px;font-size:11px;letter-spacing:.14em;color:var(--faint)}
  #card .rlist{max-height:34vh;overflow-y:auto;margin-top:6px;border-top:1px solid var(--line);
    touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #card .rrow{display:flex;align-items:baseline;gap:12px;padding:9px 2px;
    border-bottom:1px solid var(--line);cursor:pointer}
  #card .rrow .rk{font-size:22px}
  #card .rrow .rr{font-size:12px;color:var(--pig2);letter-spacing:.06em;min-width:4.4em;
    display:flex;flex-direction:column;line-height:1.35}
  #card .rrow .rr i{font-style:normal;color:var(--faint);font-size:11px}
  #card .rds{font-size:13px;color:var(--pig2);letter-spacing:.08em;line-height:1.4}
  #card .rds .kun{color:var(--faint)}
  #lvl{position:fixed;left:0;top:50%;transform:translateY(-50%);height:46vh;width:26px;
    z-index:8;opacity:.32;transition:opacity .5s;touch-action:none}
  #lvl.hot{opacity:1}
  #lvlTrack{position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--faint);
    border-radius:1px}
  #lvlHandle{position:absolute;left:10px;width:12px;height:12px;border-radius:50%;
    background:var(--pig1);border:1.5px solid var(--plaque);margin-top:-6px;top:57%}
  #lvlLabels{position:absolute;left:22px;top:0;bottom:0;font-size:10px;color:var(--faint);
    letter-spacing:.05em;opacity:0;transition:opacity .4s;pointer-events:none}
  #lvl.hot #lvlLabels{opacity:1}
  .lvlab{position:absolute;transform:translateY(-50%);white-space:nowrap}
  #lvlInfo{position:absolute;left:42px;top:50%;transform:translateY(-50%);font-size:11px;
    color:var(--pig2);letter-spacing:.08em;white-space:nowrap;opacity:0;transition:opacity .3s;
    background:var(--plaque);border:1px solid var(--line);border-radius:8px;padding:5px 10px;
    pointer-events:none}
  #lvl.hot #lvlInfo{opacity:1}
  #card .rrow .rm{font-size:12px;color:var(--faint);font-family:Georgia,serif;font-style:italic;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
</style>
<canvas id="ink"></canvas>
<div id="grain"></div>
<div id="veil"></div>
<canvas id="fx"></canvas>
<div id="sky"></div>
<div id="brand"><span id="seal">分</span>墨流し</div>
<div id="depth"></div>
<button id="theme" aria-label="pigment theme">北斎</button>
<div id="tray"></div>
<div id="hint">ことばに触れて</div>
<div id="lvl"><div id="lvlTrack"></div><div id="lvlHandle"></div>
<div id="lvlLabels"></div><div id="lvlInfo"></div></div>
<div id="card"></div>

// ---- canvases ----
const ink=document.getElementById("ink"), ictx=ink.getContext("2d");
const fx=document.getElementById("fx"), fctx=fx.getContext("2d");
const paper=document.createElement("canvas"), pctx=paper.getContext("2d");
let fdpr=1;
function sizeCanvases(){
  ink.width=Math.max(1,Math.round(vw()*0.5)); ink.height=Math.max(1,Math.round(vh()*0.5));
  stainCv.width=ink.width; stainCv.height=ink.height;
  fdpr=Math.min(devicePixelRatio||1,1.5);
  fx.width=Math.round(vw()*fdpr); fx.height=Math.round(vh()*fdpr);
  renderPaper();
}

// ---- layered parchment, pre-rendered once per theme ----
function renderPaper(){
  paper.width=ink.width; paper.height=ink.height;
  const th=THEMES[themeIx];
  pctx.setTransform(0.5,0,0,0.5,0,0);
  pctx.fillStyle=th.ground; pctx.fillRect(0,0,vw(),vh());
  // tonal mottling — uneven age of the sheet
  for(let i=0;i<16;i++){
    const f=i%2?1.045:0.94;
    const r=mind()*(0.16+Math.random()*0.34);
    const x=Math.random()*vw(), y=Math.random()*vh();
    const g=pctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,shade(th.ground,f,th.dark?.22:.5));
    g.addColorStop(1,shade(th.ground,f,0));
    pctx.fillStyle=g; pctx.beginPath(); pctx.arc(x,y,r,0,TAU); pctx.fill();
  }
  // fibers — long thin strands laid into the sheet
  pctx.lineWidth=.7;
  for(let i=0;i<240;i++){
    const x=Math.random()*vw(), y=Math.random()*vh();
    const ang=Math.random()<.6?(Math.random()-.5)*.5:Math.random()*TAU;
    const len=60+Math.random()*170;
    const bend=(Math.random()-.5)*30;
    pctx.strokeStyle=rgba(th.ink,th.dark?.04:.032+Math.random()*.02);
    pctx.beginPath(); pctx.moveTo(x,y);
    pctx.quadraticCurveTo(x+Math.cos(ang)*len/2+bend,y+Math.sin(ang)*len/2-bend,
      x+Math.cos(ang)*len,y+Math.sin(ang)*len);
    pctx.stroke();
  }
  // 簀の目 — laid screen-lines of the papermaker's bamboo screen
  const la=th.dark?.028:.05;
  pctx.lineWidth=.5;
  for(let y=0;y<vh();y+=7){
    pctx.strokeStyle=rgba(th.ink,la*(0.7+Math.random()*0.6));
    pctx.beginPath();
    pctx.moveTo(0,y+Math.sin(y*1.7)*0.9);
    pctx.lineTo(vw(),y+Math.cos(y*2.3)*0.9);
    pctx.stroke();
  }
  // chain lines — the wider vertical stitches
  pctx.strokeStyle=rgba(th.ink,la*1.5); pctx.lineWidth=.8;
  for(let x=34;x<vw();x+=88){
    pctx.beginPath(); pctx.moveTo(x,0); pctx.lineTo(x+2,vh()); pctx.stroke();
  }
  // per-grain speckle
  for(let i=0;i<2600;i++){
    pctx.fillStyle=rgba(th.ink,0.015+Math.random()*0.035);
    pctx.fillRect(Math.random()*vw(),Math.random()*vh(),1.1,1.1);
  }
  // heavier kozo strands
  pctx.lineWidth=1.3;
  for(let i=0;i<26;i++){
    const x=Math.random()*vw(), y=Math.random()*vh();
    const ang=Math.random()*TAU, len=30+Math.random()*90;
    pctx.strokeStyle=rgba(th.ink,th.dark?.06:.05);
    pctx.beginPath(); pctx.moveTo(x,y);
    pctx.quadraticCurveTo(x+Math.cos(ang)*len/2+(Math.random()-.5)*22,
      y+Math.sin(ang)*len/2,x+Math.cos(ang)*len,y+Math.sin(ang)*len);
    pctx.stroke();
  }
  // foxing — age spots on light sheets
  if(!th.dark){
    for(let i=0;i<46;i++){
      const r=1+Math.random()*(Math.random()<.15?8:2.5);
      const x=Math.random()*vw(), y=Math.random()*vh();
      const g=pctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,"rgba(138,107,74,"+(0.04+Math.random()*0.06)+")");
      g.addColorStop(1,"rgba(138,107,74,0)");
      pctx.fillStyle=g; pctx.beginPath(); pctx.arc(x,y,r,0,TAU); pctx.fill();
    }
  }
  // vignette — the sheet darkens toward its edges
  const vg=pctx.createRadialGradient(vw()/2,vh()*0.42,mind()*0.35,
    vw()/2,vh()*0.5,Math.hypot(vw(),vh())*0.62);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,th.dark?"rgba(0,0,0,.5)":rgba(th.ink,.14));
  pctx.fillStyle=vg; pctx.fillRect(0,0,vw(),vh());
}

// ---- living suminagashi: pigment masses + mist + the wave band ----
const SPRC={};
function blobSprite(color){

// Real Navier-Stokes: inject → damp → pressure-project (vortices) →
// semi-Lagrangian advect. Your finger stirs actual currents.
const FW=26,FH=44,FN=FW*FH;
const fvx=new Float32Array(FN),fvy=new Float32Array(FN);
const fvx0=new Float32Array(FN),fvy0=new Float32Array(FN);
const fdiv=new Float32Array(FN),fpr=new Float32Array(FN);
const FI=(x,y)=>y*FW+x;
function fluidInject(px2,py2,dx,dy){
  if(reduced) return;
  const gx=px2/vw()*FW, gy=py2/vh()*FH, R=3.4;
  const x0=Math.max(1,Math.floor(gx-R)),x1=Math.min(FW-2,Math.ceil(gx+R));
  const y0=Math.max(1,Math.floor(gy-R)),y1=Math.min(FH-2,Math.ceil(gy+R));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const f=Math.exp(-((x-gx)*(x-gx)+(y-gy)*(y-gy))/(R*1.1));
    const i=FI(x,y);
    fvx[i]+=dx*0.02*f; fvy[i]+=dy*0.02*f;
  }
}
function fluidBurst(px2,py2,s){
  if(reduced) return;
  const gx=px2/vw()*FW, gy=py2/vh()*FH;
  for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){
    const dx=x-gx,dy=y-gy,d=Math.hypot(dx,dy)||1;
    const f=s*Math.exp(-d/3)/d;
    const i=FI(x,y); fvx[i]+=dx*f; fvy[i]+=dy*f;
  }
}
function fluidStep(){
  for(let i=0;i<FN;i++){fvx[i]*=0.985;fvy[i]*=0.985;}
  for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){
    const i=FI(x,y);
    fdiv[i]=-0.5*(fvx[i+1]-fvx[i-1]+fvy[i+FW]-fvy[i-FW]);
    fpr[i]=0;
  }
  for(let k=0;k<6;k++)
    for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){
      const i=FI(x,y);
      fpr[i]=(fdiv[i]+fpr[i-1]+fpr[i+1]+fpr[i-FW]+fpr[i+FW])*0.25;
    }
  for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){
    const i=FI(x,y);
    fvx[i]-=0.5*(fpr[i+1]-fpr[i-1]);
    fvy[i]-=0.5*(fpr[i+FW]-fpr[i-FW]);
  }
  fvx0.set(fvx); fvy0.set(fvy);
  for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){
    const i=FI(x,y);
    let bx=x-fvx0[i],by=y-fvy0[i];
    bx=clamp(bx,0.5,FW-1.5); by=clamp(by,0.5,FH-1.5);
    const x_=Math.floor(bx),y_=Math.floor(by),sx=bx-x_,sy=by-y_;
    const i00=FI(x_,y_),i10=i00+1,i01=i00+FW,i11=i01+1;
    fvx[i]=(fvx0[i00]*(1-sx)+fvx0[i10]*sx)*(1-sy)+(fvx0[i01]*(1-sx)+fvx0[i11]*sx)*sy;
    fvy[i]=(fvy0[i00]*(1-sx)+fvy0[i10]*sx)*(1-sy)+(fvy0[i01]*(1-sx)+fvy0[i11]*sx)*sy;
  }
}
function fluidAt(px2,py2){
  const gx=clamp(px2/vw()*FW,0.5,FW-1.5), gy=clamp(py2/vh()*FH,0.5,FH-1.5);
  const x_=Math.floor(gx),y_=Math.floor(gy),sx=gx-x_,sy=gy-y_;
  const i00=FI(x_,y_),i10=i00+1,i01=i00+FW,i11=i01+1;
  return {
    x:(fvx[i00]*(1-sx)+fvx[i10]*sx)*(1-sy)+(fvx[i01]*(1-sx)+fvx[i11]*sx)*sy,
    y:(fvy[i00]*(1-sx)+fvy[i10]*sx)*(1-sy)+(fvy[i01]*(1-sx)+fvy[i11]*sx)*sy};
}

  n.tx=vw()/2; n.ty=vh()*0.40; n.ts=1.8; n.top=1; setBlur(n,0);
  ripple(n.x,n.y,true);
  const ks=[...n.w].filter(c=>isKanji(c)&&c!==n.w);
  ks.forEach((c,i)=>{
    const g=spawnGlyph(c,n.x,n.y,false);
    g.orbit=mkOrbit(n,rIn(),-Math.PI/2+i*TAU/Math.max(ks.length,2),reduced?0:0.0006,rIn()*0.82);
    lvl.spawned.push(g); lvl.orbiters.push(g);
  });
  // a single-kanji word IS its kanji: orbit its radicals, never itself
  if(!ks.length&&n.w.length>=1&&isKanji(n.w[0])){
    const ch0=n.w[0];
    const comps=(COMP[ch0]||[...(KRAD[ch0]||"")].filter(c=>RADK[c]||RAD[c]||K[c])).slice(0,3);
    comps.forEach((c,i)=>{
      const g=spawnGlyph(c,n.x,n.y,true);
      g.orbit=mkOrbit(n,rIn(),-Math.PI/2+i*TAU/Math.max(comps.length,2),reduced?0:-0.0006,rIn()*0.82);
      lvl.spawned.push(g); lvl.orbiters.push(g);
    });
  }
  // particles this word travels with — their own doors
  const ps=[...(n.p||"")].filter(c=>PDEF[c]).slice(0,2);
  ps.forEach((c,i)=>{
    const pn=spawnPart(c,n.x,n.y);
    pn.orbit=mkOrbit(n,rIn()*1.28,Math.PI/2+(i?.9:-.9),reduced?0:0.0005,rOut()*0.95);
    lvl.spawned.push(pn); lvl.orbiters.push(pn);
  });
  const sibs=[];
  for(const rec of lvl.receded){
    const o=rec.n;
    if(o.kind!=="word"||o.gone) continue;
    if([...o.w].some(c=>ks.includes(c))){
      o.mode="orbit"; o.ts=orbitScale(o); o.top=0.92; setBlur(o,0);
      sibs.push(o); if(sibs.length>=5) break;
    }
  }
  if(sibs.length<5){
    const have=new Set([n.w]);
    for(const o of sibs) have.add(o.w);
    for(let i=0;i<deck.length&&sibs.length<5;){
      const e=deck[i];
      if(!have.has(e[0])&&[...e[0]].some(c=>ks.includes(c))){
        deck.splice(i,1); have.add(e[0]);
        const p=edgePoint();
        const s2=spawnWord(e,p[0],p[1],true);
        s2.mode="orbit"; s2.top=0.92;
        lvl.spawned.push(s2); sibs.push(s2);
      } else i++;
    }
  }
  if(sibs.length<4){
    const more=relationsFor(ks.length?ks:[...n.w],n.w,n.lvl||3);
    const have2=new Set(sibs.map(o=>o.w)); have2.add(n.w);
    for(const wr of more){
      if(sibs.length>=4) break;
      if(have2.has(wr.e[0])) continue;
      have2.add(wr.e[0]);
      const p=edgePoint();
      const s2=spawnWord(wr.e,p[0],p[1],true);
      s2.fromW=true; s2.mode="orbit"; s2.top=0.92; s2.ts=orbitScale(s2);
      lvl.spawned.push(s2); sibs.push(s2);
    }
  }
  sibs.forEach((o,i)=>{
    o.orbit=mkOrbit(n,rOut(),0.35+i*TAU/Math.max(sibs.length,3),reduced?0:-0.0004,rOut()*1.18);
    lvl.orbiters.push(o);
  });
  stack.push(lvl); markDive(n.w);
  if(!divedOnce){divedOnce=true;setHint("水にふれると戻る");}
}
function diveKanji(g){
  card.classList.remove("open");
  const parent=stack[stack.length-1];
  const lvl=beginLevel(g);
  const keep=new Set();
  if(parent){
    const pc=parent.center;
    if(pc.kind==="word"&&!pc.gone&&pc.w.includes(g.ch)) keep.add(pc);
    for(const o of parent.orbiters)
      if(o!==g&&o.kind==="word"&&!o.gone&&o.w.includes(g.ch)) keep.add(o);
  }
  recedeAllExcept(lvl,g,keep);
  // outer ring: words containing this kanji
  const orb=[...keep];
  const have=new Set(orb.map(o=>o.w));
  for(const e of WALL){
    if(orb.length>=4) break;
    if(!e[0].includes(g.ch)||have.has(e[0])) continue;
    const p=edgePoint();
    const s2=spawnWord(e,p[0],p[1],true);
    s2.fromW=true; s2.mode="orbit"; s2.top=0.92; s2.ts=orbitScale(s2);
    lvl.spawned.push(s2); orb.push(s2); have.add(e[0]);
  }
  orb.forEach((o,i)=>{
    o.orbit=mkOrbit(g,rOut(),-Math.PI/2+.5+i*TAU/Math.max(orb.length,3),reduced?0:(i%2?-0.0003:0.0004),rOut()*1.18);
    lvl.orbiters.push(o);
  });
  // mid ring: family kanji built from this character — pool members first
  // (they have words here), then common joyo family; the FULL family lives
  // on the planet's card, Kodansha-style
  const fam=familyOf(g.ch);
  const sibsK=kanjiWith(g.ch);
  if(fam) for(const c of fam){
    if(sibsK.length>=8) break;
    if(c!==g.ch&&!sibsK.includes(c)) sibsK.push(c);
  }
  sibsK.slice(0,8).forEach((c,i)=>{
    const s2=spawnGlyph(c,g.x,g.y,false);
    if(i>=3) s2.ts=0.82;
    s2.orbit=mkOrbit(g,rMid()*1.08,Math.PI/6+i*TAU/Math.max(Math.min(sibsK.length,8),3),reduced?0:0.00035,rMid());
    lvl.spawned.push(s2); lvl.orbiters.push(s2);
  });
  // radical ring: the kanji visibly comes apart — radicals detach one by
  // one from the glyph and take their own orbits, clear of the planet
  const comps=(COMP[g.ch]||[...(KRAD[g.ch]||"")].filter(c=>RADK[c]||RAD[c]||K[c])).slice(0,3);
  comps.forEach((c,i)=>{
    const s2=spawnGlyph(c,g.x,g.y,true);
    s2.top=0; s2.ts=1.15; s2.s=1.5;
    s2.orbit=mkOrbit(g,rIn(),-Math.PI/2+i*TAU/Math.max(comps.length,2),reduced?0:-0.0006,rIn()*0.85);
    setTimeout(function(){if(!s2.gone) s2.top=0.95;},250+i*280);
    lvl.spawned.push(s2); lvl.orbiters.push(s2);
  });
  g.mode="center"; g.el.classList.add("center");
  // a radical taking the center sheds its chip box: it IS a planet now
  if(g.comp){ g.el.classList.remove("comp"); lvl.centerWasComp=true; }
  g.tx=vw()/2; g.ty=vh()*0.40; g.ts=g.comp?3.0:2.2; g.top=1; setBlur(g,0);
  ripple(g.x,g.y,true);
  stack.push(lvl); markDive(g.ch);
}
function divePart(p){
  card.classList.remove("open");
  const parent=stack[stack.length-1];
  const lvl=beginLevel(p);
  const keep=new Set();
  if(parent){
    const pc=parent.center;
    if(pc.kind==="word"&&!pc.gone&&(pc.p||"").includes(p.ch)) keep.add(pc);
    for(const o of parent.orbiters)
      if(o!==p&&o.kind==="word"&&!o.gone&&(o.p||"").includes(p.ch)) keep.add(o);
  }
  recedeAllExcept(lvl,p,keep);
  const orb=[...keep];
  const have=new Set(orb.map(o=>o.w));
  for(const e of WALL){
    if(orb.length>=7) break;
    if(!(e[4]||"").includes(p.ch)||have.has(e[0])) continue;
    const pt=edgePoint();
    const s2=spawnWord(e,pt[0],pt[1],true);
    s2.fromW=true; s2.mode="orbit"; s2.top=0.92; s2.ts=orbitScale(s2);
    lvl.spawned.push(s2); orb.push(s2); have.add(e[0]);
  }
  orb.forEach((o,i)=>{
    o.orbit=mkOrbit(p,rMid(),-Math.PI/2+i*TAU/Math.max(orb.length,3),reduced?0:(i%2?0.0004:-0.0003),rMid()*1.15);
    lvl.orbiters.push(o);
  });
  p.mode="center"; p.el.classList.add("center");
  p.tx=vw()/2; p.ty=vh()*0.40; p.ts=2.0; p.top=1; setBlur(p,0);
  ripple(p.x,p.y,true);
  stack.push(lvl); markDive(p.ch);
}
let trailFx=null;
function surface(){
  const lvl=stack.pop(); if(!lvl) return;
  card.classList.remove("open");
  for(const rec of lvl.receded) if(!rec.n.gone) restore(rec.n,rec.saved);
  const c=lvl.center;
  if(!c.gone){
    restore(c,lvl.centerSaved);
    if(lvl.centerWasComp) c.el.classList.add("comp");
    if(lvl.centerSaved.mode==="free") c.el.classList.remove("center","unfolded");
    if(c.ephemeral){
      c.gone=true; c.top=0; c.el.style.pointerEvents="none";
      removeNode(c,700);
    }
  }
  for(const s of lvl.spawned){
    if(s.gone) continue;
    s.gone=true; s.top=0; s.el.style.pointerEvents="none";
    // zoom-out: this layer's spawn falls away beneath as you rise
    s.tx=(s.x+vw()/2)/2; s.ty=(s.y+vh()*0.40)/2+36; s.ts=s.ts*0.35;
    if(s.kind==="word"&&!s.fromW) deck.push([s.w,s.r,s.g,s.st,s.p,s.lvl]);
    removeNode(s,700);
  }
  veilUpdate();
  if(!stack.length){
    if(journey.length>=2&&!reduced) trailFx={labels:journey.slice(-6),born:performance.now()};
    journey=[]; loopMark=false;
    setTimeout(topUp,900);
  }
}
function drawTrail(t){
  if(!trailFx) return;
  const k=(t-trailFx.born)/2600;
  if(k>=1){trailFx=null;return;}
  const al=k<.15?k/.15:1-(k-.15)/.85;
  const L=trailFx.labels.length;
  const th=THEMES[themeIx];
  const gold=th.dark?"#E6C86E":"#A8842C";
  const pts=trailFx.labels.map((lb,i)=>({
    x:vw()*(0.5+(i-(L-1)/2)*0.15),
    y:vh()*0.66-(L>1?Math.sin((i/(L-1))*Math.PI)*26:0),lb}));
  fctx.strokeStyle=rgba(gold,.5*al); fctx.lineWidth=1;
  fctx.beginPath();
  pts.forEach((p,i)=>{i?fctx.lineTo(p.x,p.y):fctx.moveTo(p.x,p.y);});
  fctx.stroke();
  fctx.font='13px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  fctx.textAlign="center";
  for(const p of pts){
    fctx.fillStyle=rgba(gold,.9*al);
    fctx.beginPath(); fctx.arc(p.x,p.y,3,0,TAU); fctx.fill();
    fctx.fillText(p.lb,p.x,p.y-10);
  }
}

// ---- grading: pigment bloom / ink sink ----
const ripples=[],particles=[];
function ripple(x,y,big){
  ripples.push({x,y,r:big?10:4,alpha:big?0.5:0.32,sp:big?4.5:2.6,echo:false});
  fluidBurst(x,y,big?0.5:0.16);
  for(const b of blobs){
    const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy)||1;
    const f=(big?42:18)*Math.exp(-d/(mind()*0.5));
    b.ix+=dx/d*f; b.iy+=dy/d*f;
  }
}
function bloom(n){
  const th=THEMES[themeIx];
  const rect=n.el.getBoundingClientRect();
  const cols=[th.pig1,th.pig2,th.accent,th.dark?"#E6C86E":"#A8842C"];
  for(let i=0;i<32;i++){
    particles.push({x:rect.left+Math.random()*rect.width,
      y:rect.top+Math.random()*rect.height,
      vx:(Math.random()-.5)*2.6,vy:-0.6-Math.random()*1.6,
      grav:-0.012,size:1.4+Math.random()*2.4,life:1,
      a0:0.5+Math.random()*0.4,
      color:cols[Math.random()<0.12?3:Math.random()<0.14?2:(i%2)]});
  }
  ripple(n.x,n.y,false);
}
function sink(n){
  const th=THEMES[themeIx];
  const rect=n.el.getBoundingClientRect();
  const col=th.dark?th.pig1:th.ink;
  for(let i=0;i<24;i++){
    particles.push({x:rect.left+Math.random()*rect.width,
      y:rect.top+Math.random()*rect.height,
      vx:(Math.random()-.5)*0.7,vy:0.8+Math.random()*2.2,
      grav:0.10,size:1.6+Math.random()*2.6,life:1,
      a0:0.55,color:col});
  }
  addStain(clamp(n.x+(Math.random()-.5)*60,12,vw()-12),
    vh()-12-Math.random()*26,8+Math.random()*14,col,0.15);
}
// the word itself acts out the judgment: known blooms up and away in its own
// pigment; unknown turns 朱, falls the full height, and joins the ink pool.
function grade(n,dir){
  if(n.gone) return;
  n.gone=true; n.frozen=true;
  const lvl=stack[stack.length-1];
  const wasCenter=lvl&&lvl.center===n;
  const key=n.kind==="word"?n.w:n.ch;
  if(dir>0){
    settled++;bloom(n);
    store.known[key]=(store.known[key]||0)+1;
    if(store.unknown[key]) delete store.unknown[key];
  } else {
    gathered++;sink(n);
    store.unknown[key]=(store.unknown[key]||0)+1;
  }
  store.lk=settled; store.lu=gathered; saveStore();
  updateTray();
  if(unfolded===n) unfolded=null;
  if(focusN===n) clearBloom();
  if(n.wref) n.wref.node=null;
  const el=n.el;
  el.style.pointerEvents="none";
  const base="translate("+n.x.toFixed(1)+"px,"+n.y.toFixed(1)+"px) translate(-50%,-50%) ";
  el.style.transition="transform .95s cubic-bezier(.3,.6,.4,1), opacity .95s, color .3s";
  if(dir>0){
    el.style.transform=base+"translate(48px,-84px) scale("+(n.s*1.28).toFixed(2)+") rotate("+(n.cr+5).toFixed(1)+"deg)";
  } else {
    el.style.color="var(--accent)";
    el.style.transform=base+"translate(-26px,"+Math.max(140,vh()-n.y-56).toFixed(0)+"px) scale("+(n.s*0.6).toFixed(2)+") rotate(-11deg)";
  }
  el.style.opacity="0";
  removeNode(n,1000);
  if(n.kind==="word"&&!n.fromW) deck.push([n.w,n.r,n.g,n.st,n.p,n.lvl]);
  if(wasCenter) setTimeout(surface,350);
  if(!stack.length) setTimeout(topUp,1800);
}
function updateTray(){
  tray.innerHTML=(gathered?'拾った <b>'+gathered+"</b>":"")+
    (gathered&&settled?" · ":"")+(settled?"済み "+settled:"")+
    (maxDepth>=2?((gathered||settled)?" · ":"")+"深さ "+maxDepth:"");
}

// dive a kanji straight out of a family list — it materializes and takes
// the center; surfacing dissolves it back into the list it came from
function diveFromList(ch){
  if(!ch) return;
  card.classList.remove("open");
  const g=spawnGlyph(ch,vw()/2,vh()*0.62,false);
  g.ephemeral=true; g.op=0;
  diveKanji(g);
}

// ---- stroke-order sheet: handwritten on a note-paper cell ----
function strokeSheet(ch){
  const S=STROKES[ch]; if(!S) return null;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 109 109");
  const guide=document.createElementNS(NS,"path");
  guide.setAttribute("d","M54.5,5 V104 M5,54.5 H104");
  guide.setAttribute("stroke","var(--line)"); guide.setAttribute("stroke-width","0.7");
  guide.setAttribute("stroke-dasharray","3 3"); guide.setAttribute("fill","none");
  svg.appendChild(guide);
  const paths=[];
  for(const d of S.p){
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",d); p.setAttribute("fill","none");
    p.setAttribute("stroke","currentColor");
    p.setAttribute("stroke-width","3.2");
    p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-linejoin","round");
    svg.appendChild(p); paths.push(p);
  }
  (S.n||[]).forEach((xy,i)=>{
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",xy[0]); t.setAttribute("y",xy[1]);
    t.setAttribute("font-size","6.5"); t.setAttribute("fill","var(--faint)");
    t.textContent=String(i+1); t.style.opacity="0";
    svg.appendChild(t);
    if(paths[i]) paths[i]._num=t;
  });
  const play=()=>{
    let delay=140;
    for(const p of paths){
      const L=p.getTotalLength();
      p.style.transition="none";
      p.style.strokeDasharray=L+" "+L;
      p.style.strokeDashoffset=L;
      const dur=reduced?0:Math.max(200,L*9);
      setTimeout(((p2,d2)=>()=>{
        p2.style.transition="stroke-dashoffset "+d2+"ms ease-out";
        p2.style.strokeDashoffset="0";
        if(p2._num){p2._num.style.transition="opacity .5s";p2._num.style.opacity="0.8";}
      })(p,dur),delay);
      delay+=dur+90;
    }
  };
  return {svg,play};
}

// ---- card ----
function openCard(n){
  if(n.kind==="word"){
    const ks=[...n.w].filter(isKanji);
    card.innerHTML='<div class="yomi">'+n.r+'</div><h1>'+n.w+'</h1>'+
      '<div class="gloss">'+n.g+'</div><div class="row">'+
      ks.map(c=>'<div><div class="k">'+c+'</div><div class="kg">'+K[c]+'</div></div>').join("")+
      '</div><div class="note">実物では、ここから完全な辞書へ — in the real app this opens the full entry.</div>';
  } else if(n.kind==="part"){
    const d=PDEF[n.ch]||["","",""];
    const words=W.filter(e=>(e[4]||"").includes(n.ch));
    card.innerHTML='<div class="yomi">'+d[0]+'</div><h1>'+n.ch+'</h1>'+
      '<div class="gloss">'+d[2]+'</div>'+
      '<div class="row">'+words.slice(0,3).map(e=>'<div><div class="k" style="font-size:19px">'+e[0]+n.ch+'</div><div class="kg">'+e[2]+'</div></div>').join("")+
      '</div><div class="note">実物では、ここから助詞ページへ — opens the full particle page.</div>';
  } else {
    const words=WALL.filter(e=>e[0].includes(n.ch));
    const kin=kanjiWith(n.ch);
    const row=words.length?
      words.slice(0,3).map(e=>'<div><div class="k" style="font-size:19px">'+e[0]+'</div><div class="kg">'+e[2]+'</div></div>').join(""):
      kin.slice(0,3).map(c=>'<div><div class="k">'+c+'</div><div class="kg">'+glossOf(c)+'</div></div>').join("");
    const canStroke=!!STROKES[n.ch];
    const fam=familyOf(n.ch);
    const num=numOf(n.ch);
    const on=onOf(n.ch), kun=kunOf(n.ch);
    // Kodansha move: a radical's card carries its COMPLETE family — every
    // row a door, with ON and kun readings
    const famHtml=fam?('<div class="rhead">'+(num?("部首 "+num+" · "):"")+
      'この部首の漢字 · '+fam.length+'字</div>'+
      '<div class="rlist">'+[...fam].map(c=>
        '<div class="rrow" data-ch="'+c+'"><span class="rk">'+c+'</span>'+
        '<span class="rr">'+onOf(c)+(kunOf(c)?('<i>'+kunOf(c)+'</i>'):"")+'</span>'+
        '<span class="rm">'+glossOf(c)+'</span></div>').join("")+'</div>'):"";
    card.innerHTML='<div class="yomi">'+glossOf(n.ch)+(num?(' · 部首 '+num):"")+'</div>'+
      '<div class="kx"><h1>'+n.ch+'</h1>'+
      ((on||kun)?('<div class="rds">'+(on?('<div>'+on+'</div>'):"")+
        (kun?('<div class="kun">'+kun+'</div>'):"")+'</div>'):"")+
      (canStroke?'<button class="bt" id="strokeBtn">もう一度</button>':"")+'</div>'+
      '<div class="gloss">'+(words.length?("appears in "+words.length+" words here"):
        (fam?("builds "+fam.length+" kanji"):("builds "+kin.length+" kanji here")))+'</div>'+
      (row?('<div class="row">'+row+'</div>'):"")+famHtml+
      '<div class="note">実物では、ここから漢字ページへ — opens the full kanji page.</div>';
    const rl=card.querySelector(".rlist");
    if(rl) rl.addEventListener("click",e=>{
      const rr=e.target.closest?e.target.closest(".rrow"):null;
      if(rr) diveFromList(rr.getAttribute("data-ch"));
    });
    // stroke order is never hidden: it writes itself the moment the card
    // opens; the button replays it
    if(canStroke){
      const show=()=>{
        const old=card.querySelector(".scell");
        if(old) old.remove();
        const cell=document.createElement("div"); cell.className="scell";
        const sh=strokeSheet(n.ch);
        cell.appendChild(sh.svg);
        card.insertBefore(cell,card.querySelector(".note"));
        sh.play();
      };
      card.querySelector("#strokeBtn").addEventListener("click",show);
      show();
    }
  }
  card.classList.add("open");
}

function brush(x1,y1,x2,y2,t,i,color){
  const mx=(x1+x2)/2+(y2-y1)*0.15+Math.sin(t*0.0011+i*1.7)*9;
  const my=(y1+y2)/2-(x2-x1)*0.15+Math.cos(t*0.0009+i*2.3)*9;

  const passes=[[7,0.06],[3.2,0.13],[1.4,0.3]];

    fctx.strokeStyle=rgba(color,p[1]);
    fctx.lineWidth=p[0];

  }

// the vault made visible: every word in the world as ink — dots, hub suns,
// and word→hub edges. DOM carries only the nearest, worthiest words.
function drawWorld(){
  if(stack.length) return;
  const th=THEMES[themeIx];
  fctx.textAlign="center";
  const fs=clamp(54*Math.sqrt(cam.z),26,60);
  const hubA=cam.z<0.8?0.20:0.10;
  for(const h of HUBS){
    const p=HUBPOS[h], s=w2s(p.x,p.y);
    if(s.x<-180||s.x>vw()+180||s.y<-180||s.y>vh()+180) continue;
    let sp2=HUBSPR[h];
    if(!sp2){
      sp2=document.createElement("canvas"); sp2.width=sp2.height=96;
      const c2=sp2.getContext("2d");
      c2.font='84px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
      c2.textAlign="center"; c2.fillStyle=rgba(th.pig2,1);
      c2.fillText(h,48,76);
      HUBSPR[h]=sp2;
    }
    fctx.globalAlpha=hubA;
    fctx.drawImage(sp2,s.x-fs*0.57,s.y-fs*0.5,fs*1.14,fs*1.14);
    fctx.globalAlpha=1;

  const lw=half?1.3:0.8;
  const far=cam.z<0.5, edgeCap=far?230:440;
  const dotA1=rgba(th.pig1,(far?0.16:0.13)*(cam.z>0.8?0.6:1));
  const dotA2=rgba(th.pig1,(far?0.30:0.26)*(cam.z>0.8?0.6:1));
  fctx.lineWidth=0.8;
  const r2=Math.max(1,1.9*cam.z), rr=r2*2;

  const cs=Math.cos(cam.rot), sn=Math.sin(cam.rot), cz=cam.z;
  const ccx=cam.x, ccy=cam.y, hw=vw()/2, hh=vh()/2;
  const W2=vw()+50, H2=vh()+50;
  const HSX={},HSY={};
  for(const h of HUBS){
    const dx=HUBPOS[h].x-ccx, dy=HUBPOS[h].y-ccy;
    HSX[h]=hw+(dx*cs-dy*sn)*cz; HSY[h]=hh+(dx*sn+dy*cs)*cz;
  }
  const drawEdges=edges<edgeCap&&cz<1.5;
  const dotFaint=rgba(th.pig1,far?0.06:0.045);
  const r3=r2*1.35, rr3=r3*2;
  const dHit=[],dMid=[],dLow=[];
  const thin=cz<0.45?4:(far?2:1);
  for(const wr of WORDS){
    wi++;
    if(thin>1&&(wi%thin)) continue;
    if(wr.lk){}
    else if(wr.hl){wr.ox+=(wr.hx-wr.ox)*0.08; wr.oy+=(wr.hy-wr.oy)*0.08;}
    else if(wr.ret){wr.ox*=0.93; wr.oy*=0.93;
      if(wr.ox<2&&wr.ox>-2&&wr.oy<2&&wr.oy>-2) wr.ret=false;}
    else {
      wr.ox+=wr.dvx; if(wr.ox>16||wr.ox<-16) wr.dvx*=-1;
      wr.oy+=wr.dvy; if(wr.oy>12||wr.oy<-12) wr.dvy*=-1;
    }
    const dx=wr.wx+wr.ox-ccx, dy=wr.wy+wr.oy-ccy;
    const sx=hw+(dx*cs-dy*sn)*cz, sy=hh+(dx*sn+dy*cs)*cz;
    wr.sx=sx; wr.sy=sy;
    if(sx<-50||sx>W2||sy<-50||sy>H2) continue;
    wr.vis=frameCount;
    const lm=Math.abs((wr.e[5]||3)-level);
    if(!wr.node||wr.node.gone){
      (lm===0?dHit:lm===1?dMid:dLow).push(sx,sy);
    }
    if(drawEdges&&edges<edgeCap){
      const seg=lm===0?eB:eD;
      const s0=wr.e[0];
      for(let k2=0;k2<s0.length;k2++){
        const c=s0[k2];

  }

  lctx.fillStyle=dotA1;
  for(let k3=0;k3<dMid.length;k3+=2) lctx.fillRect(dMid[k3]-r2,dMid[k3+1]-r2,rr,rr);
  lctx.fillStyle=dotFaint;
  for(let k3=0;k3<dLow.length;k3+=2) lctx.fillRect(dLow[k3]-r2,dLow[k3+1]-r2,rr,rr);

  const draw=(seg,a)=>{
    if(!seg.length) return;

    lctx.strokeStyle=rgba(th.pig2,a*eScale);
    lctx.beginPath();
    for(let i2=0;i2<seg.length;i2+=4){

    }

  };

  // relative-mesh: shared-kanji chains, one batched stroke
  if(cz<1.6&&MESH.length){
    lctx.lineWidth=lw;
    lctx.strokeStyle=rgba(th.pig1,(cz<0.7?0.05:0.032)*(FOCUS.length?0.4:1));
    lctx.beginPath();
    let mdrawn=0;
    const mcap=cz<0.5?300:1200;
    for(let k2=0;k2<MESH.length&&mdrawn<mcap;k2+=2){
      const a=WORDS[MESH[k2]], b2=WORDS[MESH[k2+1]];
      if(a.vis!==frameCount||b2.vis!==frameCount) continue;
      lctx.moveTo(a.sx,a.sy);lctx.lineTo(b2.sx,b2.sy);mdrawn++;
    }

    const fx2=focusN.x, fy2=focusN.y;
    if(LOCK){
      const gold=th.dark?"#E6C86E":"#A8842C";
      const tyCol=t2=>t2==="syn"?th.pig1:t2==="fam"?th.pig2:
        t2==="col"?th.accent:t2?gold:th.pig2;
      fctx.strokeStyle=rgba(th.pig1,0.34); fctx.lineWidth=1.3;
      fctx.beginPath();
      for(const it of LOCK.items) if(it.t==="g"&&!it.g.gone){
        fctx.moveTo(fx2,fy2); fctx.lineTo(it.g.x,it.g.y);
      }
      fctx.stroke();
      fctx.lineWidth=1;
      for(const it of LOCK.items){
        if(it.t==="w"&&it.wr.vis===frameCount){
          const p2=it.pg&&!it.pg.gone?it.pg:null;
          fctx.strokeStyle=rgba(tyCol(it.ty),0.3);
          fctx.beginPath();
          fctx.moveTo(p2?p2.x:fx2,p2?p2.y:fy2);
          fctx.lineTo(it.wr.sx,it.wr.sy);
          fctx.stroke();
        } else if(it.t==="s"){
          const sp2=w2s(it.gx,it.gy);
          const p2=it.pg&&!it.pg.gone?it.pg:null;
          fctx.strokeStyle=rgba(tyCol(it.ty),0.26);
          fctx.beginPath();
          fctx.moveTo(p2?p2.x:fx2,p2?p2.y:fy2);
          fctx.lineTo(sp2.x,sp2.y);
          fctx.stroke();
          fctx.fillStyle=rgba(tyCol(it.ty),0.55);
          fctx.fillRect(sp2.x-2.2,sp2.y-2.2,4.4,4.4);
          fctx.font='11px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
          fctx.textAlign="center";
          fctx.fillStyle=rgba(tyCol(it.ty),0.92);

      fctx.strokeStyle=rgba(th.pig1,0.3); fctx.lineWidth=1.1;
      fctx.beginPath();

      }
      fctx.stroke();
    }
    fctx.fillStyle=rgba(th.pig1,0.55);
    for(const wr of FOCUS) if(wr.vis===frameCount)
      fctx.fillRect(wr.sx-2.4,wr.sy-2.4,4.8,4.8);
    fctx.font='11px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
    fctx.textAlign="center";
    fctx.fillStyle=rgba(th.dark?"#E6C86E":th.pig1,0.9);
    for(const wr of FOCUS) if(wr.vis===frameCount&&(!wr.node||wr.node.gone))
      fctx.fillText(wr.e[0],wr.sx,wr.sy-8);
  }
}
function hubAt(px2,py2){
  let best=null,bd=1e9;
  for(const h of HUBS){
    const s=w2s(HUBPOS[h].x,HUBPOS[h].y);
    const d=Math.hypot(s.x-px2,s.y-py2);
    if(d<bd){bd=d;best=h;}
  }
  return bd<Math.max(34,46*cam.z*0.7)?best:null;
}

// obsidian-graph whisper at the surface: shared-kanji words link up when near
let pairs=[],frameCount=0;
function rebuildPairs(){
  pairs.length=0;
  const free=nodes.filter(n=>n.kind==="word"&&!n.gone&&(n.mode==="free"||n.mode==="glide"));
  for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++){
    const a=free[i],b=free[j];
    if([...a.w].some(c=>isKanji(c)&&b.w.includes(c))) pairs.push([a,b]);
  }
}
function drawGraph(){
  if(stack.length) return;
  const th=THEMES[themeIx];
  for(const pr of pairs){
    const a=pr[0],b=pr[1];
    if(a.gone||b.gone) continue;
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d>210) continue;
    const al=(1-d/210)*.16;
    fctx.strokeStyle=rgba(th.pig2,al);
    fctx.lineWidth=1;
    fctx.beginPath(); fctx.moveTo(a.x,a.y); fctx.lineTo(b.x,b.y); fctx.stroke();
    fctx.fillStyle=rgba(th.pig2,al*1.5);
    fctx.beginPath(); fctx.arc(a.x,a.y,2,0,TAU); fctx.fill();
    fctx.beginPath(); fctx.arc(b.x,b.y,2,0,TAU); fctx.fill();
  }
}
function drawFx(t,dt){
  const th=THEMES[themeIx];
  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];
    rp.r+=rp.sp*(dt/16); rp.alpha*=Math.pow(0.955,dt/16);
    if(rp.alpha<0.02){ripples.splice(i,1);continue;}
    fctx.strokeStyle=rgba(th.pig2,rp.alpha);
    fctx.lineWidth=1.4;
    fctx.beginPath(); fctx.arc(rp.x,rp.y,rp.r,0,TAU); fctx.stroke();
    if(rp.r>26&&!rp.echo){rp.echo=true;ripples.push({x:rp.x,y:rp.y,r:4,alpha:rp.alpha*0.6,sp:rp.sp*0.8,echo:true});}
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=0.013*(dt/16);
    if(p.life<=0){particles.splice(i,1);continue;}
    p.vy+=p.grav*(dt/16); p.x+=p.vx*(dt/16); p.y+=p.vy*(dt/16);
    fctx.fillStyle=rgba(p.color,Math.max(0,Math.min(1,p.life*p.a0)));
    fctx.beginPath(); fctx.arc(p.x,p.y,p.size*(0.4+p.life*0.8),0,TAU); fctx.fill();
  }
}

// ---- frame loop ----
let lastT=0;
function frame(t){
  const dt=Math.min(34,(t-lastT)||16); lastT=t;
  if(!reduced) fluidStep();
  lockForce();
  drawInk(t);
  fctx.setTransform(fdpr,0,0,fdpr,0,0);
  fctx.clearRect(0,0,vw(),vh());
  drawStars(t);
  if(!reduced) drawMotes();
  if(stack.length){
    const lvl=stack[stack.length-1];
    const c=lvl.center;
    if(!c.gone){
      // light well — the diving eye brings its own lantern
      const th=THEMES[themeIx];
      const lw=fctx.createRadialGradient(c.x,c.y,0,c.x,c.y,mind()*0.5);
      lw.addColorStop(0,th.dark?rgba(th.pig1,.13):rgba(th.ground,.55));
      lw.addColorStop(1,th.dark?rgba(th.pig1,0):rgba(th.ground,0));
      fctx.fillStyle=lw;
      fctx.beginPath(); fctx.arc(c.x,c.y,mind()*0.5,0,TAU); fctx.fill();
      let i=0;
      for(const o of lvl.orbiters){
        if(!o.gone&&o.op>0.15){
          const col=o.kind==="word"?THEMES[themeIx].pig1:
            o.kind==="part"?THEMES[themeIx].accent:THEMES[themeIx].pig2;
          brush(c.x,c.y,o.x,o.y,t,i,col);
        }
        i++;
      }
      // second-degree whispers: orbiters that share a kanji link up too
      for(let a=0;a<lvl.orbiters.length;a++)
        for(let b2=a+1;b2<lvl.orbiters.length;b2++){
          const oa=lvl.orbiters[a],ob=lvl.orbiters[b2];
          if(oa.gone||ob.gone||oa.op<0.2||ob.op<0.2) continue;
          if(oa.kind!=="word"||ob.kind!=="word") continue;
          if(![...oa.w].some(ch2=>isKanji(ch2)&&ob.w.includes(ch2))) continue;
          fctx.strokeStyle=rgba(THEMES[themeIx].pig2,.1);
          fctx.lineWidth=1;
          fctx.beginPath();fctx.moveTo(oa.x,oa.y);fctx.lineTo(ob.x,ob.y);fctx.stroke();
        }
    }
  }
  // camera glides toward a locked constellation center
  if(camT&&stack.length===0){
    cam.x+=(camT.x-cam.x)*0.07; cam.y+=(camT.y-cam.y)*0.07;
    if(Math.abs(camT.x-cam.x)<3&&Math.abs(camT.y-cam.y)<3) camT=null;
    camClamp();
  }
  // camera momentum glides after a flick
  if(stack.length===0&&(Math.abs(cam.vx)>0.02||Math.abs(cam.vy)>0.02)){
    cam.x+=cam.vx; cam.y+=cam.vy; camClamp();
    cam.vx*=0.92; cam.vy*=0.92;
  }
  for(const n of nodes){
    if(n.removed||n.frozen) continue;
    if(n.mode==="free"&&!n.gone){
      if(n.wx!=null){
        const _o=n.wref;
        const s=w2s(n.wx+(_o?_o.ox:0),n.wy+(_o?_o.oy:0));
        if(!reduced){
          const fv=fluidAt(s.x,s.y);
          n.x=s.x+fv.x*(vw()/FW)*1.8; n.y=s.y+fv.y*(vh()/FH)*1.8;
        } else { n.x=s.x; n.y=s.y; }
      }
      n.tx=n.x; n.ty=n.y;
      const lod=cam.z<0.62;
      if(n.lod!==lod){n.lod=lod;n.el.classList.toggle("lod",lod);}
    } else if(n.mode==="glide"){
      if(n.wx!=null){const s=w2s(n.wx,n.wy);n.tx=s.x;n.ty=s.y;}
      n.x+=(n.tx-n.x)*0.07; n.y+=(n.ty-n.y)*0.07;
      if(Math.abs(n.tx-n.x)<2&&Math.abs(n.ty-n.y)<2) n.mode="free";
    } else {
      if(n.mode==="orbit"&&n.orbit&&!n.orbit.c.gone){
        const ob=n.orbit;
        ob.ang+=ob.spd*dt;
        const br=1+0.045*Math.sin(t*0.0011+ob.ang*2);
        const fv=reduced?{x:0,y:0}:fluidAt(n.x,n.y);
        n.tx=ob.c.x+Math.cos(ob.ang)*ob.rx*br+fv.x*(vw()/FW)*0.14;
        n.ty=ob.c.y+Math.sin(ob.ang)*ob.ry*br+fv.y*(vh()/FH)*0.14;
      }
      n.x+=(n.tx-n.x)*0.085; n.y+=(n.ty-n.y)*0.085;
    }
    n.s+=(n.ts-n.s)*0.09;
    n.op+=(n.top-n.op)*0.08;
    const rt=(n.mode==="center")?0:n.rot;
    n.cr+=(rt-n.cr)*0.08;
    n.el.style.opacity=((FOCUS.length&&n.mode==="free"&&!n.hlDom&&n!==focusN)?n.op*0.35:n.op).toFixed(3);
    const zs=(n.mode==="free"||n.mode==="glide")?cam.z:1;
    n.el.style.transform="translate("+(n.x+n.dragX).toFixed(1)+"px,"+(n.y+n.dragY).toFixed(1)+"px) translate(-50%,-50%) scale("+(n.s*zs).toFixed(3)+") rotate("+n.cr.toFixed(2)+"deg)";
  }
  if(FOCUS.length&&!lockOn&&t-bloomBorn>12000) clearBloom();
  if(frameCount%90===0) rebuildPairs();
  frameCount++;
  drawWorld();
  drawGraph();
  drawFx(t,dt);
  drawTrail(t);
  requestAnimationFrame(frame);
}
addEventListener("resize",sizeCanvases);
sizeCanvases();
initBlobs();
applyTheme(0);
updateTray();
buildWorld();
refreshActive();
setInterval(refreshActive,650);
if(!reduced) setInterval(function(){
  fluidInject(Math.random()*vw(),Math.random()*vh(),
    (Math.random()-.5)*26,(Math.random()-.5)*26);
},3600);
requestAnimationFrame(frame);
</script>
