<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Meguri 廻</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@700;900&family=Zen+Old+Mincho:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap">
<style>
/* Layout: one screen, one instrument. A row of verbs on top, the orbit field filling the middle,
   a pad of the last words heard, one line of counts. Every word is a station on a ring; a tap makes it the whole screen. */
:root{
  --paper:#ebe7dc; --paper-2:#ddd7c8; --ink:#1a1816; --ink-2:#6c665a; --line:rgba(26,24,22,.14);
  --shu:#c4432c; --ai:#3a63a3; --oudo:#c47f3c; --rokusho:#3e7d6a; --murasaki:#5f4e92; --sumi:#3a3632;
  --f-disp:'Dela Gothic One','Zen Old Mincho','Hiragino Mincho ProN',serif;
  --f-jp:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-lab:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --pig:var(--shu);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171e2b; --paper-2:#111724; --ink:#e9e1cf; --ink-2:#a7a08f; --line:rgba(233,225,207,.14);
    --shu:#de5b43; --ai:#8ba7d8; --oudo:#dba855; --rokusho:#6fb39d; --murasaki:#a696db; --sumi:#cfc7b5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171e2b; --paper-2:#111724; --ink:#e9e1cf; --ink-2:#a7a08f; --line:rgba(233,225,207,.14);
  --shu:#de5b43; --ai:#8ba7d8; --oudo:#dba855; --rokusho:#6fb39d; --murasaki:#a696db; --sumi:#cfc7b5; color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#ece4d1; --paper-2:#dfd4bb; --ink:#24211f; --ink-2:#6a6356; --line:rgba(36,33,31,.14);
  --shu:#c2402a; --ai:#2f4d7b; --oudo:#c0862e; --rokusho:#3e7d6a; --murasaki:#5f4e92; --sumi:#3a3632; color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-jp);overflow:hidden;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit}
/* verbs */
.bar{flex:none;display:flex;align-items:flex-end;gap:0;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.verb{flex:none;appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 6px 6px;border-bottom:2px solid transparent;cursor:pointer;min-width:38px;position:relative}
.verb b{font:400 17px/1 var(--f-jp)}
.verb i{font:italic 10px/1 var(--f-lab);color:var(--ink-2);letter-spacing:.02em;white-space:nowrap}
.verb[data-on="1"]{border-bottom-color:var(--shu)}
.verb[data-on="1"] i{color:var(--shu)}
.verb:focus-visible{outline:2px solid var(--shu);outline-offset:-2px;border-radius:6px}
.verb .dots{position:absolute;top:0;right:3px;font:700 9px/1 var(--f-lab);color:var(--shu);letter-spacing:1px;text-decoration:none}
.title{margin-left:auto;display:flex;align-items:baseline;gap:6px;padding:0 2px 8px 10px;flex:none}
.title .mark{font:400 22px/1 var(--f-disp);color:var(--shu)}
.title .name{font:italic 13px/1 var(--f-lab);color:var(--ink-2)}
/* field */
#field{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#field canvas{position:absolute;inset:0;display:block}
#live{cursor:pointer}
#grain{pointer-events:none}
.hint{position:absolute;left:14px;bottom:10px;font:italic 12px/1.35 var(--f-lab);color:var(--ink-2);pointer-events:none;transition:opacity .6s;max-width:58%}
.hint .jp{display:block;font:12px/1.4 var(--f-jp);color:var(--ink)}
.hint.off{opacity:0}
/* pad: the last words heard */
.pad{flex:none;display:flex;gap:6px;align-items:center;padding:6px 12px 2px;overflow-x:auto;scrollbar-width:none;min-height:46px}
.pad::-webkit-scrollbar{display:none}
.pad .lab{font:italic 11px/1 var(--f-lab);color:var(--ink-2);flex:none;margin-right:2px}
.key{flex:none;appearance:none;border:0;width:38px;height:64px;padding:0;border-radius:6px;background:#0d0d0d;color:#f1efd8;
  font:400 17px/1 var(--f-disp);writing-mode:vertical-rl;text-orientation:upright;display:grid;place-items:center;cursor:pointer;position:relative;letter-spacing:.02em;overflow:hidden}
.key::after{content:"";position:absolute;right:4px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--k,var(--shu))}
.key.two{font-size:12px}
.pad .lab{writing-mode:horizontal-tb}
.key:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
/* footer */
.foot{flex:none;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:4px 14px 6px;border-top:1px solid var(--line);
  font:italic 12px/1.3 var(--f-lab);color:var(--ink-2);min-height:26px}
.foot .jp{font:12px/1.3 var(--f-jp);color:var(--ink)}
.foot button{appearance:none;border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font:12px/1.3 var(--f-jp);cursor:pointer;margin-left:4px}
.foot button.yes{border-color:var(--shu);color:var(--shu)}
/* the word, whole screen */
.page{position:fixed;inset:0;z-index:30;background:var(--paper);color:var(--ink);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);
  transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(.14);opacity:0;
  transition:transform .46s cubic-bezier(.22,.9,.24,1.03),opacity .28s ease}
.page.in{transform:none;opacity:1}
.page-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--paper);padding:6px 0 8px;z-index:2}
.page-tools{display:flex;gap:6px}
.pbtn{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font:15px/1 var(--f-jp);
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:36px}
.pbtn i{font:italic 11px/1 var(--f-lab);color:var(--ink-2)}
.pbtn[data-on="1"]{border-color:var(--shu);color:var(--shu)}
.pbtn:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.poster{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:14px;padding:14px 0 10px}
.dots{display:flex;flex-direction:column;gap:9px;padding-top:12px}
.dots s{width:14px;height:14px;border-radius:50%;display:block;text-decoration:none;border:1.5px solid var(--line);box-sizing:border-box}
.dots s.on{background:var(--pig);border-color:var(--pig)}
.dots s.seal{border-radius:3px;background:var(--shu);border-color:var(--shu)}
.big{writing-mode:vertical-rl;text-orientation:upright;font:400 clamp(70px,23vw,132px)/1 var(--f-disp);letter-spacing:-.02em;margin:0 auto;white-space:nowrap}
.big span{display:inline;color:transparent;background:linear-gradient(180deg,var(--pig) 0 54%,var(--ink) 54% 100%);-webkit-background-clip:text;background-clip:text}
.big span:nth-child(even){background:linear-gradient(180deg,var(--ink) 0 46%,var(--pig) 46% 100%);-webkit-background-clip:text;background-clip:text}
.plate{margin:0 auto;display:block;max-width:100%;border-radius:10px}
.side{writing-mode:vertical-rl;padding-top:10px}
.reading{font:700 clamp(18px,5vw,26px)/1.2 var(--f-jp);letter-spacing:.06em}
.meaning{margin:0;font:italic clamp(17px,4.6vw,22px)/1.3 var(--f-lab);color:var(--ink-2);text-wrap:balance}
.def{margin:6px 0 0;font:15px/1.7 var(--f-jp)}
.kanji{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.kanji li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.kanji .c{font:400 28px/1 var(--f-disp);color:var(--pig)}
.kanji .r{font:14px/1.3 var(--f-jp)}
.kanji .m{font:italic 13px/1.3 var(--f-lab);color:var(--ink-2);display:block}
.kanji .more{font:italic 11px/1 var(--f-lab);color:var(--ink-2)}
.kanji .parts{grid-column:1/-1;display:none;gap:6px;flex-wrap:wrap;padding-top:2px}
.kanji li.open .parts{display:flex}
.kanji li.open .more{color:var(--pig)}
.parts span{font:15px/1 var(--f-jp);padding:5px 9px;border:1px solid var(--line);border-radius:6px}
.parts .lab{font:italic 12px/1 var(--f-lab);color:var(--ink-2);border:0;padding-left:0}
.sent{margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--line);font:16px/1.95 var(--f-jp)}
.sent mark{background:none;color:var(--pig);border-bottom:2px solid var(--pig)}
.page-foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font:italic 12px/1.3 var(--f-lab);color:var(--ink-2)}
.menu{position:absolute;right:18px;top:54px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;min-width:180px;box-shadow:0 10px 28px rgba(0,0,0,.14);z-index:3}
.menu button{appearance:none;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font:15px/1.2 var(--f-jp);display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--paper-2);outline:0}
.menu button small{font:italic 12px/1.2 var(--f-lab);color:var(--ink-2)}
.menu .new{display:none;gap:6px;padding:4px}
.menu.naming .new{display:flex}
.menu .new input{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);color:var(--ink);font:15px/1.2 var(--f-jp)}
.menu .new button{padding:6px 10px;border:1px solid var(--shu);color:var(--shu);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:999px;font:14px/1.2 var(--f-jp);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .page{transition:opacity .12s linear;transform:none} }
@media (min-width:720px){
  .page{padding-left:max(18px,calc(50vw - 330px));padding-right:max(18px,calc(50vw - 330px))}
  .big{font-size:clamp(90px,12vw,150px)}
}
</style>

<header class="bar" id="bar">
  <button class="verb" id="b-play" data-on="0" aria-label="turn the rings"><b>回</b><i>turn</i></button>
  <button class="verb" id="b-voice" data-v="1" aria-label="sound"><b>声</b><i>voice</i><s class="dots">·</s></button>
  <button class="verb" id="b-link" data-on="0"><b>結</b><i>link</i></button>
  <button class="verb" id="b-fly"><b>飛</b><i>fly</i></button>
  <button class="verb" id="b-grow" data-on="1"><b>育</b><i>grow</i></button>
  <button class="verb" id="b-drift" data-on="0"><b>漂</b><i>drift</i></button>
  <button class="verb" id="b-night"><b>夜</b><i>night</i></button>
  <button class="verb" id="b-reset"><b>戻</b><i>reset</i></button>
  <div class="title"><span class="mark">廻</span><span class="name">Meguri</span></div>
</header>

<main id="field">
  <canvas id="paper" aria-hidden="true"></canvas>
  <canvas id="live" role="img" aria-label="Thirty-six N1 words on five rings; a playhead on each ring reads the words in turn"></canvas>
  <canvas id="grain" aria-hidden="true"></canvas>
  <div class="hint" id="hint"><span class="jp">言葉を叩くと、画面いっぱいに開く。</span>Tap a word to open it. 回 turns the rings; the disc sets the beat.</div>
</main>

<div class="pad" id="pad"><span class="lab">heard</span></div>

<footer class="foot">
  <span class="jp" id="f-words">三十六語</span>
  <span class="jp">五声</span>
  <span id="f-bpm">72 bpm</span>
  <span id="f-passed">0 passed · 0 sealed</span>
  <span id="f-reset" hidden><span class="jp">全部戻す？</span><button class="yes" id="f-yes">はい</button><button id="f-no">いいえ</button></span>
</footer>

<section id="page" class="page" hidden role="dialog" aria-modal="true" aria-labelledby="p-word">
  <div class="page-bar">
    <button class="pbtn" id="p-back">←<i>back</i></button>
    <div class="page-tools">
      <button class="pbtn" id="p-say" aria-label="say it">声</button>
      <button class="pbtn" id="p-seal" data-on="0">印<i>seal</i></button>
      <button class="pbtn" id="p-save">▾<i>save</i></button>
    </div>
  </div>
  <div class="poster">
    <div class="dots" id="p-dots"></div>
    <div class="big" id="p-word"></div>
    <div class="side"><div class="reading" id="p-reading"></div></div>
  </div>
  <p class="meaning" id="p-meaning"></p>
  <p class="def" id="p-def"></p>
  <ol class="kanji" id="p-kanji"></ol>
  <blockquote class="sent" id="p-sent"></blockquote>
  <div class="page-foot"><span id="p-orbit"></span><span id="p-passes"></span></div>
  <div class="menu" id="menu" hidden></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $=s=>document.querySelector(s);

// five rings = five voices. Normalised to the field; period in seconds at 72 bpm; oct = octave of the ring's pluck.
const RING_DEF=[
  {g:'history', c:[.50,.40], r:[.44,.26], tilt:-.12, period:17, oct:1},
  {g:'ai',      c:[.48,.52], r:[.36,.33], tilt:.35,  period:13, oct:1},
  {g:'india',   c:[.54,.46], r:[.28,.40], tilt:-.55, period:21, oct:2},

  {g:'mind',    c:[.52,.49], r:[.47,.41], tilt:0,    period:26, oct:.5, dash:true}
];

let state=fresh();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object'){ state=Object.assign(fresh(),s); if(!state.lists||typeof state.lists!=='object') state.lists=freshLists(); if(!Array.isArray(state.heard)) state.heard=[]; } }catch(e){} }
let saveT=0; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} },200); }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KN=['〇','一','二','三','四','五','六','七','八','九'];
function kn(n){ if(n<10) return KN[n]; if(n<20) return '十'+(n%10?KN[n%10]:''); return KN[Math.floor(n/10)]+'十'+(n%10?KN[n%10]:''); }
function reiwaDate(d){ const y=d.getFullYear()-2018; return '令和'+(y===1?'元':kn(y))+'年'+kn(d.getMonth()+1)+'月'+kn(d.getDate())+'日'; }
// value noise, seeded; used for paper, brush pressure, flying white, woodcut edges
function hash2(i,j){ let n=(Math.imul(i,374761393)+Math.imul(j,668265263))|0; n=Math.imul(n^(n>>>13),1274126177); n^=n>>>16; return (n>>>0)/4294967296; }
function noise2(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi; const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1); return (a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v; }
function fbm(x,y,o){ let a=.5,s=0,n=0; for(let i=0;i<o;i++){ s+=a*noise2(x,y); n+=a; x=x*2.03+7.1; y=y*1.97+3.3; a*=.5; } return s/n; }

// ---- tokens
let T={};
function readTokens(){ const cs=getComputedStyle(document.documentElement); for(const k of ['paper','paper-2','ink','ink-2','shu','ai','oudo','rokusho','murasaki','sumi']) T[k]=cs.getPropertyValue('--'+k).trim(); const dt=document.documentElement.dataset.theme; T.dark=dt==='dark'||(!dt&&matchMedia('(prefers-color-scheme: dark)').matches); }
const pig=g=>T[PIG[g]];
const inkMode=()=>T.dark?'screen':'multiply';

// ---- geometry
const field=$('#field'), paper=$('#paper'), live=$('#live'), grain=$('#grain');
let W=360,H=600,DPR=1,rings=[];
function layoutRings(){ rings=RING_DEF.map((d,i)=>({...d,i,cx:d.c[0]*W,cy:d.c[1]*H,rx:d.r[0]*W,ry:d.r[1]*H,phi:rings[i]?rings[i].phi:(i*1.37)%TAU})); }
function ringPoint(r,t,k){ k=k==null?1:k; const ct=Math.cos(r.tilt),st=Math.sin(r.tilt); const x=r.rx*k*Math.cos(t),y=r.ry*k*Math.sin(t); return {x:r.cx+x*ct-y*st,y:r.cy+x*st+y*ct}; }
function resize(){ const b=field.getBoundingClientRect(); W=Math.max(300,b.width); H=Math.max(380,b.height); DPR=Math.min(2,window.devicePixelRatio||1); for(const c of [paper,live,grain]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); c.style.width=W+'px'; c.style.height=H+'px'; } layoutRings(); drawStatic(); drawGrain(); }

// ---- stations
const stations=WORDS.map((w,i)=>({i,w,g:w.g,ring:GROUPS.indexOf(w.g),t:0,k:1,kT:1,x:0,y:0,flash:0,last:0,seed:1000+i*37}));
(function(){ const rnd=mulberry32(1016); RING_DEF.forEach((r,ri)=>{ const ss=stations.filter(s=>s.g===r.g); ss.forEach((s,j)=>{ s.t=((j+.5)/ss.length)*TAU+ri*.37+(rnd()-.5)*.22; }); }); })();
const passes=s=>state.p[s.w.w]||0;
const depthK=p=>1-.45*Math.min(1,p/8);
function syncDepth(){ for(const s of stations) s.kT=depthK(passes(s)); }
function placeStations(){ for(const s of stations){ s.k+=(s.kT-s.k)*.06; const p=ringPoint(rings[s.ring],s.t,s.k); s.x=p.x; s.y=p.y; } }
const pairs=[]; for(let a=0;a<stations.length;a++) for(let b=a+1;b<stations.length;b++){ const A=stations[a].w.w,B=stations[b].w.w; for(const ch of A){ if(B.includes(ch)){ pairs.push([a,b,ch]); break; } } }
let pairIdx=0;
const byWord={}; for(const s of stations) byWord[s.w.w]=s;

// ---- ink: a paper tile, a bristle brush, a woodcut sun, leaves
let paperTile=null;
function makePaperTile(){ const n=256,c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); const id=g.createImageData(n,n); const d=id.data;

    g.globalAlpha=Math.min(1,inkA+.25); g.fillStyle=T.ink; g.font=`12px ${F.jp}`; g.fillText(s.w.w,s.x-7,s.y+34); g.globalAlpha=1;
  }
  // the level bar: one beat, rising in vermilion
  { const bx=W*.21,by=H*.16,bh=H*.11; g.strokeStyle=T['ink-2']; g.globalAlpha=.35; g.lineWidth=1; g.beginPath(); g.moveTo(bx,by); g.lineTo(bx,by+bh); g.stroke(); const lvl=playing?(1-master/TAU):0; g.globalAlpha=.9; g.fillStyle=T.shu; g.fillRect(bx-3,by+bh*(1-lvl),6,bh*lvl); g.globalAlpha=.8; g.fillStyle=T['ink-2']; g.font=`italic 9px ${F.lab}`; g.textAlign='center'; g.fillText('bar',bx,by+bh+11); g.textAlign='left'; g.globalAlpha=1; }

  g.save(); g.globalCompositeOperation=inkMode(); for(let i=flecks.length-1;i>=0;i--){ const f=flecks[i],u=(now-f.t)/f.life; if(u>=1){ flecks.splice(i,1); continue; } const e=1-Math.pow(1-u,3); g.globalAlpha=(1-u)*.9; g.fillStyle=f.c; g.beginPath(); g.arc(f.x+f.vx*e,f.y+f.vy*e,f.r*(1-u*.4),0,TAU); g.fill(); } g.restore();

  for(let i=floats.length-1;i>=0;i--){ const f=floats[i],u=(now-f.t)/1500; if(u>=1){ floats.splice(i,1); continue; } g.globalAlpha=u<.15?u/.15:1-(u-.15)/.85; g.fillStyle=f.c; g.font=`700 13px ${F.jp}`; g.textAlign='center'; g.fillText(f.txt,f.x,f.y-30-u*26); g.textAlign='left'; }

  const {cx,cy,R}=disc(); g.save(); g.globalCompositeOperation=inkMode(); const halo=g.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.9); halo.addColorStop(0,T.dark?'rgba(233,225,207,.18)':'rgba(36,33,31,.18)'); halo.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=halo; g.beginPath(); g.arc(cx,cy,R*1.9,0,TAU); g.fill(); g.restore();

  g.globalAlpha=1; g.fillStyle=T['ink-2']; g.font=`italic 10.5px ${F.lab}`; g.textAlign='center'; g.fillText(state.bpm+' bpm · tap',cx,cy+R+14); g.textAlign='left';

  if(pairs.length){ const [a,b,ch]=pairs[pairIdx%pairs.length]; const A=stations[a],B=stations[b]; g.strokeStyle=pig(A.g); g.lineWidth=1.2; g.beginPath(); g.arc(px+22,py+chh/2,11,0,TAU); g.stroke(); g.strokeStyle=pig(B.g); g.beginPath(); g.arc(px+cw-22,py+chh/2,11,0,TAU); g.stroke();
    g.fillStyle=T.ink; g.font=`italic 11px ${F.lab}`; g.textAlign='center'; g.fillText('A',px+22,py+chh/2+4); g.fillText('B',px+cw-22,py+chh/2+4); g.font=`15px ${F.jp}`; g.fillText(ch,px+cw/2,py+chh/2+5);
    g.strokeStyle=T.ink; g.lineWidth=.8; g.beginPath(); g.moveTo(px+38,py+chh/2); g.lineTo(px+cw/2-12,py+chh/2); g.moveTo(px+cw/2+12,py+chh/2); g.lineTo(px+cw-38,py+chh/2); g.stroke();
    g.fillStyle=T['ink-2']; g.font=`10px ${F.jp}`; g.fillText(A.w.w+'  ·  '+B.w.w,px+cw/2,py+chh+13); g.textAlign='left'; }
  else { g.fillStyle=T.ink; g.font=`15px ${F.jp}`; g.textAlign='center'; g.fillText('結',px+cw/2,py+chh/2+5); g.textAlign='left'; }
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r); g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r); g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r); g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r); g.closePath(); }

// ---- clock, crossing, firing
function tick(now){ const dt=Math.min(.05,last?(now-last)/1000:0); last=now;
  if(playing){ const speed=state.bpm/72; master=(master+dt*TAU/(240/state.bpm))%TAU;
    for(const r of rings){ const prev=r.phi; const cur=prev+dt*TAU/(r.period/speed);
      for(const s of stations){ if(s.ring!==r.i) continue; let a=s.t; while(a<=prev) a+=TAU; while(a>prev+TAU) a-=TAU; if(a<=cur) fire(s,false); }
      r.phi=cur%TAU; } }
  if(state.drift){ for(const s of stations){ s.t+=dt*.012*(s.ring%2?1:-1); s.t=((s.t%TAU)+TAU)%TAU; } }
  placeStations(); drawLive(now); requestAnimationFrame(tick); }
function fire(s,manual){ const now=performance.now(); if(now-s.last<400) return; s.last=now; const p=passes(s);
  if(state.grow&&!manual){ state.p[s.w.w]=p+1; s.kT=depthK(p+1); }
  s.flash=now; const col=pig(s.g); ripples.push({x:s.x,y:s.y,t:now,c:col}); floats.push({x:s.x,y:s.y,t:now,txt:s.w.r,c:T.ink});
  const rnd=mulberry32(now|0); const nf=7+Math.floor(rnd()*7); for(let i=0;i<nf;i++){ const a=rnd()*TAU,d=10+Math.pow(rnd(),.7)*34; flecks.push({x:s.x,y:s.y,vx:Math.cos(a)*d,vy:Math.sin(a)*d,r:.5+Math.pow(rnd(),2)*2.4,t:now,life:600+rnd()*500,c:rnd()<.6?T.ink:col}); }
  heard(s); pluck(s); if(state.voice>=2&&!state.sealed[s.w.w]) speak(s.w.w); updateFoot(); save(); }

// ---- the pad: the last eight words heard
const pad=$('#pad');
function heard(s){ const w=s.w.w; state.heard=[w].concat(state.heard.filter(x=>x!==w)).slice(0,8); renderPad(); }
function renderPad(){ for(const k of pad.querySelectorAll('.key')) k.remove(); for(const w of state.heard){ const s=byWord[w]; if(!s) continue; const b=document.createElement('button'); b.className='key'+(w.length>2?' two':''); b.textContent=w; b.style.setProperty('--k',pig(s.g)); b.title=s.w.r+' · '+s.w.m; b.onclick=()=>{ audio(); fire(s,true); speak(w); }; pad.appendChild(b); } }

// ---- sound: a plucked string per station, a drone under the rings, a room around it
let AC=null,masterG=null,wetG=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); masterG=AC.createGain(); masterG.gain.value=.5; masterG.connect(AC.destination);
      const conv=AC.createConvolver(); const len=Math.floor(AC.sampleRate*1.9); const ir=AC.createBuffer(2,len,AC.sampleRate); for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*(i<400?i/400:1); } conv.buffer=ir; wetG=AC.createGain(); wetG.gain.value=.32; wetG.connect(conv); conv.connect(masterG); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function pluck(s){ if(!state.voice||!AC) return; const r=rings[s.ring]; const f=SCALE[(s.i*7)%5]*r.oct; const t=AC.currentTime; const sealed=!!state.sealed[s.w.w]; const vol=sealed?.22:.5;
  // a Karplus-Strong string: a burst of noise through a tuned delay loop with a darkening filter
  const n=Math.floor(AC.sampleRate*.012); const buf=AC.createBuffer(1,n,AC.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf; const del=AC.createDelay(1); del.delayTime.value=1/f; const fb=AC.createGain(); fb.gain.value=.94-(r.oct>1?.04:0); const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(7000,f*7); const out=AC.createGain(); out.gain.setValueAtTime(vol,t); out.gain.exponentialRampToValueAtTime(.001,t+2.4);
  src.connect(del); del.connect(lp); lp.connect(fb); fb.connect(del); lp.connect(out); out.connect(masterG); out.connect(wetG); src.start(t); src.stop(t+.03); fb.gain.setTargetAtTime(0,t+2.3,.08);
  // a soft body under the string
  const o=AC.createOscillator(),bg=AC.createGain(); o.type='sine'; o.frequency.value=f; bg.gain.setValueAtTime(vol*.35,t); bg.gain.exponentialRampToValueAtTime(.001,t+.6); o.connect(bg); bg.connect(masterG); o.start(t); o.stop(t+.7); }
let drone=null;
function setDrone(on){ if(!AC) return; if(on&&!drone){ const g=AC.createGain(); g.gain.value=0; g.gain.setTargetAtTime(.05,AC.currentTime,1.5); const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320; const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=40; const os=[73.42,73.9,110.0].map((f,i)=>{ const o=AC.createOscillator(); o.type=i<2?'sine':'triangle'; o.frequency.value=f; o.connect(lp); o.start(); return o; });
    // soil: a bed of filtered noise under the strings
    const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1; const ns=AC.createBufferSource(); ns.buffer=nb; ns.loop=true; const ng=AC.createGain(); ng.gain.value=.12; ns.connect(ng); ng.connect(lp); ns.start(); os.push(ns);
    lp.connect(hp); hp.connect(g); g.connect(masterG); g.connect(wetG); drone={g,os}; }
  else if(!on&&drone){ const d=drone; drone=null; d.g.gain.setTargetAtTime(0,AC.currentTime,.6); setTimeout(()=>{ for(const o of d.os){ try{o.stop();}catch(e){} } },2500); } }
let voiceJa=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voiceJa=vs.find(v=>/ja/i.test(v.lang)&&/Kyoko|O-ren|Otoya|Google/.test(v.name))||vs.find(v=>/ja/i.test(v.lang))||null; }catch(e){} }
function speak(txt){ try{ if(!('speechSynthesis' in window)) return; if(speechSynthesis.pending) return; const u=new SpeechSynthesisUtterance(txt); u.lang='ja-JP'; u.rate=.9; if(voiceJa) u.voice=voiceJa; speechSynthesis.speak(u); }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

// ---- verbs
const bPlay=$('#b-play');
function setPlaying(on){ playing=on; bPlay.dataset.on=on?'1':'0'; bPlay.querySelector('b').textContent=on?'止':'回'; bPlay.querySelector('i').textContent=on?'stop':'turn'; if(on) audio(); setDrone(on&&state.voice>0); }

// ---- field taps: a word, the disc, the capsule
const taps=[];
function fieldTap(ev){ const b=live.getBoundingClientRect(); const x=ev.clientX-b.left,y=ev.clientY-b.top; $('#hint').classList.add('off');
  let best=null,bd=26; for(const s of stations){ const d=Math.hypot(s.x-x,s.y-y); if(d<bd){ bd=d; best=s; } }
  if(best){ audio(); fire(best,true); openPage(best); return; }
  const {cx,cy,R}=disc(); if(Math.hypot(x-cx,y-cy)<R+6){ const now=performance.now(); if(taps.length&&now-taps[taps.length-1]>2200) taps.length=0; taps.push(now); if(taps.length>6) taps.shift(); if(taps.length>=2){ let sum=0; for(let i=1;i<taps.length;i++) sum+=taps[i]-taps[i-1]; const bpm=Math.round(60000/(sum/(taps.length-1))); state.bpm=Math.max(40,Math.min(160,bpm)); save(); updateFoot(); } audio(); if(!playing) setPlaying(true); return; }
  const cw=124,chh=42,px=W-cw-18,py=H*.70; if(x>=px&&x<=px+cw&&y>=py-4&&y<=py+chh+16&&pairs.length){ pairIdx=(pairIdx+1)%pairs.length; const [a,b]=pairs[pairIdx]; audio(); fire(stations[a],true); setTimeout(()=>fire(stations[b],true),260); if(!state.link){ state.link=1; $('#b-link').dataset.on='1'; save(); } } }
live.addEventListener('pointerdown',fieldTap);

// ---- the word, whole screen
const page=$('#page'),menu=$('#menu'); let cur=null,posterAnim=null;
function openPage(s){ cur=s; const b=live.getBoundingClientRect(); page.style.setProperty('--pig',pig(s.g)); page.style.setProperty('--ox',(b.left+s.x)+'px'); page.style.setProperty('--oy',(b.top+s.y)+'px'); fillPage(s); page.hidden=false; page.scrollTop=0; menu.hidden=true; requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.add('in'))); }

  const big=$('#p-word'); big.textContent=''; if(posterAnim){ try{posterAnim.cancel();}catch(e){} posterAnim=null; }

  if(MP&&MP.render){ try{ const c=document.createElement('canvas'); c.className='plate'; const pr=Math.max(1,window.devicePixelRatio||1); const cw=Math.min(300,Math.floor(Math.min(window.innerWidth*.7,320))); const ch=Math.round(cw*(1.0+.42*w.w.length)); c.width=cw*pr; c.height=ch*pr; c.style.width=cw+'px'; c.style.height=ch+'px'; big.style.writingMode='horizontal-tb'; big.appendChild(c);
      const opts={ground:T.dark?'black':'paper',pigment:pig(s.g),dots:Math.min(6,p),sealed,reading:w.r,meaning:w.m};
      const go=()=>{ if(cur!==s||page.hidden) return; if(MP.animateIn&&!matchMedia('(prefers-reduced-motion:reduce)').matches) posterAnim=MP.animateIn(c,w.w,opts); else MP.render(c,w.w,opts); };
      // the renderer rasterises Noto Sans JP; draw once it is really loaded, so the first poster is never the fallback face

      if(document.fonts&&document.fonts.load) document.fonts.load("700 80px 'Noto Sans JP'",w.w).then(go,go); else go(); drawn=true; }catch(e){ big.textContent=''; } }
  if(!drawn){ big.style.writingMode=''; for(const ch of w.w){ const sp=document.createElement('span'); sp.textContent=ch; big.appendChild(sp); } }
  const dots=$('#p-dots'); dots.hidden=drawn; dots.textContent=''; for(let i=5;i>=0;i--){ const d=document.createElement('s'); if(sealed&&i===5) d.className='seal'; else if(i<Math.min(6,p)) d.className='on'; dots.appendChild(d); }
  $('#p-reading').textContent=w.r; $('#p-meaning').textContent=w.m; $('#p-def').textContent=w.d;
  const ol=$('#p-kanji'); ol.textContent='';
  for(const k of w.k){ const li=document.createElement('li'); const c=document.createElement('span'); c.className='c'; c.textContent=k.c; const mid=document.createElement('span'); const r=document.createElement('span'); r.className='r'; r.textContent=k.r; const m=document.createElement('span'); m.className='m'; m.textContent=k.m; mid.append(r,m); const more=document.createElement('span'); more.className='more'; more.textContent=k.p.length?'inside ›':''; const parts=document.createElement('span'); parts.className='parts'; if(k.p.length){ const lab=document.createElement('span'); lab.className='lab'; lab.textContent='made of'; parts.appendChild(lab); for(const q of k.p){ const sp=document.createElement('span'); sp.textContent=q; parts.appendChild(sp); } } li.append(c,mid,more,parts); li.onclick=()=>{ if(k.p.length) li.classList.toggle('open'); speak(k.c); }; ol.appendChild(li); }
  const bq=$('#p-sent'); bq.textContent=''; const idx=w.s.indexOf(w.w); if(idx>=0){ bq.append(w.s.slice(0,idx)); const mk=document.createElement('mark'); mk.textContent=w.w; bq.append(mk,w.s.slice(idx+w.w.length)); } else bq.textContent=w.s;
  $('#p-orbit').textContent=GROUP_JA[w.g]+' · '+GROUP_EN[w.g]+' · ×'+depthK(p).toFixed(2)+' to the centre';
  $('#p-passes').textContent=p+' pass'+(p===1?'':'es')+(sealed?' · sealed':'');
  const sb=$('#p-seal'); sb.dataset.on=sealed?'1':'0'; sb.querySelector('i').textContent=sealed?'sealed':'seal'; }
$('#p-back').onclick=closePage;
$('#p-say').onclick=()=>{ if(cur) speak(cur.w.w); };
$('#p-seal').onclick=()=>{ if(!cur) return; const w=cur.w.w; if(state.sealed[w]) delete state.sealed[w]; else state.sealed[w]=1; save(); fillPage(cur); updateFoot(); toast(state.sealed[w]?'印を押した':'印を外した'); };
$('#p-save').onclick=()=>{ if(menu.hidden) showMenu(); else menu.hidden=true; };

  for(const name of Object.keys(state.lists)){ const b=document.createElement('button'); const has=state.lists[name].includes(w); b.append(name); const sm=document.createElement('small'); sm.textContent=has?'✓ '+state.lists[name].length:String(state.lists[name].length); b.appendChild(sm); b.onclick=()=>{ if(!has) state.lists[name].push(w); save(); menu.hidden=true; toast('「'+name+'」に入れた'); }; menu.appendChild(b); }

  const row=document.createElement('div'); row.className='new'; const inp=document.createElement('input'); inp.id='new-list'; inp.placeholder='名前'; inp.maxLength=12; const ok=document.createElement('button'); ok.textContent='作る'; const make=()=>{ const n=inp.value.trim(); if(!n) return; if(!state.lists[n]) state.lists[n]=[]; if(!state.lists[n].includes(w)) state.lists[n].push(w); save(); menu.hidden=true; toast('「'+n+'」に入れた'); }; ok.onclick=make; inp.onkeydown=e=>{ if(e.key==='Enter') make(); }; row.append(inp,ok); menu.appendChild(row); menu.hidden=false; }
let toastT=0; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1500); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!menu.hidden) menu.hidden=true; else closePage(); } else if(e.key===' '&&page.hidden&&e.target===document.body){ e.preventDefault(); setPlaying(!playing); } });
function updateFoot(){ let passed=0,sealed=0; for(const s of stations){ if(passes(s)>0) passed++; if(state.sealed[s.w.w]) sealed++; } $('#f-passed').textContent=passed+' passed · '+sealed+' sealed'; $('#f-bpm').textContent=state.bpm+' bpm'; }

// ---- boot
function start(data){ load(); if(data&&data.state) state=Object.assign(fresh(),data.state); syncDepth(); for(const s of stations) s.k=s.kT; showVoice(); for(const k of ['link','grow','drift']) $('#b-'+k).dataset.on=state[k]?'1':'0';
  makePaperTile(); readTokens(); if(state.theme) document.documentElement.dataset.theme=state.theme; readTokens(); resize(); placeStations(); updateFoot(); renderPad(); requestAnimationFrame(tick);
  loadAssets(()=>{ drawStatic(); });
  try{ window.claude?.hot?.snapshot?.(()=>({state})); }catch(e){}
  window.__meguri={stations,openPage,fire,get state(){return state}}; }
new ResizeObserver(()=>{ resize(); placeStations(); }).observe(field);
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(()=>{ drawStatic(); renderPad(); }); if(document.fonts.load) document.fonts.load("700 80px 'Noto Sans JP'",WORDS.map(w=>w.w).join('')).catch(()=>{}); }
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data||null);
})();
