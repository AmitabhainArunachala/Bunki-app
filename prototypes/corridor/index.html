<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%239e2b25'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23fcfbf6' font-family='serif'%3E回%3C/text%3E%3C/svg%3E"
    />
    <title>回廊 KAIRO — corridor prototype</title>
    <meta
      name="description"
      content="An instrument for deciding, not a product: one continuous corridor over real graded Japanese, with four open Wayfinder decisions rendered as switchable variants."
    />
    <!-- a real file, not a data URI: iOS requests /apple-touch-icon.png
         implicitly, and an absent file was the one console 404 on the site -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- TENOHIRA PR 一: the corridor installs to a real home screen -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f1e9d3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="corridor.css" />
    <link rel="stylesheet" href="drift-layer.css" />
    <!-- Operator hotfix, issue #79 (2026-08-24).
         The canonical living-ink renderer loads asynchronously. The legacy SVG
         fallback used to begin painting during that pending interval, producing
         the lower-left flash seen on iPhone. Keep fallback available for a real
         engine failure, but never expose it while the canonical renderer is
         merely loading. The quiet-room canvas also used a radial mask that
         literally cropped edge-heavy kanji; the character must be shown whole. -->
    <style id="stroke-room-operator-fix-79">
      .stroke-page[data-ink-ready='pending'] .stroke-canvas {
        visibility: hidden !important;
      }

      .stroke-page[data-minimal='on'] .stroke-stage .ink-sheet {
        -webkit-mask-image: none !important;
        mask-image: none !important;
      }

      .stroke-page .stroke-stage,
      .stroke-page .ink-sheet {
        overflow: visible !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- the Drift universe (Phase 2): self-mounts #drift-layer, sleeps until
         the corridor's drift entry view wakes it via window.__DRIFT__ -->
    <script defer src="drift-layer.js"></script>
    <script type="module" src="corridor.js"></script>
    <!-- the https guard is deliberate: the verification suites drive the app
         over http://127.0.0.1 and must never inherit a worker's cache -->
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    </script>
    <noscript>
      <p style="font-family: serif; padding: 24px">
        回廊 needs JavaScript — the corridor composes itself from the corpus at run time.
      </p>
    </noscript>
  </body>
</html>
