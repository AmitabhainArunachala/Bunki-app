<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%239e2b25'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23fcfbf6' font-family='serif'%3E回%3C/text%3E%3C/svg%3E"
    />
    <title>回廊 KAIRO — corridor prototype</title>
    <meta
      name="description"
      content="An instrument for deciding, not a product: one continuous corridor over real graded Japanese, with four open Wayfinder decisions rendered as switchable variants."
    />
    <!-- a real file, not a data URI: iOS requests /apple-touch-icon.png
         implicitly, and an absent file was the one console 404 on the site -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- TENOHIRA PR 一: the corridor installs to a real home screen -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f1e9d3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ZEN-DOJO v2 type (operator, 2026-08-20): Shippori Mincho B1 for the
         card's word (the oldstyle metal-type revival — Android has no system
         mincho at all), Yuji Syuku (real shodō hand) for the kana reading,
         and a 4-glyph Kaisei Tokumin micro-subset for the 再難良易 seals.
         Offline falls back to Hiragino/Yu Mincho — the stacks expect it. -->
    <!-- SELF-HOSTED (fonts/, OFL 1.1): the corridor makes no runtime
         network requests — offline, the verifier's box, and the standalone
         all stay silent; a missing file falls back to Hiragino/Yu Mincho
         by design, and unicode-range keeps runtime cost to the chunks a
         card actually shows. -->
    <link rel="stylesheet" href="fonts.css" />
    <!-- the recorded roster is aboard: the app may fetch audio/manifest.json -->
    <script>
      window.__KAIRO_AUDIO__ = 1;
    </script>
    <link rel="stylesheet" href="corridor.css" />
    <link rel="stylesheet" href="drift-layer.css" />
    <!-- Operator hotfix, issue #79 (2026-08-24).
         The canonical living-ink renderer loads asynchronously. The legacy SVG
         fallback used to begin painting during that pending interval, producing
         the lower-left flash seen on iPhone. Keep fallback available for a real
         engine failure, but never expose it while the canonical renderer is
         merely loading. The quiet-room canvas also used a radial mask that
         literally cropped edge-heavy kanji; the character must be shown whole. -->
    <style id="stroke-room-operator-fix-79">
      .stroke-page[data-ink-ready='pending'] .stroke-canvas {
        visibility: hidden !important;
      }

      .stroke-page[data-minimal='on'] .stroke-stage .ink-sheet {
        -webkit-mask-image: none !important;
        mask-image: none !important;
      }

      .stroke-page .stroke-stage,
      .stroke-page .ink-sheet {
        overflow: visible !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      ORTHOGRAPHIC AUTHORITY GATE — operator acceptance, 2026-08-24.

      Bunki is a Japanese-learning instrument. The canonical KanjiVG paths
      selected by corridor.js define the learner-facing Japanese glyph and its
      stroke topology/order. AnimCJK is a beautiful rendering corpus, but it
      can contain regional or historical geometry that is legitimate CJK while
      being pedagogically wrong for the requested modern Japanese form
      (observed live: 経 was painted as 經).

      Until a checked equivalence manifest proves a decorative outline has the
      same Japanese glyph identity and stroke topology, fail closed: make
      AnimCJK unavailable to the living renderer. corridor.js already falls
      back to INK.strokesFromKanjiVG(paths), so the same fluid-ink engine still
      paints the character; only the secondary corpus loses authority to
      substitute geometry. This is corpus-wide, not an exception for 経.
    -->
    <script id="bunki-canonical-japanese-stroke-authority">
      (() => {
        const nativeFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const raw = typeof input === 'string' ? input : input && input.url;
          if (raw && /(?:^|\/)data\/share_alike\/animcjk\/[0-9a-f]{2}\.json(?:$|[?#])/i.test(raw)) {
            return Promise.resolve(
              new Response('', {
                status: 404,
                statusText: 'Bunki canonical Japanese stroke authority',
              }),
            );
          }
          return nativeFetch(input, init);
        };
        Object.defineProperty(window, '__BUNKI_STROKE_AUTHORITY__', {
          value: 'kanjivg-japanese-canonical',
          configurable: false,
          enumerable: false,
          writable: false,
        });
      })();
    </script>
    <!-- the Drift universe (Phase 2): self-mounts #drift-layer, sleeps until
         the corridor's drift entry view wakes it via window.__DRIFT__ -->
    <script defer src="drift-layer.js"></script>
    <script type="module" src="corridor.js"></script>
    <!-- the https guard is deliberate: the verification suites drive the app
         over http://127.0.0.1 and must never inherit a worker's cache -->
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    </script>
    <noscript>
      <p style="font-family: serif; padding: 24px">
        回廊 needs JavaScript — the corridor composes itself from the corpus at run time.
      </p>
    </noscript>
  </body>
</html>
