<script>
const GLYPHS = {"永": {"outlines": ["M440 112Q497 169 535 182Q553 183 562 168Q569 152 564 133Q546 85 477 72Q438 59 421 66Q414 69 418 83Q421 96 440 112Z", "M532 452Q532 353 546 330Q559 311 546 299Q524 280 486 264Q462 255 413 285Q371 301 306 311Q290 312 299 322Q309 332 324 338Q343 342 370 335Q406 325 441 313Q460 306 467 316Q473 334 475 362Q482 629 470 790Q469 820 459 833Q453 839 369 818Q342 805 344 821Q411 873 450 913Q463 932 480 938Q490 942 499 932Q541 884 540 823Q533 693 532 497C532 467 532 467 532 452Z", "M117 499Q104 499 102 508Q101 515 117 523Q163 548 192 537Q309 503 320 505Q333 508 323 535Q280 644 240 695Q200 753 126 814Q111 827 122 829Q132 830 153 820Q220 786 275 728Q327 676 394 538Q404 516 416 503Q431 491 422 481Q412 468 374 455Q353 445 305 466Q215 488 117 499Z", "M567 493Q639 448 745 374Q767 358 793 348Q817 338 806 318Q793 299 765 282Q740 266 725 268Q712 269 715 284Q719 318 641 395Q601 435 556 480C552 484 562 496 567 493Z", "M556 480Q543 464 532 452C521 441 523 485 532 497Q737 786 799 784Q871 774 933 765Q960 762 960 755Q961 748 930 735Q777 683 733 647Q678 604 567 493C560 484 560 484 556 480Z"], "medians": ["M421 74L554 171", "M305 317L464 286L511 319L499 846L473 886L351 818", "M110 506L183 515L326 480L375 497L265 703L128 824", "M723 273L752 341L562 484", "M534 466L771 721L953 752"]}, "道": {"outlines": ["M482 134C514 180 540 204 557 206C564 206 573 202 577 191C579 182 577 170 571 158C565 146 553 138 539 131C513 118 497 110 488 109C481 108 478 111 478 118C477 122 477 128 482 134Z", "M699 98C688 117 665 150 633 199C626 208 631 215 641 210C672 191 704 166 740 136C751 126 763 116 777 109C789 102 792 92 785 83C776 71 762 64 747 57C731 50 721 48 713 50C705 51 703 54 706 64C709 73 705 85 699 98Z", "M598 285C653 274 727 267 819 265C851 264 871 262 876 255C879 248 874 240 865 233C830 208 792 207 747 218C647 241 530 260 398 284C385 286 384 291 394 301C402 309 411 314 423 317C434 319 447 319 457 316C491 305 527 298 566 291C587 287 587 287 598 285Z", "M576 384C590 365 605 351 619 338C623 333 629 329 626 319C622 308 612 297 598 285C590 278 566 280 566 291C568 301 558 334 537 392C532 404 568 395 576 384Z", "M506 398C496 390 488 386 480 383C473 380 467 379 461 382C456 383 457 389 460 398C471 439 475 489 475 547C474 581 471 618 464 648C455 680 460 709 483 735C498 751 506 731 511 714C513 703 515 692 515 681C514 652 515 631 515 606C515 589 515 589 515 580C515 555 516 533 517 515C518 501 518 501 518 494C519 459 521 444 522 425C522 415 514 404 506 398Z", "M702 697C712 719 719 741 733 765C739 774 745 781 753 781C763 780 773 769 783 748C794 723 797 695 795 667C790 616 784 545 779 454C777 434 782 418 793 405C799 396 799 390 793 384C781 372 758 359 728 345C715 339 707 339 697 345C668 359 601 378 576 384C550 389 550 389 537 392C524 394 514 396 506 398C496 400 512 427 522 425C530 423 539 420 551 418C596 408 639 399 678 390C693 386 706 386 713 394C727 409 732 526 731 603C730 625 733 670 711 673C703 676 699 689 702 697Z", "M517 515C566 508 615 501 664 495C678 492 683 486 677 479C670 469 659 463 643 462C624 459 582 470 518 494C511 497 510 516 517 515Z", "M515 606C567 600 623 592 671 587C685 585 690 578 685 571C678 562 667 555 651 552C631 548 585 558 515 580C507 583 507 608 515 606Z", "M511 714C536 711 628 701 702 697C711 697 717 679 711 673C700 663 686 657 668 657C618 661 562 673 515 681C504 683 500 716 511 714Z", "M236 194C253 211 270 230 289 253C297 262 306 267 319 268C324 268 332 264 337 255C341 245 340 228 336 208C333 193 321 180 301 170C251 145 222 135 212 141C207 143 205 148 207 158C208 165 219 177 236 194Z", "M302 720C314 713 323 703 328 691C336 666 326 632 300 591C277 553 290 500 346 435C358 420 361 411 348 401C335 391 315 382 293 372C276 364 265 366 253 377C235 392 212 402 187 412C152 425 129 431 120 430C114 429 111 431 110 435C108 437 111 441 117 444C141 456 183 451 243 430C249 427 255 431 262 440C275 454 279 473 264 491C235 525 235 561 264 611C282 641 289 667 288 684C286 694 283 706 281 718C280 725 296 724 302 720Z", "M281 718C252 715 226 721 200 730C174 738 141 744 101 746C96 746 92 748 90 754C87 758 88 764 95 772C104 784 118 794 135 804C142 807 152 805 165 797C218 762 267 751 315 762C356 771 422 792 510 831C659 897 761 923 815 905C853 891 889 871 924 848C938 837 938 833 923 834C788 838 667 827 562 800C509 785 448 766 384 741C355 730 328 722 302 720C288 719 288 719 281 718Z"], "medians": ["M486 119L565 200", "M711 57L742 98L637 205", "M396 292L761 241L872 244", "M577 284L593 325L546 394", "M465 387L494 425L492 736", "M513 405L700 364L750 389L761 655L745 775", "M517 506L671 483", "M511 595L681 575", "M510 704L708 685", "M214 151L290 202L329 260", "M118 437L268 403L313 432L266 539L309 671L289 716", "M94 757L148 773L298 739L743 869L926 838"]}};
const DPR = Math.min(2.5, window.devicePixelRatio || 1);
const CARD = document.getElementById('card');
const SIZE = 480; // css px square
CARD.width = SIZE * DPR; CARD.height = SIZE * DPR;
CARD.style.height = 'auto';
const CTX = CARD.getContext('2d');
const K = SIZE * DPR / 1024; // glyph space → device px

/* ------------------------------------------------ tiny seeded RNG */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ------------------------------------------------ noise + granulation tiles */
function makeGrain(seed, dark) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const r = rng(seed);
  const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 180 + r() * 75;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = dark ? 26 + r() * 34 : 16 + r() * 26;
  }
  g.putImageData(img, 0, 0);
  return c;
}
const GRAIN = makeGrain(7, true);

/* ------------------------------------------------ washi grounds */
function makePaper(theme) {
  const c = document.createElement('canvas'); c.width = c.height = SIZE * DPR;
  const g = c.getContext('2d'); const r = rng(theme === 'day' ? 11 : 23);
  const S = SIZE * DPR;
  if (theme === 'day') {
    const base = g.createLinearGradient(0, 0, S * 0.9, S);
    base.addColorStop(0, '#f4ecd6'); base.addColorStop(0.55, '#ecdfc0'); base.addColorStop(1, '#e3d2ae');
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    const glow = g.createRadialGradient(S*0.32, S*0.24, S*0.05, S*0.32, S*0.24, S*0.85);
    glow.addColorStop(0, 'rgba(255,252,240,0.55)'); glow.addColorStop(1, 'rgba(255,252,240,0)');
    g.fillStyle = glow; g.fillRect(0, 0, S, S);
  } else {
    const base = g.createLinearGradient(0, 0, S * 0.8, S);
    base.addColorStop(0, '#1c2547'); base.addColorStop(0.5, '#151c39'); base.addColorStop(1, '#0d1128');
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    const glow = g.createRadialGradient(S*0.5, S*0.18, S*0.05, S*0.5, S*0.18, S*0.9);
    glow.addColorStop(0, 'rgba(64,82,140,0.5)'); glow.addColorStop(1, 'rgba(64,82,140,0)');
    g.fillStyle = glow; g.fillRect(0, 0, S, S);
  }
  // long kōzo fibers — the paper's true grain
  const fiberN = 2600;
  for (let i = 0; i < fiberN; i++) {
    const x = r() * S, y = r() * S, len = (14 + r() * 90) * DPR;
    const a = r() * Math.PI * 2 * 0.08 + (r() < 0.5 ? 0 : Math.PI / 2) + (r() - 0.5) * 0.9;
    const bend = (r() - 0.5) * 30 * DPR;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 - Math.sin(a) * bend, y + Math.sin(a) * len * 0.5 + Math.cos(a) * bend, x + Math.cos(a) * len, y + Math.sin(a) * len);
    if (theme === 'day') {
      const tone = r();
      g.strokeStyle = tone < 0.82 ? `rgba(184,164,124,${0.05 + r() * 0.09})` : `rgba(250,244,226,${0.10 + r() * 0.12})`;
    } else {
      const tone = r();
      g.strokeStyle = tone < 0.86 ? `rgba(64,80,138,${0.07 + r() * 0.1})` : `rgba(150,164,210,${0.05 + r() * 0.08})`;
    }
    g.lineWidth = (0.4 + r() * 0.8) * DPR;
    g.stroke();
  }
  // fiber clumps — the cloudiness of handmade sheets
  for (let i = 0; i < 46; i++) {
    const x = r() * S, y = r() * S, rad = (26 + r() * 90) * DPR;
    const cl = g.createRadialGradient(x, y, 0, x, y, rad);
    if (theme === 'day') { cl.addColorStop(0, `rgba(226,208,170,${0.05 + r() * 0.09})`); cl.addColorStop(1, 'rgba(226,208,170,0)'); }
    else { cl.addColorStop(0, `rgba(38,50,96,${0.10 + r() * 0.12})`); cl.addColorStop(1, 'rgba(38,50,96,0)'); }
    g.fillStyle = cl; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
  }
  // sunago gold dust on the night sheet
  if (theme === 'night') {
    for (let i = 0; i < 230; i++) {
      const x = r() * S, y = r() * S, rad = (0.5 + r() * 1.9) * DPR;
      g.fillStyle = r() < 0.3 ? `rgba(240,220,150,${0.25 + r() * 0.5})` : `rgba(202,164,68,${0.18 + r() * 0.4})`;
      g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
      if (r() < 0.12) { // a few kirihaku foil squares
        g.save(); g.translate(x, y); g.rotate(r() * 3);
        g.fillStyle = `rgba(226,190,96,${0.3 + r() * 0.35})`;
        g.fillRect(-2.4 * DPR, -2.4 * DPR, 4.8 * DPR, 4.8 * DPR); g.restore();
      }
    }
  }
  // vignette
  const v = g.createRadialGradient(S/2, S/2, S*0.42, S/2, S/2, S*0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, theme === 'day' ? 'rgba(94,74,44,0.16)' : 'rgba(0,0,6,0.4)');
  g.fillStyle = v; g.fillRect(0, 0, S, S);
  return c;
}

/* ------------------------------------------------ median utilities */
function parseMedian(d) {
  const nums = d.match(/-?[\d.]+/g).map(Number);
  const pts = [];
  for (let i = 0; i < nums.length; i += 2) pts.push([nums[i], nums[i+1]]);
  return pts;
}
function medianLen(pts) {
  let L = 0; const cum = [0];
  for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); cum.push(L); }
  return { L, cum };
}
function pointAt(pts, cum, t) {
  const target = t * cum[cum.length-1];
  let i = 1; while (i < cum.length && cum[i] < target) i++;
  if (i >= cum.length) return pts[pts.length-1];
  const f = (target - cum[i-1]) / (cum[i] - cum[i-1] || 1);
  return [pts[i-1][0] + (pts[i][0]-pts[i-1][0]) * f, pts[i-1][1] + (pts[i][1]-pts[i-1][1]) * f];
}

/* ------------------------------------------------ stroke sprites (the ink itself) */
function makeStrokeSprite(outline, medPts, medCum, palette) {
  const S = SIZE * DPR;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const path = new Path2D(outline);
  g.save(); g.scale(K, K);
  // body: ink with a gentle flow gradient along the stroke
  const p0 = medPts[0], p1 = medPts[medPts.length-1];
  const grad = g.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
  grad.addColorStop(0, palette.inkDeep);
  grad.addColorStop(0.45, palette.ink);
  grad.addColorStop(1, palette.inkThin);
  g.fillStyle = grad; g.fill(path);
  // rim darkening — wet ink dries darker at its edges
  g.strokeStyle = palette.rim; g.lineWidth = 7; g.globalAlpha = 0.5;
  g.save(); g.clip(path); g.stroke(path); g.restore();
  g.globalAlpha = 1;
  // 起筆 pool — the press of the entering brush
  const entry = medPts[0];
  const pool = g.createRadialGradient(entry[0], entry[1], 2, entry[0], entry[1], 52);
  pool.addColorStop(0, palette.rim); pool.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.clip(path); g.globalAlpha = 0.34; g.fillStyle = pool;
  g.beginPath(); g.arc(entry[0], entry[1], 54, 0, 7); g.fill(); g.restore();
  g.restore();
  // granulation clipped to the ink
  g.save(); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = palette.grainAlpha;
  g.fillStyle = g.createPattern(GRAIN, 'repeat'); g.fillRect(0, 0, S, S); g.restore();
  // gold shimmer streaks for kindei
  if (palette.shimmer) {
    g.save(); g.globalCompositeOperation = 'source-atop';
    const sh = g.createLinearGradient(0, 0, S, S * 0.9);
    sh.addColorStop(0, 'rgba(255,238,180,0)'); sh.addColorStop(0.45, 'rgba(255,240,190,0.4)');
    sh.addColorStop(0.55, 'rgba(150,104,20,0.25)'); sh.addColorStop(1, 'rgba(255,236,170,0)');
    g.fillStyle = sh; g.fillRect(0, 0, S, S); g.restore();
  }
  return c;
}
function makeBleed(sprite, palette) {
  const S = SIZE * DPR;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.filter = `blur(${5 * DPR}px)`;
  g.globalAlpha = palette.bleedAlpha;
  g.drawImage(sprite, 0, 0);
  g.filter = 'none';
  return c;
}

/* ------------------------------------------------ palettes */
const PAL = {
  day: {
    live:    { ink: '#c03a20', inkDeep: '#8e2412', inkThin: '#d05a34', rim: '#7c1d0c', grainAlpha: 0.5, bleedAlpha: 0.12 },
    settled: { ink: '#26211a', inkDeep: '#161310', inkThin: '#3a332a', rim: '#0d0b08', grainAlpha: 0.6, bleedAlpha: 0.16 },
    seal: '#b3341f', paper: 'day',
  },
  night: {
    live:    { ink: '#f2d372', inkDeep: '#caa23c', inkThin: '#f8e6a8', rim: '#a37c1c', grainAlpha: 0.42, bleedAlpha: 0.10, shimmer: true },
    settled: { ink: '#c9a544', inkDeep: '#9d7b24', inkThin: '#dabd6e', rim: '#7c5f14', grainAlpha: 0.5, bleedAlpha: 0.13, shimmer: true },
    seal: '#d8b04a', paper: 'night',
  },
};

/* ------------------------------------------------ stroke typing → velocity */
function strokeProfile(medPts, cum) {
  const L = cum[cum.length-1];
  const n = medPts.length;
  const last = Math.hypot(medPts[n-1][0]-medPts[n-2][0], medPts[n-1][1]-medPts[n-2][1]);
  const exitFrac = last / L;
  // a long committed exit segment = a sweep (払い・はね): the brush leaves fast.
  // a short end = 止め: the brush stops and the ink pools.
  return exitFrac > 0.30 ? 'sweep' : L < 220 ? 'dot' : 'stop';
}
function easeFor(type) {
  if (type === 'sweep') return (k) => k < 0.18 ? 0.5 * (k/0.18) * (k/0.18) * 0.18 / 0.5 * 0.5 + k*0 + (k/0.18)*(k/0.18)*0.09 : 0.09 + (k-0.18)/0.82 * 0.91 * (1 + (k-0.18)*0.35);
  if (type === 'dot') return (k) => 1 - Math.pow(1-k, 2.2);
  return (k) => k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2; // stop: settle in
}

/* ------------------------------------------------ the writing engine */
let state = null;
function setup(glyphName, theme) {
  const S = SIZE * DPR;
  const glyph = GLYPHS[glyphName];
  const pal = PAL[theme];
  const strokes = glyph.outlines.map((o, i) => {
    const medPts = parseMedian(glyph.medians[i]);
    const { L, cum } = medianLen(medPts);
    const type = strokeProfile(medPts, cum);
    return {
      outline: o, medPts, cum, L, type,
      liveSprite: makeStrokeSprite(o, medPts, cum, pal.live),
      setSprite:  makeStrokeSprite(o, medPts, cum, pal.settled),
      bleed: null, // built lazily at settle time
      dur: 340 + Math.pow(L, 0.88) * 2.6,
    };
  });
  const base = document.createElement('canvas'); base.width = base.height = S;
  base.getContext('2d').drawImage(makePaper(pal.paper), 0, 0);
  state = { glyphName, theme, strokes, pal, base, i: 0, t0: performance.now() + 600, settling: null, done: false, sparklePhase: 0 };
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!state) return;
  const S = SIZE * DPR;
  const st = state;
  CTX.clearRect(0, 0, S, S);
  CTX.drawImage(st.base, 0, 0);

  // night sparkle breathes on the sunago
  if (st.theme === 'night') {
    st.sparklePhase = now / 900;
    CTX.save(); CTX.globalAlpha = 0.10 + Math.sin(st.sparklePhase) * 0.05;
    CTX.globalCompositeOperation = 'lighter';
    CTX.drawImage(st.base, 0, 0);
    CTX.restore();
  }

  if (st.done) return;
  const s = st.strokes[st.i];
  if (!s) { st.done = true; return; }
  const raw = (now - st.t0) / s.dur;

  if (st.settling) {
    // crossfade live → settled, bleed sinking beneath
    const k = Math.min(1, (now - st.settling) / 460);
    const g = st.base.getContext('2d');
    if (k >= 1) {
      if (!s.bleed) s.bleed = makeBleed(s.setSprite, st.pal.settled);
      g.globalAlpha = 1; g.drawImage(s.bleed, 0, 0); g.drawImage(s.setSprite, 0, 0);
      // seal numeral at the stroke's origin (day) / gold point (night)
      const e = s.medPts[0];
      g.save(); g.scale(K, K);
      if (st.theme === 'day') {
        g.fillStyle = 'rgba(179,52,31,0.9)';
        g.beginPath(); g.arc(e[0]-46, e[1]-42, 26, 0, 7); g.fill();
        g.fillStyle = '#f5ecd9'; g.font = '36px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('一二三四五六七八九十十二'.slice(st.i, st.i+1) || String(st.i+1), e[0]-46, e[1]-40);
      } else {
        g.fillStyle = 'rgba(216,176,74,0.85)';
        g.beginPath(); g.arc(e[0]-40, e[1]-40, 8, 0, 7); g.fill();
      }
      g.restore();
      st.settling = null; st.i += 1; st.t0 = now + (s.type === 'stop' ? 300 : 170);
      if (st.i >= st.strokes.length) {
        st.done = true;
        setTimeout(() => { if (state === st) { setup(st.glyphName, st.theme); } }, 3400);
      }
      return;
    }
    CTX.save(); CTX.globalAlpha = 1 - k; CTX.drawImage(s.liveSprite, 0, 0); CTX.restore();
    CTX.save(); CTX.globalAlpha = k; CTX.drawImage(s.setSprite, 0, 0); CTX.restore();
    return;
  }

  if (raw < 0) return; // breath before the first stroke
  const k = Math.min(1, raw);
  const t = Math.min(1, easeFor(s.type)(k));

  // reveal the true outline along its median — the brush's own clip
  const mask = document.createElement('canvas'); mask.width = mask.height = S;
  const mg = mask.getContext('2d');
  mg.drawImage(s.liveSprite, 0, 0);
  mg.globalCompositeOperation = 'destination-in';
  mg.save(); mg.scale(K, K);
  mg.strokeStyle = '#fff'; mg.lineWidth = 190; mg.lineCap = 'round'; mg.lineJoin = 'round';
  mg.beginPath();
  const upto = t * s.cum[s.cum.length-1];
  mg.moveTo(s.medPts[0][0], s.medPts[0][1]);
  for (let i = 1; i < s.medPts.length; i++) {
    if (s.cum[i] <= upto) mg.lineTo(s.medPts[i][0], s.medPts[i][1]);
    else {
      const f = (upto - s.cum[i-1]) / (s.cum[i] - s.cum[i-1] || 1);
      mg.lineTo(s.medPts[i-1][0] + (s.medPts[i][0]-s.medPts[i-1][0])*f, s.medPts[i-1][1] + (s.medPts[i][1]-s.medPts[i-1][1])*f);
      break;
    }
  }
  mg.stroke(); mg.restore();
  CTX.drawImage(mask, 0, 0);

  // the brush tip: a wet dab riding the median
  const tip = pointAt(s.medPts, s.cum, t);
  CTX.save(); CTX.scale(K, K);
  const tipGrad = CTX.createRadialGradient(tip[0], tip[1], 2, tip[0], tip[1], 34);
  tipGrad.addColorStop(0, st.theme === 'day' ? 'rgba(140,28,12,0.5)' : 'rgba(255,240,190,0.55)');
  tipGrad.addColorStop(1, 'rgba(0,0,0,0)');
  CTX.fillStyle = tipGrad; CTX.beginPath(); CTX.arc(tip[0], tip[1], 34, 0, 7); CTX.fill();
  CTX.restore();

  if (k >= 1) st.settling = now;
}
requestAnimationFrame(frame);

/* ------------------------------------------------ controls */
let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
let glyphName = '永';
const sun = document.getElementById('sun'), moon = document.getElementById('moon');
const kEi = document.getElementById('k-ei'), kMichi = document.getElementById('k-michi');
function refreshChips() {
  sun.classList.toggle('on', theme === 'day');
  moon.classList.toggle('on', theme === 'night');
  kEi.classList.toggle('on', glyphName === '永');
  kMichi.classList.toggle('on', glyphName === '道');
  document.getElementById('hint').textContent = theme === 'day'
    ? '朱で書き、墨に鎮まる。紙は繊維まで漉いてある。'
    : '紺紙に金泥。砂子が呼吸する。';
}
sun.addEventListener('click', () => { theme = 'day'; refreshChips(); setup(glyphName, theme); });
moon.addEventListener('click', () => { theme = 'night'; refreshChips(); setup(glyphName, theme); });
kEi.addEventListener('click', () => { glyphName = '永'; refreshChips(); setup(glyphName, theme); });
kMichi.addEventListener('click', () => { glyphName = '道'; refreshChips(); setup(glyphName, theme); });
CARD.addEventListener('click', () => setup(glyphName, theme));
refreshChips();
setup(glyphName, theme);
</script>
