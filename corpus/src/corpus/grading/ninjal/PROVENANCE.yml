  and /deed.ja. The file used is rokusyutaisyo.csv (page text also spells it
  rokushutaisho.csv; the live href is rokusyutaisyo.csv), cp932, 11,827 data
  rows: 通し番号/見出し/表記/品詞/語種/語彙配当 + six mark columns (国語研,
  初級500語, 七種対照, 工藤, 木幡, 玉村). Substrate used: the 国語研教育基本語彙
  column — 国立国語研究所『日本語教育のための基本語彙調査』(1984), the one list
  built for L2 learners — 6,103 marked words (◎ core 2,071 / ○ extended 4,032),
  matching kaisetsu.pdf 「語数は，6,103語である」. 語彙配当 (1/2/3) is the
  阪本-derived native-schoolchildren allocation and is not used as a learner
  level. DOI for the source report page: https://doi.org/10.15084/00001288.
  Levels derived from this asset are always labeled ninjal-kyoiku-kihon-goi:*,
  never JLPT.
