notes: >-
  Derived, committed outputs: datasets/jmdict_idioms/idioms.jsonl (full idiom
  layer — yoji/proverb/id/quote entries, ~4.2k rows; committing the full
  derived dataset is deliberate, it lives in the share_alike pool) and
  samples/jmdict/kanjidic_sample.jsonl (100-kanji sample of the SKIP-stripped
