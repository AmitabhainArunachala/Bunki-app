attribution: >-
  This corpus uses the JMdict and KANJIDIC2 dictionary files. These files are
  the property of the Electronic Dictionary Research and Development Group
  (EDRDG), and are used in conformance with the Group's licence
  (CC BY-SA 4.0, https://www.edrdg.org/edrdg/licence.html). JSON conversion
  by the jmdict-simplified project (scriptin/jmdict-simplified).
restrictions:
  - >-
    UI attribution obligation: EDRDG requires the acknowledgement to reach the
    end user, e.g. "on each screen display ... at the foot of the screen" —
    every product screen showing JMdict/KANJIDIC2-derived data must carry the
    EDRDG acknowledgement and licence link, not just a credits page.
  - >-
    Regular updating obligation: the EDRDG licence requires derived
    distributions to be kept reasonably up to date with upstream releases; a
    stale snapshot violates the licence. Re-pin PINNED_TAG + sha256s in
    fetch.py on a regular cadence and regenerate the committed datasets.
  - >-
    SKIP codes stripped: KANJIDIC2 query_code type "skip" (Jack Halpern's
    SKIP system) is CC BY-NC-SA 4.0 inside an otherwise CC BY-SA dataset; NC
    may not enter this corpus. kanjidic.py whitelists output fields and tests
    assert no SKIP code survives.
  - >-
    ShareAlike boundary: anything merged with this pool ships CC BY-SA 4.0.
    Keeping this asset out of the proprietary_safe pool is deliberate.
