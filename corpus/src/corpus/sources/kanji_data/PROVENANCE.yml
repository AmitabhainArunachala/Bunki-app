notes: >-
  The 漢検漢字辞典掲載ページ column (dictionary page numbers) is dropped
  entirely from all outputs — page placement is the closest thing in this
  dataset to copied arrangement (編集著作物 exposure); a test asserts the
  string is absent from every output line. The radicals file's
  漢検漢字辞典掲載順 (listing-order) column is dropped for the same reason.
  The upstream README's per-level table is stale (±1 in three places) —
  the pinned CSV is the source of truth for all counts. The 部首 file is the
  漢検漢字辞典 classification (214 radicals), which does not match Kangxi 1:1
  (⼡ U+2F21/⼢ U+2F22 merged; ⺍ U+2E8D added).
