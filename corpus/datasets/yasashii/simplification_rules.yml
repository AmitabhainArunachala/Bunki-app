# やさしい日本語 作成ルール — extracted from the 本編 of
# 在留支援のためのやさしい日本語ガイドライン (出入国在留管理庁・文化庁, 2020-08).
# Reference data for a future generation engine, NOT a product decision
# (Wayfinder #41). Each rule cites the page it appears on: page_pdf is the
# page index in guideline_honpen.pdf (sha256 pinned in sources/yasashii/
# fetch.py), page_printed the folio printed at the bottom of that page.
# Rule/detail text stays close to the document's own wording; examples are
# verbatim from the document.
#
# NOTE: the Wayfinder #41 sketch listed 分かち書き as one of the rules.
# The string 分かち書き does not appear anywhere in the 本編 text layer
# (verified 2026-08-07); the document's spacing guidance is limited to
# 「漢字とふりがな、行と行の間を空けるなどして、見やすくします」 (rule 15).

source:
  name: 在留支援のためのやさしい日本語ガイドライン（本編）
  publisher: 出入国在留管理庁・文化庁
  published: 2020-08
  url: https://www.moj.go.jp/isa/content/930006072.pdf
  sha256: 94dfc82b88eed1e13191aa376c2f09ce3d58f4c15aac24941b0057f0e8ec8106

steps:
  - step: 1
    goal: 日本人にわかりやすい文章（簡潔な文章にする）
  - step: 2
    goal: 外国人にもわかりやすい文章（日本語が母語ではない外国人に配慮する）
  - step: 3
    goal: わかりやすさの確認

rules:
  - id: r01
    step: 1
    point: 情報を整理する
    rule: 伝えたいことを整理し、情報を取捨選択する
    detail: 一言一句を元の文に対応させるのではなく、読み手にとって必要な情報に絞る。必要なら適切なタイトルを付ける。
    page_pdf: 8
    page_printed: 7

  - id: r02
    step: 1
    point: 情報を整理する
    rule: 不足している情報を補う
    example:
      before: 市区町村に書類を提出する。
      after: 市区町村の役所に書類を提出する。
    page_pdf: 8
    page_printed: 7

  - id: r03
    step: 1
    point: 情報を整理する
    rule: イラスト、写真、図や記号を使ってわかりやすくする
    page_pdf: 8
    page_printed: 7

  - id: r04
    step: 1
    point: 文をわかりやすくする(1)
    rule: 一文は短くする（一文に言いたいことは１つだけ）
    example:
      before: 婚姻をするときは、役所に届出をし、届出が受理されると、婚姻が成立します。
      after: 結婚するときは、役所に「婚姻届」を出します。役所が「婚姻届」を受理すると、結婚が成立します。
    page_pdf: 9
    page_printed: 8

  - id: r05
    step: 1
    point: 文をわかりやすくする(1)
    rule: ３つ以上のことを言うときは、箇条書きにする
    page_pdf: 9
    page_printed: 8

  - id: r06
    step: 1
    point: 文をわかりやすくする(1)
    rule: 回りくどい言い方や不要な繰り返しはしない
    example:
      before: 問題があるということになる
      after: 問題がある
    page_pdf: 9
    page_printed: 8

  - id: r07
    step: 1
    point: 外来語に気を付ける
    rule: 外来語（カタカナ語）はできる限り使わない
    detail: 「バス」「ガス」「テレビ」など外来語以外に適切な日本語がない場合のみ使用。国立国語研究所『「外来語」言い換え提案』を参考にする。
    example:
      before: スキーム／コンセンサス／デリバリー
      after: 計画／合意／配達
    page_pdf: 9
    page_printed: 8

  - id: r08
    step: 2
    point: 文をわかりやすくする(2)
    rule: 二重否定を使わない
    example:
      before: 在留カード以外は必要ありません。
      after: 在留カードを持ってきてください。
    page_pdf: 10
    page_printed: 9

  - id: r09
    step: 2
    point: 文をわかりやすくする(2)
    rule: 受身形や使役表現をできる限り使わない
    detail: 行動の主体（視点）がわかりにくくなる。
    example:
      before: 住民税は、市町村で課税されます。
      after: 住民税は、市町村へお金を払います。
    page_pdf: 10
    page_printed: 9

  - id: r10
    step: 2
    point: 言葉に気を付ける
    rule: 簡単な言葉を使う — 和語を使う（漢語はできる限り使わない）、抽象的な言葉・略語・ローマ字は使わない
    example:
      before: こちらに記入願います
      after: この紙に書いてください
    page_pdf: 10
    page_printed: 9

  - id: r11
    step: 2
    point: 言葉に気を付ける
    rule: 曖昧な表現はできる限り使わない
    detail: 「くらい」「ごろ」「など」を多用しない。「結構です」のような複数の意味を持つ表現は使わない。
    page_pdf: 10
    page_printed: 9

  - id: r12
    step: 2
    point: 言葉に気を付ける
    rule: 推測表現を使わない
    detail: 「おそらく」「ようです」「ではないでしょうか」等を避け断定的にする。断定できない場合は「～かもしれません」「たぶん～です」を使う。
    page_pdf: 10
    page_printed: 9

  - id: r13
    step: 2
    point: 文末表現
    rule: 文末は「です」「ます」で統一する — 尊敬語、謙譲語は使わず、敬語は丁寧語だけにする
    detail: 可能→することができます／不可能→することができません／指示→「～してください」または「～しなければなりません」（「～ましょう」は勧誘の意味もあるため使わない）。
    example:
      before: お越しいただく必要はありません。
      after: 来なくてもいいです。
    page_pdf: 11
    page_printed: 10

  - id: r14
    step: 2
    point: 文末表現
    rule: 重要な言葉はそのまま使い、＜＝…＞で説明を加える
    detail: 災害用語や日常生活でよく使う言葉など、知っておくとよい言葉はそのまま使い、言葉の後に説明を加える。
    example:
      before: 余震
      after: 余震＜＝後から来る地震＞
    page_pdf: 11
    page_printed: 10

  - id: r15
    step: 2
    point: 表記に気を付ける
    rule: 漢字の量に注意し、すべての漢字にふりがなをつける
    detail: ふりがなは漢字の上部に入れる、または漢字の後ろにかっこ書きで読み方を入れる。漢字とふりがな、行と行の間を空けて見やすくする。機械翻訳にかける可能性に配慮し、ふりがなをつけない文書もできる限り同時に用意する。
    example:
      before: 住民税を払います。
      after: 住民税(じゅうみんぜい)を払(はら)います。
    page_pdf: 11
    page_printed: 10

  - id: r16
    step: 2
    point: 表記に気を付ける
    rule: 時間や年月日の表記はわかりやすくする
    detail: 元号は使わず西暦。12時間表示を原則とし午前・午後を明記。「○○から△△まで」と表記し「～」「／」は使わない。
    example:
      after: 2020年６月４日 午前９時から午後６時まで
    page_pdf: 11
    page_printed: 10

  - id: r17
    step: 2
    point: 表記に気を付ける
    rule: 読みやすいフォントを使う（UDフォント推奨）
    page_pdf: 11
    page_printed: 10

  - id: r18
    step: 3
    point: わかりやすさの確認
    rule: 書き換え案ができたら、日本語教師や外国人に伝わるかどうかをチェックしてもらう
    page_pdf: 11
    page_printed: 10
