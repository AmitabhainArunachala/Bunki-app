[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bunki-corpus"
version = "0.1.0"
description = "Corpus ingestion + difficulty-grading spine. Data pipelines only; no product decisions (Wayfinder #32)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# mwparserfromhell sits in dev too: the wikinews unit tier must also run under
# a plain [dev] install. (CI installs .[dev,wikinews,aozora,snow,grading] —
# corpus-tests.yml:24, which lives outside corpus/.)
dev = ["pytest>=8", "mwparserfromhell>=0.6.6"]
wikinews = ["mwparserfromhell>=0.6.6"]
aozora = ["huggingface_hub>=0.23", "pyarrow>=15"]
snow = ["openpyxl>=3.1"]
grading = ["jreadability==1.1.5", "fugashi>=1.3", "unidic-lite>=1.0.8"]
yasashii = ["pdfplumber>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corpus.grading" = ["*.json"]
"corpus.grading.ninjal" = ["PROVENANCE.yml"]

[tool.pytest.ini_options]
markers = [
    "realdata: needs downloaded upstream data; run locally, excluded in CI",
]
